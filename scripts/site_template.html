<style>
/* 布局：顶栏 + 搜索区 + 左列表 / 右侧详情（宽屏）；窄屏点卡片打开全屏详情 */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#111A24; --ink-2:#26313D; --muted:#4A5664; --faint:#8794A3;
  --line:#E3E8ED; --line-2:#C9D2DC; --soft:#F1F3F5; --hover:#EEF1F4;
  --brand:#0B6E4F; --brand-ink:#FFFFFF; --brand-hover:#09553D; --brand-soft:#E3F3EA; --brand-text:#0B5C43; --proof:#EFF7F3; --proof-ink:#3E5A4E;
  --urgent:#B4380A; --soon:#8A4B00;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1318; --surface:#161D25; --ink:#E8EDF2; --ink-2:#CBD3DC; --muted:#9AA6B3; --faint:#6E7B89;
  --line:#26313C; --line-2:#3A4754; --soft:#1F2832; --hover:#1E2731;
  --brand:#3FBF8A; --brand-ink:#08130E; --brand-hover:#5ACD9C; --brand-soft:#16322A; --brand-text:#6FD3A6; --proof:#13281F; --proof-ink:#9CC7B3;
  --urgent:#FF8A5C; --soon:#E8B04B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#161D25; --ink:#E8EDF2; --ink-2:#CBD3DC; --muted:#9AA6B3; --faint:#6E7B89;
  --line:#26313C; --line-2:#3A4754; --soft:#1F2832; --hover:#1E2731;
  --brand:#3FBF8A; --brand-ink:#08130E; --brand-hover:#5ACD9C; --brand-soft:#16322A; --brand-text:#6FD3A6; --proof:#13281F; --proof-ink:#9CC7B3;
  --urgent:#FF8A5C; --soon:#E8B04B; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
a{color:var(--brand-text)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 顶栏 */
header{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{min-height:60px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand i{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;font-size:15px}
.brand b{font-weight:900;font-size:17px}.brand small{color:var(--muted);font-size:13px}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:14.5px}
.tab{padding:18px 12px;border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:none}
.tab[aria-current="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--brand)}
.tab .mono{font-size:12.5px;color:var(--faint);margin-left:3px}
.savebtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;margin-left:6px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:14px}
.savebtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}

/* 搜索区 */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero .in{padding-top:20px;padding-bottom:16px;display:flex;flex-direction:column;gap:14px}
.search{display:flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--surface);max-width:880px}
.search label{flex:2 1 260px;display:flex;align-items:center;gap:10px;padding:0 14px;min-height:52px;min-width:0}
.search label+label{flex:1 1 180px;border-left:1px solid var(--line)}
.search input,.search select{flex:1;min-width:0;border:0;outline:none;font:inherit;font-size:15px;color:var(--ink);background:transparent;min-height:44px}
.search svg{flex:none;color:var(--muted)}
.go{min-height:52px;padding:0 28px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer}
.go:hover{background:var(--brand-hover)}
.pills{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:13.5px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.pill:hover{border-color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}
.pills select{min-height:36px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font:inherit;font-size:13.5px;padding:0 12px;max-width:180px}
.trust{margin-left:auto;font-size:13px;color:var(--muted)}

/* 截止时间条：未来 35 天一格一天，颜色越深当天截止越多（GitHub 贡献图配色） */
.heat{padding:16px 18px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.hh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.hh h2{margin:0;font-size:15px;font-weight:900}
.hh .sum{font-size:13px;color:var(--muted)}
.hh .sum b{color:var(--ink);font-family:var(--f-mono)}
.peak{display:inline-flex;flex-wrap:wrap;gap:6px}
.peak button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.peak button:hover{border-color:var(--brand);color:var(--brand-text)}
.legend{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--faint)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.strip{overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.sg{display:grid;grid-template-columns:repeat(35,minmax(28px,1fr));gap:4px;min-width:min-content}
.sg .mo{font-size:11.5px;color:var(--muted);font-weight:700;height:16px;white-space:nowrap}
.sg .wk{font-size:10.5px;color:var(--faint);text-align:center;height:14px}
.sg .wk.we{color:var(--urgent);opacity:.7}
.d{position:relative;height:52px;border-radius:7px;border:0;padding:4px 0 0;cursor:pointer;background:var(--soft);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-family:var(--f-mono);transition:transform .12s}
.d:hover{transform:translateY(-2px)}
.d small{font-size:10.5px;line-height:1}
.d b{font-size:12.5px;line-height:1;padding-bottom:7px}
.d.l0 b{visibility:hidden}
.d.l1{background:color-mix(in srgb,var(--brand) 22%,var(--soft));color:var(--ink-2)}
.d.l2{background:color-mix(in srgb,var(--brand) 45%,var(--soft));color:var(--ink)}
.d.l3{background:color-mix(in srgb,var(--brand) 72%,var(--soft));color:#fff}
.d.l4{background:var(--brand);color:#fff}
.d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.d[aria-pressed="true"]{outline:2px solid var(--urgent);outline-offset:1px}
.dayf{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;background:var(--urgent);color:#fff;border:0;cursor:pointer;font-size:13px;font-weight:700}

/* 主体 */
main.in{padding-top:18px;padding-bottom:64px;display:flex;gap:18px;align-items:flex-start}
.list{flex:1 1 400px;max-width:460px;min-width:0;display:flex;flex-direction:column;gap:10px}
.lhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px;font-size:14px;color:var(--muted)}
.lhead strong{font-family:var(--f-mono);font-size:16px;color:var(--ink)}
.card{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--line-2);box-shadow:0 6px 18px rgba(17,26,36,.07);transform:translateY(-1px)}
.card[aria-current="true"]{border:1.5px solid var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
.pick{flex:1 1 auto;min-width:0;display:flex;gap:12px;padding:16px 4px 14px 16px;border:0;background:transparent;text-align:left;cursor:pointer}
.logo{flex:none;width:44px;height:44px;border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;letter-spacing:.02em}
.logo.big{width:60px;height:60px;border-radius:15px;font-size:21px}
.body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.t{font-size:15.5px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.org{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pay{font-size:14px;font-weight:700;color:var(--brand-text)}
.intro{font-size:13px;color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lead{margin:0;font-size:15px;line-height:1.7;color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:12px;padding:1px 8px;border-radius:4px;background:var(--soft);color:var(--ink-2)}
.tag.yes{background:var(--brand-soft);color:var(--brand-text);font-weight:700}
.tag.warn{background:none;box-shadow:inset 0 0 0 1px currentColor;color:var(--urgent);font-weight:700}
.grp{display:flex;align-items:center;gap:10px;margin:10px 2px 0;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.grp:first-child{margin-top:0}
.grp small{font-family:var(--f-mono);font-weight:400;color:var(--faint)}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.alert{padding:14px 16px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--urgent)}
.alert h2{color:var(--urgent)}
.due{margin-top:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.due.u{color:var(--urgent)}.due.s{color:var(--soon)}.due.r{color:var(--brand-text)}
.bm{flex:none;align-self:flex-start;width:44px;height:44px;margin:8px 8px 0 0;border:0;border-radius:10px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--faint)}
.bm:hover{background:var(--hover)}
.bm[aria-pressed="true"]{color:var(--brand)}
.bm[aria-pressed="true"] path{fill:currentColor}
.more{align-self:center;min-height:44px;padding:0 24px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:14px;padding:32px;text-align:center;color:var(--muted)}

/* 我的收藏：申请进度标签、状态筛选条、导出日历 */
.stt{font-weight:700}
.stt.s-want{background:var(--surface);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.stt.s-prep{background:color-mix(in srgb,var(--soon) 15%,var(--surface));color:var(--soon)}
.stt.s-sent{background:var(--brand-soft);color:var(--brand-text)}
.stt.s-interview{background:var(--brand);color:var(--brand-ink)}
.stt.s-result{background:var(--ink);color:var(--surface)}
.stt.s-result.r-reject,.stt.s-result.r-withdraw{background:var(--soft);color:var(--muted)}
.svbar{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.svbar .pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.svbar .pill{min-height:40px;padding:0 9px}
.svbar .pill .mono{font-size:12px;margin-left:3px;opacity:.7}
.svx{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.svx .keep{min-height:42px;padding:0 14px;font-weight:700}
.keep:disabled{opacity:.5;cursor:not-allowed}
.svx small{flex:1 1 180px;font-size:12.5px;color:var(--muted)}
.stw{display:flex;flex-direction:column;gap:8px}
.stw .lab{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:13px;color:var(--muted)}
.stw .lab b{color:var(--ink);font-size:13.5px}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{min-height:42px;min-width:0;padding:0 4px;border:0;border-left:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-size:14px;white-space:nowrap;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.seg.sub{grid-template-columns:repeat(3,minmax(0,1fr));max-width:340px}

/* 详情 */
aside{flex:999 1 480px;min-width:0;position:sticky;top:16px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;animation:fade .22s ease both}
.ph{padding:26px 28px 22px;display:flex;flex-direction:column;gap:16px;border-bottom:1px solid var(--line)}
.ph .row{display:flex;gap:16px;align-items:flex-start}
.ph h1{margin:0;font-size:22px;font-weight:900;line-height:1.35;overflow-wrap:anywhere}
.ph p{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.apply{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 22px;border-radius:10px;background:var(--brand);color:var(--brand-ink);text-decoration:none;font-weight:700}
.apply:hover{background:var(--brand-hover);color:var(--brand-ink)}
.keep{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer}
.keep[aria-pressed="true"] path{fill:currentColor}
.acts .due{margin:0 0 0 auto;font-size:14px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.facts div{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts span{font-size:12px;color:var(--muted)}
.facts b{font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.pb{padding:22px 28px 28px;display:flex;flex-direction:column;gap:18px}
.pb h2{margin:0 0 6px;font-size:15px}
.pb p{margin:0;font-size:14.5px;color:var(--ink-2)}
.proof{display:flex;gap:10px;padding:14px 16px;border-radius:12px;background:var(--proof)}
.proof svg{flex:none;margin-top:3px;color:var(--brand)}
.proof q{display:block;font-family:var(--f-mono);font-size:14px;font-style:normal;color:var(--ink);overflow-wrap:anywhere}
.proof small{display:block;margin-top:4px;font-size:12.5px;color:var(--proof-ink)}
.fine{font-size:12.5px;color:var(--muted)}
.tag.lang{background:none;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-2)}
.af{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.af details{border-top:1px solid var(--line)}
.af details:first-child{border-top:0}
.af summary{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 14px;cursor:pointer;list-style:none}
.af summary::-webkit-details-marker{display:none}
.af summary:hover{background:var(--soft)}
.af summary span{font-size:12.5px;color:var(--muted)}
.af summary b{font-size:14.5px;font-weight:600;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.af summary i{font-style:normal;font-size:12px;color:var(--faint);white-space:nowrap}
.af details[open] summary i{color:var(--brand-text)}
.af q{display:block;margin:0 14px 12px;padding:10px 12px;border-radius:8px;background:var(--proof);font-family:var(--f-mono);font-size:13px;line-height:1.6;font-style:normal;color:var(--ink);overflow-wrap:anywhere}
.af q::before,.af q::after{content:none}
.back{display:none}
footer{border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer .in{padding-top:16px;padding-bottom:28px;display:flex;flex-direction:column;gap:6px}

/* 窄屏：列表铺满，详情以全屏页打开，底部固定申请按钮 */
@media (max-width:860px){
  main.in{display:block}
  .list{max-width:none}
  aside{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.detail aside{display:block}
  body.detail{overflow:hidden}
  .pane{border-radius:0;border:0;min-height:100%}
  .back{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:2;width:100%;min-height:52px;padding:0 12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px}
  .ph,.pb{padding-left:18px;padding-right:18px}
  .af summary{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 12px}
  .af summary span{grid-column:1/-1}
  .af q{margin:0 12px 12px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .acts{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
  .acts .apply{flex:1;justify-content:center;white-space:nowrap;padding:0 14px}
  .acts .keep{padding:0 12px}
  .acts .due{display:none}
  .trust{margin-left:0;flex-basis:100%}
  .bar{padding-top:8px}
  nav{flex-wrap:nowrap;width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  .tab{padding:12px 10px;white-space:nowrap}
  .sg{grid-template-columns:repeat(35,34px)}
  .heat{padding:14px 12px 10px}
  .legend{margin-left:0}
  .heat{padding:12px}
  a.tab{display:none}
  .savebtn{margin-left:auto;min-height:36px;padding:0 10px;white-space:nowrap}
}
</style>
</head>

  <div class="in">

<script>
const LABELS = __LABELS__;
const PAGE = 40;
const TODAY = new Date(new Date().toDateString());
const HUES = ["#0B6E4F","#1F55B0","#0E7490","#B4380A","#6D28D9","#9F1239","#334155","#A16207","#1E3A8A","#047857","#7C2D12","#4338CA"];
const st = {view:"now",phd:false,pd:false,cn:false,full:false,soon:false,q:"",region:"",disc:"",shown:PAGE,saved:false,sel:"",day:"",sf:""};
let DATA = [], SAVED = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isDate = d => /^\d{4}-\d{2}-\d{2}$/.test(d || "");
const days = d => Math.round((new Date(d + "T00:00:00") - TODAY) / 864e5);
try { SAVED = JSON.parse(localStorage.getItem("phdradar-saved") || "{}") || {}; } catch (e) { SAVED = {}; }
const persist = () => { try { localStorage.setItem("phdradar-saved", JSON.stringify(SAVED)); } catch (e) {} };
// 申请进度单独存：{id: {s: 状态, r: 结果, t: 更新日}}；旧收藏没有记录时按“想投”处理
const STAGES = [["want", "想投"], ["prep", "准备中"], ["sent", "已投"], ["interview", "面试"], ["result", "结果"]];
const RESULTS = [["offer", "录取"], ["reject", "未录取"], ["withdraw", "放弃"]];
let STATUS = {};
try { STATUS = JSON.parse(localStorage.getItem("phdradar-status") || "{}") || {}; } catch (e) { STATUS = {}; }
if (typeof STATUS !== "object" || Array.isArray(STATUS)) STATUS = {};
const persistStatus = () => { try { localStorage.setItem("phdradar-status", JSON.stringify(STATUS)); } catch (e) {} };
const stageOf = id => { const v = STATUS[id]; return v && STAGES.some(([k]) => k === v.s) ? v : {s: "want"}; };
const stageText = v => v.s === "result" && v.r ? (RESULTS.find(([k]) => k === v.r) || [, "结果"])[1] : STAGES.find(([k]) => k === v.s)[1];
const stageTag = id => { const v = stageOf(id); return `<span class="tag stt s-${v.s}${v.r ? " r-" + esc(v.r) : ""}">${esc(stageText(v))}</span>`; };
function setStage(id, s, r){
  const v = {s, t: iso(new Date())};
  if (s === "result") { const r0 = r || (STATUS[id] && STATUS[id].s === "result" && STATUS[id].r); if (r0) v.r = r0; }
  STATUS[id] = v; persistStatus();
}

const isNow = x => !!x.o && (!isDate(x.o.dl) || days(x.o.dl) >= 0);
const dlOf = x => isNow(x) && x.o.dl ? x.o.dl : x.dl;
function hue(s){ let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return HUES[h % HUES.length]; }
function mono(x){
  const s = (x.org || x.n).replace(/[（(].*$/, "").trim();
  const cjk = s.match(/[一-鿿]/);
  if (cjk && /^[一-鿿]/.test(s)) return s[0];
  const w = s.replace(/^(the|university of|universit[äe]t|universidad)\s+/i, "").match(/[A-Za-z][A-Za-z]*/g) || [s];
  return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase();
}
function due(x){
  const d = dlOf(x);
  if (isNow(x) && x.o.st === "upcoming") return [x.o.op ? `${x.o.op} 开放申请` : "即将开放", "s"];
  if (d === "rolling") return ["滚动招生 · 随时可投", "r"];
  if (isDate(d)) { const n = days(d); return n < 0 ? [`${d} 已截止`, ""] : [`${d.slice(5).replace("-", "/")} 截止 · ${n === 0 ? "今天截止" : `还有 ${n} 天`}`, n <= 7 ? "u" : n <= 30 ? "s" : ""]; }
  return [d ? (LABELS.deadline[d] || d) : "截止日期官网未写明", ""];
}
const levelText = x => (x.l || []).map(l => LABELS.level[l] || l).join(" / ") || "博士";
const regionText = x => (x.r || []).map(r => LABELS.region[r] || r).join(" · ");
const cnYes = x => x.e === "yes";
const discTags = x => (x.d || []).filter(d => d !== "all").slice(0, 2).map(d => `<span class="tag">${esc(LABELS.discipline[d] || d)}</span>`).join("");
const screened = x => (x.fl || []).includes("security-screening");
const payText = x => x.s || LABELS.coverage[x.c] || "资助官网未写明";
const bmSvg = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';

function filtered(noDay){
  const q = st.q.trim().toLowerCase();
  const out = DATA.filter(x => {
    if (!noDay && st.day && dlOf(x) !== st.day) return false;
    if (st.saved) { if (!SAVED[x.id]) return false; }
    else if (st.view === "now" && !isNow(x)) return false;
    else if (st.view === "ver" && !x.v) return false;
    if (st.cn && !cnYes(x)) return false;
    const lv = x.l || [];
    if (st.phd !== st.pd && !lv.includes(st.phd ? "phd" : "postdoc")) return false;
    if (st.full && !["full", "salary"].includes(x.c)) return false;
    if (st.soon) { const d = dlOf(x); if (!isDate(d) || days(d) < 0 || days(d) > 30) return false; }
    if (st.region && !(x.r || []).includes(st.region)) return false;
    if (st.disc && !(x.d || []).includes(st.disc)) return false;
    if (q && !x._hay.includes(q)) return false;
    return true;
  });
  const key = x => { const d = dlOf(x); return isDate(d) && days(d) >= 0 ? d : d === "rolling" ? "9998" : "9999"; };
  return out.sort((a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : a.n.localeCompare(b.n, "zh"));
}

function card(x){

}

const AF_LABELS = [["dg", "学位要求"], ["lg", "语言要求"], ["sd", "开始时间"], ["du", "资助年限"], ["dc", "材料清单"],
  ["av", "申请方式"], ["sv", "导师"], ["na", "身份限制"]];

function detail(x){

      </div>

        ${isDate(d) && days(d) >= 0 ? `<button class="keep" data-ics="${esc(x.id)}" title="下载 .ics，截止前 14 天、7 天和 1 天提醒"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>加入日历</button>` : ""}

    <div class="facts">${facts.map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join("")}</div>
    <div class="pb">
      ${quote ? `<div><h2>官网原句</h2><div class="proof"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg><div><q>${esc(quote)}</q><small>${esc(checked || "")} 打开${x.via ? ` ${esc(x.via)} 公告` : "官网"}${what}</small></div></div></div>` : ""}
      ${screened(x) ? `<div class="alert"><h2>留意安全审查</h2><p>公告原文提到出口管制、ATAS 或知识安全审查等要求。中国大陆学生可能需要额外审查，部分方向可能受限，投递前请先读原文确认。</p></div>` : ""}
      ${af.length || notes.length ? `<div><h2>申请须知</h2>${af.length ? `<div class="af">${af.map(([k, label]) => `<details><summary><span>${label}</span><b>${esc(x.af[k][0])}</b><i>原句</i></summary><q>${esc(x.af[k][1])}</q></details>`).join("")}</div>` : ""}${notes.map(n => `<p${af.length ? ' style="margin-top:10px"' : ""}>${esc(n)}</p>`).join("")}${af.length ? `<p class="fine" style="margin-top:8px">以上由程序从公告原文摘录，点开可看原句；没列出的项目公告里没写，请以官网为准。</p>` : ""}</div>` : ""}
      ${x.al ? `<p class="fine">同一岗位也发布在：${x.al.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(new URL(u).hostname.replace(/^www\./, ""))}</a>`).join("、")}</p>` : ""}
      <p class="fine">${x.via ? `岗位来自 ${esc(x.via)}，截止日期由程序从公告原文提取。` : ""}信息以官网为准，截止时间注意时区。发现错误？<a href="__REPO__/issues">告诉我们</a></p>
    </div>
  </div>`;
}

function stageControl(id){
  const v = stageOf(id);
  return `<div class="stw"><div class="lab"><span>申请进度 <b>${esc(stageText(v))}</b></span>${v.t ? `<span class="mono">${esc(v.t)} 更新</span>` : ""}</div>
    <div class="seg" role="group" aria-label="申请进度">${STAGES.map(([k, t]) => `<button data-stage="${k}" data-sid="${esc(id)}" aria-pressed="${v.s === k}">${t}</button>`).join("")}</div>
    ${v.s === "result" ? `<div class="seg sub" role="group" aria-label="申请结果">${RESULTS.map(([k, t]) => `<button data-stage="result" data-res="${k}" data-sid="${esc(id)}" aria-pressed="${v.r === k}">${t}</button>`).join("")}</div>` : ""}
  </div>`;
}
const exportable = () => DATA.filter(x => SAVED[x.id] && stageOf(x.id).s !== "result" && isDate(dlOf(x)) && days(dlOf(x)) >= 0);
function svbar(base){
  const n = {"": base.length};
  base.forEach(x => { const s = stageOf(x.id).s; n[s] = (n[s] || 0) + 1; });
  const ex = exportable().length;
  return `<div class="pills" role="group" aria-label="按申请进度筛选">${[["", "全部"], ...STAGES].map(([k, t]) => `<button class="pill" data-sf="${k}" aria-pressed="${st.sf === k}">${t}<span class="mono">${n[k] || 0}</span></button>`).join("")}</div>
    <div class="svx"><button class="keep" id="ics-all" ${ex ? "" : "disabled"} title="${ex ? `把 ${ex} 个截止导出为一个 .ics，截止前 14 天、7 天和 1 天提醒` : "没有可导出的截止日期"}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>导出全部截止到日历${ex ? `<span class="mono">${ex}</span>` : ""}</button>
    <small>${ex ? "只导出有具体日期、尚未截止、进度不是“结果”的收藏；截止前 14 / 7 / 1 天提醒。" : "没有可导出的截止：需要有具体截止日期、尚未截止，且进度不是“结果”。"}</small></div>`;
}

function group(x){
  const d = dlOf(x);
  if (d === "rolling") return "滚动招生 · 随时可投";
  if (!isDate(d)) return "截止日期官网未写明";
  const n = days(d), wkEnd = (7 - TODAY.getDay()) % 7;
  if (n < 0) return "已截止";
  if (n <= wkEnd) return "本周截止";
  if (n <= wkEnd + 7) return "下周截止";
  return `${+d.slice(0, 4) === TODAY.getFullYear() ? "" : `${d.slice(0, 4)} 年 `}${+d.slice(5, 7)} 月截止`;
}
function cardsHtml(list){
  const counts = {};
  list.forEach(x => { const g = group(x); counts[g] = (counts[g] || 0) + 1; });
  let last = "";
  return list.slice(0, st.shown).map(x => {
    const g = group(x), head = g === last ? "" : `<h3 class="grp">${esc(g)}<small>${counts[g]}</small></h3>`;
    last = g;
    return head + card(x);
  }).join("");
}
const icsText = s => String(s || "").replace(/[\;,]/g, c => "\\" + c).replace(/\n/g, "\\n");
// 按 RFC 5545 折行：每行不超过 75 字节，续行以空格开头，不拆开多字节字符
function icsFold(line){
  const enc = new TextEncoder(), out = [];
  let cur = "", n = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (n + b > (out.length ? 74 : 75)) { out.push(cur); cur = ""; n = 0; }
    cur += ch; n += b;
  }
  out.push(cur);
  return out.join("\r\n ");
}
function vevent(x, stamp){
  const dl = dlOf(x), end = new Date(dl + "T00:00:00"); end.setDate(end.getDate() + 1);
  const alarm = (t, m) => ["BEGIN:VALARM", `TRIGGER:${t}`, "ACTION:DISPLAY", `DESCRIPTION:${icsText(m)}`, "END:VALARM"];
  return ["BEGIN:VEVENT", `UID:${icsText(x.id)}@phdradar`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${dl.replace(/-/g, "")}`, `DTEND;VALUE=DATE:${iso(end).replace(/-/g, "")}`,
    `SUMMARY:${icsText("截止：" + x.n)}`, `DESCRIPTION:${icsText([x.org, "申请链接：" + x.u, "截止时间以官网为准，注意时区。"].filter(Boolean).join("\n"))}`,
    `URL:${x.u}`, ...alarm("-P14D", "还有 14 天截止：" + x.n), ...alarm("-P7D", "还有 7 天截止：" + x.n), ...alarm("-P1D", "明天截止：" + x.n), "END:VEVENT"];
}
function icsCalendar(list){
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//PhDRadar//CN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", ...list.flatMap(x => vevent(x, stamp)), "END:VCALENDAR"];
  return lines.map(icsFold).join("\r\n") + "\r\n";
}
function icsDownload(list, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([icsCalendar(list)], {type: "text/calendar;charset=utf-8"}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const ics = x => icsDownload([x], `phdradar-${dlOf(x)}.ics`);
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const md = d => `${+d.slice(5, 7)}月${+d.slice(8)}日`;
function heat(){
  const counts = {};
  filtered(true).forEach(x => { const d = dlOf(x); if (isDate(d) && days(d) >= 0 && days(d) < 35) counts[d] = (counts[d] || 0) + 1; });
  const vals = Object.values(counts), total = vals.reduce((a, b) => a + b, 0), max = Math.max(1, ...vals);
  const lvl = n => !n ? "l0" : n >= max * 0.7 ? "l4" : n >= max * 0.4 ? "l3" : n >= max * 0.15 ? "l2" : "l1";
  const WK = "日一二三四五六", mo = [], wk = [], cells = [];
  for (let k = 0; k < 35; k++) {
    const d = new Date(TODAY); d.setDate(TODAY.getDate() + k);
    const key = iso(d), n = counts[key] || 0;
    mo.push(`<span class="mo">${k === 0 || d.getDate() === 1 ? `${d.getMonth() + 1}月` : ""}</span>`);
    wk.push(`<span class="wk${d.getDay() % 6 === 0 ? " we" : ""}">${WK[d.getDay()]}</span>`);
    cells.push(`<button class="d ${lvl(n)}${k === 0 ? " today" : ""}" data-day="${key}" aria-pressed="${st.day === key}" title="${md(key)}（周${WK[d.getDay()]}）· ${n} 个截止" aria-label="${md(key)} ${n} 个截止"><small>${k === 0 ? "今天" : d.getDate()}</small><b>${n || ""}</b></button>`);
  }
  const peaks = Object.entries(counts).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).slice(0, 3);
  $("heat").innerHTML = `<div class="hh"><h2>未来 5 周截止日历</h2>
      <span class="sum">共 <b>${total}</b> 个机会截止${peaks.length ? " · 最集中：" : ""}</span>
      ${peaks.length ? `<span class="peak">${peaks.map(([d, n]) => `<button data-day="${d}">${md(d)} ${n} 个</button>`).join("")}</span>` : ""}
      ${st.day ? `<button class="dayf" data-day="${st.day}">只看 ${md(st.day)} 截止 ✕</button>` : ""}
      <span class="legend">少 <i style="background:var(--soft)"></i><i class="d l1" style="height:12px"></i><i class="d l2" style="height:12px"></i><i class="d l3" style="height:12px"></i><i class="d l4" style="height:12px"></i> 多</span></div>
    <div class="strip"><div class="sg">${mo.join("")}${cells.join("")}${wk.join("")}</div></div>`;
}
function render(keepScroll){
  heat();
  const base = filtered(), list = st.saved && st.sf ? base.filter(x => stageOf(x.id).s === st.sf) : base;
  $("svbar").hidden = !st.saved;
  $("svbar").innerHTML = st.saved ? svbar(base) : "";
  if (!list.some(x => x.id === st.sel) && innerWidth > 860) st.sel = list[0] ? list[0].id : "";
  $("shown").textContent = list.length.toLocaleString();
  $("sv").textContent = st.saved ? " · 我的收藏" : "";
  $("cards").innerHTML = list.length ? cardsHtml(list)
    : `<div class="empty">${st.saved ? (st.sf && base.length ? "这个进度下还没有收藏。" : "还没有收藏。点卡片右上角的书签收藏想投的机会。") : "没有符合条件的机会，试试放宽筛选。"}</div>`;
  $("more").hidden = list.length <= st.shown;
  $("aside").innerHTML = detail(DATA.find(x => x.id === st.sel));
  $("n-saved").textContent = Object.keys(SAVED).length;
}
let pushed = false;
function openDetail(id){
  st.sel = id;
  if (innerWidth <= 860) { document.body.classList.add("detail"); history.pushState({d: 1}, "", "#" + encodeURIComponent(id)); pushed = true; $("aside").scrollTop = 0; }
  else history.replaceState(null, "", "#" + encodeURIComponent(id));
  render(true);
}
function closeDetail(){ document.body.classList.remove("detail"); }
function bind(){
  document.querySelectorAll(".tab[data-view]").forEach(b => b.addEventListener("click", () => {
    st.view = b.dataset.view; st.saved = false; st.shown = PAGE;
    document.querySelectorAll(".tab[data-view]").forEach(t => t.setAttribute("aria-current", t === b));
    $("saved").setAttribute("aria-pressed", "false"); render();
  }));
  document.querySelectorAll(".pill[data-f]").forEach(b => b.addEventListener("click", () => {
    st[b.dataset.f] = !st[b.dataset.f]; b.setAttribute("aria-pressed", st[b.dataset.f]); st.shown = PAGE; render();
  }));
  $("saved").addEventListener("click", () => { st.saved = !st.saved; st.sf = ""; $("saved").setAttribute("aria-pressed", st.saved); st.shown = PAGE; render(); });
  $("q").addEventListener("input", e => { st.q = e.target.value; st.shown = PAGE; render(); });
  $("form").addEventListener("submit", e => { e.preventDefault(); $("q").blur(); });
  ["region", "disc"].forEach(id => $(id).addEventListener("change", e => { st[id] = e.target.value; st.shown = PAGE; render(); }));
  $("more").addEventListener("click", () => { st.shown += PAGE; render(); });
  document.addEventListener("click", e => {
    const dd = e.target.closest("[data-day]");
    if (dd) { st.day = st.day === dd.dataset.day ? "" : dd.dataset.day; st.shown = PAGE; render(); return; }
    const c = e.target.closest("[data-ics]");
    if (c) { const x = DATA.find(y => y.id === c.dataset.ics); if (x) ics(x); return; }
    if (e.target.closest("#ics-all")) { const l = exportable(); if (l.length) icsDownload(l, `phdradar-saved-${iso(TODAY)}.ics`); return; }
    const sf = e.target.closest("[data-sf]");
    if (sf) { st.sf = sf.dataset.sf; st.shown = PAGE; render(); return; }
    const sg = e.target.closest("[data-stage]");
    if (sg) { setStage(sg.dataset.sid, sg.dataset.stage, sg.dataset.res); render(true); const pn = document.querySelector("#aside .pane"); if (pn) pn.style.animation = "none"; return; }
    const p = e.target.closest("[data-id]"), s = e.target.closest("[data-save]");
    if (s) { const id = s.dataset.save; if (SAVED[id]) { delete SAVED[id]; delete STATUS[id]; } else { SAVED[id] = 1; setStage(id, "want"); } persist(); persistStatus(); render(); return; }
    if (p) openDetail(p.dataset.id);
    if (e.target.closest("#back")) { if (pushed) { pushed = false; history.back(); } else closeDetail(); }
  });
  addEventListener("popstate", () => { pushed = false; closeDetail(); });
}
function fill(id, counts, names){
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([k, n]) => {
    const o = document.createElement("option"); o.value = k; o.textContent = `${names[k] || k}（${n}）`; $(id).appendChild(o);
  });
}
bind();
fetch("assets/catalog.json").then(r => r.json()).then(rows => {
  DATA = rows.map(x => ({...x, _hay: [x.n, x.org, x.in, regionText(x), (x.d || []).map(d => LABELS.discipline[d] || d).join(" "), x.s, x.rq, x.lt, x.af && x.af.dg && x.af.dg[0]].join(" ").toLowerCase()}));
  const nNow = DATA.filter(isNow).length, nVer = DATA.filter(x => x.v).length;
  $("n-now").textContent = nNow.toLocaleString(); $("n-ver").textContent = nVer.toLocaleString();
  if (DATA.length > nVer) { $("t-all").hidden = false; $("n-all").textContent = DATA.length.toLocaleString(); }
  const rc = {}, dc = {};
  DATA.filter(x => x.v).forEach(x => { (x.r || []).forEach(r => rc[r] = (rc[r] || 0) + 1); (x.d || []).forEach(d => d !== "all" && (dc[d] = (dc[d] || 0) + 1)); });
  fill("region", rc, LABELS.region); fill("disc", dc, LABELS.discipline);
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && DATA.some(x => x.id === h)) { st.sel = h; if (!isNow(DATA.find(x => x.id === h))) { st.view = "ver"; document.querySelectorAll(".tab[data-view]").forEach(t => t.setAttribute("aria-current", t.dataset.view === "ver")); } }
  render();
  if (h && st.sel === h && innerWidth <= 860) document.body.classList.add("detail");
}).catch(() => { $("shown").textContent = "0"; $("cards").innerHTML = '<div class="empty">数据加载失败，请刷新页面，或直接下载 CSV / JSON 数据。</div>'; });
</script>
</body>
</html>
