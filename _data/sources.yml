categories:
- id: aggregators
  title: 综合聚合平台
  description: 汇总多国、多学科 PhD 职位/项目的平台，日常刷新的首选入口。
- id: national-portals
  title: 各国学术招聘门户与机构职位页
  description: 某个国家/研究机构体系内的官方或主流职位库，欧洲带薪 PhD 大多首发在这里。
- id: gov-scholarships
  title: 政府与国家级奖学金
  description: 中国政府（CSC）及各留学目的地政府提供的博士奖学金。
- id: university-schemes
  title: 高校旗舰奖学金与资助检索
  description: 名校层面的全奖项目和校内奖学金检索入口。
- id: doctoral-programs
  title: 结构化博士项目与研究机构
  description: 自带资金、统一招生的博士项目（研究所、博士训练中心、国际研究型大学）。
- id: postdoc-fellowships
  title: 博士后奖学金与项目
  description: 面向博士后的个人奖学金/资助项目（可自带经费找合作导师），以及集中招聘博士后的研究机构项目。
- id: fellowships
  title: 企业与基金会 Fellowship
  description: 面向博士生（多为在读）的额外资助，可叠加或作为后续资金来源。
- id: discipline
  title: 学科专属信源
  description: 按学科划分的邮件列表、职位板，往往比综合平台更早、更全。
- id: pathways
  title: 科研实习与“曲线入口”
  description: 暑研/访问项目，常是拿到导师认可、进而获得全奖 offer 的关键路径。
- id: people-channels
  title: 个人信源与社交渠道
  description: 导师主页、学术社交媒体等“非公开招聘”信息，很多名额从不挂到平台上。
- id: recruiting-posts
  title: 导师招生帖（社交平台个人发布）
  description: 导师/课题组在小红书、知乎、微信公众号、微博、B站、X、Bluesky、LinkedIn 等平台亲自发布的单条博士/博后招生帖，时效性强，请留意发布日期。
- id: faculty-aggregators
  title: 导师招生汇总（指向个人主页的集合）
  description: 把“正在招博士的导师”集中列出的名单、表格和数据库，直接链接到导师个人主页或招生帖。
- id: github-resources
  title: GitHub 开源申请资源
  description: GitHub 上现有的申请指南、awesome 列表、录取数据库和文书合集。
- id: chinese-community
  title: 中文社区与官方服务
  description: 中文论坛、开源申请数据库、国内官方留学服务平台。
- id: tools
  title: 选校与申请辅助工具
  description: 找导师、查待遇、看录取数据的工具。
