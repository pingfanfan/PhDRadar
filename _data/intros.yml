the-unijobs:416604: 香港大学斯通亚洲社会经济不平等研究中心（HKU Stone Centre on Socio-Economic Inequality in Asia）的博士后岗位，工作地点在香港薄扶林。薪资标注为具有竞争力（Competitive salary）。
