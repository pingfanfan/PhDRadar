kaist-coe-phd-stipend: 韩国科学技术院（KAIST）工学院博士生资助说明：博士免学费（8 学期），工学院生活费平均超过 170 万韩元/月，因系所与导师而异。
kaist-mlv-openings: 韩国科学技术院（KAIST）机器学习与视觉实验室（MLV）通过 InnoCORE 计划招 1–3 名博后，方向包括气象气候 AI、智能体 AI 与视频理解。年薪 KRW 9,000 万/年（含机构缴费）+ α，研究经费 KRW 5,000 万/年，需相关学科博士学位。
kaist-paik-cogi-openings: 韩国 KAIST 的 Sang-Bum Paik 课题组（CoGI）招收计算神经科学与神经 AI 方向的研究生，博后名额待定。申请者需先邮件联系 PI，并有 Matlab 或 Python 等科学软件使用经验。
kaist-rirolab-graduates: 韩国 KAIST RIRO 机器人实验室招收研究生。页面列出国家奖学金、KAIST 奖学金等途径，博士生可获研究室人工费及一般助教津贴；博士申请者需有至少一篇第一作者的机器人、AI 或 ML 主流出版物。
kaitai-liang-phd: Kaitai Liang 团队（TU Delft / 图尔库大学）的博士岗位，个人主页称有 4 个全额资助的 3 年期博士岗，研究 AI 安全与隐私理论、LLM 和应用密码学；另有 3 个博后岗位。
karolinska-doctoral-admission: 卡罗林斯卡学院博士岗位按具体课题在 Varbi 系统发布，为带薪职位，需硕士学位及英语能力，按岗位要求提交申请材料。
kas-auslaender-promotion: 康拉德·阿登纳基金会外国博士生奖学金，面向在德国高校攻读或即将攻读博士的外国学生，通过 campus.kas.de 在线申请。申请时在德国居留不超过 15 个月（可酌情放宽），资助金额以官方 PDF 为准。
kasi-english-notices: 韩国天文研究院（KASI）与卡内基天文台联合四年期博后，前两年在卡内基天文台（帕萨迪纳），后两年在 KASI。提供约 1 万美元年度研究经费，偏好与 GMT 相关方向。
kasi-ust-notices: 韩国天文研究院（KASI）通过 UST 招收直博与本博连读学生并提供薪酬，博士奖学金约每月 1600 美元，前 3 年提供校园住宿。本科学位者可申请本博连读，硕士学位者可直接申请博士，需先联系对应研究方向的导师。
kassel-expose-stipendium: 卡塞尔大学 Exposé-Stipendium，为首次攻读博士者提供起步阶段资助，每月 €1,300，最多 9 个月。申请需已获卡塞尔大学教授的博士指导承诺，年龄上限一般为 35 岁。
kaust: 阿卜杜拉国王科技大学（KAUST）的博士与博后岗位，所有录取学生全奖，包括学费、高额生活费和住房。中国学生和教师比例高。
kaust-arms-reservoir-msc-phd: 沙特阿卜杜拉国王科技大学（KAUST）ARMS 课题组提供全额资助的硕士或博士职位，研究油藏建模与模拟、化学驱、CO2 管理和地热等。需通过 KAUST 官方招生系统申请。
kaust-bioscience-phd: 沙特阿卜杜拉国王科技大学（KAUST）生物科学博士项目，博士生有全额奖学金，含学费、住宿、医保与月生活费。需相关硕士学位；计算生物学方向的申请者可能被分到计算机科学或应用数学项目。
kaust-faster-join: KAUST FASTER 课题组（Aamir Farooq）的博士招生页。页面说明可直接将 CV 和研究兴趣摘要发送给 PI；正式申请以 KAUST 轮次为准，资助细节可参照 KAUST 官方博士资助。
kaust-fellowship-funding: KAUST 全奖硕博研究生资助，覆盖学费与实验室费、基础住房与医保，并发放月津贴，博士约 USD 25,000–30,000/年（依资质与进度）。需被 KAUST 录取，外部资助者可能不符合。
kaust-mure-prospective-msc-phd: 沙特阿卜杜拉国王科技大学（KAUST）MURE 项目下潜在硕士与博士岗位的汇总入口，可在此查找可申请的岗位。
kaust-numerics-phd-fellowships: KAUST 数值计算组的博士奖学金与招聘，Ph.D. 学生可获得有竞争力的津贴，含住房与保险。申请需数学、物理、工程或相关学位，申请时先发邮件联系导师并附研究样例。
kaust-phd-admissions-portal: KAUST 硕博（MS/PhD）官方申请入口。录取的硕博学生均获 KAUST Fellowship，涵盖学费、住宿、医保和搬迁支持。申请需相关硕士学位、英语成绩及 3 名推荐人，有外部资助的学生可能不适用。
kaust-phd-degree-page: KAUST 博士录取生无需单独申请即获 KAUST Fellowship，包括全额学费、基础住宿、学生医保与搬迁支持，并发放每年 USD 25,000–30,000 的津贴，依资格与学业进度而定。
kaust-postdoc-researcher-positions: KAUST 博士后研究员职位总入口，列出各部门博后职位，多数长期开放，可按 PI 联系。全球博后奖学金 2027 轮的全文提交需受邀。
kavli-institute-cosmology-fellowship: 英国剑桥 Kavli 宇宙学研究所三年期研究员岗位，研究覆盖 CMB、星系与黑洞形成、暗物质与引力波。年薪 £37,694–£46,049（依 2025 年招聘广告），英国岗位需确认签证安排。
kavli-ipmu-phd-programs: Kavli IPMU 不单独授予学位，需通过东京大学数学、天文、物理或跨学科信息研究科报考，资助与申请安排由各研究科单独设定。
kavli-ipmu-postdoc: 东京大学 Kavli IPMU 的国际博士后职位，任期 3 年，工作语言为英文。需提交一页求职信、CV、研究兴趣陈述、论文清单和至少 3 封推荐信。
kavli-nsi-graduate: 洛克菲勒大学 Kavli 神经系统研究所研究生奖学金（1 年期），面向 David Rockefeller 研究生项目在读博士生，含 5000 美元薪金补充，需入驻 Kavli NSI 成员实验室，美国与非美国公民均可申请。
kavli-nsi-postdoc: 洛克菲勒大学 Kavli 神经科学研究所两年期博后奖学金，每年最多 4 人，覆盖全额薪资与福利，外加每年 5,000 美元补充。需在 Kavli NSI 成员实验室任博后，通常面向第 3–5 年资深博后。
kaw-postdoc-calls: 瓦伦堡基金会（Knut and Alice Wallenberg）博后项目日历，数学项目面向瑞典境外研究者，与瑞典皇家科学院合作，每年重复开放。2027 轮以官网公告为准。
kcds-kit-graduate-school: KCDS 计算与数据科学研究生院的 DAAD 博士奖学金项目，研究空气污染极端值，每月 €1,400，最长 4 年，另由 KIT 兼职补充收入。申请截止时在德国居住超过 15 个月者不符合。
kcl-bhf-phd: 英国心脏基金会（BHF）资助的 4 年制博士项目「下一代人源心血管疾病模型」，由大学联合体分轮招募，资助为全额。
kcl-dickson-poon-law-studentship: 伦敦国王学院（KCL）Dickson Poon 法学院博士奖学金（方案代码 LAW2027），资助 3 年学费及 UKRI 水平维持津贴，任何国籍均可。需被录取，并在 King’s Apply 资助栏填写方案代码。
kcl-doctoral-training: 伦敦国王学院（KCL）参与的多个博士培训伙伴关系（DTP）与培训中心（DTC）总览。这些项目的资助主要面向本国（Home）学生，部分可能面向国际生，申请前须逐项查看资格要求。
kcl-imaging-cdt: EPSRC 资助的成像博士培训中心（Imaging CDT，与 Imperial 合作）。项目第一年为 MRes，之后三年为博士课题，学费、津贴及国际生条款以学校当年公告为准。
kcl-kcsc-phd: 伦敦国王学院 K-CSC 博士奖学金，限持有效中国护照的中国公民及永久居民。KCL 免全额国际学费，CSC 提供每月 £1,200–£1,350 生活费、医保、往返机票与签证费，最长 4 年，需承诺学成回国。
kcl-mrc-dtp-biomedical-mres-phd: 伦敦国王学院 MRC 生物医学 DTP 博士项目，提供全额资助的博士名额（含津贴、学费与耗材），每年 9 月入学，分 0+3.5 与 1+3 两种路径。需理科类本科 2.1 或以上等 MRC DTP 资格。
kcl-wellcome-neuro-immune-phd: 伦敦国王学院与 Wellcome 合办的神经免疫方向四年制博士项目，共 6 个全额资助名额（5 个由 Wellcome、1 个由 KCL 资助），资助含津贴、学费、研究经费及培训与职业过渡差旅。申请需至少二等下（2:2）学士学位或同等学历。
kdi-school-phd: 韩国KDI公共政策研究生院博士项目的奖学金，Global Ambassador Scholarship适用于春季入学的全日制博士。全额奖学金主要面向ODA受援国国籍学生，其他国籍可能获部分奖学金。
keio-design-the-future-award: 庆应义塾大学「Design the Future」奖学金面向国际学生，须由拟入学研究科推荐，经奖学金委员会审核与面试录取。面试定于 2026 年 12 月 12 日。
kek-privately-financed-sokendai: 日本 KEK 为 SOKENDAI 三年制博士课程中的自费国际生提供奖学金（KEK scholarship），属于自费留学生可申请的博士奖学金之一。
kellogg-phd-tuition-fin-aid: 西北大学 Kellogg 商学院博士项目，录取生均获为期五年的资助，包括津贴、助教或助研岗位、学费奖学金与学生医保，页面称国际学生同样获得资助。
kempner-research-fellowship: 哈佛 Kempner 研究所博后项目，面向智能基础研究、AI/ML 方法及计算神经科学，任期最长 3 年。年薪 $100,000 另加福利，研究经费每年最高 $10,000。
kemri-wellcome-phd-studentships: KEMRI-Wellcome Trust 在肯尼亚 Kilifi 与 Nairobi 的博士奖学金，经三个月预注册评估后注册博士，通过竞争性面试授予部分或全额奖学金。需已完成硕士学业，KSCE 成绩 B+ 及以上。
kent-sedarc: 肯特大学 SEDarc ESRC 博士奖学金，2027 年入学标准为 £21,805/年（伦敦加权 £23,805）。国际生名额约 30%，学校补足国际学费差额，机票、签证与医保需自付。
kent-sport-exercise-phd: 肯特大学运动、运动科学与康复科学博士项目入口。博士机会全年在 FindAPhD 与大学奖学金查找器发布，也接受自筹经费申请，需先联系潜在导师。GTA 带薪岗位限英国本地学生。
kent-state-biomedical-sciences-assistantship: 肯特州立大学生物医学科学博士助理奖，2026–27 十二个月津贴 $28,200，并可获全额学费减免和部分医保，每年续签至多五年。需先被博士项目录取。
kf-graduate-studies-scholarship: 韩国国际交流财团（KF）为海外大学攻读韩国学相关硕博的非韩国籍申请人提供的奖学金，博士最长资助 3 年，不能与其他韩国机构的资助叠加。
kfupm-apply-international: KFUPM 国际生申请入口，称所有博士项目对国际生提供综合奖学金：免学费，提供免费家具公寓（含水电）、往返机票、医疗与餐补。津贴按奖学金类别发放。
kfupm-chem-graduate-scholarships: KFUPM 化学工程系研究生奖学金，录取研究生可获月津贴、校内住宿、医疗、每年往返机票及免费教材。博士申请需已获同专业两年制硕士学位，累计 GPA 高于 3.2/4.0。
kfupm-intl-fees-scholarships: KFUPM 面向国际生的学费与奖学金官方说明。页面称 PhD 免学费，并提供免费家具住宿、水电、医保、餐食及国际生机票，现金津贴按奖学金类别确定。
kfupm-irc-htcm-postdocs: 沙特 KFUPM 氢能与碳管理研究中心（IRC-HTCM）的博士后职位，首聘 1 年，最长可延至 2 年，与 KFUPM 签订雇用合同。要求近 2–3 年内获得博士（或同等学历）且无 D 或 F 等级成绩。
kfupm-manufacturing-robotics-postdoc: 沙特 KFUPM 制造自动化与机器人研究中心的机械设计与精密设计博士后岗位，需机械工程或相近专业博士学位。收到申请即审，直至招满。
kfupm-postdoc-application-portal: 沙特 KFUPM 博士后统一申请入口，可按学科查找各研究中心在招的博士后岗位。需在线填写申请表，并上传 CV、学术成绩单与证书等材料。
kfupm-postdoc-fellowship: 沙特石油大学（KFUPM）博士后研究员计划，年薪 USD 48,000，含住房补贴（约三个月薪资）和 30 天带薪年假。通常为 24 个月、最长可延至 48 个月，需在申请日前 3 年内获得博士学位。
kfupm-postdoc-startup-fellowship: 沙特 KFUPM 研究院的博士后创业基金，面向希望在沙特创办技术创业公司的博士后。年薪 USD 48,000，另有 USD 32,000 里程碑式创业资金；需有早期科技创业项目或清晰商业计划。
kfupm-scholarship: 沙特石油大学（KFUPM）面向全日制博士项目的全额奖学金，含免学费、按类别发放的津贴、校内住宿、医疗牙科和补贴餐食，国际生另有机票。需成绩优异并被录取。
kgfp-kaust: 沙特 KAUST 全球奖学金项目（KGFP）下的博士后计划，面向博士后研究。全文申请仅限受邀者，需先通过概念阶段。
khalifa-tsinghua-sigs-joint-phd: 哈利法大学与清华大学深圳国际研究生院联合授予博士的项目，毕业后授予两校双博士学位。首批 5 名博士生已于 2026 年 10 月入学，后续招生轮次与截止日尚未公布。
khk-aachen-cultures-of-research: 亚琛工业大学 Käte Hamburger Kolleg「Cultures of Research」研究项目，面向人文社科及自然、生命、技术科学领域的博后至资深学者，驻地研究 6–12 个月，资助为全额。
khys-lgf-kit-doctoral-scholarship: 巴登-符腾堡州博士资助（LGF）下的 KIT 个人资助，2027 年起改由 GradExcPro 实施，面向尚未在 KIT 开始博士项目的优秀预备博士生。LGF 完成期资助目前不开放申请。
ki-available-doctoral-positions: 卡罗林斯卡学院（Karolinska Institutet）持续发布的博士教育岗位，岗位按各自公告截止。非欧盟申请人需确认工作与居留许可，并先与导师确认意向。
ki-available-positions: 卡罗琳斯卡学院（瑞典）全部在招职位的列表页，其中包含多个博士岗和博后岗。申请需高级水平学位，通过 Varbi 系统提交，截止后不能补交材料。
ki-gph-doctoral-education-contact: 卡罗林斯卡学院（瑞典）全球公共卫生系博士教育的官方联系入口，本身不是岗位列表，可通过它询问在招岗位与国际生资格。
ki-vacancies: 卡罗林斯卡学院官方职位空缺页，列出博士与博后等在招岗位，可按部门筛选。博士岗位需满足硕士或同等学历等通用要求，英语需达到瑞典高中 English B 水平。
kids-research-scholarships: 澳大利亚The Kids Research Institute的奖学金与HDR博士项目页，列出Life Course Centre、Wesfarmers疫苗与传染病中心、Play Active等博士机会。部分奖学金仅限澳新公民或永居，国际生需逐项查看资格。
kiel-chem-job-links: 基尔大学化学组整理的德国化学方向博士与博后招聘渠道，包括 GDCh、DPG、FAZ、DHV 等。页面本身不发布岗位，适合作为搜索起点。
kist-hakyeon-joint-phd: 韩国科学技术研究院（KIST）的学·研协同研究硕博（统合）课程，属硕博统合路径，韩文公告列有 2027 年上学期招生。
kist-school-ust-degree-admission: KIST 学院（UST KIST School）的学位课程招生页。博士课程需硕士学位，或入学前可取得硕士学位；设有外国人特别录取类别（父母均为外国人，或全部中小学及本科教育在韩国境外完成）。津贴金额以官网与 UST 公告为准。
kit-dbis-phd: KIT 信息系统研究所（DBIS，Klemens Böhm 教授）数据科学方向的博士及 researcher 岗位，页面称薪资（TV-L 13）足以覆盖生活开销，申请材料发至指定邮箱。
kit-doctoral-programs: 卡尔斯鲁厄理工学院（KIT）博士项目总入口，博士通常免学费，岗位多为带薪合同，需由院系或导师录用。部分项目如 KCDS 的 DAAD 奖学金仅限过去 15 个月居住于境外的申请人。
kit-helmholtz-ocpc-postdoc-china: KIT 与中国博士后委员会（OCPC）合作的博后项目，面向 OCPC 注册博后站的中国籍博士后。资助为 OCPC 30 万元人民币一次性（生活与差旅）及 KIT 每月 1,500 欧元，期限 24 个月。
kit-imk-aaf-csc-topics: 卡尔斯鲁厄理工学院（KIT）大气环境研究所（IMK-AAF）的 CSC 博士与博后课题，方向为大气气溶胶、激光遥感与云物理。需主动联系 Harald Saathoff，且须自行获得 CSC 资助。
kit-kastel-doctoral-research: KIT KASTEL 信息安全研究所的博士研究入口，页面为智能系统安全组 Christian Wressnegger 教授的访谈，表示正在寻找博士生，并希望为博士后提供机会。
kit-khys-hida-doctoral: KIT/HIDA 亥姆霍兹信息与数据科学博士项目（KHYS）入口，提供课程资助与 1–3 个月研究访问，面向亥姆霍兹成员的博士研究人员、博后与资深科学家。这是资助入口，不是带薪博士岗位列表。
kitp-theoretical-physics-postdoc: 加州大学圣巴巴拉分校 KITP 理论物理博士后，每年选出 4–5 名，覆盖理论物理各方向，入职前需已获博士学位，2027 年 9 月入职。
kmutt-intl-scholarships: 泰国 KMUTT 国际生奖学金列表页，收录多项博士奖学金，各项适用范围不同。其中 GMS 博士奖学金仅限老挝、柬埔寨、缅甸、越南及中国云南籍学生申请。
knight-hennessy: 斯坦福大学研究生层面的全额捐赠领导力项目，最长 3 年，包括学费、生活与学术费用补助，以及每年一次往返斯坦福的差旅补助。无国籍限制，但需同时申请斯坦福研究生项目。
kobe-neurophysiology-recruit: 日本神户大学医学研究科神经生理学教研室招收博士、博后、技术员及短期访问学者，欢迎各国申请者，工作语言为英语。资助路线列出 JSPS DC1/DC2、MEXT、Humanics 等，具体 RA 或奖学金需与实验室确认。
koc-anatolian-fellowship-fundit: Koç 大学 ANAMED 的安纳托利亚文明研究常规 fellowship，面向已通过资格考试的博士候选人以及博后和资深学者，研究领域包括安纳托利亚考古、艺术史和历史。需在伊斯坦布尔居住约 9 个月。
koc-gsb-phd-business: 土耳其科奇大学商学院的工商管理博士项目，以研究型培养和师资指导为特色，各研究方向设有单独的申请入口。
koc-gsse-financial-aid: 土耳其科奇大学理工研究生院博士生可参加 KU 研究生奖学金竞争，获奖者免学费，月津贴 6 万土耳其里拉并含住宿或住房补贴。土耳其政府奖学金博士项目对所有国籍开放，仅限秋季入学。
kochi-tech-csc-kut-phd: 高知工科大学（KUT）与国家留学基金委（CSC）合作的全日制博士奖学金，仅限中国大陆国籍的博士候选人，需先获拟指导教师同意。KUT 免学费，每月 50,000 日元生活补助，另有 15 万日元旅费与初期生活费。
koeln-gsgs-daad-gssp: 科隆大学地球科学研究生院（GSGS）的 DAAD 研究生院奖学金（GSSP）入口，申请直接投递研究生院，每月 €1,400。面向非德国国籍、持境外硕士者，地球与环境科学方向可关注。
konstanz-evolutionsbiologie-jobs: 康斯坦茨大学进化生物学课题组岗位页，页面称全年欢迎博士与博后咨询，可直接联系Axel Meyer教授。另列有Assistant Professor（Jr. Group Leader）岗位。
korea-univ-gks-page: 高丽大学 GKS 研究生奖学金，学费由东道大学与 NIIED 承担，每月生活费 1,000,000 韩元。申请人及父母须为指南所列国家公民，韩国国籍不可申请，需在 studyinkorea.go.kr 完成线上申请。
kseta-europe: KSETA Europe 是 KIT 的 MSCA COFUND 国际博士项目，覆盖粒子与天体粒子物理，以及电气工程、化学加工、信息学、机械工程等技术方向，需物理、工程或信息/计算机类硕士。
kstate-statistics-graduate-finance: 堪萨斯州立大学统计系的主要资助为助教（GTA）与研究助理（GRA），首学期助教约 $19,000（9 个月学年）。非英语母语者须达到 TSE 50 或 iBT 口语 22 分才能申请助教，不可豁免。
ksu-initiative-phd: 沙特国王大学全球博士奖学金，学制 3 年，含全额学费、住宿与医疗福利，年生活补贴 54,000（页面标注折合 14,400 美元）。需认可机构硕士学位，GRE 非必须。
ksu-postdoc: 沙特国王大学全职博士后，期限 1–3 年，资助覆盖培训、耗材、专利注册与国际会议。申请多限沙特公民，且博士学位需在过去 3 年内取得。
kth-architecture-doctoral-funding: 瑞典皇家理工学院（KTH）建筑学博士岗位，按空缺公告投递。需建筑学硕士或同等学历，英语达 English B/6，且须保证全部学习期间至少 4 年资助，不接受个人自费。
kth-energy-phd-studies: KTH 能源与环境系统博士培养页，列出热能存储、燃料电池、生物燃料、热泵等研究方向。博士为受雇员工并领取月薪，需申请 KTH 空缺博士岗位。
kth-how-to-apply-phd: KTH 皇家理工学院的博士招聘入口说明，博士生为 KTH 雇员并领取月薪。岗位分批公布，可在 KTH 招聘页按 PhD 关键词筛选在招岗位；岗位通常先签一年合同后续约，全时博士学习总期限上限四年。
kth-jobs: 瑞典皇家理工学院（KTH）的职位页，筛选 “Doctoral students” 可找到博士岗位。博士为受雇员工并领取月薪，岗位分批公布，需联系所在项目负责人。
kth-vacant-doctoral: KTH 皇家理工学院的空缺博士岗位总入口，瑞典博士为带薪雇员。每年约发布 9 次，包括生物医学相关方向，截止多在 2–3 周内，需定期关注 kth.se/lediga-jobb。
kth-vehicle-maritime-aerospace-phd: 瑞典皇家理工学院（KTH）车辆、海洋与航空航天工程方向的博士岗位。博士生通常为带薪职位，只能申请 KTH 招聘平台发布的在招岗位，可订阅提醒。
ktp-innovate-uk-2026-27: Innovate UK 知识转移伙伴计划（KTP）由高校与企业合作，Associate 以雇员身份在企业完成 12–36 个月项目，不是传统博士。国际生需具备英国工作权利。
ktu-doctoral-studies: 考纳斯理工大学（KTU）的公费博士免学费并享国家奖学金，依 2026 博士手册，第 1 年 1406 欧/月，第 2–4 年 1628 欧/月。国际生是否可获公费名额以当期公告为准。
ku-biz-phd-scholarship: 高丽大学商学院英文博士项目的奖学金，分两档：博士候选人奖学金每月40万韩元（最长6学期），研究奖学金每月130万韩元（最长10学期）。
ku-geology-financial-support: 堪萨斯大学地质系为新入学博士和硕士生提供一年期奖学金与助理职位，每项约 $32,000–35,000，含学费与生活费。申请即自动参与系内评选，学业合理可保障至博士第四年。
ku-geotop-phd-postdoc: 哥本哈根大学数学系地球动力学中心（GeoTop）的博士与博后岗位，均为受雇式职位，有薪水。国际生需满足丹麦博士入学要求。
ku-graduate-scholarship-international: 哈利法大学国际生研究生奖学金。博士研究路径为全时并须承诺毕业后服务，Tier I 与 Tier II 均含全额学费，基本月津贴 20,000 AED；学习路径无服务承诺，Tier I 含全额学费，月津贴 4,000 AED。无需单独申请，按录取时的 Tier 评定。
ku-graduate-scholarships: 哈利法大学（Khalifa University）研究生奖学金总页，博士奖学金按学术表现分档，可含全额或部分学费及月津贴，Tier I 基本月津贴 AED 20,000。另有与中国国家留学基金委的联合博士奖学金，仅限中国籍工程或理科博士。
ku-humanities-phd-scholarship-timeline: 哥本哈根大学人文学院博士奖学金的申请流程说明。公开征集每年一次，12 月发布岗位广告、2 月截止，5 月发放录取与雇佣函，9 月 1 日入学；专项征集在截止前 6–8 周发布广告。
ku-jobportal-pioneer-phd-stipend: 哥本哈根大学统计与保险经济数学方向的带薪博士岗位，与Pioneer Centre for AI相关网络挂钩。需统计、保险、经济或相近专业背景，可按3年制或3+5整合硕博制申请，并注明偏好课题与导师。
ku-phd: 哥本哈根大学的博士岗位汇总页，集中列出该校面向博士的招聘职位。具体资助与资格以各岗位说明为准。
ku-phd-vacancies: 哥本哈根大学招聘门户的全部岗位列表，包含博士（如 PhD fellowship）、博后、教学与行政等岗位。各岗位的学历、语言与资格要求不同，需逐条查看公告。
ku-social-sciences-industrial-phd: 哥本哈根大学社会科学学院的工业博士（Industrial PhD）项目，培养能理解企业研发业务的研究人员，学位在本院攻读。学生薪资由丹麦创新基金会补贴，补贴上限为每月最高 DKK 17,000。
ku-socwel-phd-funding: 堪萨斯大学社会福利学院博士项目，官网称享有四年学费支持，需全日制且学业良好。可申请 GRA/GTA 岗位（约 50% 助理职位，含津贴）。
kuleuven-doctoral-school-biomed-start: 鲁汶大学生物医学博士学院的入学指南，说明导师选择、奖学金与带薪职位的区别，建议先阅读此页再联系导师。
kuleuven-jobs: KU Leuven 职位门户首页，岗位按学术人员、博士（PhDs）、管理与专业人员等分类列出，并提供博士求职信息页。本页不列具体博士岗位，需在门户中筛选 PhD。
kuleuven-phd-information-jobsite: KU Leuven 说明博士的两种途径：申请带博士目标的雇员岗位，或由导师提交 FWO 等资助申请。页面为荷兰语，属入门说明而非岗位列表。
kumamoto-u-mext-2027-stem-cell-biology: 熊本大学医学研究科 2027 年 10 月入学的国际研究生特别项目（先进干细胞生物学方向），官方指南称 MEXT 奖学金名额 6 人，月津贴 JPY 145,000（页面注明可能变动）。成绩指数需达 2.3 以上，研究指导与课程以英语进行。
kumc-molecular-integrative-physiology-aid: 堪萨斯大学医学中心分子与整合生理学博士的资助页。页面称学费由导师承担或免除，学生另付杂费；生活津贴为 $38,500/年（2024–25 年数据）。
kunstakademiet-ovlisen-phd-scholarships: 丹麦 Mads Øvlisen 博士奖学金由诺和诺德基金会设立，支持艺术史与实践型艺术研究。奖学金属全额资助，面向全日制博士申请者。
kuwait-university-gse: 科威特大学研究生学术卓越奖学金，博士津贴为 KD 1,400/月。申请需本科与硕士 GPA 不低于 3.00（满分 4.00），提交英语成绩（如 TOEFL 不低于 550），并通过认可的入学考试（如 GRE）。
kyoto-double-doctoral-list: 京都大学双学位项目列表，列有能源科学研究科与浙江大学的博士双学位。入学条件与资助以京都大学当年招生简章为准。
kyoto-econ-doctoral-oct2027: 京都大学经济学研究科2027年10月入学的英文授课博士项目，国际生每年约5人。非日本学历者须先经AAO预审并提名拟指导教师，经费以学校奖学金和MEXT为主，需另行规划资金。
kyoto-english-taught-programs: 京都大学官方英文授课学位项目总览，可按学科找到博士方向。找到方向后，再到对应研究科查看申请时间与经费。
kyoto-intl-admissions: 京都大学面向国际学生的研究生入学，约 15 个英文项目，可申请 MEXT 与校内奖学金。MEXT 奖学金须经使领馆推荐，或经校方推荐（校方推荐限指定国家或地区国籍者），各研究科规则不同。
kyoto-mext-science-admissions: 京都大学理学研究科的 MEXT 奖学金入学说明，覆盖学费与月生活费，金额以当年 MEXT 指南为准。申请需先联系目标导师取得预录取，可经驻外使领馆或大学推荐。
kyoto-u-jobs-board: 京都大学官方招聘页，列有博后、特定研究岗与教职等岗位，部分岗位标注为选到合适候选人即停止招聘。各岗位要求不同，部分需博士学位或同等研究业绩，国际生资格以岗位公告为准。
kyoto-u-mext-scholarship: 京都大学MEXT奖学金的博士阶段说明：需经驻华使馆MEXT选拔（笔试加面试）或大学推荐。中国学生第一轮初审由中国教育部负责，之后需取得京大教授的临时录取函。
kyushu-iei-english-doctoral: 九州大学英文授课三年制博士项目，学校承担学费并发放每月 145,000 日元奖学金。需英语 CEFR B2 以上成绩；中国籍能否报考需先向 IGSES 办公室咨询。
kyushu-isc-mext-info: 九州大学国际学生支援中心 MEXT 奖学金信息页，列有研究生的大学推荐与使馆推荐两条路线。博士课程月额 ¥148,000（含地域补贴），学费由九州大学承担，并提供往返机票。
kyushu-research-students-univ-recommendation: 九州大学的MEXT大学推荐（研究生与硕博），名额有限，部分年度可能没有推荐。原则上面向拟入读正规硕士或博士课程者，仅以研究生身份入学者不符合，需先联系拟指导教授。
la-trobe-graduate-research-phd-project: La Trobe 大学研究生 PhD 项目奖学金，按具体项目申请，Study Australia 列出年补助 AUD 36,000。国际生资格以该校官网为准，申请时需选定对应的博士项目。
lakehead-intl-scholarships-phd: 加拿大 Lakehead University 的博士国际生资助页，列出研究生助研岗位，可能提供给含签证学生在内的部分全日制研究生。博士层级所列薪酬为 $12,338.50 加元，秋冬学期工作不超过 270 小时。
lancaster-ahrc-fhass: 兰卡斯特大学人文社科 AHRC 与学院博士奖学金，国际生与英国学生均可申请，含生活津贴的全额资助，学校补足国际学费差额。需同时申请并获得 Lancaster 博士录取。
lancaster-leverhulme-ecf: 兰卡斯特大学 Leverhulme 早期职业研究奖学金（ECF）的校内遴选，面向博士后，资助形式为薪资。申请人需未在英国大学持有全职永久教职。
lancaster-lums-phd-funding: 兰卡斯特大学管理学院（LUMS）博士奖学金，面向所有国籍学生，含学费减免与约 £19,000/年生活津贴。申请时需在申请表中注明希望被考虑 Doctoral Studentship。
lancaster-materials-science-phd-2027: 英国兰卡斯特大学 2027 年入学的材料科学全日制博士课程。页面列出 2027/28 国际生全日制学费为 £29,300，课程细节以学校页面为准。
lancaster-stats-phd-2027: 兰卡斯特大学 2027 年入学的统计学博士项目，学制三年，全日制学习。页面列出 2027/28 国际生全日制学费为 £26,000，奖学金信息需另查学校的奖学金页面。
laval-doctorate-tuition-exemption: 拉瓦尔大学博士国际生补充学费豁免，对博士注册生免除魁北克国际生补充学费，官方估计节省约 4 万加元。仅减免学费，不含生活津贴，其他学费仍需支付。
laval-goodman-doctoral-studentship: 拉瓦尔大学药学院 Goodman 家族基金博士奖学金，面向全球招生，总额 CAN$100,000，每学期 CAN$12,500，最多 8 学期。申请需有同意指导的教授，并完成博士申请。
lbl-als-collaborative-postdoc: LBNL 同步辐射光源（ALS）的合作型博士后，年津贴 $36,500（不含福利）。需具备美国合法工作资格，并有合作资金来源及校外合作导师支持；来自非美国机构的研究员可获一次性 $3,000 搬迁补助。
lbnl-alvarez-hopper-fellowship: 伯克利国家实验室计算科学部门的两年期博后奖学金（Alvarez / Hopper 共用一次申请），面向计算科学、计算机或应用数学近期博士。对中国大陆申请者可能有 DOE 外国人访问与安全审查限制，需向招聘方确认。
lbs-om-postdoc: 伦敦商学院运营与管理科学组的有薪博士后招聘页，职位随项目发布。申请需相关领域 PhD，提交 CV、三封推荐信、3 页研究陈述与样例论文，并指定 MSO 系教员作导师。
lbs-phd-entry: 伦敦商学院（LBS）博士项目，全体博士生均获全额资助：学费全免，免税津贴 2026 年 9 月起为 £32,154/年、2027 年 9 月起为 £33,762/年，保障 5 年（视学业进展而定）。
learning-theory-list: 学习理论社区的 Google Group 邮件列表，面向全球，适用于博士与博后岗位，列表中会出现 PhD 招生帖，以学习理论研究方向为主。
lebesgue-math-phd-grants: Henri Lebesgue 数学中心是法国西部数学联盟的博士资助入口，岗位由雷恩、南特、布雷斯特、昂热、勒芒等成员实验室发布。页面列有低维拓扑与奇点方向的 12 个博士资助（玛丽·居里规则，约 €3,500/月）。
leeds-intl-phd-academy-medical: 英国利兹大学国际博士学院医学研究方向，4 年制，首年为基础训练，每年 9 月入学，名额 5 个。页面称申请者为自费（个人、政府或雇主资助均可），需自付海外学费、实验耗材与生活费。
leeds-music-postdoc-opportunities: 利兹大学音乐学院博士后支持页，汇总英国学术院博士后与玛丽·居里博士后的校内申请安排。英国学术院项目一般要求获博士学位三年内，并须为英国或欧洲经济区国籍，或与英国学术界有较强既往联系。
leeds-sustech-split-site-phd: 利兹大学与南方科技大学联合培养博士项目。第一年在利兹，中间约两年九个月在深圳南科大，最后三个月回利兹完成论文。要求英国二等一荣誉学位和 IELTS 6.5，南科大提供覆盖学费及部分生活费的资助。
leeds-swjtu-dual-phd: 利兹大学与西南交通大学合办的双学位博士项目，利兹大学免除学费，学生可申请西南交大博士奖学金等资助。申请者须已被西南交大录取或在读，需先在西南交大完成一年预备学习。
leeds-yes-dtn-studentships: Yorkshire 高校联合的环境科学博士培训网络（利兹大学 YES.DTN），每年约 26 名全额资助名额，须通过利兹大学申请并获得名额，需英国 2:1 或同等学位。
leibniz-graduate-schools-rig: 莱布尼茨研究生院的博士职位，可选奖学金（每月 1,150–1,450 欧元，最长 3 年）或工作合同（通常兼职，全职约每月 4,400 欧元税前，通常 2–3 年）。需直接向相应研究所申请。
leibniz-hki-ilrs: 德国莱布尼茨 HKI 国际博士培训项目（ILRS），与耶拿大学、马普化学生态所合作，英语为主要工作语言。面向细胞生物学、微生物学、免疫学等专业，需硕士学位（或即将完成）。
leibniz-individual-doctoral-projects: 莱布尼茨研究所的个人博士项目，博士生在研究所内完成学位，由研究所与合作大学共同指导。全职约每月 4,400 欧元（税前，依德国各州公共部门集体协议），合同一般 2–3 年，可延长 1–2 年。
leibniz-jobs: 莱布尼茨联合会近百个研究所的岗位门户，社科、经济、生命科学方向岗位较多。岗位为带薪职位，部分岗位仅用德语发布。
leibniz-phds-career-page: 莱布尼茨联合会博士招聘入口，无中央统一申请，各研究所随时发布岗位，需直接申请匹配研究兴趣的研究所；部分岗位仅有德文公告。
leiden-child-law-phd: 莱顿大学儿童法与健康法系博士岗位，系里偶尔面向内部候选人公开系级或国家、欧盟项目资助的岗位。外部候选人需自筹资金或已获奖学金，可提出自拟课题并获系内导师指导，可邮件询问。
leiden-graduate-school-archaeology-phd: 莱顿考古研究生院博士招生指引。学院不提供博士奖金或奖学金，外部候选人需自筹资金，学院也不为其提供签证或居留担保。申请者需先找到至少两位愿意全程指导的教授。
leiden-indonesia-linguistics-phd-2026: 莱顿大学语言学中心的 NWO 资助博士岗位，研究印尼东部濒危语言 Usku 与 Banda 的记录与描写。4 年全职合同，税前月薪€3,204 至€4,051；要求语言学硕士，同等条件下优先印尼籍候选人。
leiden-nwo-phd-humanities-2027-archaeology: 莱顿大学考古学院参与的 NWO「PhDs in the Humanities」2027 轮，博士职位由导师正式提交。每位候选人最多两次申请机会，页面称 NWO 官方征集文件可能于 11 月发布。
leiden-observatory-jobs: 莱顿天文台招聘页，含博士与博后岗位。博士为年度统一征集，个别岗位随时发布，具体以官网岗位说明为准。
leiden-observatory-phd-apply: 莱顿天文台博士招生页，本轮为统一招生，另有 de Sitter 奖学金项目，按同一流程申请。需硕士学位或同等学历，并通过莱顿在线申请系统提交申请与推荐信。
leiden-phd-places-admission: 莱顿大学人文学院的博士招生说明，区分受雇（带薪）、合同（奖学金）和自筹三类博士。页面列出带薪岗位示例月薪€2,541–3,247（毛薪，2024 年公告），合同博士须先找到可全程指导的教授。
leiden-psychology-phd: 莱顿大学社会科学院心理学系的博士岗位入口（荷兰语页面）。需荷兰大学硕士文凭或同等学历，并已完成硕士论文。岗位在有空缺时发布于 Vacatures 页面，无固定截止日期，找到导师后需通过邮件联系研究生院。
leiden-scholarships: 荷兰莱顿大学的奖学金总览页，汇集多项奖学金。博士相关项目包括 CSC 奖学金与 Leiden University Fund，具体金额以各项目页面为准。
leipzig-math-phd: 莱比锡大学数学研究所博士招生页。2026 年 10 月 1 日入学批次拟资助至多 4 人，多为 50% 科研助理岗位（TV-L EG 13）。
lesc-cnrs-contrats-doctoraux-2026: 巴黎第十大学（Paris Nanterre）LESC（CNRS 民族学与比较社会学实验室）的博士合同 2026–2027 预选程序。需实验室内导师推荐，并提交博士论文计划、导师同意函与硕士论文，共 3 个 PDF 文件。
leverhulme-ecf: Leverhulme 早期职业研究奖学金，由英国高校托管，面向博后阶段研究者。申请者须持英国高校学位，或在截止前已有至少 4 个月的英国高校学术职位；已有 3 年以上自主博后经验者不符合。
liggins-institute-doctoral-scholarships: 奥克兰大学 Liggins 研究所博士奖学金，2026 年列出 3 个名额，须对应 Liggins 导师并符合母婴健康方向。另有 Start-Up 博士奖学金，为新入学博士生提供首年津贴与学费。
ligo-job-postings: 引力波实验室 LIGO 的职位汇总页，列有 AEI Potsdam、Ghent 大学、IGFAE 等地的博士岗位，也含博后与教职，各岗位的资助与申请要求以职位页为准。
lille-doctoral-funding-2026: 里尔大学 2026 年博士资助 PDF 汇总，按资金来源列出合同博士、CIFRE 与校内项目。外国申请人需对照各线路的资格要求。
lille-institutional-funding: 里尔大学博士学院的校级博士资助选拔，为期 3 年的雇佣合同，由接收院校支付不低于 2,300 欧元/月（毛额）的薪酬。需先联系论文导师，材料通过 ADUM 门户提交。
lincoln-enact-dla: 林肯大学 ENACT EPSRC 博士培训项目（DLA）的博士岗位支付英国标准学费，并提供按 EPSRC 标准的免税生活津贴。2026 年 10 月入学轮已关闭，招生计划于 2026 年 12 月重新开放。
lindner-cincinnati-phd: 辛辛那提大学 Lindner 商学院博士项目，方向包括会计、经济、金融、管理、营销、运营与信息系统。官网称录取者可获四年助研、助教或奖学金支持。
lingnan-msoda-postdoc-26-241: 岭南大学 MSoDA 博士后岗位（26/241/JAC），全职有薪，适合数据科学或社会计算背景。需在入职前三年内获得社会学、社会政策或计算社会科学相关博士学位，计算方法研究经验为加分项。
lingnan-phd-programmes: 岭南大学 MPhil/PhD 项目列表，涵盖文科、商科、数据科学、社会科学及环境科学、可持续发展等跨学科方向，并列有与内地高校合办的双博士学位项目。
lingnan-sociology-postdoc-26-236: 岭南大学社会学与社会政策系的博士后岗位（26/236/JAC），共 2 个研究岗位，固定期合同通常最长两年，方向为新冠防控措施与社会政策的跨国比较。需具备定量与定性社会研究经验，薪酬按资历确定。
linguist-rss-feeds: LINGUIST List 的 RSS 订阅平台。Support for Students 栏目发布帮助学生取得学位的机会（含研究生助教职位），Job Announcements 为雇主招聘流，需按截止日筛选。
liu-apply-doctoral: 林雪平大学博士岗位说明。博士生为有薪全职雇员，申请岗位即申请入学，学习两至四年。需硕士级学位，或至少 240 学分高等教育（其中至少 60 学分为高级水平）。
liu-css-research-school: 林雪平大学计算社会科学研究生院，由瑞典研究理事会拨款资助，覆盖项目活动期间的住宿与瑞典境内差旅，非瑞典参加者仅有限提供差旅补助。两年一届，面向博士生，也接受其他国家申请者。
liu-vacancies: 林雪平大学全校职位页，可按城市、系和职位类别筛选，也可通过邮箱订阅提醒。页面列出多个博士生岗位，均为有时限（临时）雇佣。
liverpool-csc-award: 利物浦大学与 CSC 合作的博士奖学金，仅限中国国籍申请者，并须满足 CSC 要求。学校覆盖全部学费并提供每年最高 £1,250 的研究费，最长 4 年，每年 10 月开始；须先申请利物浦博士，并在申请表注明 “Liverpool CSC scholarship”。
liverpool-particle-physics-phd: 利物浦大学粒子物理组的博士岗位，列有8–10个由 STFC 等合作方支持的项目，资助名额主要面向英国居民，海外名额有限，也接受自筹或外部资金申请，需先联系招生负责人再在线申请。
lmb-cambridge-scholarships: MRC分子生物学实验室（LMB）面向海外学生的剑桥奖学金，名额有限，需通过剑桥大学申请门户申请LMB博士。海外生只能申请LMB Cambridge Scholarships，不能申请仅限英国学生的MRC Studentship。
lmb-phd: MRC 分子生物学实验室（LMB）四年制全日制博士项目，2027 年 10 月入学，资助向所有国籍开放并通过公开竞争分配。需经剑桥 Applicant Portal 申请，并为最多三位导师各写研究兴趣陈述。
lmu-csc-scholarship-program: 慕尼黑大学（LMU）与 CSC 合作的博士项目，分全博士与 sandwich 联合培养两种模式。须为中国大陆国籍，先获 LMU 录取函，再向 CSC 提交申请；CSC 资助含差旅费与月生活费。
lmu-gsn-funding: 慕尼黑大学系统神经科学研究生院（GSN-LMU）的博士资助说明。博士项目免学费，多数博士生由导师课题组以雇佣合同资助，GSN 本身不直接发放全额奖学金，个别情况有生活补助。仅接受在线系统申请。
lmu-med-csc-open-doctoral-positions: 慕尼黑大学医学院列出的 LMU-CSC 2027 轮博士课题，涵盖血管外科、神经学、免疫学等多个科室。课题较具体，需符合研究兴趣与资格再申请，并提交简历、研究动机信与英语成绩。
lmu-munich-epi-public-health-daad: 慕尼黑大学（LMU）流行病学与公共卫生英文博士项目，DAAD 合作资助 2 个全额名额，约 1400 欧元/月。面向低、中收入国家的国际申请人，须先经大学系统申请并获提名。
lmu-physics-graduate-funding: 慕尼黑大学（LMU）物理系的研究项目与博士资助页，列出 DFG 研究生院、巴伐利亚精英网络（ENB）博士项目及 IMPRS 等资助项目。具体博士岗位以各项目公告为准，申请通常需先联系导师。
lodz-tech-ids-nawa-scholarships-2026-27: 罗兹理工大学跨学科博士学校的 NAWA 奖学金（2026/27 第二期），面向优秀外国博士生，每月 PLN 5,000（gross-gross），发放 3 个月。博士论文须以英语撰写，本期 10 个名额通过公开竞争选拔。
logic-list: ILLC 逻辑学邮件存档，含博士与博后岗位公告，页面显示存档仍在更新，最新一批为 2026-09-18。岗位是否带资助以各公告为准。
lorentz-leiden-jobs: 莱顿大学洛伦兹研究所（理论物理）博士与博后招聘页，岗位取决于国家或欧盟资助。页面称特别优秀的申请者可随时申请系内博士职位，建议先联系相关教授。
lorraine-isite-saps-cd-2026: 洛林大学 iSITE Lorraine 社会科学与人文方向博士合同征集，合同为 3 年，2026 年 9 月启动招生。页面称优先考虑外部尤其国际候选人，选题须用法语撰写。
lorraine-sjpeg-cd: 洛林大学法经政管博士学院（ED SJPEG）博士合同，三年固定期限带薪雇佣，要求全职研究，2026/27 学年共 10 个。需未注册或注册未满一年，经 ADUM 线上提交，先由委员会筛选再面试。
lot-school: LOT荷兰语言学国家研究生院的首页，汇总荷兰各高校近期发布的语言学博士与博后招聘公告，例如阿姆斯特丹ACLC招两名儿童语言博士生。
loughborough-csc-phd: 拉夫堡大学与 CSC 合作的全额学费博士奖学金，面向 2027 年 10 月入学的全日制新博士。学费由大学 100% 资助，CSC 提供生活费与往返机票；须为中国国籍且在中国大陆常住，学成须返回中国，并须同时在 CSC 网申。
loughborough-sehs-funded-phd: 拉夫堡大学体育、运动与健康科学院的博士项目清单，列出若干资助项目和自筹资金项目。需 2:1 荣誉学位或同等国际学历，或相关硕士学位；国际生能否申请需逐项在项目页确认。
loughborough-sehs-funding-opportunities: 拉夫堡大学体育、运动与健康科学学院的博士资助信息页，汇总政府、慈善、产业及大学奖学金等来源。页面称学生可自费或借助第三方资助申请预设项目。
lse-cep-predoc-ra: LSE 经济绩效中心（CEP）预博士研究助理，固定期限一年（可延长至两年），薪资 £36,513 至 £41,565。要求定量学科本科学位，熟练使用 STATA 或 R。页面称兼职岗位仅面向在英国的研究生。
lse-econ-costs-financial-aid: 伦敦政治经济学院（LSE）经济系的学费与资助说明页。校级奖学金覆盖 4 年，系内补足至 5 年；LSE PhD Studentships 约 £23,805/年（2026 入学）。ESRC 奖学金的国际生学费差额由 LSE 承担，但 ESRC 名额对国际生有上限。
lse-gender-phd: 伦敦政治经济学院（LSE）性别研究系博士项目，需获 PhD 无条件录取，申请即自动考虑 LSE 与 ESRC 的博士资助（竞争性）。另有 LSE-CSC 奖学金仅面向中国公民，每年约 8 个名额，最长 4 年，需承诺毕业后回国。
lse-social-policy-phd-studentship: 伦敦政治经济学院（LSE）社会政策系的博士资助页。无需单独申请，资助由提名分配。页面列出面向英国及国际申请者的 LSE Social Policy PhD Studentship，以及面向英国及欧盟申请者的 ESRC 奖学金。
lse-sociology-phd: 伦敦政治经济学院（LSE）社会学系的 MPhil/PhD 项目。经费来自学院管理的多种资助渠道，申请时需勾选；参考标准约 £23,805/年（2026 入学）。
lsgnt-cdt: 伦敦几何与数论 CDT（LSGNT）由帝国理工、伦敦国王学院与 UCL 联合设立，纯数学方向 4 年制博士，全额资助（学费、免税津贴、会议差旅）。2027 年入学共 9 个名额，国际生名额以官网为准。
lsu-chem-assistantships: 路易斯安那州立大学化学系为全日制博士生提供教学或研究助理岗位及奖学金，标准助教/助研每年 $30,667，并享受全额学费减免及医保保费减免。申请需 GPA 不低于 3.0。
lszgs-track1: ETH 与苏黎世大学联合的生命科学苏黎世研究生院（LSZGS）博士申请入口，需已获或即将获自然科学硕士学位（或同等学历），医学学位须走 MD-PhD 项目。课题组需有至少 3 年的博士雇用经费。
lu-fnr-afdoc: 卢森堡国家研究基金（FNR）的 AFdoc 博士资助计划，资助覆盖雇用薪资，最高年度薪资资助 EUR 54,574（含雇主费用、社保与养老金），不含学费。申请人需与卢森堡有关联。
lu-lv-doctoral-cs-electronics: 拉脱维亚大学计算机科学与电子学博士项目，2026/27 学费为每年 €8,400，欧盟与非欧盟学生相同，设国家资助名额 5 个、自费名额 3 个。
lu-lv-doctoral-mathematics: 拉脱维亚大学的数学博士项目，2026/2027 学年设国家资助学位 3 个、自费学位 4 个。学费方面，欧盟、EEA 及瑞士公民与永久居民为 3300 欧元，其他国家公民为 6400 欧元。
lund-stats-doctoral-studentship: 隆德大学统计系博士研究生带薪全职职位，通常为 4 年，部门称一般提供全程经济支持。职位在 lu.varbi.com 发布。
lund-vacancies: 隆德大学职位库，滚动发布，包括 LTH 电气与信息技术系的博士岗位。瑞典博士为带薪雇佣合同，学校称博士教育无学费，申请通过 lu.varbi.com 提交。
lundbeck-foundation-postdocs: 丹麦 Lundbeck 基金会博后项目，聚焦神经科学，含国际人才来丹麦的类别，最高 DKK 300 万（3 年，含家庭与差旅津贴）。需到丹麦宿主机构工作，博士毕业 4–5 年内申请。
manchester-csc-joint-humanities: 曼彻斯特大学与 CSC 联合奖学金，学校负担全部学费，CSC 提供生活费与往返机票。须为中国大陆国籍并拥有永久居民身份，适用学院为商学院、环境教育与发展学院及社会科学学院。
manchester-csc-joint-scholarship: 曼彻斯特大学与 CSC 联合奖学金，学费由曼彻斯特大学承担，CSC 提供生活津贴及往返机票，资助通常为 3 年。仅限中国大陆公民且具永久居留，须已获课题无条件录取并承诺学成回国。
manchester-peking-dual-award: 曼彻斯特大学与北京大学合办的双学位博士项目，两校学费由奖学金覆盖，英国段按 UKRI 标准发放津贴。中国籍申请者须通过北京大学申请，项目开放 2027 年 1 月入学的额外招生。
manchester-social-anthropology-phd: 曼彻斯特大学社会人类学博士。全额资助（3.5 年学费加生活费）需通过内部奖学金竞争获得，申请项目时须勾选相应竞争。生活费为 £20,780/年（2025/26 标准，2027 年待定）。
manchester-tsinghua-dual-award: 曼彻斯特大学与清华大学合办的 4 年制双学位博士项目，两校各约两年，授予双博士学位。官网称开放 2027 年 1 月入学的补充招生，资助与 CSC 资格需向两校官方确认。
mannheim-baor-phd: 曼海姆大学 Stolletz 教授生产管理组的带薪博士助研岗，方向为商业分析与运筹学，研究排队网络等随机系统的性能分析与优化。要求英语流利（不要求德语或法语），兼顾助教与教学工作。
mannheim-gess-doctoral: 德国曼海姆大学 GESS 全额资助博士项目，各研究中心录取要求不同，申请时需对照所选中心的条件，并按项目要求准备材料。
massey-csc-phd: 梅西大学（新西兰）的 CSC 博士学者项目，每年最多约 20 个名额，面向中国籍且已获博士录取（有条件或无条件）的申请者，须导师支持。学费由梅西大学承担，差旅、住宿与生活费由 CSC 承担，最长约 4 年。
massey-mcclenaghan-veterinary-scholarship: 新西兰 Massey 兽医学院的犬类健康与福利奖学金，每年 $50,000，最长 3 年，仅 1 个名额。页面称优先新西兰公民或永久居民，国际申请者也会考虑。
massey-river-water-phd: 梅西大学河流营养盐（氮、磷）动态与水质建模方向的 PhD 奖学金。年津贴 NZ$35,000 加学费，最长 3 年。面向新西兰及国际申请人，本地优先，需科研写作样本与 3 位推荐人。
mat-ed-imep2-doctoral-contracts: 格勒诺布尔阿尔卑斯大学 ED I-MEP² 博士合同，覆盖材料、能源与工程方向，竞争式招生，课题清单每年 2 月底公布。合同 36 个月，税前 €2,300/月，申请前需先联系论文导师。
mathjobs-bonn-karriere: 波恩大学数学系职业页，链接 BIGS 数学博士与 HCM 博后招生。BIGS 博士通常需数学硕士，录取不自动提供资助；博士岗首次聘期为 3 年，为带薪职位。
max-planck-schools: Max Planck Schools 博士项目，页面列出生物医学 AI、认知、物质到生命、光子学等子项目。本科或硕士毕业生均可申请，资助最长 5 年，无学费。
mayo-gsbs-neuroscience-phd: 梅奥诊所研究生院（MCGSBS）神经科学博士项目，目录基础津贴为$42,642（2025–2026），获5年保证性内部奖学金，学费免除。接受国际申请人，需提供英语能力证明。
mbi-phd-scholarship-poster-2027: 新加坡国立大学分子与细胞生物所（MBI）全奖博士招生，2027 年 8 月入学，共 10 个名额，最长提供 4 年全额资助（含津贴与福利）。面向科学、技术、工程、数学等各学科背景，无需机理学基础。
mbzuai-careers-postdoc: 阿联酋 MBZUAI 官方职位库，目前显示 97 个开放职位，其中博士后研究员岗位涵盖 AI 精准医学、AI 天气预报、统计与机器学习等方向。需博士学位。
mcgill-chiu-kay-lui-csc-fellowships: 麦吉尔大学面向持 CSC 奖学金博士生的补充项目，补足国际学费差额 $16,000，可续 3 年。申请需导师支持信、中英文研究摘要与中文学业目标陈述。
mcgill-csc-joint: 麦吉尔大学的 CSC 联合博士奖学金，学费由麦吉尔承担，CSC 提供生活补助、保险和机票，最长 4 年。需先通过 CSC 联合奖学金申请，并获得麦吉尔有条件录取。
mcgill-csc-joint-doctoral: 麦吉尔大学（McGill）与 CSC 的联合博士奖学金，最长 4 年。McGill 负担学费，CSC 提供生活费等。须为中国大陆公民或永久居民，需先获 McGill 博士录取条件性 offer，再通过本校走 CSC 程序。
mcgill-doctoral-funding: 麦吉尔大学工学院为新录取博士提供前 4 年学费覆盖，并保证每年不少于 CAD 20,000 的生活费，非学费项目需自付。外部奖学金超过一定额度的学生规则不同，中国学生符合资格。
mcgill-gps-international-funding: McGill 大学研究生院国际生资助入口，列出国际生可能适用的主要奖学金。资助包金额因院系而异，需先被录取。差别学费豁免（DFW）只覆盖国际生学费附加部分。
mcgill-gps-phd-funding: 麦吉尔大学研究生院的博士资助包来源包括校级基金、捐赠和导师科研经费，录取时随录取通知附资助信，金额因院系而异。
mcgill-microimm-funding: 麦吉尔大学微生物与免疫学系博士资助页，列出 2026–27 年国际生博士 1–4 年最低总额 $47,251（含学费），主管可额外补贴。
mcmaster-csc-joint: 麦克马斯特大学的 CSC 联合博士项目，全额资助，每年最多 15 名，最长 48 个月。申请人须先获得麦克马斯特博士项目正式录取，并在申请时注明 CSC–McMaster 联合资助项目。
mcmaster-eng-min-funding: 麦克马斯特大学工学院博士最低资助标准，最低 CAD 21,000/年加学费，国际生与本地生相同，通常最多资助四年。外部奖学金低于最低标准时学院补足；工业博士不在此列。
mcmaster-fast-facts-grad-scholarships: 麦克马斯特大学研究生奖学金速览，列出 OGS 等博士奖学金的成绩要求和金额。国际生只可申请以择优为基础的奖项，除非奖项条款另有规定。
mcmaster-kinesiology-funding: 麦克马斯特大学运动学研究生项目的资助说明（2025–26 学年），录取学生获保障资助，博士每年 $25,000，最长 4 年。录取需导师同意。
mcqst-postdoc-fellowship: 慕尼黑量子科学与技术中心（MCQST）博士后奖学金，面向持有物理、数学、计算机、化学、工程等相关博士学位者。申请需先与 PI 沟通并列出 3–5 位意向 PI，并提交 2 页以内 CV 与研究陈述。
memorial-graduate-funding: 纪念大学（Memorial University）研究生院汇总的奖学金与导师资助页面。学术合格的全日制研究生即可获得资助包，国际生与加拿大生同等，金额按项目而异。
mfo-oberwolfach-leibniz-graduate: Oberwolfach 数学研究所（MFO）为在读博士及学位取得未满 2 年的毕业生提供参加研讨会的差旅补贴，平均约 200 欧元，并非生活费。需邮件向所长申请，随时可申请，名额有限。
miami-um-fellowship: 迈阿密大学研究生院校级 UM Fellowship，面向秋季入学的首年博士新生，由院系提名，官网称国际申请人有资格。2024-25 学年津贴 $39,000，另含学费减免（可续 5 年）和 100% 医保补贴。
miller-research-fellowship: 伯克利Miller研究员计划的基础科学博士后，3年期，津贴$95,000起并每年递增3%，另有研究经费$10,000/年。须由教授或机构人员提名，不接受自荐。
mit-bcs-phd: MIT 脑与认知科学系（BCS）博士项目，每年收到 900 余份申请，通常录取 15–18 名新生。申请须在线提交，非英语母语者需提交 TOEFL iBT、IELTS Academic 或 Cambridge C1/C2 成绩，GRE 非必需。
mit-biological-engineering-phd: MIT 生物工程博士项目，全体博士生获学费、医保与津贴全额资助。需研究目标陈述与 3 封推荐信，不接受 GRE；国际申请人需英语成绩（IELTS 最低 7，TOEFL iBT 最低 100）。
mit-dusp-phd-funding: 麻省理工学院城市研究与规划系（DUSP）博士项目，学院称录取博士生可获五年全额资助，包括学费、津贴与医保。通过 MIT Graduate Admissions 网申。
mit-econ-financial-support: MIT 经济系博士生资助：前两年通常由奖学金覆盖全额学费、12 个月个人医保及 9 个月生活津贴；第 3–6 年通过助教或助研岗位获得支持，取决于学业进展。具体金额以当年公告为准。
mit-media-lab-mas-phd: MIT 媒体实验室媒体艺术与科学方向的 MAS 硕士项目，学生获全额资助，含学费、医疗保险和津贴。不直接招收 PhD，须先以 MAS 硕士身份入学，第二年才可申请转 PhD。
mit-microbiology-phd: MIT 微生物学博士项目，MIT 生物系页面称全体博士生获学费、津贴与医保资助。不需要 GRE；需英语成绩（IELTS 7 / TOEFL iBT 100），英语母语或符合学位豁免条件者可免试。
mit-philosophy-financial-support: MIT 哲学系每年可为 5 名新入学博士生提供学费加 12 个月津贴。MIT 不保证超过一年的资助，系里预计对学业良好者支持完整五年，建议另申请外部奖学金。
mitacs-accelerate-phd-fellowship: 加拿大 Mitacs 博士实习津贴，面向在加拿大高校就读的博士生，持学生签证的国际学生也可申请。项目需与加拿大合作企业或机构的课题挂钩，全年可随时申请。
mitacs-elevate-postdoc: 加拿大 Mitacs 奖学金项目下的博士后计划，支持博士后与加拿大企业合作开展应用研究。每年奖励 $60,000，其中最低津贴 $55,000，需加拿大合作导师与企业方配合申请。
mittag-leffler-junior-fellowship: 瑞典 Institut Mittag-Leffler 青年学者项目，面向高年级博士生或项目开始前 5 年内获得博士学位者。项目含月津贴、免费住宿及一次往返差旅，约 3.5 个月，属短期访问性质。
mlai-ellis-alicante-phd: ELLIS 阿利坎特单元的博士项目，面向全球青年研究者，每年秋季统一申请，约 5–10% 的合格申请者被录取。博士须由两名不同欧洲国家的 ELLIS 导师共同指导，并到交流机构停留至少 6 个月。
mlai-ellis-phd-freiburg-programme: ELLIS 博士与博后项目弗赖堡单元页，提供全额资助的 ELLIS 博士职位（100% E13，按机构薪级）并有搬迁支持；博士须由两名不同欧洲国家的 ELLIS 成员共同指导。
mlai-idiap-calinon-openings: Idiap 研究所 Calinon 团队的机器人学习博士岗位，为 4 年带薪合同，需同时被 EPFL 博士项目录取。需工程、计算机、物理或应用数学硕士，有信号处理、控制、优化或机器学习背景。
mlai-mcml-phd-applicants: 慕尼黑机器学习中心（MCML）的博士申请入口，岗位由 LMU 与 TUM 联合提供，为德国 TV-L E13 全薪职位，每个岗位期限 3 年，申请者需按页面说明投递。
mlai-studyinaustria-ista: 奥地利科学技术研究所（ISTA）的国际博士项目，覆盖十余个学科，提供全额资助的五年合同并含全额财务支持，可通过奥地利留学门户查看。
momentum-msca-hungary: 匈牙利科学院的 Momentum MSCA 高级博士后项目，须在申请截止前已获博士学位，申请前 3 年内在匈牙利居留或工作不超过 12 个月，并须完成强制国际交流。
monash-vl4ai-phd: 莫纳什大学 VL4AI 视觉-语言 AI 研究组的全额资助博士岗位，研究视觉-语言与机器人方向，国际生可申请。需先按莫纳什研究生流程申请，再发邮件至 vl4ai@monash.edu 联系课题组。
mount-sinai-icahn-phd-intl: 西奈山伊坎医学院生物医学科学与神经科学博士项目，通过研究生院（GSBS）申请。官网称国际生可获得全额机构资助；联邦资助与校内工作机会对国际生不开放。
mpg-jobboard: 马普学会所有职位的招聘页，职位类型选择 “PhD students” 即可筛出博士岗位。岗位为带薪职位，一般需硕士学位（部分 IMPRS 接受本科），多经 IMPRS 项目门户申请。
mpgc-qm-phd-2026: 马普量子材料研究生中心（MPGC-QM）的全额资助博士研究员岗位，由五个马普研究所联合招生，部分岗位为与牛津大学的联合培养。招收相关方向硕士或同等学历者，研究量子材料。
mpi-ai-phd-call-2026: 马普 AI 网络（MP-AIX）博士招生，与 ELLIS 统一招生联动，一次申请可同时考虑两个项目，2027 年入学。需硕士学位（已获得或即将获得）及优秀学术背景，资助形式为薪资。
mpi-cbg-phd-program: 德累斯顿的 MPI-CBG 博士项目入口，需生物、化学、计算机、物理、数学或工程等相关硕士学位及较好的英语能力。通过各阶段评审者将被邀请赴德累斯顿面谈，博士岗位在面谈访问结束时发出，博士论文期间提供财务保障。
mpi-ds-living-matter-phd-w091: 马普动力学与自组织研究所 Living Matter 部门（Golestanian 组）的 PhD 岗位，做活性物质的理论与计算研究，合同 3 年。待遇为 TVöD-Bund E13 的 2/3；需 CV、成绩单、研究兴趣陈述和两位推荐人。
mpi-inf-cv-direct-application: 马普信息学所计算机视觉与机器学习部，全年接受直接申请邮件，申请材料合并为一个 PDF，包括 CV、研究陈述、完整出版清单、推荐人名单、代表性论文及成绩单。
mpi-inf-job-openings: 马普信息学研究所（萨尔布吕肯）的招聘汇总，列出各系与独立研究组的博士、博后岗位入口，并介绍马普女性计算机科学博后奖学金、与 Simons Institute 的联合研究奖学金等。
mpi-psycholinguistics-vacancies: 奈梅亨马普心理语言学研究所的招聘页，目前有一个由马普学会资助的3年期博士后岗位，方向为统计遗传学与遗传流行病学。其余列出的岗位均已截止。
mpi-susmat-admission: 马普可持续材料研究所（MPI-SusMat）的博士招生页，要求材料科学、物理或化学相关的优秀硕士学位（含论文）及很好的英语水平，仅接受在线申请。页面称本年度无申请批次，可能于 2027 年秋季重新开放。
mpi-sws-graduate-studies: 马普软件系统研究所（MPI-SWS）研究生招生，全年接受申请，按季度评审。页面称录取者均获全额资助，需英语能力证明与推荐信。
mpi-sws-open-positions: 马普软件系统研究所（MPI-SWS，萨尔布吕肯与凯泽斯劳滕）的博士与博后岗位列表，并提及 CS@Max Planck 统一博士申请渠道。
mpia-imprs-heidelberg: 海德堡马普天文研究所（MPIA）的 IMPRS 天文与宇宙物理博士项目，每年秋季入学，名额有限。国籍与学位要求以官网为准。
mpib-jobs-page: 马普人类发展研究所（柏林）的招聘栏目暂无岗位。博士途径为 IMPRS 项目（计算精神病学与衰老研究、生命历程）及个人博士研究，需直接联系主任或研究组负责人。
mpil-heidelberg-foreign-doctoral-grants: 马普比较公法与国际法研究所（海德堡）面向不在德国撰写论文的外国博士候选人，停留最长 6 个月，博士候选人月资助 €1,650。须通过官网在线系统提交，邮件申请会被直接淘汰。
mpp-imprs-physics-munich: 马普物理所（慕尼黑）IMPRS 粒子物理国际博士项目（EPP）的申请页，英语授课，要求硕士或同等学历。博士生获三年合同，可延长一年，须使用官网申请表递交。
msca-dn: 欧盟玛丽居里博士网络的博士岗位，招聘时未取得博士学位即可，任何国籍均可申请，并可获生活津贴与流动津贴。但招聘日前 36 个月内在招聘国居住或工作超过 12 个月者不符合要求。
msca-dn-flexcat-phd-2026: 欧盟 MSCA 博士网络 FlexCAT，共 15 个带薪全职博士岗位，36 个月，含流动津贴，由多国多家宿主机构承担。研究方向偏蛋白质科学与癌症药物，化学或生物背景更匹配。
msca-doctoral-networks: 欧盟玛丽居里行动计划的博士网络，由大学、科研机构和企业组成的合作体提交提案。获资助的项目在 EURAXESS 发布博士岗位，申请人无需已有博士学位，任何国籍均可，但须满足流动性规则。
msca-doctoral-networks-rea-programme: 欧盟 MSCA 博士网络（Doctoral Networks）的官方说明页。博士生通常为带薪雇员，国籍不限。中国大陆学生需申请网络内机构在 EURAXESS 发布的岗位，并满足流动性规则：招聘日前 36 个月内在招聘国居住或工作不超过 12 个月。
msca-postdoctoral-fellowships: 欧盟玛丽居里博士后奖学金（MSCA PF），不限国籍，需与欧洲导师共同撰写申请书。需已取得博士学位，研究经验不超过 8 年，并满足流动性规则。
msu-psychology-doctoral-admission: 密歇根州立大学心理学系博士，页面称对所有录取申请者提供资助。各研究方向分别录取，本轮组织心理学与社会/人格方向不招生。
munich-quantum-valley-doctoral-fellowships: 慕尼黑量子谷（Munich Quantum Valley）的博士奖学金，由 MQV 与 IMPRS-QST 联合招募，可选择巴伐利亚任一大学的研究组。提供 3 年全额博士奖学金，每年约 5 个名额，需硕士学位。
naist-doctoral-prescreening-2026: NAIST 2026 年博士预选与 MEXT 奖学金指南，面向 2027/2028 入学。申请者须为非日本籍，入学前已获得硕士学位，需由合作大学推荐，英语需达标。MEXT 奖学金要求入学年 4 月 1 日未满 35 岁。
nanolund-career-opportunities: 隆德大学纳米科学中心（NanoLund）的职位页，汇总多个在招博士与博后岗位。博士与博后均按全职雇员合同聘用。
nanyang-business-phd-financial-support: 南洋理工大学南洋商学院博士财务支持，国际生每月 S$4,300 生活补助，获奖者学费可覆盖 4 年（每年续期）。需本科荣誉一等（Highest Distinction）或同等学历，所有国籍均可竞争申请。
naples-federico-ii-csc-humanities: 那不勒斯费德里科二世大学人文系 2025-2026 学年 CSC 博士预选公告，涵盖历史、哲学、语文学与数字人文。申请人需将材料发送至两位教授邮箱，经指导委员会面试选拔。
nasa-hubble-fellowship-2027: 美国 NASA 哈勃奖学金计划（NHFP），面向天文和物理相关的博士后，最长 3 年，宿主机构由申请人自选。要求 2023 年 1 月 1 日后完成或将完成天文或物理相关博士学位，并需找美国宿主机构。
naturecareers-health-science-postdoc: Nature Careers 的生命科学与医学博士后直招岗位列表，可按地区和岗位类型筛选。资助条件与工作许可因岗位而异，海外岗位需自备签证或工作许可。
naturecareers-postdoc-china: Nature Careers 汇总的中国大陆高校和研究机构直接发布的博士后岗位，可按学科筛选，列表持续更新。多数岗位要求博士学位，待遇与资格因岗位和雇主而异，部分与人才计划挂钩。
nawa-ulam-2026: 波兰 NAWA Ulam 项目，资助外国研究人员赴波兰开展博士后研究，申请须由波兰东道机构提交，PI 在波兰停留 6–24 个月。PI 薪酬上限为最高 PLN 17,000/月，申请需英文撰写。
nber-fellowship-calls: 美国国家经济研究局（NBER）博后与研究生奖学金征集汇总页，列出各项目的征集信息。金额与条件以各征集页为准，项目每年轮换。
nber-postdoc-wealth-inequality: 美国 NBER 财富与收入不平等一年期博士后，2025 轮公告为 $100,000/12 个月，并报销健康保险，提供差旅与研究津贴。需提交 CV、研究计划及推荐信。
newberry-long-term-fellowships: 纽伯里图书馆（Newberry Library）长期研究资助，面向已获博士学位的人文社科学者，多数项目不限国籍。月津贴约 $5,000，执行 4–9 个月。
newton-international-fellowships: 英国皇家学会 Newton International Fellowships 面向非英国籍、申请时居住在英国境外的早期博士后，在英国做 2 年研究，最高 £280,000（含研究经费）。研究限自然科学与工程等领域，社科与人文不在资助范围内。
nig-postdoc-fellowship: 日本国立遗传学研究所（NIG）博后研究员，聘期最长 3 年、每年续聘，年薪约 410 万日元（含税），可申请 KAKENHI 经费。需博士学位并先与 NIG PI 联系。
niigata-brain-scholarship: 新潟大学脑研究所研究生奖学金，面向入学 BRI 研究生院的国际学生，最高 100,000 日元/月，最长 4 年；在读 BRI 研究生最高 50,000 日元/月。申请前需先联系拟指导教师。
nims-employment-en: 日本 NIMS 英文招聘总页，含 ICYS 研究员及各中心博后公告入口。研究员公告通常要求博士学位，PI 岗位需提出在 NIMS 研究中心的研究项目。
nioo-reading-ecosystems-space-phd: 荷兰 NIOO-KNAW 与乌得勒支大学联合博士岗位（NWO ASCENT 项目），用卫星高光谱数据研究氮沉降对生物多样性与生态系统功能的影响。全职 4 年带薪雇佣，月薪税前 €3,204–€4,051。
nitech-mext-university-recommendation: 名古屋工业大学的研究生MEXT大学推荐，不能直接向MEXT申请，须与该校教员有学术交流或合作关系，并取得拟定指导教员同意后由其办理推荐。申请人须持与日本有外交关系国家的国籍。
nki-vacancies: 荷兰癌症研究所（NKI）职位入口，页面称全年设有包括博士生在内的空缺，可在此查看博士与博后岗位。
nl-maastricht-paid-phd: 马斯特里赫特大学带薪博士职位，统一通过 Academic Transfer 发布，可按 Maastricht University 筛选。非欧盟申请者需办理工作许可或知识移民签证。
nl-radboud-job-opportunities: 拉德布德大学职位页，列有多个博士与博士后岗位，为带薪雇佣，博士岗位税前月薪约 €3,204–€4,051。部分岗位需拟任导师（教授级）同意。
nl-rug-phd-vacancies: 格罗宁根大学官方博士岗位页，本页不列具体岗位。页面称 Campus Fryslân 研究生院的博士岗位将发布在大学 PhD Scholarships 页面。
nl-utrecht-phd-vacancies: 乌德勒支大学官方博士岗位页，列出 6 个博士岗位，分布于各院系，博士为带薪大学雇员。申请需硕士或同等学历及良好英语。
nl-vu-workingat: 阿姆斯特丹自由大学（VU）官方招聘平台，可按 PhD 关键词搜索在招岗位，理科、经济、社会科学均有带薪博士岗位。
nlm-postdoc-irta: NIH 国家医学图书馆（NLM）博士后 IRTA 项目，提供博士后津贴，国际申请者可申请。需获得博士学位（PhD、MD、DDS 或同等）且在入项前 5 年内获得，建议提前约 9 个月申请。
nnf-ias-health-sustainability-fellowship: 北欧四所高等研究院联合的 NNF-IAS 健康与可持续发展研究员项目，面向各学科，全职有薪，需迁往北欧宿主研究所工作。要求博士毕业后有 2–10 年工作经验（博士阶段不计）。
nomis-eth-fellowship-postdoc: NOMIS 基金会与 ETH 苏黎世起源生命研究中心（COPL）合办的博后奖学金，面向起源生命方向，需已提交博士论文。资助为 3 年工资，另有每年最高 CHF 20,000 研究与差旅经费；申请前需先找到 COPL 合作教授。
northwestern-chem-financial-support: 美国西北大学化学系博士资助说明。页面称历来在读且学业良好的博士生均获全额资助，包括学费与津贴；津贴水平按 Evanston 生活成本设定，具体金额以录取通知书中的说明为准。
northwestern-dgp-financial-support: 西北大学 Driskill 生命科学博士资助，2026–2027 学年津贴 $47,748。录取的全部学生（含外国国籍学生）起初即获津贴与全额学费，学业进展令人满意即可持续获得支持，另有保险补助。
northwestern-ibis-faq: 西北大学综合生物科学（IBiS）博士项目，官网 FAQ 称录取的学生（包括国际学生）只要学业进展令人满意，即可获得全额学费、津贴及健康与牙科保险。2026–27 学年津贴为 $47,748，不要求 GRE。
nova-lisbon-materials-science-phd: 葡萄牙里斯本新大学材料科学与工程博士项目，英文授课，在线申请。要求硕士学位（最终成绩 14/20 或 ECTS C 级及以上），或学士加相关学术经历并经两位教授推荐。
novo-postdoc-eth-mit-oxford-uppsala: 诺和诺德基金会资助的博士后奖学金，覆盖 ETH Zurich、MIT、Oxford、Uppsala 等机构的研究岗位。ETH Zurich 项目每项最高 DKK 360 万，最长可达 3 年，是该基金会在这些机构的博后资助之一。
nrc-research-associateship: 国家科学院在联邦实验室的博后项目，年薪约 $45,000–94,500（各实验室不同），需获或即将获科学或工程博士学位，申请前一般需联系实验室导师，部分实验室仅限美国公民或永久居民。
ntu-ai-for-x-postdoc: 新加坡 NTU AI-for-X 博士后奖学金，由 NRF 联合资助，最长 4 年，另有竞争力薪酬与 SGD 250,000 研究经费（总额，非月薪）。申请需 STEM 领域博士学位及 NTU 项目导师支持信。
ntu-ccds-phd-cs-engineering: 南洋理工大学计算与数据科学学院（CCDS）的计算机科学与工程博士，提供全额资助，国际生月津贴为 S$2,000，通过资格考试后上调。NTU Research Scholarship 随博士申请一并评审，名额有限。
ntu-dtc-research-scholarship: 南洋理工大学数字科技中心（DTC）博士研究奖学金，方向为建成环境中的 AI，包括低碳建筑、智能预制构件与建造领域的智能体 AI。国际生月津贴 S$3,500，另含年度学费及杂费，本地与国际申请者均可申请。
ntu-eee-phd-ptas: 南洋理工大学 EEE 博士助教计划（PTAS），最高 S$20,000/年，承担本科教学与实验室工作。部分页面称仅面向硕士生，国际博士生能否申请需向学院咨询。
ntu-nie-phd-scholarship: 南洋理工大学国家教育学院（NIE）博士奖学金，面向全日制博士，覆盖年度学费，国际生月津贴 S$3,000，需履行助教或实验室辅导职责；需经提名并面试。
ntu-npgs: 南洋理工大学 Nanyang President's Graduate Scholarship（NPGS），覆盖学费，国际生月津贴 S$4,300（2026 年 1 月起修订），所有国籍均可申请。国际生需履行助教或实验室辅导（GAP）职责。
ntu-npgs-scholarship: 南洋理工大学（NTU）校长研究生奖学金（NPGS），需获 NTU 博士录取。国际生每月津贴 S$4,300（2026 年 1 月起），覆盖学费并提供月津贴，需承担助教工作，最多可续领四年。
ntu-presidential-postdoc-ppf: 南洋理工大学总统博士后（PPF）项目，Wallenberg-NTU 2027 轮涵盖 AI、机器学习等方向。一年研究经费最高 S$100,000，年薪最高 S$80,000，需两页研究计划和两位推荐人（其中一位为博士导师）。
ntu-research-scholarship: 南洋理工大学研究奖学金（RSS）覆盖全年学费，国际生博士月津贴 S$3,000（2026 年 1 月起），需至少一等荣誉学位或同等成绩，并承担教学服务。
ntu-scholarships: 南洋理工大学（NTU）研究生奖学金总览页，列出 NTU Research Scholarship 等多项奖学金。需全日制研究型课程，最低 Honours (Distinction) 或同等学历，国际生可申请；金额详见 RSS 专页。
ntu-scripts-research-scholarship: 南洋理工大学（NTU）SCRIPTS 研究奖学金，面向隐私计算等方向博士，需导师为中心 PI。博士月津贴为新加坡公民 S$5,000、永久居民 S$4,500、国际生 S$4,000，另覆盖学费；国际生有 3 年服务义务。
ntu-spms-scholarships: 南洋理工大学数理科学学院博士奖学金，覆盖学费并发放月津贴，国际生初始 S$2,000/月，通过资格考试后可增加 S$500。获奖者需承担助教等教学服务，可与博士申请同步申请。
ntu-yunqi-phd-scholarship: 南洋理工大学云启科学与技术博士奖学金，覆盖学费与月津贴，首年授予，可续，最长 4 年。所有国籍均可申请，在 NTU 博士申请中勾选即可，入围者需面试。国际生月津贴 S$3,000（资格考试前）、S$3,500（之后）。
nus-chem-phd-2027-early-offer: 新加坡国立大学化学系 2027 年 8 月入学博士录取说明。博士项目提供全额奖学金，津贴最高 S$3,000/月（免税）；优秀学生可能被推荐参评总统研究生奖学金（PGF），津贴更高。需通过 GradApp 提交网上申请。
nus-cs-phd-scholarships: 新加坡国立大学计算机学院的博士奖学金，主要为研究奖学金，提供月津贴和全额学费补贴，每年续签，最长四年；通过博士资格考试后另有每月 S$500 补充。另有 PGF 与 SG Digital 奖学金。
nus-presidential-fellowship: 新加坡国立大学（NUS）总统研究员计划，为期2年，之后可转为助理教授轨道，并可参与总统青年教授（PYP）竞争。博士学位需在一年内获得或即将获得，全年接受申请。
nus-soc-graduate-scholarships: 新加坡国立大学计算机学院研究生奖学金，含月补贴与学费减免，每年续签、最长约四年；通过资格考试后有补充津贴。另有助教型（Tutorship）博士奖学金。
nus-soc-phd-cs: 新加坡国立大学计算机学院 PhD in Computer Science 项目页，列出研究奖学金、申请信息与录取要求等栏目入口。本科学位需至少二等荣誉（上等）或同等。
nwo-rubicon-2026: 荷兰 NWO Rubicon 青年博后海外流动资助，支持在荷兰以外的优秀研究机构做 12–24 个月研究，资助包括薪资、差旅和少量科研经费。博士学位需在申请截止前约 1 年内取得，2026 年分三轮。
nwo-vidi-2026: 荷兰 NWO Vidi 个人人才项目，面向博士毕业约 2–8 年的研究者，英文提交。申请需荷兰宿主出具长期职位承诺，需尽早联系荷兰教授。
nyu-fm-pl-faculty-area: NYU Courant 形式化方法、验证与程序语言方向的教师名录，不含招生与资助信息。招生名额和资助需联系教师或查阅 Courant 博士项目页面。
nyu-hauser-remarque-global-fellowship: NYU Hauser/Remarque 全球研究资助项目，面向已获博士学位者，研究须与欧洲相关，外国籍可申请。2027–28 学年津贴 US$70,000（不含住房，或依税法扣税），不可续签，需在项目开始前完成博士全部要求。
nyu-law-economics-postgraduate-fellowship: NYU 法与经济中心的博士后（Post-Graduate）研究职位，研究方向为法律经济学。页面称津贴约 $60,000 加福利。需已获法学博士（JD），或已获或即将获经济学博士且对法律有兴趣。
oead-ernst-mach-faq: 奥地利 OeAD 的 Ernst Mach 奖学金，面向海外大学的博士生、博士后及 35 岁以内研究人员，在奥地利做最长 9 个月的短期研究。津贴每月 €1,300，并协助住宿与健康保险。申请前 6 个月内不能在奥地利学习或研究过。
oise-funded-phd-cohort: 多伦多大学 OISE 教育学博士，录取即进入资助队列，资助包最低约 40,000 加元（含学费），国际生的 UHIP 医保由资助包覆盖，录取信中告知具体资助包。
oist: 冲绳科学技术大学院大学（OIST）的全英文博士项目，申请与授课均为英文，每年两次入学工作坊。需已获或入学前可获学士或硕士学位。
oist-phd-program: 冲绳科学技术大学院大学（OIST）全英文五年制跨学科博士项目，学费由研究助理津贴覆盖，津贴年 260 万–360 万日元。需硕士或同等学位，非英语授课学位需提供 IELTS 或 TOEFL 成绩。
oregon-state-gray-whale-postdoc: 俄勒冈州立大学 GRANITE 项目的灰鲸生物能量学博后，12 个月全职，可续至 3 年，2027 年 5 月 1 日起聘。要求生命科学博士，获博不超过 3 年。
oslomet-camelot-phd-climate-governance: 奥斯陆城市大学（OsloMet）ERC Consolidator 项目 CAMELOT 下的全职博士岗，研究长期气候治理，年薪 NOK 550,800，带薪合同。需政治学、公共管理、环境治理或相关领域硕士学位。
oslomet-lui-educational-sciences-phd: OsloMet 教育学与教师教育（LUI）博士招生，入学以资金为前提，须先获得 PhD 岗位、公共部门或产业 PhD 等外部资助并能提供证明。通常需五年制硕士或同等学历（教育学相关），研究计划须经博士委员会批准，纯学历申请通常不带薪。
osu-comparative-studies-graduate-funding: 俄亥俄州立大学比较研究系博士项目，承诺为所有录取学生（包括国际生）提供完整资助套餐。资助可能全部由研究生助教岗位提供，也可能由大学奖学金与助教岗位组合提供，续期需保持助教表现与学业进展。
osu-german-admissions-funding: 俄亥俄州立大学德语系为录取的硕士与博士生提供全额资助，含学费减免、津贴和 100% 医保补贴，不按国籍区分。可另申请 DAAD、Fulbright 等奖学金延长资助。
osu-wgss-phd-funding: 俄亥俄州立大学女性与性别研究博士项目，录取博士生（含国际生）获5年助教类（GA）资助，含学费减免、医保补贴与津贴，每周工作20小时。直博为6年，已获其他奖学金的年数会被扣减。
ox-foai-cdt: 牛津大学 Fundamentals of AI 博士培训中心（Oxford EIT CDT），每年约 20 个全额名额，面向所有国籍，含学费与免税生活费。需通过牛津标准研究生申请（项目代码 R35_1）并获得牛津录取。
oxford-brookes-ad-a-pt-ahrc-2027: 牛津布鲁克斯大学AHRC博士聚焦奖学金（AD[A]PT，2027年10月入学）。资助含Home费率学费与£21,805/年的生活津贴（UKRI标准，2026/27）。国际申请者可申请，但需自付Home与国际学费的差额。
oxford-control-engineering-biology-studentship: 牛津大学工程科学系合成生物学控制方向 DPhil 奖学金（2027 入学，3.5 年）。英国学生可获学费加生活费全额资助，第一年生活费至少 £21,805/年。国际生资格不明确，需联系导师确认。
paderborn-doctoral-scholarships: 帕德博恩大学博士奖学金，每月 €2,000，另加子女补贴，全校各学科均可申请，可用德语或英语提交。申请需通过所在学院办公室，并附导师支持。
paristech-csc: ParisTech–CSC 博士项目，限中国大陆国籍学生。须先获 ParisTech 成员校博士录取并通过 CSC 选拔。资助为每月 €1,350 加往返机票，期限 36–48 个月。
paristech-csc-phd: ParisTech 与 CSC 合作博士项目，CSC 奖学金 €1,350/月（36–48 个月），另含往返机票。限中国籍优秀学生，需先通过院校网申与面试录取，再获得 CSC 奖学金。
pasteur-doctoral-programs: 巴斯德研究所与巴黎大学合办的国际博士项目（PPU），英语授课，提供 3 年合同与薪资，含生活费与社保，并协助住宿与签证。申请者需在非法国大学获得硕士或同等学历，且近 3 年未在法国工作或居住超过 12 个月。
pasteur-paris-university-phd: 巴黎巴斯德大学（PPU）国际博士项目，由 Institut Pasteur 发工资并缴纳社保，属带薪博士岗位。申请需硕士或同等学位，可同时申请至多 4 个实验室，需先注册 PPU 官网账号才能查看项目列表。
perry-world-house-postdoc: 宾夕法尼亚大学 Perry World House 的博士后研究员项目（国际事务），通过研究、出版和学生指导，把宾大与全球政策界联系起来。研究须与国际和平与安全、全球正义与人权、民主或气候变化等主题相关。
phd-ai-it: 意大利国家人工智能博士项目（PhD-AI.it）由比萨大学牵头，「AI for Society」方向研究人工智能与社会问题。项目 3 年制、英语授课，部分奖学金由 PNRR 资助。
pitt-civil-transport-gra: 匹兹堡大学 PITTS 实验室交通与土木方向的研究生助研岗。页面称定期提供经济资助并特别鼓励国际学生申请，但未列出具体空缺，需直接联系实验室。
pitt-katz-phd-tuition-aid: 匹兹堡大学Katz商学院为博士生提供五年资助包，含津贴、学费与医保，国内外学生同等享有。
pku-boya-postdoc: 北京大学博雅博士后，期限 24 个月，年税前薪酬 20 万元，含社会保险、住房补贴等，无宿舍者另有 6 万元补贴。申请需先选定北大导师并取得书面推荐，年龄不超过 35 周岁。
polimi-china-scholarship-council: 米兰理工大学CSC博士奖学金，仅限中国国籍、新申请全日制博士的候选人（不含在读博士与访问学者）。须先获博士学院预录取函，获邀后再经CSC渠道申请资助。
polimi-csc-agreement: 米兰理工大学与 CSC 有协议，中国国籍的新申请者可经此通道申请全日制博士。录取以获得 CSC 奖学金为条件，学校减免学费，合作渠道受资助者另有 5000 欧元研究经费。需提交成绩单、学位证和推荐信。
polimi-phd: 米兰理工大学博士院招生公告，官网称全年陆续发布，平均每年约五个。博士奖学金以月均金额计。
polimi-phd-calls: 米兰理工大学博士招生页，博士按轮次（call）招生，各项目名额列在公告正文中。申请前需在 Online Services 注册，学历与语言要求以各项目公告为准。
polito-csc-call: 都灵理工大学与 CSC 合作的博士预选，面向中国大陆公民，方向为工程、建筑、设计与城规。先通过学校线上预选并获得邀请函，再向 CSC 申请。
polito-dottorato-42-second-session: 都灵理工大学第42周期博士招生第二批次，课程2027年3月1日开始。申请需Laurea Magistrale或同等学位，并提交B2级英语证明。有奖学金与无奖学金岗位分列，需在分表中逐项确认。
polyu-cee-hkpfs: 香港理工大学土木及环境工程系 HKPFS 页面，按导师名额推荐提名，建议先联系拟合作教授。需同时向 RGC 提交 HKPFS 申请并申请理大博士，获提名者同时获得理大博士名额。
polyu-civil-2027: 香港理工大学土木及环境工程博士申请入口，接收 2027 年入学申请，可同时关注学校 HKPFS 与 studentship。HKPFS 每年 HK$344,400，不限国籍，需硕士或一等荣誉本科。
polyu-computing-2027: 香港理工大学计算学系 2027 年入学博士申请入口，可经 HKPFS 申请每年 HK$344,400 的资助，HKPFS 不限国籍。申请前需先与导师沟通。
polyu-eee-rpg-2027: 香港理工大学电机及电子工程学系 2027 年入学的研究型博士，全额资助，可申请 HKPFS（2027/28 年 HK$344,400/年）及校内奖学金。申请 HKPFS 需先在 RGC 系统取得参考号。
polyu-fsn-studentship: 香港理工大学理学院研究生 studentship，面向全日制 PhD 或 MPhil 学生，按学术成绩择优。同时申请 HKPFS 时，由学校分配到一种资助。
polyu-gs-hkpfs: 香港理工大学研究生院 HKPFS 总页，面向 2027/28 入学。每年 HK$344,400 生活津贴，学费全免，首年 HK$40,000 后每年 HK$20,000 现金奖，并有两年宿舍保障，每人只能领取一项资助。
polyu-hkpfs: 香港理工大学博士研究生奖学金（HKPFS），面向所有国籍的全日制新入学博士生，年度助学金 HK$344,400。需同时向 RGC 与理大申请，并提供两位学术推荐人。
polyu-hkpfs-2027-28-news: 香港理工大学 2027/28 秋季入学的 HKPFS 博士全额资助通告，资助涵盖学费豁免与生活津贴，津贴约 HK$344,400/年（以 RGC 官网为准），不限国籍。
polyu-hkpfs-english-dept: 香港理工大学英语系 HKPFS 项目页，列出津贴 HK$344,400/年、学费豁免、会议经费 HK$14,400/年及现金奖。需先向 RGC 取得参考号，再提交校内申请。
polyu-hkpfs-portal: 香港理工大学 HKPFS 校内申请入口，面向 2027/28 学年入学的全日制新入学博士生，不限国籍，已在读博士者不可申请。资助为 HK$344,400/年。申请需先向 RGC 取得 HKPFS 参考号，再完成理大全日制博士申请。
polyu-ise-fellowship-schemes: 香港理工大学研究生院汇总的通用奖学金页面，列出 HKPFS、Kuok Group Fellowship、PPPFS、IPFS 与 PRPgS 等多项计划。各计划金额不同，需分别查看各自的申请要求。
polyu-mechanical-2027: 香港理工大学机械工程博士申请入口，2027 年入学分 1 月、5 月、9 月三轮，需硕士学位或一等荣誉本科。资助需结合学校 studentship 与 HKPFS 规则了解。
polyu-mm-rpg-2027: 香港理工大学管理及市场学系 2027 年 9 月入学的研究型博士，学院限额招生。全日制博士可申请 HKPFS（约 HK$344,400/年，含学费减免）或校内奖学金。需本科或硕士学位与研究计划，HKPFS 需先向 RGC 取得编号。
polyu-postgraduate-research: 香港理工大学研究生教育总入口，提供全日制博士与哲学硕士的 Research Studentships，按学术成绩授予，需满足博士入学与英语要求。
polyu-pppfs: 香港理工大学 Presidential PhD Fellowship Scheme，年津贴 HK$340,800，另有会议经费 HK$25,000、学费减免及现金奖（首年 HK$40,000，之后每年 HK$20,000）。每学年名额有限，采用竞争性评选。
polyu-rcgm-join-us: 香港理工大学电网现代化研究中心（RCGM）面向全球招收博士与博后。博士生享月津贴、年度会议与研究差旅津贴及学费减免，博后提供具竞争力的薪酬包。
polyu-rehab-sciences-phd-2027: 香港理工大学康复科学系招收2027年9月入学的研究型PhD与MPhil，方向涵盖神经科学、运动与骨骼肌肉、智能康复等。申请需两位学术推荐人，推荐人不能是拟任导师。
polyu-rpg-2027-business: 香港理工大学商学院各系的 2027 年入学博士方向。申请需提交 GMAT 或 GRE 成绩及两位学术推荐人材料，并优先考虑同时申请香港博士研究生奖学金计划（HKPFS）的申请者。
polyu-sd-phd-hkpfs: 香港理工大学设计学院博士申请页，列出 HKPFS 资助包：年度生活津贴 HK$344,400，含学费豁免与年度会议资助 HK$14,400，另有现金奖及两年宿舍保障。申请需先经 RGC 系统取得 HKPFS 参考号，再向校内提交，设计学院博士优先考虑申请 HKPFS 者。
polyu-sd-rpg: 香港理工大学设计学院 2027 年 9 月入学的研究型博士（PhD）招生页。学校研究型博士奖助为 HK$19,220/月起，学院鼓励申请香港博士研究生奖学金计划（HKPFS）。需两封推荐信与研究计划书，建议先联系拟指导教师。
polyu-xiao-huang-ai-lab: 香港理工大学黄晓 AI 实验室招收全奖博士与博后，研究数据挖掘与机器学习，偏向计算机、电子、统计、数学等背景。发送 CV 邮件联系黄晓教授即可，资助细则以港理工研究生院为准。
polyu-xu-shengduo-phd-studentship: 香港理工大学徐胜多教授招收博士，方向为 3D 打印热电材料、柔性热电与可穿戴传感器，全奖名额 1–2 个，月津贴不低于 HK$19,000。需先联系导师，再通过 RPg 系统申请。
potsdam-clp-positions: 波茨坦大学计算语言学实验室（CLP）当前仅开放一个博后岗位，100% TVL-13，初期 3 年，与柏林 DFKI 合作，项目为 FLICA。2026 年博士岗已招满。
princeton-politics-phd-funding: 普林斯顿大学政治学系的博士项目，录取者均获全额资助，包括五年学费、医疗保险，以及覆盖学年与暑期的生活津贴。通常在第三至第五年需讲授本科讨论课。
psl-curie-immunology-postdoc: 巴黎文理研究大学（PSL）与居里研究所的免疫学博士后岗位，三年固定期合同，需博士学位和必需的英语能力，申请时提交简历与求职信。计划 2026 年 12 月入职。
psl-math-doctoral-contracts: PSL 数学与应用研究生项目 2026 批次博士合同，面向法国与国际学生，第一年税前 €2,300/月。申请需提交 CV、动机信、导师承诺信、论文计划与成绩单，需持数学硕士二年级或同等学位。
psyedu-uw-madison-educational-psychology: 威斯康星大学麦迪逊分校教育心理学博士项目。申请需本科 GPA 至少 3.0（最后 60 学分）、3 封推荐信和个人陈述，部分方向需 GRE。助教与项目助理名额有限，资助不统一。
qimr-international-phd: QIMR Berghofer 国际博士奖学金，生活补助为 AUD 39,220/年（2026 标准，免税），为期 3 年半，并提供单人海外医保。国际生可申请，需一等荣誉学位或 MPhil，学费由 QIMR 提名大学学费奖学金。
qmul-cpm-cdt: QMUL（伦敦玛丽女王大学）器官芯片 4 年制博士 CDT（EPSRC 资助），需理工科相关一等或二等上荣誉学士或硕士学位，津贴 £21,795/年（2025/26，含伦敦津贴）。
qmul-csc-joint-phd: 伦敦玛丽女王大学（QMUL）与 CSC 联合的博士奖学金，学校承担全部学费，CSC 发放生活费和回国机票。仅限中国大陆护照持有者，须先获院系条件性录取再申请 CSC，并需导师支持。
qmul-csc-scholarship-2027: 伦敦玛丽女王大学（QMUL）CSC 联合奖学金，面向中国籍学生，2027/28 学年入学，不可延期。学费由 QMUL 承担，CSC 提供生活津贴约 £1,350/月，共 4 年。
qmul-csc-scholarships: 伦敦玛丽女王大学（QMUL）的 CSC 奖学金，须持中国护照并先获 QMUL 录取再申请 CSC。学费由 QMUL 全额覆盖，CSC 提供约 £1,350 的月生活津贴，共 4 年，并含一张单程机票。
qmul-machine-listening-csc-phd: 伦敦玛丽女王大学 Machine Listening 实验室提供面向中国申请人的 CSC 博士奖学金，2026 年秋季入学，Centre for Digital Music 最多 8 个名额。页面鼓励申请前先联系导师。
quang2-grenoble-phd: 格勒诺布尔量子科技博士项目 QuanG2，属 MSCA COFUND 带薪博士项目，学制 36 个月，可申请最多 10,000 欧元交流与会议经费。需硕士或同等学历，并须符合 MSCA 流动性规则。2026 秋批次已截止。
quantalps-automn-2026: 阿尔卑斯地区量子科技博士项目的 2026 年秋季批次，博士生为带薪雇员，税前 2,300 欧元（QuantAlps Labex 与 QuanTEdu-France），QuanG2 为 2,400 欧元。需硕士学位或在 2026-09-07 前取得。
queens-funding-packages: 女王大学全日制博士生有保底资助，2026–27 学年最低为 CAD $25,000/年，不含学费，许多院系更高。需被博士项目录取，并在申请入学时提出资助申请。
queens-geography-doctoral-funding: 皇后大学（金斯敦）地理与规划系博士生，国内外学生每年至少获 CAD $23,000 资助，最长 4 年（2025–26 数据）。需申请所有符合条件的主要校内外奖学金才能满足最低保障。
qutech-open-positions: 代尔夫特与莱顿量子中心（QuTech）的博士与博后岗位入口，岗位由合作高校在 PI 组下发布。页面当前标注无开放岗位。
raeng-research-fellowship-sheffield: 英国皇家工程院研究员计划（经谢菲尔德大学校内流程申请），面向博士毕业四年内的工程类早期研究者，资助形式为薪资，需在英国高校或 UKRI 认可机构任职。本轮已关闭，下一轮以官网公告为准。
rcn-talented-researchers-norway: 挪威引进人才项目，面向欧洲以外的研究者（俄罗斯除外），由挪威科研机构提名申请。学历与资助细则以新一轮公告为准。
rcs-phd-mphil: 苏格兰皇家音乐学院音乐与表演研究型博士 / MPhil 项目，学位由圣安德鲁斯大学授予。需一等或二等荣誉学位，非英语母语者需 IELTS 7.0。资助以当年官网为准。
reading-csc-joint: 雷丁大学 CSC 联合资助博士项目，学校承担学费，CSC 提供每年生活津贴（含海外学生医疗保险及签证费）。申请人须为中国公民或永久居民且在境外无工作，研究方向需属 CSC 优先领域，大学仅有 5 个名额。
reading-international-phd-studentships: 雷丁大学面向国际生的博士 studentship，资助国际学费，并每年提供 £1,000 培训津贴。生活津贴仅限在雷丁校内学习的申请者，校外或远程申请者不含生活津贴；需先申请雷丁博士项目，并经院系推荐参加校级竞争。
reading-international-studentships: 雷丁大学国际博士奖学金，面向国际学费身份申请者，覆盖全部学科，需先获得 Reading 博士录取。列表页未显示金额与生活津贴细则。
regina-intl-doctoral-student-award: 里贾纳大学（加拿大）面向国际博士生的奖学金，无需单独申请，按学期自动考虑，每学期约 $1,450，最多前 4 年；成为永久居民后停发。
rgc-pdfs: 香港研资局青年研究员计划（JRFS，原博士后奖学金 PDFS），资助青年博士到 UGC 资助高校做博士后，每轮约 60 名、为期 24 个月，约 HK$430,000/年（含差旅津贴，按 CCPI 调整）。需经 UGC 资助高校提名，须取得在港合法工作与居留权。
rhodes: 英国罗德奖学金（Rhodes Scholarship）的中国名额，每年 4 个，限中国大陆公民。可资助的课程需对照官网 Courses covered by the Rhodes Scholarship 页面查看，以确定自己的专业是否在内。
rhul-sedarc-economics: 皇家霍洛威大学经济学 SEDarc 博士奖学金，为期 3.5 年，竞争性名额，覆盖生活津贴与英国及国际学生学费。需先申请 RHUL 经济学博士，研究计划经内部评审并匹配导师后再申请 SEDarc。
riken-cems-careers: 理化学研究所创发科学研究中心（CEMS）的博士后与研究员招聘页，列有多个岗位，多为 1 年起的固定期限合同。各岗位标注招满为止，博士学位要求依岗位而定。
riken-spdr: 理化学研究所（RIKEN）特别研究员（SPDR）计划，面向自主研究的博士后，签 3 年固定期限合同，月薪 550,000 日元，另有年度研究经费。申请前需先与理研的研究室（host lab）达成匹配，需持博士学位。
rims-project-fellow: 京都大学数理解析研究所（RIMS）Project Fellow 为带薪非终身研究岗位，面向已获或即将获得博士学位者，需先联系所内教授并获推荐。
ritsumeikan-csc: 立命馆大学 CSC 公派研究生项目，面向在中国高校攻读或已毕业的中国学生。须先获立命馆大学录取，再由 CSC 选拔。学校免除入学费与学费，生活津贴由 CSC 发放。
ritsumeikan-mext-university-recommendation: 立命馆大学 MEXT 大学推荐（博士）2027 年 9 月入学仅生命科学与理工研究科招生。每所大学只推荐一人，推荐后还需 MEXT 审核。
rmit-research-scholarships: 皇家墨尔本理工大学（RMIT）研究学位奖学金中央轮次。国际申请人需先提交 EOI 及导师支持声明表。页面称学院或外部资助项目可在轮次之外申请。
rmit-research-stipend: 皇家墨尔本理工大学（RMIT）研究生生活津贴奖学金，2026 轮标注为 AUD 36,245/年（按全时折算，每年指数调整）。国际申请人须获 RMIT HDR 录取，并同时获得 RIFOS 或 RRITFS 学费奖学金。
rochester-biostat-phd-financial-aid: 罗切斯特大学生物统计博士项目，所有录取博士生均获学费、医保与津贴资助，不分国籍。2026–27学年津贴为$29,250/年（10个月），前两年由学院资助。
rockefeller-phd: 洛克菲勒大学博士项目，学费为 0 并提供生活津贴，录取不分国籍。需学士、硕士或医学学位或同等学历，生命、化学、数学或物理等领域成绩须优秀。
ru-phd-decolonising-reparations-2026: Radboud 大学的带薪博士岗位，研究去殖民化与赔偿问题。月薪€3,204–€4,051（税前总额），要求政治学或相近学科硕士及定性研究经验。
ru-phd-physics-informed-genai-energy-2026: Radboud 大学理学院 NWO 资助 SHARE 项目的带薪博士岗位，研究能源领域的物理信息生成式 AI。月薪€3,204–€4,051，合同先签 1.5 年。需相关硕士及机器学习与 PyTorch 经验，无需能源背景。
ru-working-as-phd-candidate: 拉德堡德大学（Radboud）的博士候选人说明：博士候选人通常为雇员并领薪，外部博士生不领薪，具体薪资以职位页为准。
rug-csc-ug-joint: 格罗宁根大学（UG）与 CSC 的联合博士奖学金，提供 CSC 生活津贴（含医疗保险）和往返国际机票，UG 免除 bench fee 与学费。面向中国大陆在读学生或中国机构员工，须先获 UG 对应研究生院录取。
rug-medical-csc-full: 格罗宁根大学医学院研究生院（GSMS）的 CSC 全额博士奖学金入口，面向中国大陆公民，持硕士学位或在读硕士。须先获 UMCG 导师接收，再由导师向 GSMS 申请录取函。
saitama-esiti-mext-2027: 埼玉大学 ESITI 项目的 MEXT 博士名额，2027 年 10 月入学，共 8 个，全额资助，每月 148,000 日元另含往返机票。申请需硕士学位，2027 年 4 月 1 日未满 35 岁，英语 CEFR B2，申请时居住在日本境外，过去三年未获日本政府奖学金。
saitama-ssed-mext-guideline-2027: 埼玉大学 SSED 项目 2027 年 10 月入学的 MEXT 大学推荐细则（英文 PDF）。申请者须为非日本国籍且居住在日本境外，近两年 GPA 不低于 2.30/3.0，需提交研究计划，两封推荐信直接寄至项目办公室，可能进行线上面试。
schlumberger-faculty-future: Schlumberger 基金会 Faculty for the Future 项目，仅限女性，资助攻读 STEM 博士或博后研究。博士最高 USD 50,000/年，博后最高 USD 40,000/年，国籍需属基金会定义的发展中或新兴经济体。
schmidt-science-fellows: Schmidt Science Fellows 是面向自然科学、工程、数学、计算机方向博士毕业生的跨学科博士后奖学金，不限国籍，最长 2 年，$110,000/年（以官网为准）。须由博士授予院校提名，且该院校在官方提名机构名单内。
schulich-phd-fellowship: 约克大学 Schulich 商学院博士奖学金，国际生前五年每年 $43,000（可能调整）。需全日制入学，前三年绑定研究助理工作，学费需从奖学金中自付。
science-tokyo-igp: 东京科学大学 International Graduate Program，全英文授课。需通过 IGP(A) 申请，IGP(A) 优秀者可申请 MEXT 大学推荐奖学金，但推荐名额极少且不可自选；IGP(C) 为自费或其他资助。
scripps-postdoc-award: UCSD 斯克里普斯海洋研究所的博士后奖，两年期，最低 $74,000/年（另含福利），另有一次性研究津贴 $6,000，须先联系潜在导师。
scripps-research-phd: Scripps Research 研究生院博士项目，学费、医保和津贴由学校、导师和国家奖学金共同覆盖；2025–26 学年基础津贴为 $43,680（佛州）或 $45,760（加州）。持外部奖学金可获额外补充。
scu-graduate-school-scholarships: 南十字大学（Southern Cross University）研究生院奖学金。其中 RTP 奖学金面向澳大利亚本国高成绩研究生候选人，生活津贴标注为 AU$32,192/年（2024 标准，按年指数化）。
sedarc-royal-holloway-esrc: 皇家霍洛威大学的 SEDarc（ESRC）博士奖学金，2027 年 9 月入学。学费按英国标准，另发生活费约 £21,805/年（以当年为准）。国际生名额约占 30%，需先申请 PhD 并获系里批准，再填写 SEDarc 表格。
sedarc-sussex-esrc-2027: 萨塞克斯大学 2027 入学的 SEDarc（ESRC）博士奖学金。国际生名额约占 30%，国际奖学金生的学费为补差，不含机票、签证与医疗附加费；需先经校内提名，再进入联盟评审。
sfu-physics-graduate-financial-support: 西蒙弗雷泽大学物理系承诺为录取博士生提供 4 年资助保障。页面所载 2025–26 年为每年 $35,600，学费从中扣除；持 NSERC 奖学金者为 $48,600/年。
sheffield-ahrc-dla-2027: 谢菲尔德大学人文与社会科学方向的 AHRC Doctoral Landscape Award，面向 2027/28 学年入学，资助 3.5 年，每年 4 个名额，国际候选人至多 1 个。需先提交 PhD 申请并取得申请编号，再单独提交 AHRC 资助申请；已在读博士者不接受。
sheffield-csc-phd: 谢菲尔德大学 Sheffield–CSC 联合博士奖学金。官网标注 2027 年 10 月入学已关闭，2026 年入学无名额，目前不可申请。
sheffield-csc-scholarship: 谢菲尔德大学与 CSC 合作的博士奖学金，学校承担 3.5 年学费，CSC 发放生活费并资助一次回国机票。仅限中国大陆国籍，须获谢菲尔德无条件博士录取，学成后须回国。
simons-dissertation-math: Simons Dissertation Fellowship in Mathematics，面向美国授予博士学位的数学系在读博士，于博三申请。须以美国高校在读身份申请，每年 19,200 美元，共两年，无国籍要求。
simons-ee-fellowships: Simons 生态与进化研究生奖学金，面向计划入读美国高校生物或生命科学相关博士项目、开展生态与进化研究的学生，无国籍要求。已持生态或进化方向博士学位者不符合条件。
simons-fellows-to-faculty: Simons 基金会面向资深博后的过渡资助，3 年研究经费最高 $600,000，领域为自闭症与衰老脑科学。申请者需持 PhD 和/或 MD，处于带教研究训练岗位，并计划下一学年起任教职。
simons-plant-biology-postdoc: Simons 植物生物学博士后奖学金，年津贴 $85,000，另有年度津贴最高 $35,000。外国申请人可以申请，但须与美国非营利研究机构的导师合作，博士学位须在截止前 3 年内获得。
simtech-stuttgart: 斯图加特 SimTech 研究生院博士岗位，按 TV-L E13 全职雇员聘用。需先找到 SC SimTech 导师并获岗位，每位博士须有至少两名不同学科背景的导师，并完成约三个月海外研究停留。
sissa-bando-italiano-2026-27: 意大利 SISSA（特里雅斯特高等研究院）2026/27 年博士招生公告（意大利语版），列出多个研究方向及名额，税前年津贴 €16,242.96。国际生可申请同一项目的英文版。
sissa-phd: SISSA 的里雅斯特国际高等研究院博士招生，官网写明欢迎欧盟外学生申请，具体资格以各方向公告为准。
smu-dedman-econ-phd-funding: 美国德州 SMU Dedman 经济学系博士项目的申请与资助页，录取学生通常获全额资助，含学费减免、津贴与医保。院系助教津贴为 $25,000+/年，GRE 推荐但不强制。
snf-doctoral-salary-news: 瑞士国家科学基金会（SNSF）项目下博士生薪资调整公告。博士生薪资下限自 2026 年 1 月 1 日起由 47,040 瑞郎提高至 50,000 瑞郎（税前），2024 年薪资上限为 55,000 瑞郎，实际薪资在区间内由高校确定。
sni-phd-school-basel: 巴塞尔大学纳米科学 SNI 博士学院以项目方式招生，每个项目资助 1 名博士生，最长 4 年，薪资依据 SNSF 标准并含运行经费。提案须由两名提案人组成导师组，其中一名为巴塞尔大学 Gruppierung I 教授。
sns-phd-admission-competition: 比萨高等师范学院（SNS）的博士招生，所有博士课程对意大利籍与非意大利籍学生开放，录取者均获奖学金并含住宿相关支持，免注册费。非意大利籍可申请，需持外国硕士学位。
sns-pisa-phd-concorso: 比萨高等师范学院（SNS）博士招生，国籍不限，需持意大利硕士或同等外国学位。学费免除并提供奖学金，外国大学学位持有者另有保留名额。
sofinaboel-fellowship-2027: SofinaBoël 奖学金，面向在比利时高校注册、已有 100% 带薪博士岗位且注册满一年的博士生，资助出国研修 6 或 12 个月，每月 €1,650，并一次性补助 €1,000 往返机票。
southampton-csc-partnership: 南安普顿大学 CSC 合作博士奖学金，面向中国籍、18 岁以上申请者。学校承担学费，CSC 承担生活费并含差旅费用。需已获南安普顿博士录取，学业平均成绩 75% 至 80% 或以上，并满足英语要求。
ssm-phd-napoli: 意大利南方高等研究院（SSM）四年制博士项目，预公告称共 10 个项目，每个至少 3 个带奖学金名额，入学不收学费（地区学生权利费除外）。年毛额 €19,000（含社保），预公告注明可能调整。
st-andrews-csc: 圣安德鲁斯大学 CSC 联合奖学金，学校承担全额学费与本地科研费，CSC 负责生活费。须为中国大陆国籍且在大陆常住（不含港澳台），并承诺学成回国。
st-andrews-world-leading: 圣安德鲁斯大学 World-Leading 博士奖学金，最多 6 个名额，全额资助（学费与年生活津贴 £20,467，2026–27 学年标准）。无地域限制，国内外学生均可申请，需申请本校博士，可自拟课题。
stanford-biosciences-phd-funding: 斯坦福大学生物科学博士资助，全奖，2025–26 学年津贴 $56,348/年，另含学费与医保。需美国学士学位或同等国际学历，并满足英语能力要求；官网称公民身份不构成录取条件。
stanford-ceas-chinese-studies-postdoc: 斯坦福东亚研究中心的12个月中国研究博士后，面向人文社科学者。页面称基本薪酬约$78,000。需获博士学位不超过四年，斯坦福本校博士通常不予考虑。
stanford-doerr-postdoc: 斯坦福 Doerr 可持续发展学院的 Dean's 博士后奖，两年期，年薪 $85,000，另有每年 $10,000 研究与专业发展经费，含福利与医保，不需要教师提名信。
stanford-history-phd-funding: 斯坦福大学历史系博士资助保障，官方页面称在读且学业状况良好的 PhD 学生享有 5 年连续资助，含学费、津贴或助教/助研薪资、暑期津贴和医疗保险。
stanford-linguistics-phd: 斯坦福大学语言学博士项目，录取即含 5 年学费与生活费，页面称与国籍无关。通常五年完成学业，第 2–4 年可担任助教。
stanford-philosophy-phd-funding: 斯坦福大学哲学系录取的博士生可获五年资助，包括学费、奖学金或薪资及夏季资助。外部奖学金计入该资助，不额外延长年限。
stanford-science-fellows: 斯坦福 Science Fellows 三年期自然科学博士后，年薪 $98,000，另有最高 $10,000/年研究与发展经费及最高 $2,500 搬家费。需斯坦福教员接收，持 H-1B 者不符合。
stanford-shorenstein-contemporary-asia: 斯坦福APARC Shorenstein当代亚洲博士后，面向近期获博士学位者，研究方向为亚太地区政治、经济或社会变化。2026–27学年津贴约$80,000（10个月折算）加研究经费。
stiftung-mercator-fellowship: Stiftung Mercator 研究员计划面向有实质学术或工作经验的研究者与实践者，向所有国籍开放，全年可提交申请。不适用于本科、硕士学生或博士资助。
stipendium-hungaricum-study-finder: 匈牙利政府奖学金（Stipendium Hungaricum）官方检索页，可按博士课程和院校筛选，申请须在项目所列大学内提交。2026/27轮已截止，2027/28轮时间以官网为准。
stonybrook-chem-how-to-apply: Stony Brook 化学系博士申请与资助说明。页面称博士生可获年度研究生津贴、补贴健康保险和全额学费，当前津贴为 $38,000/年。申请需提交成绩单与 3 封推荐信，GRE 已不要求。
stonybrook-genetics-graduate-program: 石溪大学遗传学研究生项目（含 CSHL 教员），官网称全体学生获全额学费奖学金及补贴医保。当前津贴 $40,667，自 2027-07-01 起 $44,000，自 2028-07-01 起 $48,000。
strategiska-ssf-research-institute-phd-2026: 瑞典战略研究基金会（SSF）资助的研究所博士岗位，项目 2027 年 8–12 月开始。博士生由研究所受雇（至少 80%），需大学与研究所各一名导师共同申请。国际生资格以官方公告为准。
stsci-brinson-prize-fellowship: Brinson 基金会资助、STScI 提供行政协助的天体物理博士后奖学金，本轮三个名额，面向所有国家公民。学位需在 2023-01-01 后授予，或须在 2027-09-01 前获得。
study-australia-scholarships: 澳大利亚政府官方奖学金检索门户（Study in Australia），收录政府、院校及其他机构的奖学金。澳洲 PhD 的主要资金仍多来自各校 RTP 奖学金，具体金额与资格以各项目页面为准。
studyinjapan-mext-research-2027: 日本政府官方门户 Study in Japan 的 MEXT 2027 年度使馆推荐（研究生）入口，是 MEXT 使馆推荐的总入口。中国申请者需通过中国使馆初审（材料、笔试、面试），并取得日本大学暂定录取函，具体以使馆公告为准。
su-economics-phd-employed: 斯德哥尔摩大学经济系博士项目，博士生为受雇的博士候选人，按薪级发工资，全日制 48 个月，每年录取约 10 人。需经济学 90 ECTS 学分或等价知识，并有经济学论文。
su-linguistics-work-with-us: 斯德哥尔摩大学语言学系的博士岗位为带薪雇佣，一般覆盖四年全时博士学习，岗位在 su.varbi.com 逐个发布，资格以各岗位公告为准。
surrey-csc-awards: 萨里大学 CSC 联合奖学金，仅限中国大陆公民。学校免除学费，CSC 提供生活津贴、海外学生医疗保险与往返机票；须先获萨里无条件录取，学成后需回国。
surrey-sedarc-studentship: 萨里大学 SEDarc ESRC 社科全额博士奖学金，博士 3.5 年，面向英国与国际学生，标准生活津贴 £21,805/年（2026 参考）。国际生名额据第三方信息约占 30%，需通过萨里校内申请流程并符合 ESRC 资格。
sussex-ahrc-dla: 萨塞克斯大学 AHRC Doctoral Landscape Award（艺术与人文），标准津贴 £21,805/年（2026–27 标准）。需获得该学院博士录取，研究须属 AHRC 资助范围。AHRC 只覆盖 Home 学费，国际生需自付与 Home 学费的差额。
sussex-ahrc-dla-stuart-hall: 萨塞克斯大学 AHRC DLA（Stuart Hall 基金会）博士奖学金，共两个名额。AHRC 只覆盖英国学费标准，国际生需自行承担差额；须满足萨塞克斯博士录取要求。
sutd-istd-phd-opportunities: 新加坡科技设计大学 ISTD 博士项目按课题组列出在招课题，学制 4 年，每年 9 月与 1 月入学。PGF 资助面向所有国籍，国际生每月津贴 S$3,600，需承担教学或实验室助教工作。
sutd-pgf: 新加坡科技设计大学 President's Graduate Fellowship，面向所有国籍，最长 4 年资助学费与月津贴。国际生博士月津贴为 S$4,300（自 2026 年 1 月 1 日起），需承担教学或实验室辅导任务。
swbio-dtp-projects: 英国西南生物博士培训伙伴（SWBio DTP）的项目列表，提供全额资助的四年期博士岗位。申请递交给项目所在的承办院校，国际生资格以各项目公告为准。
swc-phd: Sainsbury Wellcome Centre（UCL）的系统神经科学博士项目，全额资助、不限国籍，覆盖 UCL 学费，并提供免税年津贴 £30,839 及会议差旅预算。申请需英国一等或高二等荣誉学位，或同等海外学位。
swinburne-research-stipend: 斯威本科技大学（Swinburne）博士研究津贴奖学金，设 SUPRA 与 RTP Stipend 两类，提供研究期间的津贴。2026 年标准为每年 AU$35,500（指数调整），三年，可延 6 个月。
swinburne-supra: 斯威本科技大学研究生研究奖（SUPRA）年津贴 AU$35,500（免税，2026 标准，3 年，个别情况可延 6 个月），并提供最长四年的学费奖学金。需一等或二等上荣誉学位或同等学历。
swiss-excellence: 瑞士政府卓越奖学金，面向博士和博后，需先获瑞士导师提名。第三方报道月津贴 CHF 2,450，需以官网为准；中国大陆能否申请以官方国家名单为准。
sydney-architecture-design-planning-rs: 悉尼大学建筑、设计与规划学院的研究奖学金，面向国内外 PhD 或 Master by Research 申请者，最低津贴 AUD 27,000/年起。研究须属学院研究领域，获奖须放弃其他悉大 RTP 申请。
sydney-business-research-scholarship: 悉尼大学商学院研究奖学金（国际生），覆盖国际学费，最长 3.5 年，最低津贴每年 $42,754（RTP 标准，逐年指数化调整）。需先申请并获得博士录取。
sydney-csc-phd-scholarship: 悉尼大学与CSC合作的全额博士奖学金：学校免学费，CSC提供生活费、机票、签证及海外医疗保险。限35岁以下中国公民，需先获博士无条件录取，申请时未在澳大利亚工作或学习。
sydney-csc-renewal-2026: 悉尼大学 2026 年 9 月宣布与 CSC 续约，面向中国博士生，全额资助，需通过与 CSC 的合作遴选。此前条件为中国公民、35 岁以下。2027 入学时间需向悉尼大学研究生办公室确认。
sydney-law-rhd-scholarships: 悉尼大学法学院博士研究奖学金有两条途径：RTP 最高 AUD 42,000/年，法学院奖学金（如 Harris 奖学金）最高 AUD 55,000/年，建议两者都申请。部分法学专项奖最高 AUD 50,000/年。
sydney-maths-stats-rtp-scholarship: 悉尼大学数学与统计学院博士研究奖学金（RTP 体系），页面称提供 RTP 标准生活津贴及 SSAF，国际生可申请。需获无条件录取或在读全日制博士，并通过 RTP 竞争性评选。
sydney-quantum-academy-sqa-phd: 悉尼量子学院（SQA）的博士奖学金，覆盖悉尼四所高校，国际生学费可豁免，主要津贴为 A$42,754/年（2026 标准，最多 4 年），按轮次征集。
sydney-transnational-musical-exchange-rs: 悉尼大学音乐学院的跨国音乐交流博士奖学金，研究音乐学与音乐文化，最长 3 年，国际生可获学费与 RTP 标准生活津贴。名额绑定 ARC 项目，需先联系项目团队选定主导师。
tampere-ippe-epi-phd: 坦佩雷大学国际流行病学与公共卫生博士项目，面向国际申请者，2027年8月入学，第一年在坦佩雷修课。项目免学费但不提供个人或项目资助，需自备约10个月的生活费。
tamu-anthropology-funding: 德州农工大学人类学系为新入学博士生提供多年资助包，含非居民学费减免与助教职位，每年秋季招生。
tamu-atmos-funding-assistantships: 德州农工大学大气科学研究生资助，所有助教与助研岗位都包含学费。月津贴 $2,750（硕士及未通过博士资格考试者），$2,900（已通过资格考试的博士生）。研究岗位多依赖导师在研经费。
tartu-phd: 爱沙尼亚塔尔图大学博士招生，博士生免学费（含国际生），多数名额为初级研究员合同，2026 年最低 €2,100/月（税前）。博士津贴仅限爱沙尼亚公民或居民，是否有名额需逐个研究组确认。
tau-research-fellowship-intl-phd: 特拉维夫大学国际办公室面向境外在读博硕士生的研究访问奖学金，访问 1–6 个月，金额为 5,000–30,000 新谢克尔（按访问时长与学位层次）。申请人需已完成至少一年学业并在撰写论文，且非以色列公民或居民。
tcd-csc-joint: 都柏林圣三一学院与 CSC 的联合奖学金，学院免学费，CSC 提供生活费和往返机票。仅限中国大陆公民或永居者（不含港澳台），须已获得 TCD 无条件录取且尚未持有博士学位。
tcd-law-research-awards: 都柏林圣三一学院法学院博士研究奖，面向全日制新入学博士生，每项四年，年津贴 €25,000 并免全部学费，欧盟与非欧盟学生均可申请。
tcd-trda-school-based: 都柏林圣三一学院 TRDA 院系博士奖学金，每院系每年一个名额，津贴 €25,000/年加学费减免，共四年。名额由院系决定分配，非保证获得，需直接联系拟申请院系。
tcd-ussher-fellowship: 都柏林圣三一学院（TCD）Ussher 博士奖学金，面向新入读全日制博士的学生，全额覆盖学费并提供生活津贴，按学术成绩竞争授予。通常需一等荣誉学位或 TCD 硕士学位，面向所有国籍。
technion-aerospace-phd-studies: 以色列理工学院（Technion）航空工程博士项目，英文授课，国际生可申请。提供学费减免、生活津贴与住宿支持。申请前需先联系导师，并已获得硕士学位（含论文）。
technion-thhi-nanoscience-postdoc-2026: 以色列理工学院 THHI 的 Rebecca Dratofsky 博士后奖学金，每年一次，最高 $35,000（一年）。申请人需在申请前 5 年内获得博士学位。页面标题为纳米科学，正文偏再生医学与干细胞，申请前可向 THHI 办公室确认范围。
teratronics-kit: 亥姆霍兹国际研究生院 HIRST 下的 Teratronics 方向（KIT），全年接受申请。可在合作研究所申请在招博士岗，须先联系在招 PI；已在读博士者也可申请研究员资助，需 HIRST 教授支持。
theory-cern-jobs: CERN 理论部（CERN-TH）博士后 Fellow 招募页，需理论物理博士学位或即将答辩。分两条轨道：成员国或准成员国国籍申请标准 Fellow，其他国籍申请非成员国项目，每年约 2 个名额。
tigp-biodiv-taiwan: 中研院与台湾师大、东海大学合办的生物多样性与生态进化博士项目（TIGP-BIODIV），英文授课，录取者可获至少 3 年研究生奖学金。申请时需指定意向导师；大陆学生赴台申请受相关规定约束。
tlu-dt-junior-research-fellow-2026: 塔林大学数字技术学院的补充招生，提供带薪的初级研究岗位（Junior Research Fellow），最低月薪 €2,100。申请需硕士学位，并通过 Dream Apply 提交。
tohoku-cijs-eajs-fellowship: 东北大学日本研究博士生奖学金，资助在欧洲读博的人文社科（日本研究）学生赴日完成4–12个月论文研究。2027年征集简章载明月津贴310,000日元，另含往返机票，每期约3名。
toronto-eeb-phd-international: 多伦多大学生态与进化生物学（EEB）博士的国际生申请，需先与导师达成意向并获系内录取。SGS 基础奖学金 $18,000/年，另含学费与 UHIP；该系不接收国际生读硕士，可从学士直接申请博士。
tse-iast-political-economy-postdoc-2027: 图卢兹经济学院（TSE）与 IAST 联合招聘的两年期政治经济学博士后，研究方向为气候风险，2027 年 1 月入职。薪资为指示性数字，约为年薪 €45,000 毛薪。
tsinghua-dme-supervisor-list: 清华大学机械工程系博士生导师及研究方向名单（PDF），可按研究方向找英文授课的导师，再去套磁。文件载明本科国际生 GPA 3.3/4 以上可直接申请，但名单本身不代表全奖或名额，资助以学校和导师确认为准。
tsinghua-shuimu-postdoc: 清华大学水木学者计划博士后，由院系遴选后向学校推荐，材料含申请书、代表性成果与 2–3 封推荐信。要求 35 周岁以下，全职在校，一年内仅限申报一次。
tsinghua-sppm-postdoc: 清华大学公共管理学院博士后项目。学院有 50 余名在站博后，岗位多由教授或研究中心自行招收，没有统一批次。一般先联系目标导师，再经学院博后流程入站，需具备博士学位。
tsukuba-cn-csc-special-selection: 筑波大学面向中国大陆籍 CSC 或 CGGSOS 奖学金获得者的博士特别选拔，获奖者免入学费与学费，资助期 36 个月，超出部分的学费需自付。需持硕士学位，并通过学校特别选拔。
tsukuba-mext-2027-guideline: 筑波大学前沿医学的大学推荐 MEXT 奖学金 2027 申请指南，中国籍可申请。多数项目要求日语 N2 或英语成绩，国籍须为与日本有外交关系的国家，入学时间为 2027 年 10 月。
ttic-phd: 丰田芝加哥技术学院（TTIC）博士项目，含全额学费奖学金（官网列为 $45,000/年）与按月生活津贴，津贴金额以录取信为准。录取后提供最长 5 年支持，第二年起通常担任研究助理。
tubitak-2216: 土耳其 TÜBİTAK 2216 国际研究者研究奖学金，面向外国籍国际博士生与青年博士后，提供月津贴、差旅与医保，最长 36 个月。需土耳其大学或研究机构邀请，截止时不超过 35 岁。
tudelft-bk-phd-vacatures: 代尔夫特理工大学建筑与建成环境学院的带薪博士岗位，为 4 年雇员合同，月薪 €2,770–€3,539（税前，荷兰大学 CAO 薪级）。岗位同步发布于 vacaturesindelft.nl。
tudelft-cheme-careers: 代尔夫特理工大学化工系的官方招聘入口，列出 4 年期研究型博士岗位，岗位为带薪职位，具体以各岗位公告为准。
tudelft-qutech-semiconductor-quantum-phd-2026: 代尔夫特理工大学 QuTech 研究所的带薪博士岗位，研究半导体量子计算。税前月薪€3,204–4,051，要求物理、应用物理或纳米电子学硕士，需流利英语。
tue-become-phd-candidate: 埃因霍温理工大学（TU/e）博士入职说明：博士通常以带薪雇员身份入职，合同约 4 年，要求硕士学位（荷兰或同等学历）与 C1 级英语。
tuebingen-csc-phd: 蒂宾根大学的 CSC 博士奖学金，限中国籍博士生。可选全职方案（最长 48 个月）或三明治兼职方案（6–24 个月），需通过大学在线门户申请。
tufts-gsbs-intl-applicants: 塔夫茨大学医学院研究生院（GSBS）博士项目，申请流程与美国学生相同，无国际配额。获得资助名额的国际博士生享有与美国公民相同的学费奖学金、医保和津贴；MD-PhD 仅限美国公民和永久居民。
tum-cbi-open-positions: TUM 生物成像教席的博士与博后长期招募页，方向为光学与光声生物成像，岗位开放式招募。需提交英文动机信（注明岗位名称）、简历和成绩单，并通过 TUM 在线系统申请。
tum-doctorate: 慕尼黑工业大学（TUM）博士岗位，无统一招生，多数需先获得岗位或导师，博士生无学费。非欧盟申请人需有允许工作的居留许可。
tum-dse-systems-research: 慕尼黑工业大学（TUM）系统研究组（dse）的博士与博士后岗位，组页面称有开放岗位，所有岗位按 TV-L 13（100%）标准支付并含社会福利。简历请发送至 application.dse@xcit.tum.de。
turkiye-burslari-phd: 土耳其政府奖学金（Türkiye Scholarships）的博士项目，面向国际申请人，覆盖学费、月津贴、住宿和医保，并含一年土耳其语课程。多数申请通过所选大学或奖学金门户在线提交。
turku-dpt-call: 芬兰图尔库大学 DPT 技术博士项目，带薪博士研究员岗，雇佣期最长 4 年，月薪大致 2,400 至 3,300 欧元。需已获得或即将获得可授予博士资格的学位，岗位在芬兰图尔库工作。
tuwien-jobs: 维也纳工业大学（TU Wien）招聘门户，页面列有当前职位入口，仅接受在线申请。通常需硕士或同等理工学位，具体资格以各岗位公告为准。
twas-fapesp-postdoc: TWAS-FAPESP 发展中国家博士后奖学金，在圣保罗州开展为期 12 个月（不可延长）的研究。需发展中国家国籍，博士学位取得不超过 7 年，由圣保罗州课题负责人经 SAGe 系统提交，个人不可直接申请。
ua-grad-college-ga-benefits: 亚利桑那大学研究生助理（GA）：2026–27 学年 0.50 FTE 最低津贴 $25,654（9 个月），各学院可支付更高。0.5 FTE 及以上可享学费减免，非本州学生按本州学费标准计算。
uab-csc-phd-opportunities: 巴塞罗那自治大学（UAB）的 CSC 协议博士项目，面向中国大陆公民：须先获 UAB 博士录取，再申请 CSC 资助。页面列出可招收 CSC 博士生的项目名单。
uab-gbs-benefits: 阿拉巴马大学伯明翰分校生物医学研究生院（GBS）的资助与福利：官网称全体学生（含国际生）均获年津贴、单人医保与学费覆盖，2026–27 年津贴约 $35,719。
uaeu-phd-scholarship: 阿联酋大学面向所有国籍的 4 年博士奖学金，含全额学费减免、月津贴与医保。要求硕士 GPA 3.5/4.0，论文需属阿联酋优先领域，如可再生能源、健康、水、航天。
ualberta-graduate-entrance: 阿尔伯塔大学研究生入学奖学金，博士新生 CAD $21,000，国际生另加 CAD $10,000 学费补助。入学 GPA 不低于 3.7，由院系提名，学生不能直接申请，不可续领。
ualberta-izaak-walton-killam-postdoc: 阿尔伯塔大学 Izaak Walton Killam 纪念博士后奖学金，不限国籍，每年 5 万加元，最长 2 年，另有 4000 加元研究经费。博士须来自阿尔伯塔大学以外，学位需在提名截止前三年内取得，并需经提名。
ualberta-killam-doctoral: 阿尔伯塔大学 Izaak Walton Killam 博士奖学金，是该校最高额度的博士奖学金之一，最高 $45,000/年，为期两年。无国籍限制，系内提名制，需 first class 学业水平（约 3.5 GPA）。若获主要外部奖学金，金额会减少或为零。
ualberta-killam-trust-scholarships: 阿尔伯塔大学 Killam 信托博士奖学金总页，博士奖为 Izaak Walton Killam 纪念奖学金，金额最高 $45,000/年、共两年。需经院系提名，持学习许可的国际生另享国际研究生差额学费补助。
uam-csc-predoctoral: 马德里自治大学（UAM）与 CSC 合作的博士及联合培养资助，依据 2025 年 7 月签订的协议，首年提供 15 个 4 年期博士名额及 15 个 1 年期名额，仅面向中国学生。具体条件与津贴以官网为准。
uantwerpen-emat-open-positions: 安特卫普大学电子显微镜组（EMAT）的开放职位，持续招聘博士与博士后，可直接联系各研究项目负责人，技术岗位也定期开放。透射电镜经验为加分项。
ubc-4yf-doctoral: 不列颠哥伦比亚大学（UBC）Four Year Doctoral Fellowship（4YF），国内外学生均可获得。页面称 2026 年 9 月起每年 $24,000 生活费加学费，最多 4 年。须获 UBC 博士项目录取，录取者自动参评，院系按名额提名。
ubc-awards: UBC 研究生奖学金总览，包括校内择优奖、Tri-Agency 等外部奖项与需求型资助。全日制博士生（国际生同样适用）：温哥华校区博士前 4 年最低 $40,000/年（2026 年 9 月起），奥肯那根校区最低 $25,000/年。
ubc-chbe-funding: UBC 化学与生物工程博士项目，全日制博士生前四年每年至少 $40,000 资助。申请通常需学术平均成绩达 B+ 水平，研究型博士还需导师同意。
ubc-csc-doctoral: UBC 与 CSC 合作的博士奖学金，资助生活费加学费，期限 2–4 年，CSC 年生活补助约 $26,400。仅限中国大陆 PRC 国籍且无他国永居者（港澳台居民除外），年龄需在 35 岁以下，毕业后需回国服务 2 年。
ubc-international-tuition-award: UBC 温哥华校区国际研究生学费奖，符合条件的国际博士生自动获考虑、无需申请。已获得支付学费的外部奖学金或资助者不符合条件。
ubc-killam-postdoc: 加拿大 UBC Killam 博士后研究奖学金，面向全球学者，最长两年，每年 $60,000（加元）。需院系提名（每单位至多推荐一人），博士学位须在资助开始前 24 个月内完成。
ubc-kinesiology-phd: UBC 运动学（Kinesiology）博士，全日制博士生前四年每年至少获 40,000 加元资助，为校级保障，国内外适用。申请前须先与潜在导师确认，否则不会被录取。
ubc-min-funding-policy: UBC 博士最低资助政策，自 2026 年 9 月起，第 1–4 年每年至少 $40,000（CAD）。资助包可由奖学金、助教、研究助理等组成，国际生与本地生同等适用。
ubc-okanagan-phd-minimum-funding: 不列颠哥伦比亚大学奥卡纳根校区为全日制博士生提供前四年每年至少 $40,000 的资助保底，可由奖学金、助教或助研岗位等组合构成。
ubc-pharmsci-funding-awards: UBC 药学系博士资助，页面称全日制博士生国内外相同，每年至少获 $40,000 资助，可含奖学金及助教、助研岗位。国际博士生可获校级 International Tuition Award，最高 $3,200/年，无需单独申请。
ubc-phd-funding-guarantee: UBC 研究生院的博士资助保障，2026 年秋季起入学的博士生前 4 年基础资助为每年最低 $40,000（税前、学费前），由助教、奖学金等合并构成，学费另计。
ubco-postdoc-fellowship: UBC Okanagan 博士后研究奖学金（UBCOPF），每年 $60,000，资助期 2 年，不可续期。面向加拿大公民、永久居民及国际申请人，博士学位须在申请截止前 5 年内获得，且不得持有教职。
uc-canberra-hdr-stipend: 堪培拉大学 HDR 津贴奖学金（RTP）按 2025 标准每年 AUD 36,225（免税），为期 3.5 年，国际生获奖后可能另获学费减免。竞争激烈，上一轮获奖者不足申请人的 10%。
ucalgary-ages: 阿尔伯塔省研究生卓越奖学金（AGES）卡尔加里大学入口，博士档上限为每年 CAD 15,000，对国际生开放。须通过校内 Graduate Award Competition（GAC）申请，至少申请一项 GAC 奖项才会被考虑。需持学习许可、全日制攻读博士并居住于阿尔伯塔省。
ucalgary-csc-guide: 卡尔加里大学 CSC 博士申请指南，适合计划通过 CSC 竞争资助读博的学生。在线申请时需在 remarks 栏注明参加 CSC 竞争，并主动联系导师。
ucalgary-funding-floor: 卡尔加里大学博士资助保底，2026 年 1 月 1 日起入学的全日制博士生前四年有保底资助，国际生为 CAD 33,205/年，由导师经费、奖学金与助教助研岗位组成。
ucalgary-geoscience-phd: 卡尔加里大学地球科学博士项目，9月入学，申请时须列出潜在导师，需硕士或相当学位、近两年全日制 GPA 至少 3.0/4.0，并提交研究兴趣陈述和两封推荐信。
ucalgary-killam-postdoc: 卡尔加里大学 Killam 博士后奖学金，需卡尔加里大学教授作为导师，博士须在预计入职前 36 个月内获得，且不能是卡尔加里大学自授。无国籍限制，国际申请人自办工作签证。
ucalgary-kinesiology-phd: 卡尔加里大学运动学博士项目，申请需 GPA 不低于 3.00、两封推荐信，并获得系内导师同意。录取需提供外部资助的书面确认。
ucd-ad-astra-art-history-phd: 爱尔兰 UCD 艺术史与文化政策学院 Ad Astra 博士奖学金，研究方向为创意与文化产业（Benjamin Anderson 指导），面向欧盟与非欧盟申请者。全额学费减免，每年 €22,000 津贴加 €4,000 研究经费，最长 4 年。
ucd-china-scholarship-scheme: 都柏林大学学院（UCD）中国奖学金计划，UCD 承担学费，CSC 提供每年 €16,200 生活费及往返机票。可选 4 年全日制博士或 6–24 个月联合培养，申请需获得 UCD 导师同意。
ucdavis-are-financial-support: 加州大学戴维斯分校农业与资源经济系博士录取者近年获 5 年资助。国际生的非居民学费（NRT）可由系里承担，但需按期进入候选人阶段（第四年前）。
uchicago-bsd-financial-support: 芝加哥大学生物科学部（BSD）博士资助，2026–27 学年津贴 $47,741，另含医保与费用。学部承诺前五年提供有保障的资助（需学业进展达标），包括学费、医保、津贴与科研经费。
uchicago-chd-phd-fellowship-support: 芝加哥大学比较人类发展博士项目，新入学博士生在整个学程内获资助，包括学费、医保与生活津贴，资助不因国籍而异。最低津贴为 $45,000（引用 2024–25 数据）。
uchicago-social-sciences-fellowship-support: 芝加哥大学社会科学部博士资助页，称学程内资助与公民身份无关，包括全额学费奖学金、学生医保保费、学生服务费与生活津贴。政治学系可获最长六年资助，并可申请第七年。
uci-mae-postdoc-jpf10343: 加州大学欧文分校（UC Irvine）机械与航空航天工程系博后岗位（JPF10343），需机械或航空航天工程博士学位。初始聘期 2 年，总年限不超过 5 年，薪资按资历确定。
uci-sociology-funding: 加州大学欧文分校社会学系博士资助。页面称所有录取 offer 含五年资助，资助形式包括奖学金、学费减免、助教或研究助理岗位等组合。非加州居民（含国际生）前 1–2 年 offer 含非本州学费。
uclouvain-fsr-incoming-postdoc: UCLouvain FSR 2027 年国际博士后资助，提供 15 个名额，资助期 12–36 个月，免税，含社保、保险及科研运行经费。须由 UCLouvain 导师提交申请，博士学位须不晚于 2027 年 5 月 1 日获得。
uclouvain-fsr-postdoc-incoming: UCLouvain FSR国际博士后接收资助，面向所有国籍的持博士学位者，博后经验不超过5年，过去3年内在比利时生活或工作不超过24个月。资助12–36个月，免税。
ucsb-idrf-international-fellowship: UCSB国际博士招生奖学金（IDRF），面向新入学国际博士生，由院系在申请过程中提名获得。可覆盖非居民补充学费（NRST）、学费与医疗保险，也可能含生活费。
uea-csc: 东英吉利大学与 CSC 联合博士奖学金，面向中华人民共和国公民及永久居民，年龄不超过 35 岁。资助含学费减免、生活津贴、医疗保险、回程机票与签证费，最长 4 年，需承诺学成回国。
uea-phd-funding-deadlines-2027: 东英吉利大学（UEA）2027/28 招生年各类研究型博士资助的申请截止日期汇总，涵盖多个资助项目。其中 CSC 资助面向中国公民，其余项目以各项目页为准。
uea-senss-studentships: 东英吉利大学 SENSS 学生主导的 ESRC 博士奖学金，覆盖学费与 UKRI 生活费，年生活费 £20,780（2026/27 页面）。面向各国国籍，国际生名额每年约 10 个。
ufz-higrade-doctoral: 亥姆霍兹环境研究中心（UFZ）的博士入口，博士研究人员均属 HIGRADE 研究生院。须先申请 UFZ 公布的博士岗位，并同时在授予学位的大学注册；已有 DAAD 奖学金者需直接联系所在研究所。
ugc-hkpfs-official: 香港博士研究生奖学金计划（HKPFS，研资局设立）不限国籍，面向申请香港高校全日制博士者。2026/27 学年每年 HK$344,400，另有差旅津贴 HK$14,400/年，最长 3 年。
ugent-composites-phd-vacancies: 根特大学复合材料研究组（UGent-MMS）的博士岗位页，标注 2026 年秋季共 7 个博士与博后岗位。三个博士岗位税后起薪约 2600 欧元/月、期限 4 年，需持硕士学位。
ugent-vacancies: 根特大学博士研究员（Doctoral fellows）岗位页，集中列出 10 个 100% 全职博士岗位。每个岗位的申请要求与截止时间以其各自的岗位说明为准。
uiuc-geography-gis-graduate-funding: 伊利诺伊大学厄巴纳-香槟分校地理与GIS系的博士资助说明页，包括半时助教、助研以及系级和研究生院奖学金，官网称国际生与本地生条件相同。非英语母语者需满足 ITA 英语要求；完整申请即进入资助池。
uiuc-linguistics-phd-financial-aid: 伊利诺伊大学厄巴纳-香槟分校语言学 PhD，录取到 Stage 1 的博士生提供 5 年全额资助，直接进入 Stage 2 的提供 4 年。资助含学费减免、津贴与医保，需保持学业良好并逐年续申。
uiuc-polsci-graduate-faq: 伊利诺伊大学厄巴纳-香槟分校政治学博士，录取生通常获 5 年资助，包括助教或助研津贴加学费减免。2025-26 学年校内最低 9 个月津贴 $24,200（系里通常更高）。2026 轮申请不需要 GRE。
uiuc-psychology-phd-funding: 伊利诺伊大学厄巴纳-香槟分校心理学系 PhD，学业合格的博士生通常可获多年支持，多为助教或研究助理岗，含生活津贴与学费减免。需保持良好学业状况，担任助教须通过英语口语测试。
uk-2027-bl-cdla: 大英图书馆（BL）合作型 AHRC Doctoral Landscape Award 博士课题，面向 2027 年 10 月入学，由英国高校在职学者与 BL 联合指导。具体条件以 BL 页面为准。
uk-bbsrc-cambridge-biosciences-dtp: 剑桥生物科学 BBSRC DTP，2027 入学批次约 25 个名额，覆盖学费与津贴。需 High 2:1 及以上学位，国际生可申请但名额有限，需以官网当期规则为准。
uk-birmingham-csc-phd: 伯明翰大学与国家留学基金委联合的 CSC 博士奖学金，学校负责学费，留学基金委提供生活津贴和往返机票。需先获伯明翰全日制博士录取并联系导师，须持中国大陆护照。
uk-glasgow-csc-phd: 格拉斯哥大学与国家留学基金委联合的 CSC 博士奖学金面向中国大陆学生，名额每年很少。需学业成绩优秀，先通过学院初选，再获国家留学基金委批准，学成后须回国。
uk-liverpool-duncan-norman: 利物浦大学 Duncan Norman 研究奖学金，面向全日制博士，不分国籍与学费身份，覆盖学费并提供每年 £23,000 生活补助（有其他资助时补足至该水平）及 £5,500 住宿津贴。每学年仅 1 名，建议与博士申请同步提交。
uk-manchester-csc-joint-scholarship: 曼彻斯特大学与国家留学基金委联合资助的博士奖学金，仅限中国大陆公民。学校负担学费，国家留学基金委负责生活费与往返机票，最长约四年。需先获无条件录取，再由导师提名。
uk-qub-csc-phd-2026: 贝尔法斯特女王大学与中国留学基金委合作的博士奖学金，面向中国大陆学生（须为中国公民），覆盖最长 3 年国际学费及写作期费用，并由 CSC 提供生活津贴、往返经济舱机票和签证费。
uk-shu-sheffield-institute-of-education-phd: 谢菲尔德哈勒姆大学教育学院 White Rose 合作博士奖学金（教育、儿童与青年方向）。需先与学院联系并提交研究计划，再正式申请。资助覆盖 UKRI 标准生活津贴与学费。
uk-st-andrews-pgr-scholarships: 圣安德鲁斯大学博士研究奖学金统一入口，汇总 World-Leading Doctoral Scholarships、Ewan and Christine Brown 等多项奖学金。部分奖项可覆盖最高全额学费并发放年度生活补助，2026–27 学年标准为每年 £20,467。
ukro-msca-dn-guidance: 英国国家联络点（UKRO）的 MSCA Doctoral Networks 指南，用于查找英国高校参与的 DN 博士岗。岗位在 EURAXESS 发布，同样适用流动性规则。
ul-government-of-ireland-scholarship: 爱尔兰政府国际教育奖学金（GOI-IES）利默里克大学页面，由政府与高校合作、HEA 管理，覆盖学费及注册费（不含 50 欧元申请费）。面向原籍不在欧盟/EEA、英国、瑞士的申请人，须先申请 UL 博士项目并取得 offer。
um-gov-2027-28-postgrad-call: 澳门政府公告的澳门大学 2027/28 年博士课程招生信息。申请须直接通过澳大官网；奖学金需在博士申请时单独提出，由校级委员会竞争性决定。
um-macau-phd: 澳门大学博士奖学金（UM PhD Scholarship），不限国籍，每月 MOP 20,000，最长 4 年。须与博士入学申请同时提交，由校方委员会评审，不保证获得。
um-phd-scholarship: 澳门大学博士奖学金（UMPS）不限国籍，月津贴 MOP 20,000，最长 4 年，学费由津贴抵扣。需与博士入学申请同步提交，并由校级委员会终审。
um-umps-phd: 澳门大学博士奖学金（UMPS），面向所有国籍的全日制博士申请者，仅限秋季入学，需与博士入学申请同步提交。月津贴 MOP20,000，最长 4 年，学费先由津贴抵扣。
umd-ansc-graduate-assistantships: 马里兰大学动物科学（ANSC）研究生项目，竞争择优录取。助教与研究助理资助依系里经费发放，不保证全员获得；国际申请者需提交 TOEFL 等英语成绩。
umd-merrill-journalism-studies-phd: 马里兰大学 Merrill 学院新闻学研究博士项目（2027 年秋季入学）。需研究陈述、三封推荐信与写作样本，年度津贴视经费而定，另有学费援助与健康福利。
umd-smith-phd-financial-support: 马里兰大学史密斯商学院博士录取者均有资格获得研究生助理资助，基本薪资 $37,550（每周约 20 小时），学费减免至 10 学分，国际生另缴国际学生费。
umich-complit-phd-fellowship: 密歇根大学比较文学博士的 Department Fellowship，录取博士生即享 5 年资助保障，包括学费、医保与牙科险、生活津贴和暑期资助。
umich-philosophy-phd-support: 密歇根大学哲学系承诺为学业进展良好的博士生提供六年全额支持，包括非教学奖学金、教学助理、夏季支持与医保。需被录取为博士生，并保持学术进展与教学表现达标。
umn-sociology-graduate-funding: 明尼苏达大学社会学系博士录取者享五年资助保障（需学业进展达标），平均约 $23,000/年（9 个月 TA，每周约 20 小时），含学费减免与医保保费优惠。国际生学费与国内不同。
unc-kenan-flagler-phd-funding: 北卡大学 Kenan-Flagler 商学院博士录取者均获五年保证资助（含暑期），通常为研究或教学助理职位，学院承担医保并可推荐州外学费减免。需保持良好学业进度。
uni-due-chem-vacancies: 杜伊斯堡-埃森大学化学系的招聘栏目。Werdelmann 基金资助的博士岗为三分之二 TV-L 13 雇员岗，最长 3 年，可延长最多 12 个月；需化学或相近专业学位，学业成绩优秀。
uni-lu-yadias-doctoral-fellowship-2026: 卢森堡大学 YADIAS 高等研究院 2026 年征集的博士研究员岗位，约 15 个全职 48 个月岗位，面向任何国籍和年龄，全部研究领域均可，研究方案由申请人自拟，需先确定两位导师。
unibo-csc-joint-phd: 博洛尼亚大学 CSC 联合博士选拔，面向中国公民，需硕士学位。流程分两步：先在博洛尼亚大学线上预选，通过后再向 CSC 申请生活费。适合先找到导师再申请。
unicamp-iq-postdoc: 巴西坎皮纳斯大学化学研究所博士后奖学金，对巴西及外国候选人开放，月津贴 12,570 雷亚尔（税前），全职研究，每周至多 8 小时教学。需有该所在职教师的接收信。
unige-life-sciences-phd-school: 日内瓦大学生命科学博士学院的冬季招生。申请者可选择 1–2 个项目，需硕士或同等学位；资助因导师和项目而异，申请前需与导师确认。
unilu-repair-phd-ai-welfare: 卢塞恩大学 100% 全职博士岗位，挂在 ERC Starting Grant 项目 REPAIR 下，研究 AI 对福利国家政治的影响。固定期限 4 年，以论文集形式完成。
unisc-rtp-scholarship: 阳光海岸大学（UniSC）RTP 奖学金，基础生活津贴 A$38,000/年（2026 基础标准），资助 3 年（特定情况可延长 6 个月），可选学费减免，另有合计 A$2,000 搬迁补贴。需先获得 UniSC HDR 录取。
unist-grad-admissions: 蔚山科技院（UNIST）研究生招生，学生均获 RA/TA 职位，覆盖全部学费并提供月津贴。博士最低约 KRW 13,200,000/年（政府资助轨道），大学资助轨道约 KRW 20,880,000/年，需满足学业进度要求以维持津贴。
unitn-international-studies-phd: 特伦托大学国际研究博士项目第 42 周期提供 5 个奖学金与 6 个名额，年税前奖学金 18,345 欧元（Tier I），期限 3 年，官方语言为英语。
univ-larochelle-allocation-doctorale-2027: 拉罗谢尔大学自设的带薪博士合同征集，2027 批次。需满足硕士学历要求，课题须符合学校科研优先方向，且需先与导师确定课题再提交。
univ-lyon1-msca-page: 里昂第一大学的 MSCA 博士后资助页面，可接收任意国籍的博后。MSCA 博后为津贴类资助，申请资格以欧盟官方条款为准。
univ-paris-cite-eiffel-doctorat-2027: 巴黎城市大学 Eiffel 博士奖学金 2027–2028 批次，面向非法国籍、35 岁以下者。学生需先与拟合作导师联系，由接收院校提名，不能直接申请，名额有限。
unive-msca-pf-ca-foscari: 威尼斯 Ca' Foscari 大学作为 MSCA 博士后奖学金宿主的说明页。申请人需与校内学者先达成合作，宿主再联系该校 MSCA 负责邮箱；2027 轮申请人不得在意大利居住或开展主要活动。
unoesc-stricto-foreign-2026: 巴西私立大学 Unoesc 面向外国学生的 stricto sensu 硕博连续流征集，目标为 2026 年内入学。每个项目仅 1 个奖学金名额，奖学金覆盖全额学费与注册费，名额有限。
uoft-physiology-2026-27-base-funding: 多伦多大学生理学系博士生适用的 2026–27 学年 Temerty 医学院统一基础资助协议，分列国内与国际生标准。硕士入学者保障至少 4 年基础资助，本科直入者至少 5 年。
uoft-tfom-harmonized-funding-2025-26: 多伦多大学 Temerty 医学院博士统一基础资助协议，页面给出 2026/2027 学年的基础资助标准，分硕博与国内、国际生。补充上限每 12 个月 5,000 加元，入学奖学金最高 5,000 加元。
uottawa-intl-doctoral-scholarship: 渥太华大学面向全日制国际博士生的奖学金，2023 年 5 月及以后入学适用，5 年共 $45,000，每学期最多 $3,000 记入学费。仅在按国际学费计费时发放。
uottawa-phd-intl-research-scholarship: 渥太华大学博士国际研究奖学金，面向博士第二年及以上学生，须在加拿大境外开展至少 8 周与学位论文直接相关的研究，一次性奖励 $5,000，不可续。
uow-csc-joint-phd: 伍伦贡大学（UOW）与 CSC 合作的联合博士项目，面向中华人民共和国公民。需先获 UOW 博士录取，并先找到导师和题目；CSC 承担生活津贴、往返机票与签证费。
upc-csc-phd-research-stay: 加泰罗尼亚理工大学（UPC）CSC 博士研修项目，每年最多 30 名已在国内高校注册博士的中国学生，在 UPC 研修最长 24 个月。需先取得 UPC 无条件邀请函，再向 CSC 申请资助。
upm-csc-cooperative-phd: 西班牙理工大学（UPM）CSC 合作博士项目，CSC 提供生活津贴与往返机票，UPM 免除学费及研究费。需硕士或同等学历，并获 UPM 录取信。
upsaclay-star-phi-postdoc: 巴黎萨克雷大学的 MSCA COFUND 国际博后计划，面向国际博后，合同为24个月，过去3年在法停留不得超过12个月，下一轮以官网为准。
upv-csc-doctorate: 瓦伦西亚理工大学（UPV）与 CSC 合作的联合博士奖学金，最多 10 个全额资助名额。学校免注册费，CSC 提供月津贴（含医保）及往返经济舱机票。限中国国籍，学成后须回国。
uq-csc-joint: 昆士兰大学（UQ）与 CSC 合作的博士奖学金，面向中国大陆公民和永久居民，提供生活津贴、医保、往返机票及 UQ 学费奖学金。需先向导师提交 EOI，再申请 CSC；要求 IELTS 6.5（单项不低于 6.0）。
uq-grss: 昆士兰大学研究生院奖学金（含 RTP），面向国际生，生活津贴 AUD 37,500/年（免税），另含 OSHC。仅限全日制，须由学院提名并先提交 EOI，学费覆盖范围以官网为准。
us-berkeley-statistics-phd-financial-support: 加州大学伯克利分校统计系博士资助。所有录取博士生最长可获五年资助，由奖学金、助教（GSI）、助研（GSR）组合而成，涵盖学费与生活津贴。页面称国际学生全程覆盖。
us-brown-cs-doctoral-faq: 布朗大学计算机系博士项目称向所有博士生（含国际生）提供资助，仅招秋季入学。非英语母语者需提交 TOEFL，一般不考虑 iBT 低于 105 分或 IELTS 低于 7 分。
us-buffalo-engineering-paid-assistantships: 布法罗大学工学院博士录取即获 TA/RA 助理职位（PhD Excellence Initiative），含学费与费用减免，10 个月职位至少约 $23,690/年。并非所有项目都提供全额资助，以具体项目为准。
us-cornell-cs-phd-funding: 康奈尔大学计算机系博士项目称，学位期间可获全额支持，形式为助教、助研或奖学金，但需保持良好学术状态。
us-harvard-seas-phd-funding: 哈佛大学工程与应用科学学院称所有录取博士生均获全额资助，含学费、交通与牙科补贴及生活津贴，不看经济需求；页面所载税前月津贴为 $4,330（AY26-27）。
us-indiana-hpsc-funding-faq: 印第安纳大学科学史与哲学系博士资助说明，资助按学术标准选拔，美国与国际学生同等考虑，每年约录取 3 人。典型为一年奖学金接三到四年助教，名额少，需按系截止日申请。
us-mit-eecs-admissions-letter: 麻省理工学院电子工程与计算机系的录取信说明，国际生可获研究助理或 fellowship 资助，研究助理含月薪与全额学费；录取信所载 RA 月薪为 $4,547（AY24-25 指南）。
us-northwestern-philosophy-financial: 西北大学哲学系称每位录取博士生获五年全额资助，第 1、5 年以奖学金为主，2–4 年以助教职位为主；外部奖学金可能冲减校内资助。
us-northwestern-stats-financial-aid: 西北大学统计与数据科学博士录取者可获五年五个夏季的资助保障，前提是保持学术标准；首年多为大学奖学金，之后以助教与助研为主。
us-pcm-berkeley-physics-admissions: 加州大学伯克利分校物理系的研究生招生页，仅招秋季入学的博士生。2027 年秋季申请需提交 Physics GRE（必需），General GRE 推荐但可选。
us-priv-brown-five-year-guarantee: 布朗大学研究生院的博士资助保障：录取博士生获 5 年资助（人文社科 6 年），含津贴、学费减免和医保，覆盖国内外学生，以学业进展为条件。
us-priv-bu-engineering-ece-funding: 波士顿大学工程学院 ECE 博士资助，首年通常获 Distinguished ECE Fellowship，覆盖学费、基础医疗保险、学生服务费及月津贴，2026/27 学年首年津贴约 $47,741。进展良好时资助可保障五年，之后通常由导师提供助研岗位。
us-priv-caltech-grad-funding-pdf: 加州理工研究生院资助说明：全体博士生获得覆盖全额学费并含津贴的资助，需全日制就读并取得学业进展。
us-priv-cmu-bme-aid: 卡内基梅隆大学生物医学工程博士资助，全日制博士生获全额学费资助及生活津贴，不论经济需求。直接入学的博士资助最长 14 学期（含夏季），需每学期达到课程与科研要求。
us-priv-cmu-dietrich-lcal-funding: 卡内基梅隆大学应用语言学博士项目的资助，录取博士生获四年全额资助，包括全额学费、月津贴、研究与差旅补助和医保，以学业进展及教学、研究工作为条件。
us-priv-cornell-publicpolicy-costs-aid: 康奈尔大学公共政策博士项目的费用与资助。据该系页面称，录取博士生可获六年资助，包括津贴、医保和学费。
us-priv-cornell-sociology-funding: 康奈尔大学社会学系博士资助，资助包通常提供六年支持，覆盖全部学费并提供生活津贴（含暑期）。目前本年度不接收新申请。系页面称，多数外部奖学金面向美国公民，外国申请者应向本国政府或大学寻求资助。
us-priv-duke-12-month-phd-funding: 杜克大学博士资助细则：自 2022–2023 学年起，五年保障期内的博士生获得 12 个月津贴，第 6 年津贴由院系决定。暑期资金来自研究生院、教务长办公室、院系等多个来源，部分需竞争申请或承担服务要求。
us-priv-northwestern-mccormick-financial-aid: 西北大学 McCormick 工学院研究生资助。博士新生获全额资助，包括学费、医保和月度津贴；McCormick 一般不资助硕士生。申请材料提交后自动参与奖助评审。
us-priv-northwestern-tgs-funding-faqs: 西北大学研究生院（TGS）博士资助说明，涵盖学费、津贴、健康服务费及年度医保保费。国际生与本国生标准相同，但担任助教前须通过 TGS 口语英语要求。理工科博士通常至少获五年资助，人文社科为 20 个季度。
us-priv-nyu-global-public-health-fellowship: NYU 全球公共卫生博士项目，录取博士生可获奖学金，或奖学金加助研岗位，资助五年。国际生是否同等享有该资助，需向学院询问。
us-priv-nyu-steinhardt-funding-packages: NYU Steinhardt 全日制博士资助包。Steinhardt Fellowship 含每年津贴、必修课学费减免及学生医保（至第五年），2025–26 年津贴为 $34,883。研究助理岗位同样含津贴、学费减免和医保，但需每周约 20 小时参与导师科研。
us-priv-stanford-gse-doctoral-financing: 斯坦福大学教育学院（GSE）为所有录取博士生提供五年资助包，含学费资助、奖学金津贴，以及助教或助研薪资，覆盖标准就读成本。资助以学业进度及助教或助研工作表现为前提。
us-priv-stanford-polisci-funding: 斯坦福政治学系研究生资助。系页面称，国内外学生都应获得足够支持；标准资助包覆盖全部学费及学年生活费，学业进度达标的博士生可获五年支持。
us-priv-usc-dornsife-cslc-financial-support: USC Dornsife 比较文学与文化研究博士资助，录取即享五年资助，前三年为奖学金，后两年为教学岗位，含学费、医保与月度津贴。具体金额请以学院官网为准。
us-priv-usc-dornsife-history-funding: USC Dornsife 历史系博士资助，录取的博士生享有五年资助，覆盖学费、大部分费用及医疗牙科保险，其中三年为奖学金，两年为助教岗位。最低津贴 41,200 美元（2025–26 学年，学院公布）。
us-priv-usc-dornsife-poir-funding: USC Dornsife 政治学系博士资助，通常获五年全额资助，包括学费减免、津贴及医疗与牙科保险。早期与最后一年多为奖学金，中间年份为助教或助研。2025–26 学年最低津贴 41,200 美元。
us-priv-vanderbilt-igp-stipend-2026-27: 范德堡大学（Vanderbilt）IGP 博士项目资助包（2026–27），覆盖全部大学学费、学生费用及健康、牙科、视力保险，另有 $40,000 津贴与 $2,000 入学搬迁补贴。国际生同样获首年资助，第二年起依导师经费或助教职位。
us-priv-vanderbilt-philosophy-funding: 范德堡大学哲学系博士资助，录取博士生可获六年资助，含年度津贴、全额学费减免和医保，另有旅费与暑期补助。
us-priv-vanderbilt-physics-aid: 范德堡大学物理与天文系博士资助，五年资助含年度津贴（2024–25 约 $34,000–$38,000）、全额学费减免和学院承担的医保保费，通常先担任 1–2 年助教，续签需满足研究与教学进度。
us-priv-wustl-economics-phd: 华盛顿大学圣路易斯分校经济学博士项目，录取博士生可获全额资助五年，含学费减免、医保与年津贴 $35,000，需保持良好学业状态。OPT 延期需咨询国际学生办公室。
us-rochester-urmc-biostat-financial-aid: 罗切斯特大学 URMC 生物统计博士项目，录取即自动获得资助且不论国籍：全额学费奖学金、单人医保与 10 个月补助，2026–27 学年补助为 $29,250。F-1 国际生需先提供经济证明方可签发 I-20。
us-stanford-cs-phd-funding: 斯坦福大学计算机系博士生在学业进展合格的前提下获得资助保障，形式包括助研、助教或奖学金；校级政策自 2020 年起为在读博士提供最多前五年的 12 个月资助。
us-uchicago-social-sciences-funding: 芝加哥大学社会科学学部称，所有入学的在读博士生在整个学程内获得资助，不论国籍，含学费与医保；2026–27 学年年化最低津贴为 $47,741（税前，每月 $3,978.41）。
us-ucla-philosophy-funding: 加州大学洛杉矶分校哲学系博士资助。录取博士生通常先获两年奖学金（含生活费、学费、医疗保险），之后以助教岗位衔接。系里拟对新录取博士生不论国籍与居留身份，保证至少六年有竞争力的资助。
us-uconn-rmme-phd-funding: 康涅狄格大学 RMME 博士生可竞争研究生助教或助研职位，按功绩授予，职位含学费减免与医保。国际生与国内学生同样可申请。
us-uiuc-math-phd-financial-support: 伊利诺伊大学厄巴纳-香槟分校数学系博士资助。新生通常获 50% 助教职位，含全额学费豁免（不区分居民身份）及生活津贴，约 $24,620/学年（2025–26 秋春学期数据）。需先获录取。
us-uiuc-siebel-financial-aid: 伊利诺伊大学厄巴纳-香槟分校 Siebel 学院博士申请者自动参与奖学金评审，录取后以助研、助教或全额奖学金形式资助，均含学费减免；国际生需提交 TOEFL 口语成绩。
us-umd-cs-phd-funding: 马里兰大学帕克分校计算机系称，全部录取的 PhD 学生均获助研或助教保障并持续资助，金额以当年官网为准。
us-umich-presidents-postdoc: 密歇根大学总统博士后项目每年录取少量博后，含薪资与研究经费。2026 轮申请截止 2026 年 11 月 1 日，申请系统 9 月 1 日开放。国籍与身份要求以官网 FAQ 为准。
us-wisconsin-cs-funding: 威斯康星大学麦迪逊分校计算机系博士多数录取者获四年资助，以助教为主，含学费减免和津贴；学院页面称五年保障，以录取信为准。博士只招秋季入学。
us-yale-cs-graduate-faq: 耶鲁大学计算机系研究生招生说明称，PhD 学生通常获全额资助，博士申请不接受 GRE 成绩，语言要求以当年 FAQ 为准。
us-yale-gsas-funding: 耶鲁大学研究生院博士录取者可获全额学费奖学金和 12 个月生活津贴，2026–27 学年最低标准为 $52,046，并享全面医保，通常至少 5 年。
usach-bee-foreigners: 智利圣地亚哥大学面向非居住外国人的博士奖学金（BEE），含学费减免、每年生活维持费和一次性安置补助。申请者须为外国国籍且不在智利居住，本科或研究生平均成绩不低于 5.0（1–7 分制）。
usask-csc-joint-phd: 萨斯喀彻温大学与国家留学基金委（CSC）合作的联合资助项目，含联合培养博士，覆盖博士与博后层次，提供全额资助。仅限中国大陆公民且无他国永居，申请时不超过 35 岁，并需取得 USask 录取信。
usc-dornsife-sociology-funding: 南加州大学 Dornsife 社会学系为新生提供五年资助：前两年为 Dornsife 或研究生院奖学金，后三年为助教。年度津贴 $42,436（2026-2027 学年），含每年 36 units 学费及全年医疗牙科保险。
usth-cotutelle-phd-2026: 越南科学技术大学（USTH）2026 年联合培养博士（co-tutelle）岗位，约 10 个名额，与法国或其他欧洲合作方联合培养。学费只由一方每年支付，申请需先找到法国或其他欧洲合作方导师。
usyd-general-intl-research-scholarships: 悉尼大学面向国际博士生的通用研究奖学金入口，下设多个子项目，资格与金额各不相同。其中 University of Sydney International Scholarship 页面列出每年 $40,109，部分项目要求已持有主要津贴奖学金。
usyd-medicine-health-intl-phd-scholarships: 悉尼大学医学与健康学部的国际博士研究生奖学金列表，汇总多项面向国际生的博士奖学金，各项金额与条件不同，例如每年 $35,950、$40,109 或 $42,754，申请前需逐项看具体条件。
usyd-rtp-international: 悉尼大学面向国际生的研究奖学金（RTP 类），生活津贴 A$42,754/年（2026 年标准），学费减免 100%（最多 14 个研究期）。需另行提交奖学金申请表，属竞争性评选。
ut-careers-phd-page: 特文特大学（UT）博士与职位总入口，页面称博士为有薪工作，入选者可获最长四年的合同，包含研究与教学工作，具体薪资以职位为准。
ut-eemcs-nanoelectronics-vacancies: 特文特大学 EEMCS 学院纳米电子学组招聘页，组内定期有职位，可联系 Wilfred van der Wiel 教授主动申请。博士税前月薪 €2,901（第 1 年）至 €3,707（第 4 年）。
ut-physics-of-fluids-vacancies: 特文特大学流体物理组（Lohse 组）的职位页，列出多组分体系的熔化与溶解、自推进向列液滴等博士岗位。荷兰博士通常为带薪雇员，具体以岗位为准。
utah-graduate-research-fellowship: 犹他大学研究生研究奖学金，全日制博士生均可申请，由院系提名，每院系最多 2 份提案。奖金 $28,500，另含学费福利与可选补贴医保，为一年期、不可续领。
utah-population-health-phd-funding: 犹他大学人口健康科学博士，录取时自动匹配资助，无需单独申请。提供全额学费、GSHIP 医保和研究助理津贴，2026–27 学年兼职 RA 年津贴 $33,280，暑期可增至 $41,600。
utep-eeb-funded-ra-phd: 德州大学埃尔帕索分校（UTEP）环境与进化生物学（EEB）博士项目，提供多个带 RA 岗位，合格申请者可获学费减免。需先邮件联系导师。第三方公告显示 Fall 2027 森林生态岗位约 $26,000–$30,000/年。
utm-postdoctoral-fellowship: UTM 两年期博士后奖学金，每年最多资助 3 名，用于支付博后薪酬（2024 年竞赛公布为 CAD 58,000/年，当期金额需向 UTM 确认）。任何国籍均可申请，导师须为 UTM 系内有终身或准终身教职的教师。
utokyo-mext-general-guideline-oct2027: 东京大学工学系 MEXT 大学推荐一般选拔指南，适用于 2027 年 10 月入学。申请者须经所在大学推荐进入 MEXT 选拔，具体资格以指南为准。
utoronto-connaught-intl: 多伦多大学康诺特国际博士奖学金，面向国际博士生（加拿大公民和永久居民不符合资格），在院系基础资助上加发 $10,000/年，由院系冬季提名。
utoronto-csc-joint: 多伦多大学与 CSC 的联合资助项目，学校覆盖学费，CSC 提供生活津贴、医疗保险和往返机票。仅限中华人民共和国公民，需先获得多伦多大学有条件录取，并在 GradApp 中勾选该项目。
utoronto-factor-inwentash-sw-phd-funding: 多伦多大学 Factor-Inwentash 社会工作学院的博士资助，学校承诺基础资助 $40,000（含学费），国内外博士生均适用。需全日制注册第 1–5 年，并保持学术状况良好。
utoronto-sgs-financial-support: 多伦多大学研究生院博士资助承诺，基础承诺 $40,000（含学费，2025–26），国际生 $40,756（据 MSE 院系页）。需获 SGS 录取并保持学业良好。
utoronto-utm-university-fellowship: 多伦多大学（UTM）化学系的 University of Toronto Fellowship，对国籍或身份无限制，可作为学费奖学金或主要奖学金的补充，通常需承担约 200 小时助教工作，单份价值通常不少于 $4000。按录取情况发放，无需单独申请。
uts-csc-phd: 悉尼科技大学（UTS）与 CSC 合作的博士奖学金，UTS 免学费，CSC 提供生活津贴、签证费与往返机票。面向中国大陆公民或永久居民，需 UTS 院系提名，并承诺学成回国。
uts-international-research-scholarship: 悉尼科技大学国际研究生研究奖学金仅覆盖博士学费，最长约 3.5 年，不含生活津贴与 OSHC 保险。申请人需为海外学生，购买 OSHC 并在 UTS 研究重点领域全日制入学。
uts-irtp-scholarship: 悉尼科技大学国际研究训练计划奖学金（IRTP）学费全免，并含 OSHC 保险与免税生活津贴，标注为 $40,500/年，博士最长 3.5 年。
uts-research-degree-closing-dates: 悉尼科技大学（UTS）研究学位奖学金国际轮次。申请 PhD 或 Master's by Research 并寻求竞争性奖学金者，需在截止日前完成申请，页面建议提前约六周准备。
uts-urban-planning-phd: 悉尼科技大学的城市规划博士（thesis 型）项目，为澳洲城市规划博士。可申请政府资助的名额有限，申请时需同时申请奖学金。
utt-csc: 特鲁瓦理工大学（UTT）与中国国家留学基金委（CSC）合作的博士资助项目，面向中国候选人，须通过 UTT/INSA 课题选拔。页面列有博士课题与选拔流程。
uu-ebc-evol-ecol-genetics-phd-2026: 乌普萨拉大学生态与遗传系的进化与生态遗传学博士岗位，偏定量遗传、群体基因组与实验进化，全职 4 年，按瑞典大学博士工资表聘用。需硕士学位，申请需在 uu.varbi.com 提交。
uva-ai-governance-phd: 阿姆斯特丹大学法学院的四年期带薪博士岗，研究方向为 AI 治理，偏法学与社会科学背景。月薪税前 €3,204–€4,051，为带薪雇员合同，首期 12 个月后按评估延长。
uva-phd-alzheimer-synapses-2026: 阿姆斯特丹大学神经科学方向的 4 年全职雇员博士岗位，研究阿尔茨海默病相关的突触修饰。为带薪岗位，月薪€3,204–€4,051，计划 2027 年 1 月入职，要求神经科学或相关方向硕士。
uva-phd-vacancies-page: 阿姆斯特丹大学（UvA）博士岗位总入口，职位在 werkenbij.uva.nl 发布，多为带薪雇员合同，每个职位的截止日期各不相同，以具体职位为准。
uvm-funding-your-graduate-degree: 佛蒙特大学（UVM）研究生院的资助说明。助教、助研与奖学金面向国内外全日制博士生开放，通常提供学费支持，具体分配由院系决定。页面标注 2026–2027 学年最低津贴为 9 个月 $25,781、12 个月 $34,375。
uw-biostat-funding-guarantee: 华盛顿大学生物统计系博士项目。系里称博士生最长 5 年有 RA/TA 形式的资助保障，博士生不缴学费，资助以研究助理和助教岗位的形式提供。
uw-communication-phd-assistantship: 华盛顿大学传播学博士助教/助研资助，国际生与美国申请者在助教与助研岗位上同等考虑，无需单独申请。入学时获得助教或助研的通常享有四年资助。非英语母语申请者需证明英语能力才能被聘为助教。
uw-madison-ipib-biochemistry-funding: 威斯康辛大学麦迪逊分校 IPiB 生物化学博士资助，2026–27 年津贴 $38,500/年。学业进展良好的在读博士生享有津贴保障，美国与国际学生同等适用，含学费减免与医保选项。
uw-madison-sociology-dept-funding: 威斯康星大学麦迪逊分校社会学系博士，助教、研究助理等岗位按学术潜力与岗位匹配分配，不看经济需求。大学支付学费并承担约 90% 医保保费，另付津贴。
uwa-hdr-scholarships: 西澳大学 HDR 奖学金，RTP 生活津贴为 $39,253/年（2027 年），名额有限，国际与国内学生按竞争择优。入学申请即奖学金申请，须满足课程入学与英语要求。
uzh-dast-jobs: 苏黎世大学 DaST 组（数据管理的理论与系统）招收博士与博士后，博士生年薪约 7.5 万瑞士法郎（另加 15% 社保）。页面明确不接受应用 ML/AI 方向的申请，需向 Dan Olteanu 教授发邮件联系。
uzh-doctoral-programs: 苏黎世大学按学院列出的全部博士项目。结构化项目统一招生，其余多需直接联系导师。通常需认可大学的硕士学位，多数项目需先获导师与学院录取。
uzh-prospective-phds-postdocs: 苏黎世大学 SPiNS 组当前招收 2 名博士生和 1 名博士后，理想入学时间为 2027 年 1 月。页面称提供有竞争力的津贴与养老金，首年博士生可申请补贴住房；页面明确不适合应用 ML、LLM 等方向的申请者。
vanderbilt-english-phd-aid: 范德堡大学英语系为所有录取博士生提供全额学费、基础津贴每年$36,500及医保，入学前另有$2,000一次性津贴。需保持学业进展方可逐年续期。
vanderbilt-igp-international: 范德比尔特大学（Vanderbilt）IGP 国际生，第一年获全额学费、医保及 $40,000 津贴（2026–27）。第二年由 BRET 办公室资助，之后由导师通过机构支持、项目经费或助教岗位资助。
vanderbilt-sociology-phd-aid: 范德堡大学社会学系为录取博士生提供五年资助，包括9个月助教或助研津贴、12个月免服务津贴、全额学费减免及学生医保。免服务津贴约$23,918/年。
vib-kuleuven-cnl-intl-phd-2026-2027: VIB与鲁汶大学（KU Leuven）联合的神经科学中心（CNL）国际博士招生，共4个岗位，计划2027年5至9月入学。需硕士学位（或在读硕士），要求成绩cum laude，薪资以招聘页为准。
vu-hdr-scholarship-guide: 维多利亚大学（墨尔本）HDR 奖学金指南，收录 2026 年第 1 研究期入学的 RTP 博士奖学金，国内外学生均可申请，金额标注为 2025 年的 $35,006/年。申请时需提名已发布的研究焦点大纲（Research Focus Outline）。
vu-hdr-scholarship-guide-2027: 维多利亚大学（VU）2027 年第 1 研究期 HDR 奖学金指南，适用于国内外 RTP 博士与研究硕士津贴。指南标注的 RTPSS 金额为每年 A$35,707，数值为 2026 年标准。
vu-phd-info-page: 阿姆斯特丹自由大学（VU）博士招生信息页，说明雇员博士与奖学金、自费等不同入学途径。雇员博士为带薪合同，需通过 workingat.vu.nl 投递具体岗位，硕士或同等学历才能进入博士通道。
vuw-csc-scholarship-scheme: 惠灵顿维多利亚大学（VUW）与国家留学基金委（CSC）合作的博士项目，面向中国学生。学费最长 48 个月由维大提供，生活费、医保、往返机票和签证费按 CSC 标准发放。需先获维大博士录取，并同时申请 CSC。
vuw-wellington-doctoral-scholarship: 惠灵顿维多利亚大学博士奖学金，面向新西兰与国际学生，覆盖所有学科，按学术成绩择优。津贴每年 $32,000（最长 3 年）加学费，需计划全日制攻读博士并提交研究计划。
waikato-csc-phd: 怀卡托大学（新西兰）与 CSC 合作的博士奖学金，学校每年约支持 20 名 CSC 博士生，须为中华人民共和国公民。需获无条件录取（CSC 不接受有条件录取，含英语条件），并先取得导师、提交 CSC 意向表。
waikato-csc-phd-partnership: 新西兰怀卡托大学与 CSC 合作的博士奖学金，须为中华人民共和国公民，需先找到怀卡托导师并获得正式录取。学校负担学费，CSC 提供生活津贴，须分别在怀卡托和 CSC 两边申请。
warwick-chancellors-intl-scholarship: 华威大学 Chancellor's International Scholarship，是面向海外学费身份国际博士生的全额奖学金，覆盖学费及生活津贴。须申请并录取 2027 年 10 月入学的华威博士课程，奖学金不可延期。
warwick-csc-2027: 华威大学 CSC 联合博士奖学金（2027 轮），2027 年秋季入学，CSC 类别最多 30 个名额。面向持中国护照且常居中国或在海外学习者，香港、台湾居民及海外工作者不符合。华威负责学费并将津贴补足至 UKRI 标准，CSC 提供津贴（最长 4 年）与中英往返机票。
warwick-gresearch-phd-scholarship: 华威大学统计系 G-Research 博士奖学金，资助学费、生活津贴及多项津贴，偏好机器学习与 AI 建模方向。页面注明学费身份为 Home，生活津贴 £21,830/年，固定 4 年。
warwick-maths-studentships: 英国华威大学数学系博士奖学金，覆盖学费并提供 4 年生活费，按先到先得方式审核。
warwick-pais-studentship: 华威大学政治与国际研究系（PAIS）的博士奖学金，面向英国、欧盟及海外学生。部分奖学金为学费加生活津贴，其余仅覆盖学费。申请需相关学科硕士 Merit 或 2:1 以上，并有研究计划和 PAIS 导师支持。
warwick-stats-cdt-funding: 华威大学统计学 CDT 博士资助说明，生活费按 UKRI 标准 £21,300/年（2026/27 入学）加 RTSG £5,000。名额分 Home 与 Overseas，国际生名额有限，需先获得学院录取。
washu-complit-phd-funding: 华盛顿大学圣路易斯分校比较文学博士项目，录取后至少 5 年提供全额学费减免与生活津贴，需学业良好。另设面向非美国申请者的 International Writers Track。
waterloo-ece-funding: 滑铁卢大学电气与计算机工程系为研究型博士提供最低资助保障，博士 4 年、直博 5 年，由研究生研究助学金、奖学金和助教等组合构成。国际博士生可另获 IDSA 奖。
waterloo-idsa: 滑铁卢大学国际博士生奖学金（IDSA），自动提供给全日制注册的国际博士生，无需单独申请。约 15,420 加元/年，为期 4 年，价值随多种因素变化。
waterloo-international-doctoral-funding: 滑铁卢大学国际博士生资助页，适用于环境学院下的地理、规划、社会与生态可持续、可持续管理四个项目。录取后自动获 IDSA，多数学生约 CAD 5,100/学期。
waterloo-minimum-funding: 滑铁卢大学博士生最低资助保障，全日制博士生在规定学制内且成绩合格即可获得，自 2026 年 5 月 1 日起为 CAD 29,145/年（此前为 CAD 28,351/年）。IDSA 另计，不属于该保障。
waterloo-pharmacy-phd-funding: 滑铁卢大学药学院硕博资助，学院为国际博士设定的最低总资助每年 CAD 44,560（含 IDSA，2026/5/1–2027/4/30）。需全日制在读 MSc/PhD in Pharmacy，且须无其他资助来源。
wehi-international-phd-scholar: WEHI 国际博士奖学金，面向医学生物（Medical Biology）博士，全额资助。生活津贴按 Melbourne Research Scholarship 标准，另有 WEHI 补充金，总额 $43,100/年。学位须非澳洲大学获得。
wehi-phd-scholarship: WEHI 博士奖学金总页，须为非澳洲公民、非永居或新西兰公民，上一学位不得取自澳大利亚大学。生活津贴最低 A$42,137/年（自 2024 年 6 月起），另有补充金覆盖整个学程。
weizmann-feinberg: 以色列魏茨曼科学院（Weizmann School of Science，原 Feinberg Graduate School）的博士与博后项目。页面称不收学费，并为所有学生和博士后研究员提供按月生活津贴，授课语言为英语。
weizmann-merbl-lab-recruiting: 以色列魏茨曼研究所 Merbl 课题组长期招收博士生与博士后，欢迎计算生物学、免疫学、生物化学、细胞生物学或生物信息学背景。请将简历与求职信发至 PI 邮箱，资金与起始时间需直接咨询 PI。
wellcome-early-career-awards: Wellcome 早期独立研究经费（Early-Career Awards），面向已取得博士学位的研究者，不限国籍。主申请人须在英国或符合条件的 LMIC 承担机构任职，中国大陆机构不在范围内，经费也不可转入中国大陆。
wenner-gren-dissertation: Wenner-Gren 基金会的博士论文田野研究资助，面向人类学方向，所有国籍的博士生均可申请，最高 $20,000。需与导师联合申请。
western-fims-phd-tuition-finances: Western 大学 FIMS 博士学费与资助说明。全日制且学业良好的博士生享有大学博士资助保障；达到学院最低资助平均标准的国际生可获 WGRS 补充，使学费接近本地标准。
western-schulich-epibio-funding: 西安大略大学（Western）Schulich 医学院流行病学与生物统计学博士资助，博士生最低保障每年 $25,000（含学费），国内与国际生同额。TA/RA 及其他院系职位不计入保障。
western-sydney-csc-phd: 西悉尼大学 CSC 研究奖学金，学校免学费最长 48 个月，CSC 提供生活费、医保和机票。仅限中国大陆公民及永久居民，需先获得导师支持信并取得有条件录取。
white-rose-esrc-dtp-2027: White Rose ESRC 博士培训伙伴 2027/28 奖学金，由合作院校提供全额资助。国际生名额不超过约 30%，需先联系合作院校导师。津贴 £21,805/年（2026/27 标准，随 UKRI 调整）。
wisc-polsci-phd-guide: 威斯康星大学麦迪逊分校政治学博士，系里承诺所有录取博士生享有五年资助（以学业进展达标为前提），包括全额学费减免、可观津贴、夏季资助和健康保险。
wpi-aimr-open-positions: 东北大学 WPI-AIMR 英文招聘，列出安全卫生管理办公室技术职员（1–3 年任期）及 Mehrdad Elyasi 实验室的特任助理教授（博士后，初任一年，最长可延至四年）等岗位。
wuerzburg-int-phd-completion-grant: 维尔茨堡大学面向外国籍博士生的完成资助（DAAD 资助），每月 €1,050，最多 4 个月。仅限已在维尔茨堡全日制攻读博士、处于最后阶段且有经济需要者，不是入学资助。
wur-agd-2026-call-pdf: 瓦赫宁根大学与中国农业大学合办的中荷农业绿色发展（AGD）联合博士项目，获 CSC 批准 2026–2028 年分三轮招生。限中国国籍、35 岁以下，需先与 AGD 项目提案对接。
wur-agd-phd-programme: 瓦赫宁根大学与中国农业大学的 AGD 联合博士项目，由国家留学基金委资助，面向中国国籍、35 岁以下、持指定四所中国高校硕士学位者。CSC 生活津贴约 €2,000/月（居留期间）并含往返机票，另有 €1,000/月实验台费。
wur-coastal-peat-flooding-phd: 瓦赫宁根大学（WUR）Re-Flex Zeeland 项目下的博士岗位，研究沿海泥炭地形成与洪水的数值建模。税前月薪 €3,204–€4,051（第 1 年至第 4 年），需在瓦赫宁根与 Vlissingen 两地工作。
wur-phd-jobs: 瓦赫宁根大学与研究中心的博士与工程博士职位统一入口，列出 18 个职位，涉及儿童饮食行为、气候政策影响评估、野火天气风险、PFAS 去除等方向。博士职位为带薪雇员合同。
wur-phd-programme: 瓦赫宁根大学与研究中心（WUR）的博士项目入口页，列出 18 个开放博士职位并链接各职位页。国际候选人资格需在各职位页查看。
wustl-dbbs-financial-support: WashU DBBS 生物医学博士资助，2026–27 学年津贴 $41,000/年，另含全额学费与健康等费用。录取即获资助，学业进展正常时承诺持续资助。
wustl-mstp-international: 圣路易斯华盛顿大学 MD/PhD（MSTP）项目。国际生与美国公民、永久居民享有同等录取标准与资助（含 F-1 签证学生），最新页面津贴约 $41,000/年。
xjtlu-doctoral-prospectus-2026: 西交利物浦大学博士奖学金，全额档每月 RMB 5,000、免学费三年，需担任助教或助研；另有部分资助选项，多数对所有国籍开放。博士申请全年接收，需先找到 XJTLU 导师。
xjtlu-xjtu-uol-joint-doctorate: 西交利物浦大学、西安交通大学与利物浦大学联合培养博士，学位由利物浦大学授予，通常 3 至 4 年全日制。须先获拟导师同意并选择对应项目代码，项目按导师代码全年接受申请。
yadias-doctoral-fellowship-lu: 卢森堡大学高等研究院的 YADIAS 博士研究员岗位，为期 48 个月的全职带薪雇员博士岗，本轮 15 个名额，开放所有学科。须已获认可的硕士学位且尚未取得博士学位，任何国籍均可申请。
yale-bbs-financial-support: 耶鲁大学生物医学博士（BBS）资助包，2026–27 基础津贴 $53,629，学费全额覆盖并含医保。页面称该资助不论国籍向所有 BBS 学生提供。
yale-ceas-postdoctoral-associates: 耶鲁大学东亚研究理事会（CEAS）的博后 Associates 项目，面向中国、日本、韩国的单区域或跨区域东亚研究。入选者可在耶鲁两年内修改论文成书、开展研究，并教授本科高阶研讨课。
yale-fds-postdoc-2026: 耶鲁大学数据科学研究所（FDS）博后职位，为期 2–3 年的独立研究，薪资岗位。申请需在 cover letter 中列出拟合作的耶鲁导师（至少一位为 FDS 成员），并提交 CV、研究计划及推荐信，仅通过官方门户提交。
yale-gsas-architecture-phd: 耶鲁 GSAS 建筑博士，设历史与理论、生态系统两个方向。页面称博士生通常全额资助，含 12 个月生活津贴、学费全额覆盖的奖学金及学生医保。
yale-political-science-funding: 耶鲁大学政治学系的博士资助：系官网称录取的博士生均可获得 5 年完整资助，可能延至第 6 年。金额以耶鲁研究生院公布的数据为准。
ynu-csc-joint-postdoc: 横滨国立大学 CSC 联合奖学金（访问学者与博士后），面向中国籍学者，每月 170,000 日元生活津贴，另含往返经济舱机票，名额 5 个。需已获博士学位、抵日时不超过 3 年、40 岁以下，并先联系 YNU 导师。
yonsei-frontier-lab-fellowship: 延世大学前沿实验室（Yonsei Frontier Lab）博士后研究员项目，面向非韩国籍学者，每年 2 月和 8 月各一轮。最低博士后年度津贴 5,200 万韩元。申请需新村/国际校区全职教授推荐，并需先确认目标课题组。
york-csc-scholarships: 约克大学 CSC 奖学金，面向中国籍博士申请者，资助含全额学费（通常三年）、生活费补助、一次回国机票与英国签证费。需先获 York 博士录取并经系推荐后再申请 CSC。
york-fgs-funding: 约克大学研究生资助，正文列出国内生与国际生的资助金额表，并含国际生学费减免（International Tuition Offset）等项目。资助以全日制注册和学业进展为前提。
york-history-of-art-ahrc-dla-2027: 约克大学艺术史系 AHRC 博士地标奖学金，面向 2027/28 学年入学的博士生，共 6 个名额。资助含生活补助（£21,805/年，2026/27 费率）与英国费率学费，国际生需自付学费差额。
