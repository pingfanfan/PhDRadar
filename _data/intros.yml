us-priv-brown-five-year-guarantee: 布朗大学研究生院的博士资助保障：录取博士生获 5 年资助（人文社科 6 年），含津贴、学费减免和医保，覆盖国内外学生，以学业进展为条件。
us-priv-bu-engineering-ece-funding: 波士顿大学工程学院 ECE 博士资助，首年通常获 Distinguished ECE Fellowship，覆盖学费、基础医疗保险、学生服务费及月津贴，2026/27 学年首年津贴约 $47,741。进展良好时资助可保障五年，之后通常由导师提供助研岗位。
us-priv-caltech-grad-funding-pdf: 加州理工研究生院资助说明：全体博士生获得覆盖全额学费并含津贴的资助，需全日制就读并取得学业进展。
us-priv-cmu-bme-aid: 卡内基梅隆大学生物医学工程博士资助，全日制博士生获全额学费资助及生活津贴，不论经济需求。直接入学的博士资助最长 14 学期（含夏季），需每学期达到课程与科研要求。
us-priv-cmu-dietrich-lcal-funding: 卡内基梅隆大学应用语言学博士项目的资助，录取博士生获四年全额资助，包括全额学费、月津贴、研究与差旅补助和医保，以学业进展及教学、研究工作为条件。
us-priv-cornell-publicpolicy-costs-aid: 康奈尔大学公共政策博士项目的费用与资助。据该系页面称，录取博士生可获六年资助，包括津贴、医保和学费。
us-priv-cornell-sociology-funding: 康奈尔大学社会学系博士资助，资助包通常提供六年支持，覆盖全部学费并提供生活津贴（含暑期）。目前本年度不接收新申请。系页面称，多数外部奖学金面向美国公民，外国申请者应向本国政府或大学寻求资助。
us-priv-duke-12-month-phd-funding: 杜克大学博士资助细则：自 2022–2023 学年起，五年保障期内的博士生获得 12 个月津贴，第 6 年津贴由院系决定。暑期资金来自研究生院、教务长办公室、院系等多个来源，部分需竞争申请或承担服务要求。
us-priv-northwestern-mccormick-financial-aid: 西北大学 McCormick 工学院研究生资助。博士新生获全额资助，包括学费、医保和月度津贴；McCormick 一般不资助硕士生。申请材料提交后自动参与奖助评审。
us-priv-northwestern-tgs-funding-faqs: 西北大学研究生院（TGS）博士资助说明，涵盖学费、津贴、健康服务费及年度医保保费。国际生与本国生标准相同，但担任助教前须通过 TGS 口语英语要求。理工科博士通常至少获五年资助，人文社科为 20 个季度。
us-priv-nyu-global-public-health-fellowship: NYU 全球公共卫生博士项目，录取博士生可获奖学金，或奖学金加助研岗位，资助五年。国际生是否同等享有该资助，需向学院询问。
us-priv-nyu-steinhardt-funding-packages: NYU Steinhardt 全日制博士资助包。Steinhardt Fellowship 含每年津贴、必修课学费减免及学生医保（至第五年），2025–26 年津贴为 $34,883。研究助理岗位同样含津贴、学费减免和医保，但需每周约 20 小时参与导师科研。
us-priv-stanford-gse-doctoral-financing: 斯坦福大学教育学院（GSE）为所有录取博士生提供五年资助包，含学费资助、奖学金津贴，以及助教或助研薪资，覆盖标准就读成本。资助以学业进度及助教或助研工作表现为前提。
us-priv-stanford-polisci-funding: 斯坦福政治学系研究生资助。系页面称，国内外学生都应获得足够支持；标准资助包覆盖全部学费及学年生活费，学业进度达标的博士生可获五年支持。
us-priv-usc-dornsife-cslc-financial-support: USC Dornsife 比较文学与文化研究博士资助，录取即享五年资助，前三年为奖学金，后两年为教学岗位，含学费、医保与月度津贴。具体金额请以学院官网为准。
us-priv-usc-dornsife-history-funding: USC Dornsife 历史系博士资助，录取的博士生享有五年资助，覆盖学费、大部分费用及医疗牙科保险，其中三年为奖学金，两年为助教岗位。最低津贴 41,200 美元（2025–26 学年，学院公布）。
us-priv-usc-dornsife-poir-funding: USC Dornsife 政治学系博士资助，通常获五年全额资助，包括学费减免、津贴及医疗与牙科保险。早期与最后一年多为奖学金，中间年份为助教或助研。2025–26 学年最低津贴 41,200 美元。
us-priv-vanderbilt-igp-stipend-2026-27: 范德堡大学（Vanderbilt）IGP 博士项目资助包（2026–27），覆盖全部大学学费、学生费用及健康、牙科、视力保险，另有 $40,000 津贴与 $2,000 入学搬迁补贴。国际生同样获首年资助，第二年起依导师经费或助教职位。
us-priv-vanderbilt-philosophy-funding: 范德堡大学哲学系博士资助，录取博士生可获六年资助，含年度津贴、全额学费减免和医保，另有旅费与暑期补助。
us-priv-vanderbilt-physics-aid: 范德堡大学物理与天文系博士资助，五年资助含年度津贴（2024–25 约 $34,000–$38,000）、全额学费减免和学院承担的医保保费，通常先担任 1–2 年助教，续签需满足研究与教学进度。
us-priv-wustl-economics-phd: 华盛顿大学圣路易斯分校经济学博士项目，录取博士生可获全额资助五年，含学费减免、医保与年津贴 $35,000，需保持良好学业状态。OPT 延期需咨询国际学生办公室。
us-rochester-urmc-biostat-financial-aid: 罗切斯特大学 URMC 生物统计博士项目，录取即自动获得资助且不论国籍：全额学费奖学金、单人医保与 10 个月补助，2026–27 学年补助为 $29,250。F-1 国际生需先提供经济证明方可签发 I-20。
us-stanford-cs-phd-funding: 斯坦福大学计算机系博士生在学业进展合格的前提下获得资助保障，形式包括助研、助教或奖学金；校级政策自 2020 年起为在读博士提供最多前五年的 12 个月资助。
us-uchicago-social-sciences-funding: 芝加哥大学社会科学学部称，所有入学的在读博士生在整个学程内获得资助，不论国籍，含学费与医保；2026–27 学年年化最低津贴为 $47,741（税前，每月 $3,978.41）。
us-ucla-philosophy-funding: 加州大学洛杉矶分校哲学系博士资助。录取博士生通常先获两年奖学金（含生活费、学费、医疗保险），之后以助教岗位衔接。系里拟对新录取博士生不论国籍与居留身份，保证至少六年有竞争力的资助。
us-uconn-rmme-phd-funding: 康涅狄格大学 RMME 博士生可竞争研究生助教或助研职位，按功绩授予，职位含学费减免与医保。国际生与国内学生同样可申请。
us-uiuc-math-phd-financial-support: 伊利诺伊大学厄巴纳-香槟分校数学系博士资助。新生通常获 50% 助教职位，含全额学费豁免（不区分居民身份）及生活津贴，约 $24,620/学年（2025–26 秋春学期数据）。需先获录取。
us-uiuc-siebel-financial-aid: 伊利诺伊大学厄巴纳-香槟分校 Siebel 学院博士申请者自动参与奖学金评审，录取后以助研、助教或全额奖学金形式资助，均含学费减免；国际生需提交 TOEFL 口语成绩。
us-umd-cs-phd-funding: 马里兰大学帕克分校计算机系称，全部录取的 PhD 学生均获助研或助教保障并持续资助，金额以当年官网为准。
us-umich-presidents-postdoc: 密歇根大学总统博士后项目每年录取少量博后，含薪资与研究经费。2026 轮申请截止 2026 年 11 月 1 日，申请系统 9 月 1 日开放。国籍与身份要求以官网 FAQ 为准。
us-wisconsin-cs-funding: 威斯康星大学麦迪逊分校计算机系博士多数录取者获四年资助，以助教为主，含学费减免和津贴；学院页面称五年保障，以录取信为准。博士只招秋季入学。
us-yale-cs-graduate-faq: 耶鲁大学计算机系研究生招生说明称，PhD 学生通常获全额资助，博士申请不接受 GRE 成绩，语言要求以当年 FAQ 为准。
us-yale-gsas-funding: 耶鲁大学研究生院博士录取者可获全额学费奖学金和 12 个月生活津贴，2026–27 学年最低标准为 $52,046，并享全面医保，通常至少 5 年。
usach-bee-foreigners: 智利圣地亚哥大学面向非居住外国人的博士奖学金（BEE），含学费减免、每年生活维持费和一次性安置补助。申请者须为外国国籍且不在智利居住，本科或研究生平均成绩不低于 5.0（1–7 分制）。
usask-csc-joint-phd: 萨斯喀彻温大学与国家留学基金委（CSC）合作的联合资助项目，含联合培养博士，覆盖博士与博后层次，提供全额资助。仅限中国大陆公民且无他国永居，申请时不超过 35 岁，并需取得 USask 录取信。
usc-dornsife-sociology-funding: 南加州大学 Dornsife 社会学系为新生提供五年资助：前两年为 Dornsife 或研究生院奖学金，后三年为助教。年度津贴 $42,436（2026-2027 学年），含每年 36 units 学费及全年医疗牙科保险。
usth-cotutelle-phd-2026: 越南科学技术大学（USTH）2026 年联合培养博士（co-tutelle）岗位，约 10 个名额，与法国或其他欧洲合作方联合培养。学费只由一方每年支付，申请需先找到法国或其他欧洲合作方导师。
usyd-general-intl-research-scholarships: 悉尼大学面向国际博士生的通用研究奖学金入口，下设多个子项目，资格与金额各不相同。其中 University of Sydney International Scholarship 页面列出每年 $40,109，部分项目要求已持有主要津贴奖学金。
usyd-medicine-health-intl-phd-scholarships: 悉尼大学医学与健康学部的国际博士研究生奖学金列表，汇总多项面向国际生的博士奖学金，各项金额与条件不同，例如每年 $35,950、$40,109 或 $42,754，申请前需逐项看具体条件。
usyd-rtp-international: 悉尼大学面向国际生的研究奖学金（RTP 类），生活津贴 A$42,754/年（2026 年标准），学费减免 100%（最多 14 个研究期）。需另行提交奖学金申请表，属竞争性评选。
ut-careers-phd-page: 特文特大学（UT）博士与职位总入口，页面称博士为有薪工作，入选者可获最长四年的合同，包含研究与教学工作，具体薪资以职位为准。
ut-eemcs-nanoelectronics-vacancies: 特文特大学 EEMCS 学院纳米电子学组招聘页，组内定期有职位，可联系 Wilfred van der Wiel 教授主动申请。博士税前月薪 €2,901（第 1 年）至 €3,707（第 4 年）。
ut-physics-of-fluids-vacancies: 特文特大学流体物理组（Lohse 组）的职位页，列出多组分体系的熔化与溶解、自推进向列液滴等博士岗位。荷兰博士通常为带薪雇员，具体以岗位为准。
utah-graduate-research-fellowship: 犹他大学研究生研究奖学金，全日制博士生均可申请，由院系提名，每院系最多 2 份提案。奖金 $28,500，另含学费福利与可选补贴医保，为一年期、不可续领。
utah-population-health-phd-funding: 犹他大学人口健康科学博士，录取时自动匹配资助，无需单独申请。提供全额学费、GSHIP 医保和研究助理津贴，2026–27 学年兼职 RA 年津贴 $33,280，暑期可增至 $41,600。
utep-eeb-funded-ra-phd: 德州大学埃尔帕索分校（UTEP）环境与进化生物学（EEB）博士项目，提供多个带 RA 岗位，合格申请者可获学费减免。需先邮件联系导师。第三方公告显示 Fall 2027 森林生态岗位约 $26,000–$30,000/年。
utm-postdoctoral-fellowship: UTM 两年期博士后奖学金，每年最多资助 3 名，用于支付博后薪酬（2024 年竞赛公布为 CAD 58,000/年，当期金额需向 UTM 确认）。任何国籍均可申请，导师须为 UTM 系内有终身或准终身教职的教师。
utokyo-mext-general-guideline-oct2027: 东京大学工学系 MEXT 大学推荐一般选拔指南，适用于 2027 年 10 月入学。申请者须经所在大学推荐进入 MEXT 选拔，具体资格以指南为准。
utoronto-connaught-intl: 多伦多大学康诺特国际博士奖学金，面向国际博士生（加拿大公民和永久居民不符合资格），在院系基础资助上加发 $10,000/年，由院系冬季提名。
utoronto-csc-joint: 多伦多大学与 CSC 的联合资助项目，学校覆盖学费，CSC 提供生活津贴、医疗保险和往返机票。仅限中华人民共和国公民，需先获得多伦多大学有条件录取，并在 GradApp 中勾选该项目。
utoronto-factor-inwentash-sw-phd-funding: 多伦多大学 Factor-Inwentash 社会工作学院的博士资助，学校承诺基础资助 $40,000（含学费），国内外博士生均适用。需全日制注册第 1–5 年，并保持学术状况良好。
utoronto-sgs-financial-support: 多伦多大学研究生院博士资助承诺，基础承诺 $40,000（含学费，2025–26），国际生 $40,756（据 MSE 院系页）。需获 SGS 录取并保持学业良好。
utoronto-utm-university-fellowship: 多伦多大学（UTM）化学系的 University of Toronto Fellowship，对国籍或身份无限制，可作为学费奖学金或主要奖学金的补充，通常需承担约 200 小时助教工作，单份价值通常不少于 $4000。按录取情况发放，无需单独申请。
uts-csc-phd: 悉尼科技大学（UTS）与 CSC 合作的博士奖学金，UTS 免学费，CSC 提供生活津贴、签证费与往返机票。面向中国大陆公民或永久居民，需 UTS 院系提名，并承诺学成回国。
uts-international-research-scholarship: 悉尼科技大学国际研究生研究奖学金仅覆盖博士学费，最长约 3.5 年，不含生活津贴与 OSHC 保险。申请人需为海外学生，购买 OSHC 并在 UTS 研究重点领域全日制入学。
uts-irtp-scholarship: 悉尼科技大学国际研究训练计划奖学金（IRTP）学费全免，并含 OSHC 保险与免税生活津贴，标注为 $40,500/年，博士最长 3.5 年。
uts-research-degree-closing-dates: 悉尼科技大学（UTS）研究学位奖学金国际轮次。申请 PhD 或 Master's by Research 并寻求竞争性奖学金者，需在截止日前完成申请，页面建议提前约六周准备。
uts-urban-planning-phd: 悉尼科技大学的城市规划博士（thesis 型）项目，为澳洲城市规划博士。可申请政府资助的名额有限，申请时需同时申请奖学金。
utt-csc: 特鲁瓦理工大学（UTT）与中国国家留学基金委（CSC）合作的博士资助项目，面向中国候选人，须通过 UTT/INSA 课题选拔。页面列有博士课题与选拔流程。
uu-ebc-evol-ecol-genetics-phd-2026: 乌普萨拉大学生态与遗传系的进化与生态遗传学博士岗位，偏定量遗传、群体基因组与实验进化，全职 4 年，按瑞典大学博士工资表聘用。需硕士学位，申请需在 uu.varbi.com 提交。
uva-ai-governance-phd: 阿姆斯特丹大学法学院的四年期带薪博士岗，研究方向为 AI 治理，偏法学与社会科学背景。月薪税前 €3,204–€4,051，为带薪雇员合同，首期 12 个月后按评估延长。
uva-phd-alzheimer-synapses-2026: 阿姆斯特丹大学神经科学方向的 4 年全职雇员博士岗位，研究阿尔茨海默病相关的突触修饰。为带薪岗位，月薪€3,204–€4,051，计划 2027 年 1 月入职，要求神经科学或相关方向硕士。
uva-phd-vacancies-page: 阿姆斯特丹大学（UvA）博士岗位总入口，职位在 werkenbij.uva.nl 发布，多为带薪雇员合同，每个职位的截止日期各不相同，以具体职位为准。
uvm-funding-your-graduate-degree: 佛蒙特大学（UVM）研究生院的资助说明。助教、助研与奖学金面向国内外全日制博士生开放，通常提供学费支持，具体分配由院系决定。页面标注 2026–2027 学年最低津贴为 9 个月 $25,781、12 个月 $34,375。
uw-biostat-funding-guarantee: 华盛顿大学生物统计系博士项目。系里称博士生最长 5 年有 RA/TA 形式的资助保障，博士生不缴学费，资助以研究助理和助教岗位的形式提供。
uw-communication-phd-assistantship: 华盛顿大学传播学博士助教/助研资助，国际生与美国申请者在助教与助研岗位上同等考虑，无需单独申请。入学时获得助教或助研的通常享有四年资助。非英语母语申请者需证明英语能力才能被聘为助教。
uw-madison-ipib-biochemistry-funding: 威斯康辛大学麦迪逊分校 IPiB 生物化学博士资助，2026–27 年津贴 $38,500/年。学业进展良好的在读博士生享有津贴保障，美国与国际学生同等适用，含学费减免与医保选项。
uw-madison-sociology-dept-funding: 威斯康星大学麦迪逊分校社会学系博士，助教、研究助理等岗位按学术潜力与岗位匹配分配，不看经济需求。大学支付学费并承担约 90% 医保保费，另付津贴。
uwa-hdr-scholarships: 西澳大学 HDR 奖学金，RTP 生活津贴为 $39,253/年（2027 年），名额有限，国际与国内学生按竞争择优。入学申请即奖学金申请，须满足课程入学与英语要求。
uzh-dast-jobs: 苏黎世大学 DaST 组（数据管理的理论与系统）招收博士与博士后，博士生年薪约 7.5 万瑞士法郎（另加 15% 社保）。页面明确不接受应用 ML/AI 方向的申请，需向 Dan Olteanu 教授发邮件联系。
uzh-doctoral-programs: 苏黎世大学按学院列出的全部博士项目。结构化项目统一招生，其余多需直接联系导师。通常需认可大学的硕士学位，多数项目需先获导师与学院录取。
uzh-prospective-phds-postdocs: 苏黎世大学 SPiNS 组当前招收 2 名博士生和 1 名博士后，理想入学时间为 2027 年 1 月。页面称提供有竞争力的津贴与养老金，首年博士生可申请补贴住房；页面明确不适合应用 ML、LLM 等方向的申请者。
vanderbilt-english-phd-aid: 范德堡大学英语系为所有录取博士生提供全额学费、基础津贴每年$36,500及医保，入学前另有$2,000一次性津贴。需保持学业进展方可逐年续期。
vanderbilt-igp-international: 范德比尔特大学（Vanderbilt）IGP 国际生，第一年获全额学费、医保及 $40,000 津贴（2026–27）。第二年由 BRET 办公室资助，之后由导师通过机构支持、项目经费或助教岗位资助。
vanderbilt-sociology-phd-aid: 范德堡大学社会学系为录取博士生提供五年资助，包括9个月助教或助研津贴、12个月免服务津贴、全额学费减免及学生医保。免服务津贴约$23,918/年。
