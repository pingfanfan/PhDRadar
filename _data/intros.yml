naturecareers:12862188: 美国国立卫生研究院（NIH）下属的过敏与传染病研究所（NIAID）招聘博士后研究员，工作地点在美国马里兰州罗克维尔。学员可获得健康保险，并获得与经验相称的津贴。
naturecareers:12862293: IBSA 科研基金会设立的全球博士后奖学金，面向世界各地科研机构和大学的人员开放，金额为 € 32.000，国际生可申请。
naturecareers:12862383: 匹兹堡大学认知神经基础中心与生物工程方向的博后岗位，研究系统神经科学和/或神经工程。薪酬$60,000—$75,000，依经验而定。
naturecareers:12862416: 美国NIST生物物理与生物医学测量组的博后岗位，研究用于单分子生物剂量测定的纳米孔光谱。薪酬为$63,480 USD加福利。
naturecareers:12862474: 加州大学旧金山分校结肠炎中心（UCSF Colitis Center）招聘博士后研究员，工作地点在美国加利福尼亚州旧金山市。薪资标注为高于美国国立卫生研究院（NIH）指南标准。
naturecareers:12862577: Anacker 课题组位于美国纽约市，招聘博士后研究员，岗位为博士后层级的科研职位，工作地点在纽约市。年薪 $72,000-$80,000，另加福利。
