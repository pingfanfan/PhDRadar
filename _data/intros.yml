jsps-postdoctoral-fellowship: 日本学术振兴会（JSPS）外国人特别研究员（博后），由日本接收研究机构导师提名申请。国籍须为与日本建交国家。
jsps-standard-fellowship-guideline: 日本学术振兴会（JSPS）外国人特别研究员（Standard）的官方申请指南。申请需由日本接收教授在 JSPS 系统内提交，个人不能直接申请，因此需先找到日本的接收教授。
