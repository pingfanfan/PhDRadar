sns-pisa-phd-concorso: 比萨高等师范学院（SNS）博士招生，国籍不限，需持意大利硕士或同等外国学位。学费免除并提供奖学金，外国大学学位持有者另有保留名额。
sofinaboel-fellowship-2027: SofinaBoël 奖学金，面向在比利时高校注册、已有 100% 带薪博士岗位且注册满一年的博士生，资助出国研修 6 或 12 个月，每月 €1,650，并一次性补助 €1,000 往返机票。
southampton-csc-partnership: 南安普顿大学 CSC 合作博士奖学金，面向中国籍、18 岁以上申请者。学校承担学费，CSC 承担生活费并含差旅费用。需已获南安普顿博士录取，学业平均成绩 75% 至 80% 或以上，并满足英语要求。
ssm-phd-napoli: 意大利南方高等研究院（SSM）四年制博士项目，预公告称共 10 个项目，每个至少 3 个带奖学金名额，入学不收学费（地区学生权利费除外）。年毛额 €19,000（含社保），预公告注明可能调整。
st-andrews-csc: 圣安德鲁斯大学 CSC 联合奖学金，学校承担全额学费与本地科研费，CSC 负责生活费。须为中国大陆国籍且在大陆常住（不含港澳台），并承诺学成回国。
st-andrews-world-leading: 圣安德鲁斯大学 World-Leading 博士奖学金，最多 6 个名额，全额资助（学费与年生活津贴 £20,467，2026–27 学年标准）。无地域限制，国内外学生均可申请，需申请本校博士，可自拟课题。
stanford-biosciences-phd-funding: 斯坦福大学生物科学博士资助，全奖，2025–26 学年津贴 $56,348/年，另含学费与医保。需美国学士学位或同等国际学历，并满足英语能力要求；官网称公民身份不构成录取条件。
stanford-ceas-chinese-studies-postdoc: 斯坦福东亚研究中心的12个月中国研究博士后，面向人文社科学者。页面称基本薪酬约$78,000。需获博士学位不超过四年，斯坦福本校博士通常不予考虑。
stanford-doerr-postdoc: 斯坦福 Doerr 可持续发展学院的 Dean's 博士后奖，两年期，年薪 $85,000，另有每年 $10,000 研究与专业发展经费，含福利与医保，不需要教师提名信。
stanford-history-phd-funding: 斯坦福大学历史系博士资助保障，官方页面称在读且学业状况良好的 PhD 学生享有 5 年连续资助，含学费、津贴或助教/助研薪资、暑期津贴和医疗保险。
stanford-linguistics-phd: 斯坦福大学语言学博士项目，录取即含 5 年学费与生活费，页面称与国籍无关。通常五年完成学业，第 2–4 年可担任助教。
stanford-philosophy-phd-funding: 斯坦福大学哲学系录取的博士生可获五年资助，包括学费、奖学金或薪资及夏季资助。外部奖学金计入该资助，不额外延长年限。
stanford-science-fellows: 斯坦福 Science Fellows 三年期自然科学博士后，年薪 $98,000，另有最高 $10,000/年研究与发展经费及最高 $2,500 搬家费。需斯坦福教员接收，持 H-1B 者不符合。
stanford-shorenstein-contemporary-asia: 斯坦福APARC Shorenstein当代亚洲博士后，面向近期获博士学位者，研究方向为亚太地区政治、经济或社会变化。2026–27学年津贴约$80,000（10个月折算）加研究经费。
stiftung-mercator-fellowship: Stiftung Mercator 研究员计划面向有实质学术或工作经验的研究者与实践者，向所有国籍开放，全年可提交申请。不适用于本科、硕士学生或博士资助。
stipendium-hungaricum-study-finder: 匈牙利政府奖学金（Stipendium Hungaricum）官方检索页，可按博士课程和院校筛选，申请须在项目所列大学内提交。2026/27轮已截止，2027/28轮时间以官网为准。
stonybrook-chem-how-to-apply: Stony Brook 化学系博士申请与资助说明。页面称博士生可获年度研究生津贴、补贴健康保险和全额学费，当前津贴为 $38,000/年。申请需提交成绩单与 3 封推荐信，GRE 已不要求。
stonybrook-genetics-graduate-program: 石溪大学遗传学研究生项目（含 CSHL 教员），官网称全体学生获全额学费奖学金及补贴医保。当前津贴 $40,667，自 2027-07-01 起 $44,000，自 2028-07-01 起 $48,000。
strategiska-ssf-research-institute-phd-2026: 瑞典战略研究基金会（SSF）资助的研究所博士岗位，项目 2027 年 8–12 月开始。博士生由研究所受雇（至少 80%），需大学与研究所各一名导师共同申请。国际生资格以官方公告为准。
stsci-brinson-prize-fellowship: Brinson 基金会资助、STScI 提供行政协助的天体物理博士后奖学金，本轮三个名额，面向所有国家公民。学位需在 2023-01-01 后授予，或须在 2027-09-01 前获得。
study-australia-scholarships: 澳大利亚政府官方奖学金检索门户（Study in Australia），收录政府、院校及其他机构的奖学金。澳洲 PhD 的主要资金仍多来自各校 RTP 奖学金，具体金额与资格以各项目页面为准。
studyinjapan-mext-research-2027: 日本政府官方门户 Study in Japan 的 MEXT 2027 年度使馆推荐（研究生）入口，是 MEXT 使馆推荐的总入口。中国申请者需通过中国使馆初审（材料、笔试、面试），并取得日本大学暂定录取函，具体以使馆公告为准。
su-economics-phd-employed: 斯德哥尔摩大学经济系博士项目，博士生为受雇的博士候选人，按薪级发工资，全日制 48 个月，每年录取约 10 人。需经济学 90 ECTS 学分或等价知识，并有经济学论文。
su-linguistics-work-with-us: 斯德哥尔摩大学语言学系的博士岗位为带薪雇佣，一般覆盖四年全时博士学习，岗位在 su.varbi.com 逐个发布，资格以各岗位公告为准。
