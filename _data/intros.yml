mathjobs:29269: 法国雅克·阿达马数学基金会（FMJH）提供 4 个主题博士后资助岗位，工作地点在巴黎与奥赛一带。
mathjobs:29326: 卡尔加里大学数学与统计学院（加拿大）的博士后职位，属于博士后级别的研究职位，工作地点在卡尔加里。
mathjobs:29330: 威斯康星大学麦迪逊分校数学系的博士后岗位，研究科学机器学习与反问题。
max-planck-schools: Max Planck Schools 博士项目，页面列出生物医学 AI、认知、物质到生命、光子学等子项目。本科或硕士毕业生均可申请，资助最长 5 年，无学费。
mayo-gsbs-neuroscience-phd: 梅奥诊所研究生院（MCGSBS）神经科学博士项目，目录基础津贴为$42,642（2025–2026），获5年保证性内部奖学金，学费免除。接受国际申请人，需提供英语能力证明。
mbi-phd-scholarship-poster-2027: 新加坡国立大学分子与细胞生物所（MBI）全奖博士招生，2027 年 8 月入学，共 10 个名额，最长提供 4 年全额资助（含津贴与福利）。面向科学、技术、工程、数学等各学科背景，无需机理学基础。
mbzuai-careers-postdoc: 阿联酋 MBZUAI 官方职位库，目前显示 97 个开放职位，其中博士后研究员岗位涵盖 AI 精准医学、AI 天气预报、统计与机器学习等方向。需博士学位。
mcgill-chiu-kay-lui-csc-fellowships: 麦吉尔大学面向持 CSC 奖学金博士生的补充项目，补足国际学费差额 $16,000，可续 3 年。申请需导师支持信、中英文研究摘要与中文学业目标陈述。
mcgill-csc-joint: 麦吉尔大学的 CSC 联合博士奖学金，学费由麦吉尔承担，CSC 提供生活补助、保险和机票，最长 4 年。需先通过 CSC 联合奖学金申请，并获得麦吉尔有条件录取。
mcgill-csc-joint-doctoral: 麦吉尔大学（McGill）与 CSC 的联合博士奖学金，最长 4 年。McGill 负担学费，CSC 提供生活费等。须为中国大陆公民或永久居民，需先获 McGill 博士录取条件性 offer，再通过本校走 CSC 程序。
mcgill-doctoral-funding: 麦吉尔大学工学院为新录取博士提供前 4 年学费覆盖，并保证每年不少于 CAD 20,000 的生活费，非学费项目需自付。外部奖学金超过一定额度的学生规则不同，中国学生符合资格。
mcgill-gps-international-funding: McGill 大学研究生院国际生资助入口，列出国际生可能适用的主要奖学金。资助包金额因院系而异，需先被录取。差别学费豁免（DFW）只覆盖国际生学费附加部分。
mcgill-gps-phd-funding: 麦吉尔大学研究生院的博士资助包来源包括校级基金、捐赠和导师科研经费，录取时随录取通知附资助信，金额因院系而异。
mcgill-microimm-funding: 麦吉尔大学微生物与免疫学系博士资助页，列出 2026–27 年国际生博士 1–4 年最低总额 $47,251（含学费），主管可额外补贴。
mcmaster-csc-joint: 麦克马斯特大学的 CSC 联合博士项目，全额资助，每年最多 15 名，最长 48 个月。申请人须先获得麦克马斯特博士项目正式录取，并在申请时注明 CSC–McMaster 联合资助项目。
mcmaster-eng-min-funding: 麦克马斯特大学工学院博士最低资助标准，最低 CAD 21,000/年加学费，国际生与本地生相同，通常最多资助四年。外部奖学金低于最低标准时学院补足；工业博士不在此列。
mcmaster-fast-facts-grad-scholarships: 麦克马斯特大学研究生奖学金速览，列出 OGS 等博士奖学金的成绩要求和金额。国际生只可申请以择优为基础的奖项，除非奖项条款另有规定。
mcmaster-kinesiology-funding: 麦克马斯特大学运动学研究生项目的资助说明（2025–26 学年），录取学生获保障资助，博士每年 $25,000，最长 4 年。录取需导师同意。
mcqst-postdoc-fellowship: 慕尼黑量子科学与技术中心（MCQST）博士后奖学金，面向持有物理、数学、计算机、化学、工程等相关博士学位者。申请需先与 PI 沟通并列出 3–5 位意向 PI，并提交 2 页以内 CV 与研究陈述。
memorial-graduate-funding: 纪念大学（Memorial University）研究生院汇总的奖学金与导师资助页面。学术合格的全日制研究生即可获得资助包，国际生与加拿大生同等，金额按项目而异。
mfo-oberwolfach-leibniz-graduate: Oberwolfach 数学研究所（MFO）为在读博士及学位取得未满 2 年的毕业生提供参加研讨会的差旅补贴，平均约 200 欧元，并非生活费。需邮件向所长申请，随时可申请，名额有限。
miami-um-fellowship: 迈阿密大学研究生院校级 UM Fellowship，面向秋季入学的首年博士新生，由院系提名，官网称国际申请人有资格。2024-25 学年津贴 $39,000，另含学费减免（可续 5 年）和 100% 医保补贴。
miller-research-fellowship: 伯克利Miller研究员计划的基础科学博士后，3年期，津贴$95,000起并每年递增3%，另有研究经费$10,000/年。须由教授或机构人员提名，不接受自荐。
mit-bcs-phd: MIT 脑与认知科学系（BCS）博士项目，每年收到 900 余份申请，通常录取 15–18 名新生。申请须在线提交，非英语母语者需提交 TOEFL iBT、IELTS Academic 或 Cambridge C1/C2 成绩，GRE 非必需。
mit-biological-engineering-phd: MIT 生物工程博士项目，全体博士生获学费、医保与津贴全额资助。需研究目标陈述与 3 封推荐信，不接受 GRE；国际申请人需英语成绩（IELTS 最低 7，TOEFL iBT 最低 100）。
mit-dusp-phd-funding: 麻省理工学院城市研究与规划系（DUSP）博士项目，学院称录取博士生可获五年全额资助，包括学费、津贴与医保。通过 MIT Graduate Admissions 网申。
mit-econ-financial-support: MIT 经济系博士生资助：前两年通常由奖学金覆盖全额学费、12 个月个人医保及 9 个月生活津贴；第 3–6 年通过助教或助研岗位获得支持，取决于学业进展。具体金额以当年公告为准。
mit-media-lab-mas-phd: MIT 媒体实验室媒体艺术与科学方向的 MAS 硕士项目，学生获全额资助，含学费、医疗保险和津贴。不直接招收 PhD，须先以 MAS 硕士身份入学，第二年才可申请转 PhD。
mit-microbiology-phd: MIT 微生物学博士项目，MIT 生物系页面称全体博士生获学费、津贴与医保资助。不需要 GRE；需英语成绩（IELTS 7 / TOEFL iBT 100），英语母语或符合学位豁免条件者可免试。
mit-philosophy-financial-support: MIT 哲学系每年可为 5 名新入学博士生提供学费加 12 个月津贴。MIT 不保证超过一年的资助，系里预计对学业良好者支持完整五年，建议另申请外部奖学金。
mitacs-accelerate-phd-fellowship: 加拿大 Mitacs 博士实习津贴，面向在加拿大高校就读的博士生，持学生签证的国际学生也可申请。项目需与加拿大合作企业或机构的课题挂钩，全年可随时申请。
mitacs-elevate-postdoc: 加拿大 Mitacs 奖学金项目下的博士后计划，支持博士后与加拿大企业合作开展应用研究。每年奖励 $60,000，其中最低津贴 $55,000，需加拿大合作导师与企业方配合申请。
mittag-leffler-junior-fellowship: 瑞典 Institut Mittag-Leffler 青年学者项目，面向高年级博士生或项目开始前 5 年内获得博士学位者。项目含月津贴、免费住宿及一次往返差旅，约 3.5 个月，属短期访问性质。
mlai-ellis-alicante-phd: ELLIS 阿利坎特单元的博士项目，面向全球青年研究者，每年秋季统一申请，约 5–10% 的合格申请者被录取。博士须由两名不同欧洲国家的 ELLIS 导师共同指导，并到交流机构停留至少 6 个月。
mlai-ellis-phd-freiburg-programme: ELLIS 博士与博后项目弗赖堡单元页，提供全额资助的 ELLIS 博士职位（100% E13，按机构薪级）并有搬迁支持；博士须由两名不同欧洲国家的 ELLIS 成员共同指导。
mlai-idiap-calinon-openings: Idiap 研究所 Calinon 团队的机器人学习博士岗位，为 4 年带薪合同，需同时被 EPFL 博士项目录取。需工程、计算机、物理或应用数学硕士，有信号处理、控制、优化或机器学习背景。
mlai-mcml-phd-applicants: 慕尼黑机器学习中心（MCML）的博士申请入口，岗位由 LMU 与 TUM 联合提供，为德国 TV-L E13 全薪职位，每个岗位期限 3 年，申请者需按页面说明投递。
mlai-studyinaustria-ista: 奥地利科学技术研究所（ISTA）的国际博士项目，覆盖十余个学科，提供全额资助的五年合同并含全额财务支持，可通过奥地利留学门户查看。
momentum-msca-hungary: 匈牙利科学院的 Momentum MSCA 高级博士后项目，须在申请截止前已获博士学位，申请前 3 年内在匈牙利居留或工作不超过 12 个月，并须完成强制国际交流。
monash-vl4ai-phd: 莫纳什大学 VL4AI 视觉-语言 AI 研究组的全额资助博士岗位，研究视觉-语言与机器人方向，国际生可申请。需先按莫纳什研究生流程申请，再发邮件至 vl4ai@monash.edu 联系课题组。
mount-sinai-icahn-phd-intl: 西奈山伊坎医学院生物医学科学与神经科学博士项目，通过研究生院（GSBS）申请。官网称国际生可获得全额机构资助；联邦资助与校内工作机会对国际生不开放。
mpg-jobboard: 马普学会所有职位的招聘页，职位类型选择 “PhD students” 即可筛出博士岗位。岗位为带薪职位，一般需硕士学位（部分 IMPRS 接受本科），多经 IMPRS 项目门户申请。
mpgc-qm-phd-2026: 马普量子材料研究生中心（MPGC-QM）的全额资助博士研究员岗位，由五个马普研究所联合招生，部分岗位为与牛津大学的联合培养。招收相关方向硕士或同等学历者，研究量子材料。
mpi-ai-phd-call-2026: 马普 AI 网络（MP-AIX）博士招生，与 ELLIS 统一招生联动，一次申请可同时考虑两个项目，2027 年入学。需硕士学位（已获得或即将获得）及优秀学术背景，资助形式为薪资。
mpi-cbg-phd-program: 德累斯顿的 MPI-CBG 博士项目入口，需生物、化学、计算机、物理、数学或工程等相关硕士学位及较好的英语能力。通过各阶段评审者将被邀请赴德累斯顿面谈，博士岗位在面谈访问结束时发出，博士论文期间提供财务保障。
mpi-ds-living-matter-phd-w091: 马普动力学与自组织研究所 Living Matter 部门（Golestanian 组）的 PhD 岗位，做活性物质的理论与计算研究，合同 3 年。待遇为 TVöD-Bund E13 的 2/3；需 CV、成绩单、研究兴趣陈述和两位推荐人。
mpi-inf-cv-direct-application: 马普信息学所计算机视觉与机器学习部，全年接受直接申请邮件，申请材料合并为一个 PDF，包括 CV、研究陈述、完整出版清单、推荐人名单、代表性论文及成绩单。
mpi-inf-job-openings: 马普信息学研究所（萨尔布吕肯）的招聘汇总，列出各系与独立研究组的博士、博后岗位入口，并介绍马普女性计算机科学博后奖学金、与 Simons Institute 的联合研究奖学金等。
mpi-psycholinguistics-vacancies: 奈梅亨马普心理语言学研究所的招聘页，目前有一个由马普学会资助的3年期博士后岗位，方向为统计遗传学与遗传流行病学。其余列出的岗位均已截止。
mpi-susmat-admission: 马普可持续材料研究所（MPI-SusMat）的博士招生页，要求材料科学、物理或化学相关的优秀硕士学位（含论文）及很好的英语水平，仅接受在线申请。页面称本年度无申请批次，可能于 2027 年秋季重新开放。
mpi-sws-graduate-studies: 马普软件系统研究所（MPI-SWS）研究生招生，全年接受申请，按季度评审。页面称录取者均获全额资助，需英语能力证明与推荐信。
mpi-sws-open-positions: 马普软件系统研究所（MPI-SWS，萨尔布吕肯与凯泽斯劳滕）的博士与博后岗位列表，并提及 CS@Max Planck 统一博士申请渠道。
mpia-imprs-heidelberg: 海德堡马普天文研究所（MPIA）的 IMPRS 天文与宇宙物理博士项目，每年秋季入学，名额有限。国籍与学位要求以官网为准。
mpib-jobs-page: 马普人类发展研究所（柏林）的招聘栏目暂无岗位。博士途径为 IMPRS 项目（计算精神病学与衰老研究、生命历程）及个人博士研究，需直接联系主任或研究组负责人。
mpil-heidelberg-foreign-doctoral-grants: 马普比较公法与国际法研究所（海德堡）面向不在德国撰写论文的外国博士候选人，停留最长 6 个月，博士候选人月资助 €1,650。须通过官网在线系统提交，邮件申请会被直接淘汰。
mpp-imprs-physics-munich: 马普物理所（慕尼黑）IMPRS 粒子物理国际博士项目（EPP）的申请页，英语授课，要求硕士或同等学历。博士生获三年合同，可延长一年，须使用官网申请表递交。
msca-dn: 欧盟玛丽居里博士网络的博士岗位，招聘时未取得博士学位即可，任何国籍均可申请，并可获生活津贴与流动津贴。但招聘日前 36 个月内在招聘国居住或工作超过 12 个月者不符合要求。
msca-dn-flexcat-phd-2026: 欧盟 MSCA 博士网络 FlexCAT，共 15 个带薪全职博士岗位，36 个月，含流动津贴，由多国多家宿主机构承担。研究方向偏蛋白质科学与癌症药物，化学或生物背景更匹配。
msca-doctoral-networks: 欧盟玛丽居里行动计划的博士网络，由大学、科研机构和企业组成的合作体提交提案。获资助的项目在 EURAXESS 发布博士岗位，申请人无需已有博士学位，任何国籍均可，但须满足流动性规则。
msca-doctoral-networks-rea-programme: 欧盟 MSCA 博士网络（Doctoral Networks）的官方说明页。博士生通常为带薪雇员，国籍不限。中国大陆学生需申请网络内机构在 EURAXESS 发布的岗位，并满足流动性规则：招聘日前 36 个月内在招聘国居住或工作不超过 12 个月。
msca-postdoctoral-fellowships: 欧盟玛丽居里博士后奖学金（MSCA PF），不限国籍，需与欧洲导师共同撰写申请书。需已取得博士学位，研究经验不超过 8 年，并满足流动性规则。
msu-psychology-doctoral-admission: 密歇根州立大学心理学系博士，页面称对所有录取申请者提供资助。各研究方向分别录取，本轮组织心理学与社会/人格方向不招生。
munich-quantum-valley-doctoral-fellowships: 慕尼黑量子谷（Munich Quantum Valley）的博士奖学金，由 MQV 与 IMPRS-QST 联合招募，可选择巴伐利亚任一大学的研究组。提供 3 年全额博士奖学金，每年约 5 个名额，需硕士学位。
naist-doctoral-prescreening-2026: NAIST 2026 年博士预选与 MEXT 奖学金指南，面向 2027/2028 入学。申请者须为非日本籍，入学前已获得硕士学位，需由合作大学推荐，英语需达标。MEXT 奖学金要求入学年 4 月 1 日未满 35 岁。
nanolund-career-opportunities: 隆德大学纳米科学中心（NanoLund）的职位页，汇总多个在招博士与博后岗位。博士与博后均按全职雇员合同聘用。
nanyang-business-phd-financial-support: 南洋理工大学南洋商学院博士财务支持，国际生每月 S$4,300 生活补助，获奖者学费可覆盖 4 年（每年续期）。需本科荣誉一等（Highest Distinction）或同等学历，所有国籍均可竞争申请。
naples-federico-ii-csc-humanities: 那不勒斯费德里科二世大学人文系 2025-2026 学年 CSC 博士预选公告，涵盖历史、哲学、语文学与数字人文。申请人需将材料发送至两位教授邮箱，经指导委员会面试选拔。
nasa-hubble-fellowship-2027: 美国 NASA 哈勃奖学金计划（NHFP），面向天文和物理相关的博士后，最长 3 年，宿主机构由申请人自选。要求 2023 年 1 月 1 日后完成或将完成天文或物理相关博士学位，并需找美国宿主机构。
naturecareers-health-science-postdoc: Nature Careers 的生命科学与医学博士后直招岗位列表，可按地区和岗位类型筛选。资助条件与工作许可因岗位而异，海外岗位需自备签证或工作许可。
naturecareers-postdoc-china: Nature Careers 汇总的中国大陆高校和研究机构直接发布的博士后岗位，可按学科筛选，列表持续更新。多数岗位要求博士学位，待遇与资格因岗位和雇主而异，部分与人才计划挂钩。
naturecareers:12859054: 甬江实验室（Y-Lab）先进智能材料中心（CASM）的博士后职位（宁波），年薪为 450,000-550,000 RMB。
naturecareers:12859179: 中国科学院成都生物研究所同时招战略科学家、优秀青年人才和博士后，博士后薪资写的是有竞争力，地点在四川成都。
naturecareers:12861745: 北京的中国医学研究所（CIMR）招聘课题组负责人（PI）及博士后职位，页面标注薪资具有竞争力（Competitive salary）。
