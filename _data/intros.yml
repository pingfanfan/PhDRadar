1p3a-wsu-liwei-robotics-fall2026: 华盛顿州立大学机器人规划与自主实验室（RoPAL）招收机器人方向博士，可咨询 Sihui Li 教授。据论坛帖，2026 秋季有 1 个全奖 CS 博士名额。需计算机背景或扎实 C/C++ 基础，有机器人研究经验者优先。
4tu-sai-engd-vacancies: 荷兰 4TU 联合的带薪工程博士（EngD）岗位，由 Stan Ackermans 研究院发布，工业导向，岗位常年开放。为期两年全职，通常需硕士或同等学历（理工科优先），须提交求职信、CV 和至少两封英文推荐信。
a-star-gis-students: A*STAR 基因组研究所（GIS）学生项目，国际博士生通过 SINGA 申请，学籍在新加坡国立大学（NUS）或南洋理工大学（NTU），即通过这两所高校的博士项目就读。
aalto-chem-eng-doctoral-programme: Aalto 化学工程博士项目，2026 年设四个入学窗口，需持有相关硕士学位或国外同等学位。申请前需先与拟任导师确认，再申请入学资格（study right）。
aalto-doctoral-open-positions: 阿尔托大学博士研究员岗位页，岗位按旗舰项目和领域分批发布。博士研究员为雇佣合同，与博士课程录取需分别申请。页面写明目前试点中暂无开放岗位，岗位发布后会陆续加入。
aalto-doctoral-pilot: 芬兰阿尔托大学 MEC 资助博士试点项目（2024–2027），由芬兰教育部资助，覆盖材料、纳米与工程。需先联系 Aalto 导师，获批后为带薪博士合同且免学费，开放时间按院系分批安排。
aalto-jobs: 阿尔托大学（芬兰）的开放职位页，博士岗位为雇员合同，博士研究员起薪 €3,100–3,260/月（税前）。芬兰的赫尔辛基大学、坦佩雷大学等也有各自职位页。
aalto-msca-solar-wind-sail-phd: 阿尔托大学与CrystalSpace联合培养的MSCA博士网络岗位，方向为电推进太阳风帆任务设计。需硕士学位，并满足MSCA流动性规则：近三年在芬兰居住或主要活动不得超过12个月。
aarfa-alzheimers-research-fellowship: 美国阿尔茨海默病协会研究奖学金 AARFA，面向在阿尔茨海默病或痴呆研究中由资深导师指导的博士后，页面称向美国和国际研究人员开放。周期 2–3 年，总额不超过 $200,000，需经 ProposalCentral 提交。
aarhus-econ-vacancies: 奥胡斯大学经济系的岗位页，含计量经济方向，博士岗位为带薪职位。当前列出的是计量经济学博后岗位，目标开始时间为 2027 年夏季或秋季。
aarhus-industrial-phd: 奥胡斯大学产业博士（Industrial PhD）说明页。候选人需与企业签订雇佣合同并在丹麦大学攻读博士；企业向 Innovation Fund Denmark 提交申请，候选人同时向研究生院申请，资助金额以 IFD 当年规定为准。
aarhus-math-phd-2027: 奥胡斯大学数学系概率论与分析方向博士岗位，由 ERC 高级资助项目 RanGe 资助，属带薪雇佣，2027 年 2 月或之后入职。需数学或相近专业硕士，并按官网指南提交研究计划 PDF。
aarhus-phd-salary-employment-info: 奥胡斯大学文学院博士雇员薪资与合同说明。5+3 博士为正式雇员，税前月薪约 DKK 31,641–38,213（视工龄）。3 年研究生学院 PhD 资助要求硕士（120 ECTS）在征集规定日期前完成。
abg: 法国博士岗位的主要发布平台之一，包括 CIFRE 企业联合博士。博士岗位为受雇合同，国际申请人需按岗位确认工作许可与学历、语言要求。该页面本身不是资助项目，而是岗位平台。
abo-doctoral-funding: 奥博学院（Åbo Akademi）定期发布博士研究员岗位，多为带薪职位，需硕士学位。其中 Finland Fellowship 仅面向非 EU/EEA 公民，需在申请信中注明。博士学习权本身不附带资助。
academia-sinica-iis-research-fellow: 中央研究院资讯科学研究所的 Research Fellow 招聘，属于助研、副研、研究员等正式研究职称岗位，而非学生奖学金。需计算机或相关领域博士学位，薪资依资历而定。
academia-sinica-postdoc-guidelines: 中央研究院博士后研究学者计划（台湾）的官方办法。申请人需先联系研究所研究员作为 Sponsoring Mentor，并由其在线提交；需准备研究计划书及 2–3 封推荐信。
academia-sinica-postdoc-scholar: 台湾中研院博士后研究学者（ASMS），需先由中研院研究员作为 sponsor 同意并代为提交，博士学位须于 2022 年 1 月 1 日后取得。
academicjobsonline: 以教职和博后岗位为主的招聘平台，覆盖全球、美国与欧洲。数学、理论计算机方向的欧洲博士岗位也会在此发布。
academicjobsonline-astrophysics: AcademicJobsOnline 天体物理分类，主要列出北美天体物理博后岗位，可按岗位浏览。天文领域的主流招聘入口仍是 AAS Job Register，本分类作补充。
academics-de: 德国学术招聘门户，博士岗位多为雇佣合同（如 TV-L 13），而非奖学金。国际生资格需看具体岗位的招聘说明。
academictransfer: 荷兰高校与研究机构的 PhD 及博士后招聘平台，岗位多为带薪雇员合同。2024 年第三方指南引用的参考月薪约 €2,618 至 €3,333，以具体岗位公告为准。
academictransfer-job-alert: 荷兰学术招聘主平台 AcademicTransfer 的邮件提醒，设置学科和岗位条件后，新岗位会自动推送。荷兰博士多为带薪雇员合同，约 4 年。
adum-offers-explainer: 法国博士课题平台 ADUM（巴黎萨克雷大学）的使用说明。课题由博士学院发布，候选人可等待导师联系，也可主动联系。这不是资助名单，资格以各课题的合同说明为准。
aea-grad-funding: 美国经济学会（AEA）的研究生资助指引页，汇总经济学博士的资助信息并链接外部资源。页面引用 2006 年研究数据，称约 80% 经济学博士新生入学首年获得资助。并非所有项目都全额资助，需逐校查看。
aei-fpu-2026-predoctoral-contract: 西班牙科学与创新部 FPU 大学教师培养预博士合同，以薪资形式资助。申请需持附件 III.1 所列学位，并在 2026/27 注册或获得西班牙博士项目录取，外国学位需学历等效认证。
aei-max-planck-fellowship: 马普学会 AEI 引力物理研究所的马普研究员基金，面向非德国籍优秀博士后，可在 AEI 停留最长两年。税后月津贴 €2,500 / €3,000 / €3,600，按学术履历分三档。
aerospace-illinois-5yr-funding: 伊利诺伊大学厄巴纳-香槟分校航空航天工程系承诺，博士生入学后前五年（秋、春学期）提供有资助的岗位，含全额学费减免、部分杂费减免和生活津贴。需保持学术良好并履行助教或助研职责。
afd-cifre: 法国 CIFRE 企业联合培养博士，由 AFD 资助，每年发布 1–3 次公开征集，岗位在 AFD 招聘门户发布。博士受雇于企业，年薪不低于 €27,600（2026 年下限）。AFD 不回复自荐申请。
ag-jobregister-astronomy: 德国天文学会（AG）招聘登记册，收录天文与天体物理方向的博士与博后岗位。AG 办公室只登记岗位、不作中介，需直接联系岗位方。
aggregator-academicjobsonline-qc: AcademicJobsOnline 的量子计算职位板，汇总全球量子计算领域的博士与博士后学术招聘。职位随时间变化，资助与截止以各职位为准。
agh-doctoral-school-candidates: 克拉科夫科技大学（AGH）博士学院的英文招生入口，设有 17 个学科，可查看录取条款与外国申请人说明。AGH 参与 IDUB 卓越计划，该计划支持为优秀博士生提高博士奖学金。
agi-geoscience-jobs: AGI 地球科学职位中心，是地球科学岗位的精选职位板，涵盖学界、政府与企业，可按类型、薪资和截止日期筛选。博士与博后岗位需逐条查看公告。
agu-careers: AGU 职业中心，页面显示约 479 个地球与空间科学在招职位，可按学科、地点和部门类型筛选，职位条件与资助以各岗位发布为准。
agu-findajob-geology: AGU FindAJob 的地质学职位页，收录博士后、助理教授及研究生机会，岗位以美国为主，也有加拿大与瑞士岗位。资助与身份要求需逐条岗位确认。
agu-findajob-ocean-science-phd: 美国地球物理学会（AGU）职位库中海洋科学与博士学历的预筛页面，当前列有 9 个可协商岗位，多为教职与研究职位，地点以北美为主，另有香港岗位，未见博士奖学金。
ahrc-dla-royal-holloway: 皇家霍洛威大学 AHRC 博士着陆奖（DLA），面向 2027 年 9 月 20 日入学的学生。国际生最多占约 30% 名额，AHRC 资助按本地学费标准计，国际生差额与津贴以校方说明为准。
ai2-young-investigators: Ai2（艾伦人工智能研究所）西雅图的青年研究者博后计划，任期 1–3 年，配有专属导师、差旅预算及数据和算力资源。岗位薪资约 $159,650/年（部分职位发布），页面称结束后可能获得基于提案的约 10 万美元研究经费。
aicentre-dk-phd: 丹麦 Pioneer Centre for AI 教员定期发布 PhD 岗位，页面称为全职、12 个月有薪职位。另有愿意考虑 DARA 申请者的教员，需先以项目构想直接联系，且须在截止日前至少 1 个月达成同意。
aims-industry-studentships: 牛津大学 EPSRC AIMS 博士培训中心的产业资助博士岗，共两个全额资助的 4 年岗位，2027 年 10 月入学，分别与牛津马丁 AI 治理倡议和 MathWorks 联合。
aip-potsdam-jobs: 德国莱布尼茨天体物理研究所（AIP，波茨坦）岗位页，列有博士、博后、科学家及 tenure-track 岗位。博后多为 TV-L 工资标准下约 1–2 年的项目制岗位。
aip-students-careers: 波茨坦莱布尼茨天体物理研究所（AIP）的学生与博士招生页，汇总博士生招聘与研究生院信息，学位通过波茨坦大学授予。需天体物理、物理、计算方法或神经网络相关背景，编程能力为加分项。
airbus-vie-phds: 空客（Airbus）博士岗位页面（VIE and PhDs），博士岗需学士或硕士学位。VIE 项目面向欧洲经济区国籍、18–28 岁人群，博士岗的具体适用条件以岗位为准。
airc-short-term-fellowships-abroad: 意大利 AIRC 癌症研究短期海外访学，资助 1–3 个月的海外访学，面向博士后及博士生，页面称向所有国籍开放，通常需在意大利实验室工作。同一年度只能申请一项 AIRC 资助。
aisg-phd-fellowship: 新加坡 AI Singapore（AISG）博士奖学金面向全部国籍，全额学费，最长 4 年，非公民及 PR 月津贴 S$6,300。需经 NUS、NTU、SMU 或 SUTD 提名，NUS 对非新加坡籍学生另有两年企业服务要求。
aist-innhr-postdoc-en: 日本产业技术综合研究所（AIST）英文博士后招聘页，聘期约一年，2027 年 4 月 1 日入职。申请须先与 AIST 研究者协商并获受理同意，需博士学位（2027 年 3 月前取得亦可）及日语 JLPT N2 或以上。
aist-ncm-recruit: AIST（日本产业技术综合研究所）英文招聘页，面向博士后与研究岗位，为固定期限研究合同。要求近 7 年内取得博士学位，在 AIST 累计担任博士后不超过 5 年。
ajo-condensed-matter-physics: Academic Jobs Online 平台的凝聚态物理分类页，可按理论或实验方向筛选，多为欧美的博士与博后职位。
ajo-quantum-information: Academic Jobs Online 平台的量子信息科学分类页，汇集该方向的博士与博后职位。部分职位已过期。
ajou-university-graduate-scholarship: 亚洲大学（Ajou University）研究生奖学金，BK21 博士创意研究奖学金每月 160 万韩元，博士挑战研究奖学金每月 110 万韩元，国际学生按同样方式发放月度津贴。BK21 期间博士阶段最多可领 8 个学期，一般规定为 6 个学期。
aka-academy-research-fellowship-2026: 芬兰研究理事会 Academy Research Fellowship 早期研究者资助，资助期 2026-09-01 至 2030-08-31 共 4 年，可覆盖本人工资、可能的研究团队工资及其他研究费用，最高 70 万欧元。页面称外国研究者也可申请。
alberta-innovates-recruitment-postdoc: 阿尔伯塔大学博士后招募奖学金（Alberta Innovates Recruitment Fellowships），年额 CAD 70,000，最长两年，不含福利。面向校外新入职候选人，研究须为健康相关并在阿尔伯塔大学开展，页面称无国籍限制。
alcf-margaret-butler-fellowship: 阿贡领导级计算设施（ALCF）的 Margaret Butler 计算科学博后奖学金，面向超算应用研究，聘期通常 2 年。申请需一页研究计划或研究兴趣摘要、求职信与简历，推荐信在入围后另行索取。
alliance-mbs-phd-business-management-2027: 曼彻斯特大学 Alliance 商学院 2027 年入学的商业与管理博士项目，生活津贴每年 £21,805，国际生学费每年 £22,500。需英国一等或 2:1 荣誉学位或同等学历，申请时勾选竞争项目。
almoa-dn-positions: ALMOA 博士网络（Klagenfurt 协调）的 13 个带薪博士岗，涵盖可持续能源系统、绿色物流、绿色数据科学等应用方向。页面称除 DC11 外其余岗位已招满，DC11 在招满前仍接收申请。
alz-aarf-postdoc: 阿尔茨海默病协会的博后研究员奖学金（AARF），面向美国及国际研究人员，要求获得学位后研究经历少于 10 年，并在非营利学术、医疗或研究机构全职任职；已为助理教授或以上者不符合。
amazon-ai-phd-fellowship: Amazon AI PhD Fellowship 面向美国合作高校的博士生，学生不能直接申请，需在 9 所参与院校之一读博并由院系提名。项目学生资助合计 1000 万美元，另有每学年 2400 万美元 AWS 云计算积分。
amii-career-opportunities: 加拿大 Amii 的职业机会页，是持续更新的博后与 AI 研究岗位入口，包括 AI Fellowship 类岗位。非加拿大公民需确认工作许可。
amolf-phd-jobs: 阿姆斯特丹原子与分子物理研究所（AMOLF，NWO 研究所）的有薪博士岗位，约 4 年。这是在招岗位列表，具体学历要求以各岗位为准。
amu-doctoral-contracts: 普罗旺斯大学各博士学院竞争的博士合同，属雇佣合同并含薪资，按 2026–2029 周期招收，具体以各学院公告为准。
amu-ed372-financing: 艾克斯-马赛大学 ED372 博士合同途径，属带薪雇佣，博士合同为三年雇员合同。申请前需先告知 Master 2 导师并提交申请材料。
amu-ed659-funding: 艾克斯-马赛大学生物医学研究博士学院（ED659）每年通过校内竞争分配约 14 个带薪博士合同。上一年参加过竞争的候选人本年不可再参加。
amu-env-biology-phd-announcements: 亚当·密茨凯维奇大学环境生物学院的博士招生公告栏，集中发布该院各类博士职位。每条职位的类型与资助情况需进入公告逐条查看。
amu-inter-ed-doctoral-contracts: 艾克斯–马赛大学跨博士学院（Inter-ED）征集的博士合同，2026 年提供 10 个。需两位导师分属该校两个不同博士学院，研究项目须跨学科。
andlinger-distinguished-postdoc: 普林斯顿 Andlinger 能源与环境中心的杰出博士后研究员，年薪 US$75,000，另有 US$3,500 用于会议与职业发展。需与普林斯顿两位及以上教授或高级研究人员合作，其中至少一位为主导师。
anid-doctorado-nacional-chile: 智利 ANID 国家博士奖学金（Beca de Doctorado Nacional），面向已在智利大学认可博士项目中正式申请、已录取或在读的学生。申请人须持学士或同等学位，本科成绩均分不低于 5.0（智利评分制）或位于前 30%。
anr-jcjc-2026: 法国国家研究署（ANR）JCJC青年研究者项目，面向博士学位取得不超过10年、任职不超过5年的研究者，须在法国实验室开展项目。本轮预申请已关闭，需等待结果后进入全申请。
anrs-mie-allocations-2026: 法国 ANRS-MIE 资助的传染病方向博士与博后研究分配（Allocations de recherche）。课题须属传染病方向，博士须为法国博士学校候选人，申请材料为英文；2027 年规则已于 2026 年 6 月发布。
anthropic-fellows-program: Anthropic Fellows 项目，为期约4个月的全职 AI 安全实证研究，驻 Berkeley 或伦敦，提供每周津贴与算力经费，滚动招募。这是研究项目而非博士录取。
antwerp-aria-phd-fellowships: 安特卫普大学 ARIA 艺术博士资助岗位，为 4 年带薪的约 55% 合同研究职位，需承担教学或研究。研究须源自个人艺术实践，需艺术或设计背景及两位导师。外籍候选人须持比利时工作许可，申请语言为荷兰语或英语。
anu-cic-phd-scholarship: 澳大利亚国立大学中国与世界研究中心（CIW）设有 Graduate Fellowship，每年最多 5 个，面向在澳大利亚或新西兰大学攻读博士的学生，研究须以中国为重点的人文社科方向。CIW 相关页面列出每年 A$30,000，为期 3 年。
anu-doherty-phd: 澳大利亚国立大学JCSMR的Doherty补充奖学金，面向有临床学历资质、在JCSMR开展临床研究的博士。该奖学金属补充性质，支付给AGRTP或同类奖学金持有者，官网称每年A$7,000。
anu-phd-scholarship: 澳国立大学（ANU）通用博士奖学金，面向国内外申请者，基础津贴为 A$39,069/年（2026 基础费率），支付 3.5 年。须已申请博士或专业博士项目，并具备一等荣誉学位或带研究成分的硕士学位。
anu-research-degree-scholarships: 澳大利亚国立大学研究学位奖学金（RTP/URS），含学费与生活津贴，国际生可申，每年两轮。需先被 ANU 录取为博士生，RTP/URS 随录取由学校自动考虑，无需单独申请。
anu-robotics-group-recruitment: 澳国立大学（ANU）机器人组招收博士、研究工程师与博后，方向为机器人规划与决策。博士奖学金最低 AUD 34K/年（免税），博后年薪 AUD 99K–121K（另加 17% 养老金）。
anu-rsaa-international-phd: 澳大利亚国立大学（ANU）天文与天体物理研究院（RSAA）的博士项目提供全额博士奖学金，国际生可申请。优秀本科或硕士申请者均可申请，有天文研究经验者优先。
anu-rsb-international-phd: ANU 生物学院的国际博士奖学金，面向全日制国际博士生，无需单独申请，申请入学并满足条件即被考虑。奖金按双周发放 3.5 年，另有旅费、搬迁、论文等补贴。
anu-rses-critical-resources-phd: ANU 关键资源未来中心（CCRF）博士奖学金，共2个名额，支持3.5年，生活津贴每年 $36,652，按学术成绩择优，面向国内及国际申请者，需先申请 RSES 博士录取。
anu-rses-scholarships: 澳国立大学地球科学研究院（RSES）博士奖学金汇总。其中 Ringwood 补充奖学金每年 A$8,002，分 3 年发放，无需单独申请。需一等荣誉学位或研究型硕士。
anu-rtp-international-fee-offset: ANU 研究培训计划（RTP）的国际学费补助，为国际博士生提供博士学制内的学费减免与海外学生医保（OSHC），不含生活费；生活费需另获 ANU 奖学金或 RTP 津贴。需获 ANU 博士录取，竞争制。
anu-shen-su-sun-supplementary: 澳国立大学 Shen-su Sun 博士补充奖学金，面向已获国家留学基金委（CSC）奖学金的中国博士生，需先获 ANU 博士录取。每年 $10,000，最多 2 名，支付 3 年，双周发放。
anu-urs: 澳大利亚国立大学研究生奖学金（University Research Scholarship），申请 HDR 学位时勾选即参评，无需单独提交表格，本地与国际生均可申请。获奖者可同时获得学费奖学金。
apecs-job-board: 极地早期职业科学家协会（APECS）的职位板，可按类型和截止日筛选极地与海洋方向的博士及博后岗位，资助形式因岗位而异。
apple-aiml: 苹果公司 AI 与机器学习方向的 Scholars 项目，面向在读博士，最高 $40,000/年生活费，另含学费与 $5,000/年差旅。学生不能直接申请，须由受邀大学提名，每校最多 3 名。
aps-slater-predoctoral-fellowship: 美国哲学学会（APS）John C. Slater 科学史与技术史博士预科研究奖学金，面向高年级博士生，须非美国公民且非美国永久居民。驻费城研究 9 个月，提供 $25,000 津贴及 $5,000 差旅与研究经费，不提供签证担保。
arc-science-fellows: Arc Institute 设立的 5 年期独立研究员职位（美国），含全薪与团队经费，可提供签证支持。需已获博士、MD 或 MD-PhD 学位（或即将获得），2026 轮要求 2024–2026 年间毕业。
arcane-grenoble-cofund: 格勒诺布尔 ARCANE 的 MSCA COFUND 博士项目，采用两步申请，需先与导师对接课题，并完成 2 个月外派实习期，合同 2027 年 10 月开始。
arch-chicago-mansueto-postdoc: 芝加哥大学 Mansueto 研究所的城市研究博士后，一年期全职（可续一年）。年薪 $70,000（含福利，另扣联邦、州及学校规定项），需指定 1–3 位芝大导师，且须在入职前持有校外博士学位。
arch-dbu-promotionsstipendium: 德国联邦环境基金会（DBU）的博士生奖学金，面向在德国高校或研究机构完成、与环境或自然保护相关的研究，资助期限最长三年。非德国籍申请人需提交德语 B2 证明，并获高校导师支持。
arch-epfl-edar-enac: EPFL 建筑学院 ENAC 下的 EDAR 建筑与城市科学博士项目，每年接收三批新博士生。申请者需持有硕士学位，并先找到论文导师，通过候选资格审查。
arch-lse-geography-phd-funding: LSE 地理与环境系的博士奖学金由系里提名分配，申请人无需单独申请资助，但需在资助截止前提交全部申请材料。
arch-manchester-planning-phd-programme: 曼彻斯特大学规划、地产与环境管理博士项目。部分奖学金需导师提名，申请前应与拟任导师沟通；2027 入学国际生学费为每年 £23,000，雅思总分要求 7.0。
arch-shu-ahrc-doctoral-landscape: 谢菲尔德哈勒姆大学 AHRC 博士景观奖，限艺术与设计方向，提供 1 个博士名额，2027 年 2 月开始，仅限 Home 申请人。资助含学费与标准博士津贴，后者 2025/26 学年为 £22,152。
arch-stockholm-human-geography-research: 斯德哥尔摩大学人文地理系的四年制全职博士岗位，博士生通常受聘于系里，为带薪雇佣。申请需硕士或同等学历，人文地理至少 90 学分或同等，英语或瑞典语达标。
arch-zgis-salzburg-news: 萨尔茨堡大学 Z_GIS 的新闻页会发布研究员与博士岗位，是地理信息方向较直接的入口。奥地利职位常有国籍与语言要求，需逐个岗位查看说明。
argonne-battery-postdoc: 阿贡国家实验室的电池材料博士后岗位。实验室有多个电池与正极材料方向的博后岗，部分滚动招聘，需留意签证支持与博士毕业年限要求。
aries-dtp-studentships: ARIES 博士培训伙伴下的 UKRI NERC 资助博士项目（含 Cefas 合作 CASE 项目），2027 年 10 月 1 日开学。全额资助，标准生活津贴为 £20,780/年（2025/26 标准，2026/27 待定）。
arizona-cs-aid: 亚利桑那大学计算机系博士新生首年资助有保障，TA/RA 最低 $15,000/学年，另含学费减免与医保，之后视学业进展。国际生需另提交财务担保表。
arizona-eller-accounting-phd: 亚利桑那大学Eller会计博士项目，官网称所有博士生获全额学费与生活津贴。申请需四年制学士学位，并提交GMAT Focus 615或GRE；国际生需托福iBT 100分。
arizona-infosci-phd-funding: 亚利桑那大学信息科学学院的PhD资助，学院帮助全体博士生争取全额学费加津贴，至少四年。母语非英语国家的国际申请者需提供英语能力证明。
arthist-net-jobs: H-ArtHist / arthist.net 发布艺术史领域的职位与奖学金公告，博士与博后岗位以 JOB 公告形式发布，部分为德国或欧洲岗位。
asa-career-center: 美国社会学会（ASA）职业中心的职位库，以教职与博后岗位为主。博士奖学金需到各校研究生院页面查看。
ascor-uva-phd-salaried-openings: 阿姆斯特丹大学（UvA）ASCoR 传播学带薪博士岗位，岗位随项目经费不定期开放。作为 UvA 雇员享受学费减免与荷兰大学社保，月总薪约 €2,000（第 1 年）至 €2,550（第 3 年），需承担 5%–15% 教学。
ascsa-graduate-fellowships: 雅典美国古典研究学院（ASCSA）研究生与博士后奖学金，面向古典学、考古学或古代史方向。各子奖项的国籍与会员限制不同，例如 AIA Colburn 限美国或加拿大公民或永久居民。
asea-uninet-scholarships: ASEA-UNINET（东盟—欧洲大学网络）的奖学金分类页，收录 2026 年多条东盟与奥地利相关的博士与博后奖学金通告，例如泰国—奥地利研究交流项目（Thailand–Austria Research Mobility Programme）与 PSU 博士及交换奖学金。
asea-uninet-thailand-list: ASEA-UNINET 泰国大学奖学金分类页，汇总 2025–2026 年多所泰国大学的博士奖学金通告，例如 PSU 博士奖学金和 Kasetsart University Sriracha 奖学金，适合按学校逐条查看。
ash-democracy-postdoctoral-fellowships: 哈佛大学 Ash 中心民主博士后奖学金，面向近三年内获博士学位、研究政治理论、政治学、社会学、法学或历史学等方向的学者。两学年项目，年津贴 $65,000。2026–27 学年暂不接受申请。
aspen-summer-program: 美国 Aspen 物理中心夏季项目，面向博士后及以上参与者，特殊情况下也接收即将毕业的博士生。页面称提供财务援助，可在申请表中提出请求。
assas-contrat-doctoral-candidature: 巴黎 Panthéon-Assas 大学博士合同，持有人免交学费（仍需缴纳 CVEC）。需导师承诺书、研究计划、成绩单及硕士二年级论文 PDF，经 ADUM 线上提交，由博士学院遴选，初筛后约 10 分钟面试。
astar-arap: 新加坡 A*STAR 研究实习项目（ARAP），面向海外合作大学的博士生，由双方导师共同提名，在 A*STAR 研究所完成 1–2 年研究。月津贴 S$3,600，另有一次性机票、安家津贴，但不含学费。
astar-bii-graduate-research: 新加坡 A*STAR 生物信息研究所（BII）的研究生项目，列出支持的博士奖学金（含 SINGA）与合作培养项目。国际生资格需逐项查看。
astar-singa-research-projects: 新加坡 A*STAR 的 SINGA 博士课题列表，全额资助学费，月津贴 S$2,700，资格考试后升至 S$3,200。仅限首次在新加坡高校就读的国际学生，海外奖学金学生需履行 2–6 年 bond。
aston-phd-health-life-sciences: 阿斯顿大学健康与生命科学博士项目提供 4 月与 10 月两个入学批次。资助形式因项目而异，可能是全奖、部分资助或自费，国际生能否申请全奖以项目为准。
asu-hua-wei-darl-phd-2027: 亚利桑那州立大学（ASU）Hua Wei 课题组 DaRL 实验室招生，研究方向含强化学习、城市计算和人在环机器学习。页面称有全奖博士与博后名额，申请需具备 Python 或 C++ 编程能力。
asu-sanford-sociology-phd: 亚利桑那州立大学 Sanford 学院的社会学博士项目，面向秋季入学的申请者。学费、生活费与助教或助研资助情况请以官网为准。
asu-shaofeng-zou-phd-page: 亚利桑那州立大学（ASU）教授邹韶峰（Shaofeng Zou）的课题组博士招生，研究方向为机器学习、强化学习、统计信号处理和信息论。申请需机器学习、统计信号处理或强化学习相关背景，建议先发邮件联系导师。
asu-wang-prospective-students: 亚利桑那州立大学工程学院 Wang 课题组的潜在博士生与博士后页面。资助以导师回复为准，邮件需附上与课题相关的研究背景。
asu-wpcarey-phd-aid: 亚利桑那州立大学 W. P. Carey 商学院博士资助，典型为 9 个月研究生助理津贴，最长 5 年，含学费全免与学生医保，各方向安排略有不同。
au-arts-open-calls: 奥胡斯大学人文学院（Arts）定期发布博士公开征集，对丹麦与国际申请人开放，资助形式为 4+4 奖学金或 5+3 fellowship。部分轮次仅接受 4+4 申请，具体以各征集为准。
au-baker-bright-sparks: Baker 研究所 Bright Sparks 博士补充奖学金（Top-up），面向博士生的补充资助，按竞争性评选授予，每年 $6000、共三年，可作为博士期间的额外经费。
au-bss-phd: 奥胡斯大学商学与社会科学院（BSS）博士项目每年分两轮申请。通用招聘面向丹麦及国际申请人，除非另有说明；具体项目的学历与语言要求以招聘公告为准。
au-florey-funding-route: 墨尔本大学弗洛里研究所（Florey）博士生的入学路径：先找导师与项目，再通过墨大系统申请。国际生自动纳入墨尔本研究奖学金（MRS）评审，该奖学金含全额学费减免与生活津贴，页面称每年三轮。
au-health-open-calls: 奥胡斯大学健康学院每年两轮公开征集博士，每轮约 10 个全额资助博士奖学金（fully financed PhD fellowship），其余为入学名额或部分资助。
au-health-perfusion-pet-phd: 奥胡斯大学医院核医学部的Perfusion PET成像工具博士项目，三年期全额资助，计划2027年1月1日入学。需物理、生物医学工程或相关专业硕士学位，动态PET与动力学建模经验为加分项。
au-hudson-student-brochure: Hudson 研究所研究生手册（由 Monash 授位），列出 2027 年入学的学生研究项目（含 PhD）。申请时需先选定课题，再邮件联系导师。
au-math-vacancies: 奥胡斯大学数学系带薪博士岗位（Mathematics and Stochastics），官网博士招聘页可见一轮岗位。薪资、学历与国际生资格以岗位公告为准。
au-phd-vacant-positions-hub: 奥胡斯大学（AU）博士岗位统一入口，汇集各研究生院的指定课题岗位与个人申请（open call）两类征集，不是单一岗位。个人申请需提交自己的博士项目描述。
au-physics-orbitronics-phd: 奥胡斯大学自然科学院的带薪博士岗，研究方向为超快角分辨光电子能谱，涉及轨道电子学与拓扑物理。申请需物理或相关硕士学位，入学时间为 2027 年 2 月 1 日或之后。
au-sydney-arc-postgrad-scholarship: 悉尼大学理学院挂靠 ARC 项目的研究生奖学金，研究须与所申请的 ARC 项目相关，津贴按大学 RTP 标准发放，并为获奖国际生提供学费。未获无条件录取者可申请，但取得无条件录取前不发放奖学金 offer。
au-tech-apply-here: 奥胡斯大学工程与技术科学研究生院统一发布博士岗位，按具体项目申请，丹麦博士为带薪雇员。需工程或相关专业硕士学位。
au-tech-mass-spec-imaging-phd: 奥胡斯大学计算质谱成像与空间代谢组学博士岗位，带薪，偏向AI与数据分析，计划2027年2月1日入学。需相关专业硕士学位。
auburn-chemeng-intl-assistantship: 奥本大学化学工程博士的助研或助教资助，博士生至少每年可获32,500美元的全额资助并含学费。录取的国际生通常首学期担任助教，需通过TSE口语测试或抵校后口试。
auckland-csc-phd: 奥克兰大学（新西兰）与 CSC 合作的博士奖学金，鼓励中国优秀学生申请。学费减免年限、生活费等细节需查看学校的 Learn more 页面。
auckland-doctoral-international: 奥克兰大学国际生博士奖学金随博士申请一并评审，录取前即可被考虑。2026 年免税津贴最高 $35,468/年，最长 42 个月，符合国内学费政策的国际生可获学费覆盖。
auckland-fmhs-deans-intl-doctoral: 奥克兰大学医学与健康科学学院（FMHS）院长国际博士奖学金，面向国际生攻读该学院首个博士学位，每年 1 个名额，最长 42 个月，另含学费与健康保险。无需单独申请，由学院推荐授予。
audiolabs-erlangen-career: 埃尔朗根-纽伦堡大学与弗劳恩霍夫 IIS 联合运营的音频信号处理实验室（AudioLabs），招收博士生与博后。申请需通过弗劳恩霍夫 IIS 人事部门投递，邮件注明 AudioLabs。
austms-careers: 澳大利亚数学学会（AustMS）职位板，可找到 UNSW、ANU、昆士兰大学、QUT、墨尔本大学等高校的数学博士与博后岗位，可按高校逐一查看各岗位的截止日期与要求。
aviz-inria-hci-jobs: Inria AVIZ 可视化与人机交互团队招聘页，当前列出 2027 年秋季入学的博士岗，课题为地理数字孪生所用数据资源的合理性与偏差可视化。
az-cambridge-noncl-phd: 阿斯利康与剑桥合作的非临床博士项目（4 年），由剑桥导师与阿斯利康联合提交课题。申请前需在剑桥招聘页找到对应的 AZ 资助岗位，项目资助覆盖津贴与本地生标准学费。
azrieli-international-postdoc: 以色列Azrieli国际博士后奖学金，面向非以色列博士，为期2年，津贴每年ILS 168,000，另有研究与差旅经费。申请前需获以色列学术机构教师作为导师，博士学位不早于2023年11月1日。
azrieli-visiting-phd-fellowship: Azrieli 国际访问博士奖学金（以色列）。在非以色列机构读博满一年、无以色列学术经历者，可赴以色列高校访问约 4 个月，每月 12,000 新谢克尔，需先找到以方导师。
babraham-bioscape-phd: BioSCaPe 四年制生物科学博士项目，由剑桥大学、Wellcome Sanger、Babraham 与 LMB 联合举办，官网称该项目为全额资助，并要求学生完成企业实习。
babraham-institute-phd: 剑桥 Babraham 研究所博士项目，需 2:1 荣誉学位或同等学历及两封推荐信，IELTS 总分 7.0。非英国、非欧盟申请者须自筹学费与生活费或另获资助。
babraham-phd-funding: Babraham 研究所的博士招生，须通过剑桥大学研究生申请门户申请，每年 9 月至 12 月初开放。海外申请人若无 BBSRC 或 MRC 名额，需自证有足够资金覆盖学费与生活费。
bangor-postgraduate-funding: 班戈大学研究生奖学金汇总页，含 ESRC DTP Wales 博士名额与国际生奖学金（部分资助）。国际生可自动考虑最高 £4,000 奖学金，无需单独申请；全额博士名额的国际生资格需逐条查看。
bar-ilan-postdoc-fellowship: 以色列巴伊兰大学博士后研究员计划，面向近 5 年内获博士学位的年轻学者。申请需校内资深导师书面同意，并需自备医疗保险。
bard-graduate-center-phd: 巴德研究生中心装饰艺术与物质文化博士项目。学院目标是以奖学金与研究津贴支持所有录取博士生，资助一般为五年期，含全额学费奖学金与年度研究津贴，津贴具体数额需向招生办确认。
basel-bgsh-starter-scholarships-2027: 巴塞尔历史研究生院（BGSH）一年期启动奖学金，2027 年 4 月开始，金额 CHF 32,000，分两期发放。需历史学硕士或同等学位，申请时须列出一名 BGSH 导师，获奖者须注册为巴塞尔大学博士生。
basel-endress-postdoc-cluster: 依托巴塞尔–弗赖堡量子集群的 Georg H. Endress 博士后奖学金，本轮招两名博士后，任期两年，可在弗赖堡或巴塞尔任职。申请前建议先联系拟合作的 PI。
basf-nao-asia-phd: BASF 亚洲开放创新网络（NAO）博士合作项目，合作大学的博士候选人或博士后可承担产业相关的高分子或材料科学课题，由教授与 BASF 导师共同指导。申请需向 NAO 联系人发送简历与动机信。
bath-china-doctoral-funding: 巴斯大学与 CSC 联合资助项目，最多 10 个新博士名额，涵盖国际学费、生活津贴与差旅，最长 48 个月。限中国大陆公民及永久居民，申请时需注明 CSC-Bath，获提名函后再申请 CSC。
bath-research-with-impact-phd: 英国巴斯大学 Research with Impact 博士奖学金，面向国际和国内学生，四年内资助 28 名学生。学校承担学费，并提供与 UKRI 挂钩的生活费。
bath-spa-fees-funding: 巴斯斯巴大学博士资助主要来自 ESRC South West DTP，覆盖教育、管理与商业等学科。每个路径最多推荐 3 份申请，其中最多 2 份可为国际候选人。SWDTP 资助不保证，建议先与潜在导师讨论研究想法。
bath-swdtp-esrc-application: 巴斯大学 SWDTP（ESRC）博士奖学金申请指南，面向英国与国际学生。须先完整提交巴斯博士申请并在资助栏选择 ESRC，不能直接向 ESRC 申请；需导师支持（Annex B 导师声明），入选者须接受在线面试。
bath-vc-international-scholarships: 巴斯大学 Vice-Chancellor 国际博士奖学金，减免学费（不含生活费），减免期 3.5 年，2027/28 入学减免后学费为 £12,750。须先获博士录取并确定导师，不可与其他 Bath 或 UKRI 奖学金叠加。
bauhaus-weimar-doctorate: 魏玛包豪斯大学艺术与设计博士，三年制，论文兼含学术与艺术或设计两部分，由学术教授与艺术或设计教授共同指导。申请者需有艺术或设计类硕士或文凭，并具备德语和英语能力。研究训练组提供带薪博士岗位。
bbsrc-nwdp-manchester-liverpool: 曼彻斯特大学与利物浦大学联合承办的 BBSRC 西北生物科学博士项目（NWDP），提供学费与 UKRI 标准津贴，为期四年，面向英国及国际申请者。页面称竞争预计非常激烈。
bc-chemistry-funding: 波士顿学院化学系博士助理津贴，含学费减免，2026–2027 学年 12 个月津贴为 $46,560。录取按滚动方式审核，国际生约占研究生的 30%。
bc-cs-phd-fall2027: 波士顿学院计算机科学博士项目，2027 年秋季入学，方向为 AI/ML 与计算理论。页面写明院系力争为每位全职博士生提供五个学年的支持。
bc-sociology-funding: 波士顿学院社会学系博士资助，五年内提供学费与生活津贴，多以教学服务交换，通常为 TA 三年、TF 两年。
bcam-joboffers-portal: 西班牙巴斯克应用数学中心（BCAM）的招聘门户，目前列出博后岗位 IC2026_09_01，并有硕士论文与实习项目，联系邮箱为 joinus@bcamath.org。
bcm-phd-benefits: 贝勒医学院（BCM）研究生院的博士项目，博士生可获竞争性津贴，并享有全额学费减免与个人医保，适合看重生活保障的申请者了解福利结构。
bcu-ahrc-dla-2027: 英国伯明翰城市大学 2027 年 9 月入学的 AHRC 博士地标奖学金，共 6 个全额岗位。每年仅 1 名国际申请人可获全额学费减免与 UKRI 标准津贴，建议先提交兴趣表达（非强制）。
bcu-phd-studentships: 伯明翰城市大学的全额博士岗位为期 36 个月，2026/7 年津贴 £21,805（免税，按月发放）。学费奖学金面向 Home（本地）学生，最长 3 年，并以完成研究实践研究生证书课程等为条件。
be-fnrs-bourses-mandats-2026: 比利时 F.R.S.-FNRS 2026 年 Bourses et Mandats 征集，涵盖 ASP、BSD、CSD 等博士生类岗位与博士后类岗位。申请通过 e-space 系统进行，页面为法语，资格以官方指南为准。
be-fnrs-fresh-2026-guide: 比利时 F.R.S.-FNRS 面向人文社科方向的 FRESH 博士奖学金，需由比利时高校博士学院或导师推荐，经校长确认后提交。2026 轮指南为法文版。
be-fnrs-fria-2026-guide: 比利时 F.R.S.-FNRS 的 FRIA 博士奖学金，严格限于已获学位、拟在工业或农业领域发展研究职业的申请人，并优先考虑具有工业或农业应用前景的项目。
be-fwo-junior-postdoc-2026: 比利时 FWO 2026 年初级与高级博士后奖学金，需由佛兰德高校导师接收。初级博后要求博士毕业不超过 3 年，高级博后为毕业 3–6 年，导师推荐信权重提高。
be-imec-phd: imec 与鲁汶、根特等比利时高校合作的博士项目，博士学位由合作高校授予，财务支持与就业安排由 imec 处理。一次最多申请 3 个项目，按官网参考编号选题。
be-uantwerp-doctoral-fellowships: 安特卫普大学博士奖学金页面，汇总多项资助。VLAIO Baekeland 对所有国籍开放，但需由比利时企业与高校合作申请；BAEF 面向比利时学生与研究人员，Fulbright 面向比利时（及卢森堡）公民。
be-uantwerp-funding-postdoc: 安特卫普大学博士后的内部与外部资助汇总入口，多数资助要求持有博士学位，具体资格以 FWO、MSCA、BOF 等项目页为准。
be-ugent-csc-cofunding: 根特大学与国家留学基金委（CSC）的联合博士项目，每年共同资助约 50 名新 CSC 博士生。需先获 UGent 教授同意担任导师，并与国内高校联合攻读；仅为境外交换、拟在中国完成博士者不符合。
be-uhasselt-bof-2026: 哈塞尔特大学 2026 年 BOF 博士奖学金，官网称不限国籍与年龄。须先获该校某学院博士录取，获奖后须在比利时居住完整博士期间，并需同时向 FWO 重新申请。
be-uhasselt-bof-maastricht-2026: 马斯特里赫特大学与哈塞尔特大学合作的 2026 年联合博士奖学金，两校各任用 1 名候选人，任期 4 年，每人获 1 万欧元研究与差旅预算。要求具备相关硕士学位及优秀成绩。
be-uhasselt-bof-unamur-phd: 哈塞尔特大学与那慕尔大学联合的 BOF 博士奖学金，两校共同资助 2 个全职博士名额，首期 2 年可续 2 年，候选人在两校各任职 50%。页面称不限国籍、性别、年龄。
be-uhasselt-vacancies: 哈塞尔特大学官方职位页，页面所见 3 个职位为研究员（40%）、博士后研究员（100%）和副教授/教授（100%），需硕士或同等学历。
be-ulb-academic-vacancies: 布鲁塞尔自由大学学术与科研职位列表（页面以法语为主），博士岗位多为助理类，可能兼职教学。助理岗位需欧盟第二周期学位或经认可的同等学历。
be-ulb-financer-these: ULB 官方博士经费说明页（法语），列出校内与外部资助征集、F.R.S.-FNRS 的 FRIA/FRESH 等博士资助，以及导师研究项目下的博士岗位，页面称竞争激烈。
be-ulb-funding-your-phd-en: 布鲁塞尔自由大学英文博士经费说明页，列出校内 Mini-ARC、发展合作奖学金，以及 F.R.S.-FNRS 的 Aspirant、FRIA（理工与生命科学）、FRESH（人文社科）等博士资助，并有校企合作的 Applied PhD 与 Win4Doc 途径。
be-vub-csc-phd: 布鲁塞尔自由大学（VUB）CSC 博士项目，涵盖全博士与联合培养博士两类。CSC 提供月生活津贴和国际机票，校方承担学费及（全博士）医疗保险。仅限中国国籍，需先联系导师并在线预申请。
be-vub-jobs: VUB 官方招聘平台 jobs.vub.be，设有博士生（Doctorandi）类别，页面称每年发布 300 多个岗位。常见流程为申请材料审核加面试两步选拔。
beatriz-galindo-2026: 西班牙Beatriz Galindo高层次人才合同（2026年），为海外在职研究者争取西班牙大学4年教职合同。申请时须在西班牙境外机构任职，senior模式需7年以上海外经验，需先联系目标大学由其提交申请。
bekker-nawa-programme: 波兰国家学术交流署（NAWA）的 Bekker 项目，资助赴合作单位开展研究。页面称面向波兰科学与学术机构的研究人员，博士生可通过在合作单位完成部分博士教育或收集研究材料参与。
belfer-isp-fellowship: 哈佛肯尼迪学院 Belfer 中心国际安全项目的一年期研究员（可续），面向在读博士及近 5 年内获博士者。津贴名额有限，也有无津贴职位；国际申请人资格以当年公告为准。
bergamo-csc: 贝加莫大学 CSC 博士项目，接收中国大陆国籍、获 CSC 资助的博士生，仅录取获 CSC 奖学金的候选人。流程为校内网上预选，通过后再由 CSC 评审。
berkeley-city-regional-planning-grad: 伯克利城市与区域规划系的研究生入口页，可查到博士项目及各类奖学金的入口。通常需已获规划或相关硕士学位；资助包由系招生委员会统一配置，无需单独申请。
berkeley-erg-phd-admissions: 加州大学伯克利分校能源与资源集团（ERG）跨学科能源与环境博士项目，仅秋季入学。需学士或同等学历，有2年以上相关工作经验者优先；每年约350人申请，录取约20人。资助方案可能与录取通知分开提供。
berkeley-gateway-fellowship: 伯克利 I-House 为博士生提供的 Gateway 奖学金，资助覆盖范围为全额。申请者需已获加州大学伯克利分校录取、能住单人房间，并由院系提名，优先新入学且有经济需求的学生。
berkeley-ghes-fellowship: 加州大学伯克利分校全球卫生新锐学者（GHES）博士后项目，NIH 资助，为期12个月的导师制。非美国申请者只能走 LMIC 博后轨道，须为 LMIC 公民并隶属合作机构。
berkeley-haas-phd-costs: 伯克利 Haas 商学院博士的费用与资助组合，包括五年期奖学金、助教或研究津贴，以及学费覆盖，取决于学业进展。申请时自动参与系内资助评审，录取后通知资助结果。
berkeley-math-financial-aid: 加州大学伯克利分校数学系的博士资助：系页面承诺至少 5 年资助，形式包括助教、助研和奖学金。金额与学费减免以系里说明为准。
berkeley-psych-phd-funding: 加州大学伯克利分校心理学系 PhD 的助教与研究助理岗位，含学费减免与每月津贴。国际生须每学期支付非居民补充学费（NRST），系与导师安排前四个学期的 NRST 支付。
berkeley-public-policy-phd: 加州大学伯克利分校（UC Berkeley）Goldman 学院公共政策博士，侧重学术社会科学研究，仅秋季入学。需 GRE（普通测试）成绩，院系通常每年只录取两到三名博士申请者。
berkeley-teitz-fellowship: 加州大学伯克利分校城市与区域规划方向的 Michael B. Teitz 奖学金，面向全日制 MCP 或博士生，金额最高 $2,500，优先博士生。需提交 CV、近期研究成果与研究计划信。
berlin-bergsas-predoc: 柏林自由大学古代研究研究生院（BerGSAS）的预博士奖学金，每月 €1,000，最长 6 个月，不可延期，用于制定博士选题并申请后续资助。申请者需已通过硕士论文评定，并计划在 FU Berlin 攻读博士。
bern-fcrp-clinical-project-call: 伯尔尼大学 Vetsuisse 学院临床研究项目资助（FCRP），面向临床学科的博士生与拟申请 Habilitation 的进阶博后，资助本人或支持人员的（部分）岗位经费，不资助项目成本。申请者须隶属该学院三个系之一。
bern-gcb-graduate-school: 伯尔尼大学细胞与生物医学研究生院（瑞士），提供结构化实验研究培训，授予 PhD。通常需先确定导师与课题，申请须在研究项目开始后 4 个月内提交，并需英文面试。
bernstein-freiburg-postdoc: 弗莱堡 Bernstein 计算神经科学中心的博后培养项目，面向资深博士生与博士后，提供研究、教学与方法论培训。职位单独发布，感兴趣者需直接联系相关研究员询问空缺。
bernstein-job-pool: 德国计算神经科学网络（Bernstein）的职位页，列有博士与博后岗位，来自成员实验室与合作项目，如 ELLIS Institute Tübingen、Ruhr University Bochum 等。各岗位截止不一，需逐条查看。
best-toulouse-cofund: 图卢兹 BEST 的 MSCA COFUND 博士项目，共 37 个博士名额，合同 36 个月，估计税后约 €2,800–3,000/月，依家庭情况有所不同。需英语 B2，且近 36 个月在法居留不超过 12 个月。
bgc-jena-jobs: 马普生物地球化学研究所（耶拿）招聘页，列有大气逆向建模博后岗位，博士岗位为有薪合同，并介绍访客与奖学金项目。博士申请需理学硕士或同等学位，通过 IMPRS 在线申请。
bgs-phd-studentships: 英国地质调查局（BGS）的博士研究平台 BUFI，多数名额通过 NERC 博士培训伙伴（DTP）资助，须经合作大学的项目申请，不接受个人直接申请，国际生名额有限。
bgse-funding: 波恩经济学研究生院（BGSE）的硕博合并项目，含 2 年硕士与 3 年博士。学生自入学起领取月补助，当前为 €1,565/月（自 2026-10-01 起），符合里程碑规则者最长资助 5 年。德国公立大学对国际生免除学费，仅缴学期费。
bgu-postdoc-opportunities: 本-古里安大学（BGU）国际办公室汇总的博士后资助与机会。Fulbright 博后限美国公民且需 BGU 邀请函，其他项目通常需 BGU 合作导师支持。
biblhertz-census-reception-antiquity: 由洪堡大学、Bibliotheca Hertziana 与 Warburg Institute 共同资助的古典艺术与建筑接受史研究奖学金，面向博士与博后。博士阶段约 €1,500/月，共 6 个月，另有 €500 差旅补助。
bicmr-postdoc-math-2026: 北京国际数学研究中心（BICMR）的招聘总页，列有博士后岗位类别，每年发布征集。具体聘期与要求以当期公告为准。
bielefeld-grace-graduate-centre: 比勒费尔德大学 GrACe 研究生中心，是博士候选人与博后的统一咨询入口。具体岗位与奖学金分散在各研究生院与 Promotionsprogramme 中，需逐个查看。
bielefeld-nachwuchsfonds: 比勒费尔德大学青年研究者基金（Nachwuchsfonds），含硕博过渡的 Career Bridge（€1,000/月，最多 6 个月）、博士完成奖学金（€1,250/月，最多 6 个月）及早期博后资助。Career Bridge 需成绩高于平均水平并有推荐人。
bifold-graduate-school-berlin: 柏林 BIFOLD 数据与学习基础研究所的博士项目，每年 10 个全额资助岗位（TV-L E13），方向为数据管理与机器学习。需计算机或相关领域硕士（或同等学历），申请材料合并为单一 PDF 发送至官网邮箱。
bigs-bonn-math: 波恩大学数学博士院（BIGS），录取不自动包含资助，BIGS 会筛选可用的资助来源。Hausdorff 博士职位为 TV-L E13 75%，净工资约 2000–2300 欧元/月（视个人情况）。
bigsss-news-calls: 不来梅国际社会科学研究生院（BIGSSS）博士项目征集公告页。博士候选人需由 BIGSSS 教员担任导师；Adjunct 需第一导师的支持信，Affiliated 要求英语 C1。
bih-phd-programme-en: 德国柏林卫生研究院（BIH）英文博士项目，由 BIH 附属 PI 指导，最长四年，须同时融入博士学院或结构化项目。采用雇员合同，资助为 65% E13 职位，期限两年。
bimsa-postdoc-chern-instructor: 北京雁栖湖应用数学研究院（BIMSA）的博士后岗位，含 Chern Instructor 与普通博士后。Chern Instructor 年薪 RMB 40–55 万，普通博士后 RMB 30–50 万，经 MathJobs 申请，并需 3 封推荐信。
binghamton-som-phd-funding: 宾汉姆顿大学管理学博士录取者可获助研或助教津贴并免学费，最长四年，视表现续期。2026 年秋季助研津贴 $27,500/年，每周约 20 小时协助教学或研究，需先被博士项目录取。
biozentrum-phd-faq: Biozentrum 博士生常见问题，说明可直接联系课题组负责人申请博士，是奖学金之外的第二条路径。需硕士或可入读博士的同等学历。
biozentrum-phd-fellowship: 巴塞尔大学 Biozentrum 博士奖学金（PhD Fellowship），面向全球申请者、无国籍限制。月薪约 CHF 3,500（净额，按 SNSF 标准），学费 CHF 350/学期；入学后先轮转再选课题组。
biozentrum-phd-fellowships: 巴塞尔大学 Biozentrum 面向全球申请者的博士奖学金，覆盖整个博士阶段。需持有或即将获得硕士或同等学位，前一年需在至少两个实验室轮转后再选课题组，申请时不得已注册博士。
birmingham-csc-joint-phd: 伯明翰大学与 CSC 联合博士奖学金，学校覆盖海外学费与实验费，CSC 提供生活津贴与往返机票。需持中国大陆护照，须先获伯明翰全日制博士录取并与拟导师联系。
birmingham-csc-phd-joint: 伯明翰大学 CSC 联合博士奖学金，面向持中国大陆护照者（港澳台不可申请）。学校负担学费与实验费，CSC 提供生活津贴与往返机票；需先获伯明翰全职博士录取。
birmingham-music-doctoral-scholarships: 伯明翰大学音乐系博士奖学金，涵盖作曲、音乐学、表演等方向，国际生与本地生均可申请。需先提交博士申请，再提交学院统一的奖学金申请。
birmingham-sr-phd-admissions: 伯明翰大学空间研究与引力波博士招生页，覆盖引力波天文与仪器方向，部分为 STFC 全奖名额。STFC 名额面向英国学生并要求 2:1 以上学位，国际生资助以具体岗位为准。
bis-phd-fellowship: 国际清算银行（BIS）博士研究奖学金，安排在巴塞尔进行约 3–11 个月的短期研究驻留，含工资、医保与差旅等。申请人需在读经济、金融或相关领域博士。
biu-postdoc-scholarships: 巴伊兰大学（BIU）博后奖学金，面向非以色列公民及居民，月津贴 ILS 14,000（年 168,000），另有研究经费 ILS 20,000/年。申请需持博士学位，并先获 BIU 校内导师接收。
biu-presidential-phd-scholarship: 以色列巴伊兰大学（BIU）的校长博士奖学金，提供生活津贴并免学费，为期四年。需持论文型硕士学位且成绩优秀，并提交成绩单、硕士论文成绩证明与两封推荐信。
bjmu-boya-postdoc-pdf: 北京大学医学部博雅博士后 2026 年通知，年税前 20 万元，另有租房补贴 6 万元/年及各类保险、公积金、住房补贴。要求全职全时进站从事博士后研究，年龄不超过 35 周岁。
bluesky-mastodon-slice-jobsacuk-postdoc: jobs.ac.uk 博士后职位分类页，是英国最大的学术招聘聚合站之一，可横向检索英国有薪博后。其中部分为短期项目岗，而非独立博后基金。
bms-berlin: 柏林三校联合的数学博士院 Berlin Mathematical School（MATH+），免学费。Phase I 硕士阶段有 10 个资助名额，博士阶段由 BMS 配对导师，BMS 本身不发放资助。
bnl-goldhaber-fellowship: 布鲁克海文国家实验室的 Goldhaber 杰出博后奖学金，聘期 3 年，每轮名额很少。须获得博士学位不超过 3 年，并有实验室内导师承诺支持。对中国大陆申请者可能有 DOE 外国人访问与安全审查限制，申请前需向招聘方确认。
bnl-raymond-davis-fellowship: 布鲁克海文国家实验室的 Raymond Davis Jr. 早期职业奖学金，面向 STEM 领域博士，任期 4 年，每轮最多选 2 名。须博士毕业后至少 2 年经验，申请时距博士学位不超过 5 年，入选者与一名 sponsor 合作研究。
boe-phd-placements: 英格兰银行的博士实习项目，约 12 周带薪，伦敦或利兹混合办公，需在读博士且研究学科与中央银行政策相关。薪资伦敦为 £30,000/年（按比例），利兹为 £27,000/年。
boe-research-fellowships: 英格兰银行研究资助，主要为 Houblon-Norman 与 George 研究奖学金，资助期 1 个月至 1 年，按日发放生活津贴。申请时可自选经济或金融题目，面向博士后阶段研究者。
boeckler-promotionsstipendium: 德国汉斯·博克勒基金会博士奖学金，面向各学科，每年约 100 个名额，每月 1,750 欧元（含 100 欧元研究经费）。需已获德国国家承认高校的博士录取，并在工会或社会政治领域有积极参与。
boku-doctoral-studies: 维也纳农业大学（BOKU）博士项目总览，共13个博士项目。多数岗位通过学院批量招聘，2026年国际申请表要求写明拟研究课题、拟导师及既往学位，部分课程以德语授课。
bologna-public-gomap-2026-27: 博洛尼亚大学公共治理、管理与政策博士（Public-GoMaP），三年制，英文与意大利文授课。仅部分岗位有奖学金，最低净津贴约 €1,250/月，是否全额资助以具体岗位为准。
bond-hdr-scholarships: Bond 大学私立博士 HDR 奖学金，2026 年全日制津贴标准为每年 AUD 34,315。国际生可获学费部分减免，非全额；需已提交该博士项目申请，且不得同时领取澳洲政府同类 HDR 费用减免奖学金。
bonn-cologne-gradschool-applying: 波恩-科隆物理与天文研究生院，允许全年申请，多数情况需先由导师接收，并需成绩单、研究计划和推荐信。奖学金与岗位由各研究组决定，覆盖情况不统一。
bonn-hcm-opportunities: 波恩 Hausdorff 数学中心的岗位与机会页，列出当前在招的数学方向博士岗位与博后岗位，可直接在页面查看具体职位。
bonn-hcm-postdoc-positions: 波恩 Hausdorff 数学中心（HCM）博士后岗位，初始合同 2 年，可再续 1 年。申请需在波恩大学找到本地导师并选择一个研究领域，还需至少两封非波恩大学人员的推荐信。
bonn-math-postdoc-positions: 波恩大学数学系博后岗位列表（HCM 博后岗位），岗位以薪资形式提供，当前公告须通过 MathJobs 平台申请。
booth-phd-aid: 芝加哥布斯商学院博士财务资助，所有录取博士生获学费资助、生活津贴、学生医保、电脑补贴和研究差旅经费。2025 年入学者每年 $55,000，第 1–5 年保证。
bordeaux-csc: 波尔多大学 CSC 博士奖学金年度征集。需先由导师提交课题并列入年度清单，候选人面谈获校方有条件录取信后再申请 CSC，资助期为 36 或 48 个月。
botany-society-jobs-board: 美国植物学会（BSA）的共享职位板，汇总大学教职、研究员、博后及博士助研（Ph.D. Graduate Assistantship）等岗位，具体资助以各岗位页为准。
bps-phd-funding-programme: 英国药理学会（BPS）博士资助，单次申请由学会决定授予 AJ Clark 或 Sir David Jack 奖学金。英国校外生活津贴 £21,805/年（2026/27），伦敦 £23,805/年，另有每年最多 £10,000 研究经费。国际学生可申请，但需说明国际学费如何覆盖。
brandeis-ibs-econ-finance-phd: 布兰迪斯大学国际商学院的国际经济与金融博士项目，官网称几乎所有录取博士生获全额学费奖学金、医保与生活津贴。项目隔年招生，目前不接受申请，官网称下一次预计 2028 年秋季入学。
brandeis-neuroscience-funding: 布兰迪斯大学（Brandeis）神经科学博士项目，录取即获学费与津贴资助，津贴为 $38,496/年（2023 年 7 月起的标准）。国际生需提供英语成绩。
bremen-byrd-doctorate: 不来梅大学 BYRD 博士研究者页，说明攻读博士的途径。BYRD 本身不受理博士申请，多为导师个人名额，需先联系拟导师并申请其岗位，资金取决于导师项目经费。
bremen-promotionsprogramme: 不来梅大学的博士项目总目录，汇总各研究生院与 DFG 研究生院，包括 MARUM Research Academy、BIGSSS、MMMIGS 网络等。岗位与奖学金以各项目页面为准。
bric-copenhagen-phd: 哥本哈根大学生物技术研究与创新中心（BRIC）博士项目 MoMeD、DISCOVER 面向国际生，博后有 LEAD（MSCA 共资助）项目。博士职位需生命科学或医学相关硕士及实验室经验。
brin-postdoc-program: 印尼国家研究创新署（BRIN）博士后项目，面向外籍博士，博士学位不超过 5 年。需先与拟合作的 BRIN 研究员取得联系，并办理移民许可。
bristol-astro-phd-studentships: 布里斯托大学天体物理博士名额页，名额由 STFC 及校方提供，为期 3.5–4 年，欢迎英国或海外学生申请。通常需一等或上二等荣誉学位，申请时需在个人陈述中写明感兴趣的项目编号。
bristol-brms-scholarship: 布里斯托医学院 4 年期全奖博士奖学金，官方页称英国与非英国学生学费均减免，免税生活补助按 UKRI 标准，另有每年 £2,100 科研经费。
bristol-cabot-phds: 布里斯托大学Cabot环境研究所的博士机会页，列出NERC GW4+ DTC、Sustainable Futures等环境类博士项目。建议先与感兴趣的导师沟通，再投递申请。
bristol-chemistry-funded-phd: 布里斯托大学化学学院的资助博士课题，含 EPSRC DTP、TECS 与 Aerosol Science 等项目。EPSRC DTP 向海外申请者开放，申请前需先联系拟合作导师并提交一页课题大纲。
bristol-csc-joint-phd-guidance: 布里斯托大学与国家留学基金委（CSC）联合博士奖学金，覆盖全额学费、CSC 生活津贴及往返机票，毕业后需回国服务两年。申请人须为中国大陆永久居民，申请时不超过 35 岁。
bristol-csc-joint-scholarship: 布里斯托大学化学学院 CSC 联合奖学金，需在 Bristol 博士项目申请中选择该奖学金并列出四名拟导师。海外申请者需在近 12 个月内获得或即将获得硕士，英语须在 CSC 申请前达标。
bristol-csc-scholarship: 布里斯托大学 CSC 博士奖学金，大学承担学费，CSC 提供生活津贴与返程机票。限中国大陆永久居民、年龄不超过 35 岁，需有硕士或即将完成的学位及有效英语成绩，学成后需回国服务两年。
bristol-geographic-data-science-phd: 布里斯托大学地理数据科学博士项目，含奖学金，覆盖国际与本地学费并发放 UKRI 标准津贴。申请需提交研究计划并至少列出 2 位拟导师，建议先联系导师。
bristol-hls-pgr-scholarships: 布里斯托大学健康与生命科学方向的博士奖学金，含全额学费和生活津贴，津贴水平与主要研究理事会资助一致。2026/27 全日制生活津贴为 £21,805。
bristol-pg-research-scholarship: 布里斯托大学理工与医学方向研究生奖学金，面向国际生，覆盖学费并提供按 UKRI 标准的生活津贴。国际生的覆盖范围需向所在学院确认。
bristol-practice-oriented-ai-cdt: 布里斯托实践导向 AI 博士培训中心，每年约 10 个资助名额，含学费、津贴与科研差旅。资助名额以英国学生为主，国际生可申请但多为自费或赞助。
bristol-sasakawa-japanese-phd: 布里斯托大学的年度 Sasakawa 日本研究博士奖学金，限人文、社科类且论文主要研究日本的博士项目，金额为 £15,000（一年），非全奖，可作补充资金。申请时需在博士申请表中注明 Sasakawa。
bristol-science-pgr-scholarships: 布里斯托大学理学与工程学院的博士奖学金，面向全球申请者，全额学费加 UKRI 标准生活津贴及科研经费。生活津贴为 £20,780（按 25/26 数字）。
brnz-early-career-researchers: 新西兰脑研究所（Brain Research NZ）的早期研究者资助入口，覆盖博士与博后。博士后奖学金目前关闭，毛利与太平洋裔学者另有专门项目。
broad-schmidt-center-postdoc: 美国 Broad 研究所 Eric and Wendy Schmidt 中心的博士后，面向具备机器学习、统计或应用数学背景、研究生物医学问题的学者。一年一聘、可续聘至第三年，需同时找 Broad、MIT 或哈佛的导师。
brookes-biodtp-studentships: 牛津布鲁克斯大学的 BBSRC/NERC 博士岗位，经牛津生物 DTP 列出，由布鲁克斯大学指导，学费与生活津贴全覆盖。牛津生物 DTP 主页称已不再招收新生。
brown-admitted-phd-financing-guide: 布朗大学录取博士生指南的资助章节，说明录取博士生可获 5 年资助（人文社科 6 年），包括津贴、学费减免及健康服务费与保险补助，具体以录取信为准。
brown-five-year-guarantee: 布朗大学研究生院承诺博士新生获得 5 年经费保障（人文社科 6 年），包括津贴、学费减免、健康服务费与医保补贴，以学业进展达标为前提。官网称国内外录取博士生均适用。
brown-phd-funding: 布朗大学研究生院称，大多数新入学博士生可获 5 年资助（人文社科 6 年），包括津贴、学费减免和医保，需学业进展达标。需完成 I-9 就业资格核验表。
bsa-sociology-vacancies-board: 英国社会学会（BSA）的社会学职位聚合页，列出多所英国院校的博士和研究员岗位。可在此找到博士studentship与研究岗位，再进入各岗位页查看要求。
bse-la-caixa-severo-ochoa-phd: 巴塞罗那经济学院（BSE）la Caixa Severo Ochoa 国际博士奖学金，第 1–2 年每年 €18,069，第 3–4 年每年 €26,700，另有研究费。需同时被录取到 BSE 的 GPEFM 或 IDEA 博士项目。
bse-upf-economics-phd-track: 巴塞罗那经济学院与庇拉布拉大学（UPF）联合的经济与金融 Master’s-PhD Track，第一学年修读后取得 BSE 硕士学位并进入博士二年级。2027–28 入学申请已开放，需托福 90+、雅思学术 6.5+ 或 Duolingo 120。
bu-bioinformatics-funding: 波士顿大学生物信息博士项目的资助说明。所有博士资助均含全额学费、医保与差旅，年度津贴起点约 $45,000，资金部分来自 NIH T32 培训经费。
bu-bioinformatics-phd-finaid: 波士顿大学生物信息学方向博士奖学金页（文理研究生院 PhD 项目）。对在读且学业合格的学生承诺 5 年资助，包括学费、津贴与医保补贴，起始津贴为 $45,000/年。
bu-cas-phd-aid: 波士顿大学文理学院为博士生提供最长五年资助，国际生与本地生同等。资助含必修课程全额学费、学生服务与健康费用，并纳入学校医保学分。
bu-earth-phd-funding: 波士顿大学地球与环境系博士资助，新录取的国内外博士生可获最长五年资助，含全额学费奖学金与生活津贴，续资需保持良好学业。系页面称2025–26学年津贴为$46,350/12个月。
bu-econ-phd-five-year-funding: 波士顿大学经济系博士项目，新录取博士生最多可获五年资助，含学费、医保与生活津贴，以学业进展为条件。
bu-pibs-program: 波士顿大学医学院生物医学科学项目（PiBS），官网称为全额资助的伞式博士项目，接受国际学生申请。2025 年 9 月起年津贴 $46,350，按工会合同每年约增 3%。需学士学位、TOEFL 或 IELTS 成绩及 3 封推荐信。
bu-questrom-phd-admissions: 波士顿大学 Questrom 商学院博士项目，官网称提供全额学费奖学金，学费与学生医保保费全包并有生活津贴。评审考虑 GMAT/GRE 成绩、学术背景与研究匹配度。
bu-ssw-phd-funding: 波士顿大学社会工作学院博士项目提供最长五年的多年资助包，包括学费、带薪津贴和医疗保险。助理岗位津贴按八个月学年发放。
buffalo-econ-financial-aid: 布法罗大学经济系为全日制有资助的博士生提供 10 个月助理岗位，自 2027 年秋季起学年津贴 $27,000 并全额学费减免。页面称国内外学生均可按 Presidential Fellowship 条件申请。
buffalo-exercise-nutrition-assistantships: 纽约州立大学布法罗分校运动与营养科学系的博士助教/助研岗位。申请需满足研究生院博士录取要求，岗位需承担服务工作。
buffalo-urban-regional-planning-phd: 布法罗大学城市与区域规划博士项目，通常需规划或相关领域硕士、研究生 GPA 不低于 3.0，页面称不要求 GRE。页面说明资助不保证，申请时需主动咨询助研或助教机会。
burnet-study: Burnet研究所的博士招生入口，博士生需通过Monash、墨尔本大学、La Trobe、RMIT、Deakin等合作大学注册，并获得大学奖学金。建议先联系导师。
bytedance-scholarship: 字节跳动奖学金面向全球在读本科、硕士与博士生，方向包括 AI、计算机与基础科学。获奖者可得 ¥200,000 科研经费，导师另得 ¥100,000。
ca-concordia-jmsb-phd: Concordia 大学 JMSB 商学院博士项目承诺 5 年担保资助共 $100,000 CAD（约 $20,000/年），并减免前 8 学期学费。国际生可获国际学费奖，学费降至魁北克本地水平。
ca-mcgill-desautels-tuition-aid: McGill Desautels 管理学博士资助，每年约 CAD 30,000，共四年，另含魁北克学费及国际学费补贴。第四年需讲授一门 3 学分课程才能获全额资助，持外部奖学金者仅获部分保障。
ca-mcgill-intl-external-awards: 麦吉尔大学国际生外部资助汇总表，列出外部机构与麦吉尔合作的奖学金。页面称该表非穷尽列表且不由研究生院管理，表中列出的国家或地区不含中国大陆。
ca-mcgill-phd-funding-expectations: 麦吉尔大学研究生院说明：所有博士生都会在录取信中获得资助信（Funding Letter），国际生的资助包覆盖其与魁北克学费的差额。具体金额与来源以录取信和院系为准。
ca-mitacs-accelerate-intl: Mitacs Accelerate 是面向各学科学生与博后的高校–企业合作项目，国际博士生须持学生签证，国际博后须持工作许可且在博士毕业 5 年内，每 4–6 个月至少 $10,000 津贴或薪资。
ca-ontario-ogs: 安大略研究生奖学金（OGS）的国际生配额，最高 CAD 15,000/年（每学期最多 5,000）。国际生需持安大略省学习许可并全日制就读，名额受省级配额限制，由院系提名。
ca-quebec-pbeee-2026-2027: 魁北克政府出资、FRQNT 管理的外国学生博士奖学金 PBEEE（2026-27 批次）。年额 25 000 $（前 9 个学期），延期后为 12 000 $（最后 3 个学期），累计最高 87 000 $，另免除高额学费并提供医保。须先经大学预选，仅限非加拿大公民或永久居民。
ca-sfu-cs-funding: SFU 计算机科学系博士资助，学院承诺每年至少 3 万加元、共四年，需保持学业进展，其中含每年 9,000 加元的研究生奖学金（GF）。需获该系博士项目录取。
ca-sfu-geography-funding: SFU 地理系说明页：博士生自 2024 年秋起至少每年 28,000 加元、共 4 年，资金由奖学金、助教和/或助研组合构成，是该系博士生的基础资助保障。
ca-sfu-linguistics-minimum-funding: SFU 语言学系博士生保证每年不低于 CAD $28,000，共 12 学期，资金可来自助教、助研与研究生奖学金等。国际生须证明生活资金不少于 CAD $22,895；Vanier 奖学金对国际博士申请者开放，SSHRC 与 NSERC 奖学金仅限加拿大公民和永久居民。
ca-sfu-postdoc-prospective: 西蒙菲莎大学（SFU）博士后申请者指南，链接博后职位与资助信息。申请人通常需在过去五年内获得博士学位，博后一般在一名或多名 SFU 教员指导下工作 1–3 年。
ca-ubc-biochem-funding: UBC 生物化学系博士保障，2026 年 9 月起入学的全日制博士生，最低总资助包约 CAD 40,000/年，最长 4 年。申请人需被 UBC 博士项目录取。
ca-ubc-okanagan-min-funding: UBC Okanagan 博士最低资助政策，2026 年 9 月起博士前四年最低 CAD 40,000/年，国际生同样适用，资助可由 TA、RA、奖学金等组合构成。温哥华校区政策不同。
ca-umanitoba-cs-financial-aid: 曼尼托巴大学计算机系为新录取研究生提供资助保底，博士前四年每年至少 CAD 23,000。系里另有 UMGF 等对国际生开放的竞争性奖学金，UMGF 每年 2 月 27 日截止。
ca-umanitoba-umgf: 曼尼托巴大学研究生奖学金 UMGF，博士每年 C$25,000，资助 12–48 个月，须由所在系推荐。国际生与加拿大学生均可申请，金额为部分资助。
ca-uoft-ece-funding: 多伦多大学 ECE 博士保障资助，保障期 4 年，2025–26 标准约 CAD 40,000/年（含学费）。2025 年 9 月 1 日或之后入学的博士生，需每年申请一个助教岗位（约 3,178 加元）才能获得其中的助教部分。
ca-uoft-impact-plus-training-awards: 加拿大联邦 Canada Impact+ 研究培训奖，多伦多大学页面列出，面向博士与博后，每年 $70,000、共 2 年。须由持有三机构资助的加拿大教授提名，候选人提名时不得隶属加拿大高校。
ca-uoft-sgs-research-stream-funding: 多伦多大学研究型硕博资助总说明：录取的多数研究型学生可由所在院系获得基础资助，组合包括导师经费、院系资助、学术奖学金及助教、助研工作等，具体金额依院系而定。
ca-uottawa-telfer-phd-funding: 渥太华大学（uOttawa）Telfer 管理学院博士资助，基础资助为 CAD 22,000/年；国际生加上国际博士奖后，每年合计最高 CAD 47,000，最长可资助四年。
ca-usask-cgps-funding: 萨斯喀彻温大学研究生院的博士资助说明：多数博士项目对新录取学生提供保证资助包，每年 $20,000、共 4 年。并非全部项目适用，具体资格与各奖项以研究生院及院系为准。
ca-uvic-ece-awards: 维多利亚大学（UVic）电子与计算机工程博士资助说明。全日制研究型硕博学生自动参与 UVic Fellowship 按 GPA 的评选，国际生可参加；新生需最近两年课程成绩 A- 平均。
calgary-csm-funding-policy: 卡尔加里大学 Cumming 医学院博士最低津贴政策，国际生高于国内。2025–26 年国内最低 $32,000、国际最低 $33,300，津贴部分由导师科研经费提供。
calgary-schulich-phd-min-funding-2026: 卡尔加里大学 Schulich 工程学院 2026 年修订的博士最低资助政策，2026-01-01 起入学的全日制博士保障前四年。国内博士 $31,426.05/年，国际博士 $33,205.65/年（已扣除 IGTA $3,120）。
calgary-werklund-phd-funding: 卡尔加里大学 Werklund 教育学院 PhD 资助保障：2026 年冬季入学起前四年提供基础资助 $27,750/年加学费，国际生扣减 $3,060 IGTA。需申请可申请的奖学金，未申请将减少或取消资助。
caltech-aws-quantum-postdoc: 加州理工学院 IQIM 的 AWS 量子博士后学者，三年期，由 AWS 资助，2027 年秋季入职。第一年年薪 $85,000，另有每年 $7,000 研究经费及一次性搬迁补助。需指定一位 Caltech 教员合作，并经 Academic Jobs Online 提交。
caltech-exp-prize-postdoc: 加州理工学院实验物理与天体物理方向 Prize 博士后，首年年薪 $88,000，另有每年 $10,000 研究经费，需挂靠 PMA 实验组。天体物理候选人须以仪器或实验室工作为主要方向。
caltech-fasa-international: Caltech FASA 国际学生外部奖学金说明，列出 AAUW International、A*STAR、Google PhD 等不要求美国公民身份的项目为例；NSF GRFP、Fulbright 等多要求美国公民或永久居民。
caltech-gps-stanback-postdoc: Caltech 地球与行星科学部的 Foster & Coco Stanback 博后奖学金，面向全球环境科学方向，任期通常两年。资助为 $80,000/年，另有 $10,000 科研经费，须以完成博士学位及第一年进展良好为前提。
caltech-grad-applicant-faq: 加州理工学院研究生申请者常见问题页。研究生办公室称，获录取研究生中超过 98% 可获得学费覆盖与津贴（终结性硕士项目除外）。多数资助需工作授权，入学时须提供证明，除非录取院系另行约定补偿。
caltech-graduate-budget: 加州理工学院（Caltech）博士资助与预算页。资助含学费、强制费用及学生医保补贴；津贴自 2026 年 9 月 1 日起每年 $50,000，按月发放并作为应税收入。随录取发放，无单独申请。
caltech-ppfp: 加州理工学院博士后奖学金项目（PPFP），可选择开放申请或指定导师岗位，最高 $45,000/年，为期两年。需挂靠 Caltech 导师，页面称资格不因国籍等受限。
caltech-seismolab-postdoc: 加州理工学院地震实验室的主任博士后学者，年薪 $78,000，初聘2年，第一年表现良好后续聘，需博士学位，并请3位推荐人将推荐信发送至指定联系人。
cam-med-funding-opportunities: 剑桥大学医学系博士申请者可用的资助入口，包括剑桥大学统一资助、UKRI 下的 MRC 课题制博士名额、Gates Cambridge 及部分系级和学院基金。MRC 名额需申请页面所列主题下的特定课题。
cambridge-ames-postgraduate-funding: 剑桥 AMES 页面列出的中国研究方向资助，包括 Ogden Scholarship（全额学费与生活费，仅限 Home 学费档次的 MPhil 学生）等。需先获剑桥博士或 MPhil 录取，再向学院申请。
cambridge-biological-sciences-phd: 剑桥大学生物科学博士课程，是 Babraham 等研究所博士的统一入口。需通过剑桥统一系统申请，可选课题并标注资助来源，需一等或 2:1 荣誉学位、两位推荐人及 IELTS 总分 7.0。
cambridge-dtp-mr: 剑桥医学研究博士培训项目（DTP-MR）提供全额资助，期限3.5年，包括按 UKRI 最低标准的生活津贴、学费及实验与差旅津贴，须已获医学院相关博士课程录取，并由系推荐面试。
cambridge-engineering-biology-opps: 剑桥大学工程生物学机会页，汇总合成生物与工程生物学方向的博士与博后机会。资助与国际生资格需逐条查看。
cambridge-english-leverhulme-ecf: 剑桥英语系的 Leverhulme 早期职业奖学金，面向博士后，资助形式为薪资。需先通过系内遴选并先联系系内导师，通常在提交博士论文后不超过 4 年申请。
cambridge-funding: 剑桥大学研究生资助总入口，包括 Cambridge Trust 国际奖学金与 CSC Cambridge Scholarship（由国家留学基金委选拔）。Cambridge Trust 面向非英国、非爱尔兰申请人，需先提交博士课程申请并在门户中勾选资助。
cambridge-guimaraes-phd-2027: 剑桥大学物理系 Guimarães 课题组招收 2027 年 10 月入学的博士生，页面要求直接邮件联系 PI。
cambridge-ieef-phd: 剑桥大学 IEEF 能源与环境方向博士奖学金，资助生活费与研究生学费，水平参照英国本土 UKRI 博士资助，期限 3.5 年。需通过大学申请系统列明意向项目，并注明研究将在该研究所开展。
cambridge-jobs-research-term: 剑桥大学官方招聘站上按合同期限筛选的研究类岗位，覆盖各院系博士后与研究助理。国际申请者需办理英国工作许可。
cambridge-judge-finance-pathway: 剑桥大学 Judge 商学院金融方向博士路径，需先读 9 个月 MPhil in Finance，攻读期间获全额资助，研究理事会标准津贴 2024/25 学年为每年 £20,285。
cambridge-law-phd-finance: 剑桥大学法学 PhD 资助入口，汇总学院、大学及 Gates 等奖学金。资助申请与学术申请分开进行，需提交剑桥博士申请（含研究计划）、Gates 500 字陈述、CV 与推荐信。
cambridge-mlg-advanced-ml-phd: 剑桥大学机器学习组（MLG）的高级机器学习博士项目。页面称博士生可获部分或全额资助，资助覆盖整个三年博士期。
cambridge-quantum-materials-openings: 剑桥大学卡文迪许实验室量子材料组的博士岗位页。申请前需先联系导师，全额资助多依赖剑桥奖学金或项目经费，国际生资格以各岗位说明为准。
cambridge-rao-phd-2027: 剑桥大学物理系 Rao 课题组招收 2027 年 10 月入学的博士生。页面称资助竞争激烈，建议提前联系导师。
cambridge-sociology-phd-2027: 剑桥大学社会学博士项目，适用于2027年秋季入学及2028年Lent、Easter学期入学，申请可从2026年9月开始提交。
cambridge-studentships-list: 剑桥大学 studentship 列表页，列出 BHF 4 年期博士资助（2027 年 10 月入学，10 个名额，多校合作）和 EPSRC IDLA 博士课题。IDLA 页面称面向合格本国学生及少量国际学生。
cambridge-studentships-listing: 剑桥大学统一招聘系统的 Studentships 分类页，列有 20 个岗位，多数为博士课题，另含一个兽医临床实习奖学金。国际生需满足各岗位的学历与语言要求。
cambridge-vet-medicine-course-list: 剑桥大学兽医医学系的博士与 MPhil 课题列表，多数为自筹经费项目。页面所示全额资助课题多已截止或仅限英国本土学生，国际生资格需看各项目页。
cambridge-willis-synbio-phd: 剑桥大学化学系 Julian Willis 组的合成生物学与基因编辑博士岗位，全额资助 3.5 年，面向 2027 年 10 月入学。申请须经化学系博士项目提交。
cambridge-zoology-2026-27: 剑桥大学动物学系的研究生课题列表，涵盖生态与保护科学、进化、行为与神经科学等主题，包括博士与 MPhil 课题。列表不穷尽，欢迎申请者提出自己的课题想法。申请前需先联系拟申请导师。
camk-doctoral-recruitment-2026: 波兰哥白尼天文中心（CAMK）天文学博士招生，经 GeoPlanet 博士学校发布，正文称有 4 个博士岗位。第 I–II 年净额下限约为每月 3077 PLN。
canberra-research-scholarships: 堪培拉大学研究生奖学金，包括 RTP 学费减免与 UC HDR 津贴。国内外申请者均可，采用竞争性评审，需通过 HDR 申请门户并另填研究奖学金表格。
canssi-cdpf: CANSSI 分布式博士后奖学金，面向统计、精算、生物统计、数据科学方向近期获博士学位者，两年期，在加拿大合作高校进行，最高 $70,000/年并含福利。学者可从教授提出的项目中选择三个。
canssi-ontario-postdoc: 安大略 CANSSI 统计与数据科学博士后奖学金，两年期，最高每年 $70,000 并含福利。需近期获统计、精算、生物统计或数据科学博士学位，两位合作导师须来自安大略 CANSSI 合作高校或其附属机构。
canterbury-uc-doctoral-scholarship: 坎特伯雷大学 UC 博士奖学金，按 120 学分计每年 NZ$32,650，另加论文类学位学费（最多 360 学分）。申请奖学金前须另在 myUC 提交博士入学申请。
capes-pipd-postdoc: 巴西 CAPES 国内博士后计划（PIPD），由巴西高校研究生项目自行招募，部分院校每月 R$ 5,200。申请人需在 7 年内取得博士学位（外国学位须在巴西认证），部分院校要求巴西国籍。
carlson-phd-tuition-aid: 明尼苏达大学卡尔森商学院博士项目，录取生均获 5 年资助、学费全免，助教或助研约半职并附医保。9 个月津贴约 $30,000（2025 年秋起），5 年保障年均约 $53,000。
case-bstp-stipend-benefits: 凯斯西储大学 BSTP 博士项目，页面称录取博士生可获全额学费、医保和津贴。2026–27 学年津贴为 $39,000，另有 2000 美元搬迁补贴，资助内容以 BSTP 页面说明为准。
case-western-mae-funded-phd: 凯斯西储大学机械与航空工程学院的博士岗位，2027 年秋季入学的流体力学（高超声速实验）方向。页面称含全额资助与学费，但取决于联邦机构支持，且要求美国公民身份。
casimir-research-school-phd: 代尔夫特与莱顿的 Casimir 理学院物理博士项目，博士岗位为全职带薪职位，页面称无学费。岗位由各研究组分别发布，需理学硕士或同等学历。
catolica-global-phd-law: 里斯本天主教大学全球法学博士项目，全英文授课，2027 年 1 月开学。本轮 5 个名额中 3 个为覆盖四年全日制学习期的奖学金，其中 1 个限消费者权益研究方向。
cbs-economics-doctoral-fellowships-mpi: 马普集体物品研究所与科隆大学合办的经济学博士资助，位于德国。申请材料与流程见所链接的科隆大学经济学博士项目页面。
cbs-vacant-positions: 哥本哈根商学院（CBS）的招聘列表，汇集运营管理、审计与会计、营销、数字化等方向的博士、博后和讲师职位。多数博士奖学金为三年受薪，含教学义务，各岗位要求以岗位页为准。
cck-europe-doctoral-fellowship: 蒋经国基金会欧洲博士论文奖学金，面向欧洲境内攻读博士最后一年的非中华民国国籍研究生，每份 EUR 15,000，为期一年。研究方向限中国研究（人文社科），需导师说明能在资助期内完成论文。
cckf-europe-dissertation-postdoc: 蒋经国基金会的欧洲博士论文奖助与博士后奖学金，要求非中华民国国籍。博士论文奖助€15,000（一年）；博士后每年最高€21,000，最长两年，需获博士学位5年内。须通过基金会在线系统申请。
ccl-jobs: 计算化学岗位页，列出 2026 年发布的博士与博后职位，例如 26.07.09 发布的内布拉斯加-林肯大学计算材料科学博士岗位。
ccl-post: CCL POST 是计算化学的通用招聘公告列表，同时发布博士与博后职位，可在此查找计算化学相关的博士与博后机会。
ccp4-bb: CCP4 邮件列表的结构生物学与晶体学招聘存档，列有多条博士与博后招聘帖，最新岗位需在存档中查看。
cdt-aqt-applied-quantum: 苏格兰三校联合的应用量子技术 CDT（EPSRC 资助），五批次、每批约 16 人。国际生可申请，但 EPSRC 限定国际名额。
cea-dam-postdocs-2026-livret: CEA DAM 2026 年博士后岗位手册，岗位为有薪职位，覆盖核能与国防应用方向。一般需已取得博士学位，各岗位要求以手册为准。
cea-dam-theses-2026-livret: CEA DAM 2026 年博士课题手册，手册称所列课题均已获资助。合同类型各不相同：CFR 由 CEA 全额承担，CTBU 由接收单位承担，CTCI/CTCR 为各半。
cea-drf-thesis-salary-info: CEA 博士为全职雇员，属带薪岗位，按 INSTN 页面的年度课题清单申请，需 Master 2 或同等学历，直接向各课题导师投递申请。
cees-uzh-fellowship: 苏黎世大学 CEES 东欧与欧亚研究员计划，面向研究东欧、俄罗斯、高加索或中亚的社会科学与人文学者，驻校约 4 个月。资助含生活津贴、差旅与行政费用，并协助在苏黎世找房，仅限本校就读或任职者申请。
cefres-platform-phd-fellowship: CEFRES 平台博士奖学金，面向在布拉格查理大学读博或在捷克科学院任研究员的人员，为期一年，约 €9,000/年（225,000 捷克克朗）。研究方向需与 CEFRES 研究领域相关，需良好英语。
cerge-ei-phd-economics: 布拉格 CERGE-EI 经济学博士项目，官网称为全额资助，并提供生活费津贴以覆盖学习期间的开支。需硕士或可认可的学位及英语能力证明，经济学背景为佳。
cfa-postdoc-fellowship: 哈佛-史密森天体物理中心（CfA）博士后奖学金，每年 $84,600 并含年度生活成本调整，研究经费每年 $18,000，任期 3 年。申请须通过 AAS 职位页提交，页面写明向讲英语的各国公民开放。
cgu-studyintaiwan-scholarship-339: 长庚大学博士奖学金（留台门户页），名额 50 人，补助按英语与 GRE 成绩分档。两项条件均满足者，学杂费同额补助加每月 NT$12,000（每年 10 个月，前 4 年）；仅满足语言条件者每月 NT$10,000。
chalmers-doctoral-studies-employment: 查尔姆斯理工大学博士岗位入口说明。博士生为全职固定期限雇员，领取月薪、不收学费，教学与系内工作最多占 20%。申请需硕士学位，英语最低要求为瑞典高中 English B/6。
chalmers-ees-graduate-school: 查尔姆斯理工大学能源、环境与系统研究生院，下设能源转换、工业能源系统、环境系统分析等方向。博士岗为全职固定期受雇岗位，一般不超过 5 年，常年发布。
champalimaud-indp: 葡萄牙里斯本 Champalimaud 基金会的国际神经科学博士项目，录取博士生获全额资助，每年续期，最长 5.5 年。当前申请已关闭，2027 轮日期未公布。
charite-medical-neurosciences: 柏林 Charité 英文医学神经科学项目，同时接受 PhD 与 MD/PhD 申请；另有两年制硕士，每年最多约 20 名国际学生。页面称 NeuroCure 与 Einstein Center for Neurosciences 提供奖学金。
charles-ims-phd-funding: 查理大学国际研究所（IMS）博士项目，2026/27 起免学费。全日制博士生有保障性收入，2025/26 约 25,000 克朗/月；联读制博士生无保障收入。
charles-junior-fund-postdoc: 查理大学面向海外博士的全校性博后基金（JUNIOR Fund），由院系提名、校方终审，单个岗位最长 24 个月全职。申请人须在国外获得博士学位，学位授予后不超过 8 年。
charles-univ-sociology-phd: 捷克查尔斯大学社会科学学院的社会学博士项目，博士学费为 0 欧元/年，全日制与联读均可申请。奖学金或岗位金额请直接向学校咨询。
charm-eu-opportunities-hub: CHARM-EU 联盟的机会与征集页，统一发布博士夏/冬校、博士流动与 MSCA 征集等信息，覆盖博士与博后层次。博士岗位需回到各成员校招聘页查看，适合订阅联盟通讯以跟进后续周期。
che-intl-scholarship-programs: 以色列高等教育委员会（CHE）的国际生奖学金总目录，涵盖博士与博后子项目，包括 PBC 中国与印度博后奖学金、Zuckerman 博后项目及 PhD Sandwich 项目。金额与截止以 CHE 当期公告为准。
chem-bath-fellowships: 巴斯大学化学系可作为 MSCA 博士后东道主的 fellowship 入口。申请者需持有博士学位且研究经验不超过 8 年，申请前需获得巴斯导师的书面支持，完整申请通过 EU Funding and Tenders Portal 提交。
chem-bigs-chemistry: 波恩大学化学系的 BIGS-Chemistry 结构化博士项目，英语授课，8 学期。申请者需先被波恩大学化学系某课题组接收为博士生，资助来自课题组合同。
chem-birmingham-postdoc: 伯明翰大学化学院的博后与 fellowship 入口，列出 EPSRC、Leverhulme、皇家学会、MSCA 等可申请的计划，个别博后需先联系研究组。申请者需具备英国工作签证资格，或由雇主担保。
chem-cambridge-dept-jobs: 剑桥大学 Yusuf Hamied 化学系招聘页，列出当前在招的博士奖学金（MA51367）及若干博后、研究和行政岗位。通常需 II.i 荣誉学位或硕士学位，国际生资格以各奖学金公告为准。
chem-epfl-doctoral-salary: 瑞士 EPFL 博士生的薪资与雇佣说明。博士生多以 doctoral assistant 身份受雇并领取薪资，税前年薪 CHF 55,225（自 2026 年 1 月 1 日起）。须先被博士项目录取，这是待遇说明而非具体项目。
chem-epfl-isic-open-positions: EPFL 化学学院汇总多个课题组的博士岗位，如蛋白质降解方向的 PhD Fellowship。博士岗位需先被 EDCH 化学与化工博士项目录取并在线申请，部分课题组要求化学相关一等硕士学位。
chem-epfl-lcps-nguyen-openings: EPFL Suong Nguyen 课题组的合成高分子化学方向博士招生页。申请材料需合并为单个 PDF 发送给 Nguyen 教授，页面称目前没有有经费的博后岗位。
chem-epfl-lcsa-cramer-openings: EPFL Nicolai Cramer 课题组招收博士，方向为过渡金属催化、有机方法学和天然产物全合成。需化学硕士（成绩优秀），申请 EDCH 前须先联系 Cramer 教授确认是否有名额，名额视经费与人员变动而定。
chem-epfl-lpdc-openings: EPFL LPDC 实验室（化学化工方向）的招聘页，博士岗位需同时申请 EPFL 化学与化工博士项目，要求化工或相关专业硕士、英语流利，可先联系 Luterbacher 教授做背景预评估。
chem-groningen-stratingh-phd: 格罗宁根大学 Stratingh 化学研究所博士与博后岗位的招聘说明。岗位一般发布在各课题组网站，建议直接联系 PI 申请。
chem-hifunmat-graduate: 斯特拉斯堡大学 HiFunMat 功能材料研究生院（ITI）的博士入口，导师须为 HiFunMat 成员且课题相关。申请需提交 CV、动机信、导师推荐信及约半页论文摘要，博士合同由导师在 CNRS Emploi 与 Euraxess 发布。
chem-iciq-fully-funded-phd: 西班牙塔拉戈纳化学研究所（ICIQ）的 Severo Ochoa 预博士（FPI）项目，每年一轮，录取者签最长 4 年的预博士雇佣合同。申请需化学、物理、化工、药学或相关领域的硕士或同等学位，并须在博士入学前取得，已获博士学位者不符合条件。
chem-imprs-ice-jena: 马普化学生态研究所与耶拿大学联合的 IMPRS「生态系统中的化学通讯」博士项目，英文授课，3 年博士职位按 TVöD 公务员薪资标准支付，无学费，耗材与设备由实验室承担。申请需硕士学位（含硕士论文）与良好英语能力。
chem-nature-careers-europe-phd: Nature Careers 上的欧洲化学博士岗位筛选页，可按国家、全职和固定期限过滤。它是聚合站，需回到原招聘页面确认截止日期和资助条件。
chem-oxford-xuphos: XuPHOS 牛津基金资助的化学 DPhil 奖学金，由捐赠设立，未来十年至少资助 8 个化学 DPhil，并提供在中国企业实习的机会。
chem-purdue-funding-benefits: 普渡大学化学系的博士资助页，博士一年级通常提供助教（TA）职位，含全额学费减免及有竞争力的津贴。无外部奖学金的博士生通常获至少五年研究生助理资助。
chem-rseq-jobs: 西班牙皇家化学学会（RSEQ）官方招聘板，页面称只发布已有资金支持的岗位，包括博士与博后职位，例如 Lancaster 大学的 CASE 博士。
chem-st-andrews-fellowships: 圣安德鲁斯大学汇总化学各类独立 fellowship 的校内截止日期，适合在寻找博后 fellowship 东道主时作为参考，2027 轮可联系 chemdor@st-andrews.ac.uk 咨询。
chem-stanford-phd-financial-support: 斯坦福大学化学系的博士资助页，学业表现良好的博士生通常获五年支持（含学费与薪酬），第一年多为助教。2026–27 学年第一年薪酬不低于 $58,460。
chem-warwick-urf-2027: 皇家学会大学研究员（URF）2027 轮的华威大学化学内部遴选页，面向博士后。校内意向书需发送至 chem-fellowships@warwick.ac.uk，并附 CV、发表列表及 EOI 表。
chem-weizmann-graduate: 以色列魏茨曼科学研究所的研究生与博后入口页，列出 MSc、PhD、MD-PhD 与博后项目及各自的申请入口，可由此进入各项目的申请页面。
chem-york-wild-fund: 约克大学专为国际（含欧盟）学生设置的 Wild Fund 化学博士奖学金，资助学费与 3 年生活费，生活津贴为研究理事会标准津贴（免税），另含科研与培训经费。申请需已获得化学博士研究的录取。
chemecol-isce-jobs: ISCE 化学生态学职位板，发布化学生态学领域的教授、博后与博士岗位及研究人员类职位。公告约保留六个月，各岗位要求以具体公告为准。
chemistry-world-jobs: 英国皇家化学会旗下职位板，职位来自主要行业雇主、大学与专业招聘机构，页面研究生分类下仅列 1 条。
chemnitz-landesstipendium-phd: 开姆尼茨工业大学的萨克森州博士生奖学金，每月 €1,500，每个孩子另加 €100，最长 3 年。需持成绩超过平均水平的职业资格学位，已由其他公共资金资助的博士研究不予资助。
chhowalla-group-opportunities: 剑桥大学材料方向的 Manish Chhowalla 课题组招收博士与博士后，研究方向为二维材料与薄膜，职位资金来自课题组经费。页面列有 3 个固定期限的 Research Associate 岗位。
chicago-booth-phd-financial-aid: 芝加哥大学布斯商学院博士学费全额覆盖（5–6 年），含本人医保保费与研究生服务费。2025 年秋入学者 Stevens 项目津贴为 $55,000/年（前五年保障），另有每年至多 $3,000 差旅经费。
chicago-social-sciences-phd-funding: 芝加哥大学社会科学 Division 页面称，所有入学博士生在整个学程内获资助，不论国籍，包括全额学费奖学金、学生医保（本人）、学生服务费及生活津贴。
choose-europe-for-science: 欧盟“Choose Europe for Science”博士后计划，由接收机构申报项目，入选后雇用博后并支付工资。申请者需具备博士学位，具体岗位以EURAXESS及接收机构公告为准。
chula-link-scholarship-phd: 朱拉隆功大学 Chula LINK 国际研究生奖学金（博士），面向持非泰国护照的国际生，含全额学费、月生活津贴与往返机票。需已获朱拉隆功大学录取。
cibss-doctoral-researchers: 弗赖堡生物信号研究中心（CIBSS）博士生页面。CIBSS Track 当前无开放招募，但 SGBM 设有持续的常规选拔轮次，接受主动申请。博士生获得的雇佣合同为至少 TV-L E13 职位的 65%。
cic-buenos-aires-posdoc26: 布宜诺斯艾利斯省科研委员会（CIC）的博后奖学金，最长 2 年。申请人须与 CIC 的研究人员职位或 CIC 博士奖学金有关联。
cifor-cgiar-germany-hub-phd: 德国–CGIAR++ 科学与影响力中心的博士奖学金，面向农业、粮食与环境研究，每月 €1,800，共 3 年，另可申请 €25,000 研究经费。需硕士学位，且须与 CGIAR++ 科学家及德国高校教授组队共同申请；是否对中国籍开放以当年征集为准。
cifre-anrt: 法国 CIFRE 企业联合培养博士，由 ANRT 批准财政资助，博士课题依托企业与实验室合作开展，需由企业向 ANRT 提交。需硕士或同等学历及首次研究经验；非欧盟国籍者需已取得在法国工作的许可。
cim-imprs-muenster: 明斯特 CiM-IMPRS 博士项目，每年约 16 个全额岗位，英文授课，面向所有国籍的优秀申请者，无学费。
cinp-student-opportunities: 加拿大核物理研究所（CINP）的学生机会页，列出研究生奖学金、本科暑期科研及学生与博后出差资助；TRIUMF、SNOLAB 等实验室的博后与博士岗位需到各实验室招聘页查看。
ciqus-vacancies: 圣地亚哥大学化学研究中心（CiQUS）招聘页，列有 6 个博士前研究岗位（Predoctoral Research Opportunities）的开放征集，其余征集已关闭。
cirad-fundit-institution: 法国热带农业研究中心（CIRAD）的博士奖学金。该中心官方博士页称每学年约有 20 个部分资助博士奖学金，多与 ANSES、INRAE 等机构共同资助，也接受他方资助的学生。
cispa-cristal-lab-trustworthy-ai-phd-postdoc: CISPA 亥姆霍兹信息安全中心 CRISTAL 实验室（圣因贝特）的可信 AI 博士与博后岗位，提供 TVöD E13 全职薪资与福利，工作语言为英语。博士需计算机、数据科学或 AI 相关硕士，博后需有独立性与强发表记录。
cispa-phd: CISPA 亥姆霍兹信息安全中心的博士岗位，博士生为全职雇员，按 TVöD 支付，起薪约 €4,000/月（税前），博士期限估计 3–4 年，工作语言为英语。
cispa-postdoc-general: CISPA 博士后通用申请页，可全年通过系统投递，优秀候选人随时可申请。工作语言为英语，无需德语；申请时需在求职信中注明目标研究组。
cispa-rossow-system-security-jobs: CISPA 系统安全组（Rossow）长期招收博士与博士后，全职合同按 TVöD E13 发放。博士需硕士学位或即将获得，并有安全基础。页面上的工作地点说法不一，以岗位页面为准。
cita-postdoc-2026: CITA 理论天体物理博后（多伦多大学），2027 年 9 月入职，任期 3 年，薪资 $81,500。需近期获得理论天体物理相关任意领域的博士学位，材料包括 CV、研究陈述、发表列表及 3 封推荐信，仅接受电子提交。
citius-expressions-of-interest-archive: 西班牙 CiTIUS 的兴趣表达与职位存档页，按年份列出各征集，包括 2026 年 5 月 22 日发布的 TALENTGAL 博后资助征集，以及 3 月 16 日发布的 MSCA 博后候选人征集。具体条件见各征集页。
cityu-coril-computational-biology: 香港城市大学 CORIL 计算生物实验室，招收博士与博后。主页称提供覆盖学费和生活费的全额奖学金，内地学生可申请。申请需先发邮件联系导师，并在 CityU 申请中注明；香港博士奖学金计划（HKPFS）另需经 RGC 系统申请。
cityu-sgs-admissions-handbook: 香港城市大学研究生院发布的 2026 年研究学位招生手册，可查阅博士入学条件、申请流程和资助概况。
cityu-ss-research-degrees: 香港城市大学社会科学学院研究型博士项目入口，资助多通过 HKPFS 等途径。HKPFS 2026/27 月津贴 HK$28,400。需同时向 RGC 提交 HKPFS 初步申请，并向城大提交正式申请。
cityu-sye-hkpfs-2026: 香港城市大学系统工程系 HKPFS 2026 资料。年度津贴 HK$344,400（约 US$44,150），另有会议及研究差旅津贴 HK$14,400/年。申请需先向研资局（RGC）取得参考号。
cl-rainbow-applying: 剑桥大学计算机实验室 Rainbow 图形与交互组的申请说明。已有外部资助的海外申请人需提早申请，与剑桥统一的 Cambridge Trusts 截止是两套时间线，需同时准备。
clay-research-fellowship: 克雷数学研究所（Clay Math Institute）的 Clay 研究员计划，面向近期获博士学位的数学研究者，须由他人提名，并提交提名信、两位其他推荐人信息、CV 与论文列表。
clemson-cs-phd-faq: Clemson大学计算学院的博士招生FAQ，资助以研究生助教（graduate assistantship）为主且保留给博士生。助教享受大幅减免的学费并按半月发放津贴，博士申请在处理时自动考虑资助，无需另行申请。
clemson-graduate-finance: 克莱姆森大学研究生院的资助以助教岗位（assistantship）为主，每周约 10–28 小时工作，换取学费折扣加津贴；Fellowship 不需服务。各院系分配名额，需直接联系目标院系。
cliccs-hamburg-jobs: 汉堡气候园区CLICCS卓越集群的招聘页，官网称2026年计划招28个博士岗与28个博后岗，岗位陆续发布。首个公告为CLICCS项目研究助理岗。
cliccs-jobs-hamburg: 汉堡气候集群（CLICCS）的招聘页，岗位陆续发布。官网称 2026 年计划招 28 个博士岗与 28 个博后岗，国际生通常需硕士学位与英语能力。
cmu-ai4bio-fellows-postdoc: 卡内基梅隆大学AI与生物交叉方向的博士后项目，由计算机学院两位教授联合指导。申请者需在计算机、机器学习、计算生物等相关领域获得博士学位，聘期1年，可续1年。
cmu-cee-phd-costs-funding: 卡内基梅隆大学土木与环境工程系的博士资助说明：研究助理职位通常覆盖学费并发放生活费，最长约 5 年，每周需工作约 20 小时。
cmu-hcii-phd-fellowship: 卡内基梅隆大学人机交互研究所（HCII）博士招生项目，面向 2027 年秋季入学，经 SCS 统一在线申请系统提交申请。
cmu-kantor-lab-openings: 卡内基梅隆大学 Kantor 课题组（机器人方向）的招生页。研究生由机器人研究所统一招收，录取后再联系 Kantor 教授，通常在二月。
cmu-ml-phd-program: 卡内基梅隆大学机器学习博士项目，页面称对每位全日制学生提供学费与按学年发放的生活费，属全额资助。非美国学生需按官网说明办理F-1签证流程。
cmu-portugal-affiliated-phd: CMU Portugal 合作博士项目，英语授课，在葡萄牙合作大学就读，并赴 CMU 进行最长 12 个月研究。最多约 12 个 FCT 资助名额，覆盖学费并提供月津贴；须在奖学金开始时在葡萄牙永久且习惯性居住。
cmu-ri-doctoral-robotics: 卡内基梅隆大学机器人研究所的博士项目，每年提供覆盖学费和生活津贴的奖学金，可续期，学生无需单独申请资助。项目不接受春季入学，需通过 SCS 研究生申请系统申请。
cmu-scs-phd-funding-policy: 卡内基梅隆大学计算机学院（SCS）为所有在读且学业合格的博士生提供全额资助，细则见学院博士项目页。国际生是否同样适用需向学院确认。
cn-social-gaoxiaojob-career-column: 高校人才网的博士与博士后招聘栏目。导航设有“高才博士后”栏目（另有 boshihou.gaoxiaojob.com 专站），并收录各校博士后与博士岗位公告，岗位以原校通知为准。
cn-social-ntu-kinjo-phd-scholarship: 南洋理工大学 Rei Kinjo 课题组化学博士研究奖学金，面向 2027 年 1 月入学批次。单页称每月约 S$3000，可覆盖四年博士项目，课题组可为 CSC 申请提供材料。需提交 GRE 与 TOEFL 成绩。
cnai-epfl-positions: EPFL 计算神经科学与 AI 实验室（CNAI）的博士与博后岗位，方向包括计算机视觉、强化学习与计算神经科学。博后页列出 SNSF 瑞士博士后奖学金与 EPFL AI Center 博后奖学金。
cnam-smi-doctoral-contracts: Cnam ED SMI（ED 432）工程博士合同竞赛，带薪。需硕士或同等学位，按招聘公告提交候选人与导师的简历及研究计划。
cnes-theses-postdocs: 法国航天局（CNES）通过 PDOC+ 项目每年资助约 130 个博士与博后研究名额（约 100 名博士、30 名博后）。博士课题须由工业或机构伙伴联合资助，岗位通过 CNES 招聘平台申请。
cnic-predoctoral-program: 马德里心血管研究中心（CNIC）的预博士项目，资助博士培训相关的学费、论文印刷费和意外保险，前提是未被外部奖学金覆盖。
cnio-phd-programme: 马德里国家癌症研究中心（CNIO）的博士项目，主要资助渠道为 la Caixa 基金会 Severo Ochoa 国际博士奖学金，另有课题组招聘。申请需生物医学相关学位，并具备突出的学业成绩与科研经历。
cnr-istc-vacancies-scala: 意大利国家研究委员会科学技术研究所（CNR-ISTC）招聘列表，列出博士后合同与研究奖学金，当前页面上未见博士岗位。MSCA 博士岗需未持博士学位并满足流动性规则。
cnrs-cellule-sante: CNRS 健康跨学科博士合同（2026 年征集），由 CNRS 单位内导师申报，近 4 年获得过 CNRS 博士合同者不可申请。合同受雇于 CNRS 且须在法国执行，外国合作方不能共同指导。
cnrs-irl-canada-france-math-theses: 由法国国家科研中心（CNRS）资助的数学博士合同，依托加拿大–法国数学国际研究所（IRL）。须在法国注册博士，并安排至少 3 个月赴加拿大合作单位访学。
cnrs-jobs: 法国国家科研中心（CNRS）招聘门户，非社科方向的博士及博后岗位可按 Doctorant 或 Postdoc 检索。社科（SHS）博士合同须由法国境内导师提出课题，学生不能直接递交。
cobene-pooled-calls: CoBeNe 博士学院每半年一次的统一招生，提供 2 个为期 3 年的带薪 pre-doc 岗位，由两位 CoBeNe PI 共同指导。需硕士或同等学历，未报读其他博士项目，并需较高英语读写能力。
cobene-vienna-how-to-apply: 维也纳 CoBeNe 博士学院的带薪 pre-doc 岗位入口，主要有每半年一次的统一招生（uni:docs）、导师在 JobCenter 发布的岗位等途径。需硕士或同等学历，并提交英文动机信。
cocomo-strandburg-peshkin-phd-2027: 马普动物行为所与康斯坦茨大学 IMPRS-QBEE 项目下 Strandburg-Peshkin 组的博士课题，研究动物群体通讯与协调。工作语言为英语无需德语，需任意科学学科硕士学位及编程经验。
cologne-cga-ageing: 科隆衰老研究研究生院（CGA）2027 招生，约 12 个 TV-L E13（65%）博士岗位，合同至少三年，培训使用英文。需硕士或同等学历及相关生命科学背景，英语约 C1。
cologne-gsgs-daad-scholarship-2026: 科隆大学地球科学研究生院的 DAAD 奖学金，面向国际博士候选人，资助最长 4 年。申请需硕士成绩优秀、英语能力好，并提交与科隆地球科学导师课题相关的研究计划。
colorado-atoc-funding-opportunities: 科罗拉多大学博尔德分校大气与海洋科学博士资助。系里称几乎所有录取博士都获得 TA 或导师科研经费支付的 RA 岗位，2026–27 年至少 $48,870（资格考试前）至 $51,450（之后）。
colorado-cs-discover-fall-2027: 科罗拉多大学博尔德分校计算机系公布的 2027 年秋季在招博士名单，列出在招博士的教授与实验室，可按研究方向选择对应的研究组。
colorado-grad-school-departmental-funding: 科罗拉多大学博尔德分校研究生院的系级资助说明。助教与助研岗位包含津贴、学费减免及福利。国际生在合格岗位上可免除州外学费差额，具体政策因院系而异。
colorado-leeds-phd-funding: 科罗拉多大学博尔德Leeds商学院为录取博士生提供五年资助，学院称国际生同样获全额资助。需保持学术进展并担任约50%研究或助教工作，学院资助页称津贴为$37,000/学年。
colorado-mechanical-phd-funding: 科罗拉多大学博尔德分校机械工程博士资助。页面称对所有录取博士申请者提供资助，含工资、学费减免和医保，第一年通常在助教与助研学期之间交替。
colorado-mse-funding-admissions: 科罗拉多大学博尔德分校材料科学与工程系博士资助（2024 年 1 月 1 日起生效），津贴 $38,000/年。国际生无法取得州内学费资格，但在合格 TA/RA 岗位上，学费差额由学校承担。硕士不提供系资助。
colorado-psych-neuro-faculty-recruiting: 科罗拉多大学博尔德分校心理与神经科学系公布的在招研究生导师名单，可按研究方向筛选后直接联系导师。行为神经科学项目为直接录取进实验室，需先联系导师。
colostate-ansci-graduate-funding-policy: 科罗拉多州立大学动物科学研究生资助政策。据 2025 版研究生手册，助教与助研（GTA/GRA）为竞争性分配，录取不保证获得任何资助；导师需在录取前说明资助责任。
columbia-dbmi-funding: 哥伦比亚大学生物医学信息学系博士资助页，GSAS 为满足时限等条件的博士生保障学费、学校费用和生活津贴，具体金额在录取信中列明。
columbia-gsapp-phd-support: 哥伦比亚大学建筑学院（GSAPP）面向入学第 2–7 年的在读博士生，提供差旅、会议与展览补助，每次 1,500 美元，每学年最多一次、学业期间最多两次。只资助未来活动，不含学费或生活津贴。
columbia-nursing-phd-funding-package: 哥伦比亚大学护理学院的博士资助方案，全日制博士生可获三年学费、杂费、学生医保和生活费资助，国际博士生也在其中。2026–27 学年预估生活费为 $48,080/年。
columbia-vibre-financial-support: 哥伦比亚大学 VIBRE（Vagelos 生物医学研究教育）博士通道，资助页称博士生享有年度津贴、医疗保险与住房支持，按 12 个月聘任。
comp-neuro-list: OCNS 计算神经科学邮件列表，过去 30 天有 57 个讨论帖、52 位参与者，讨论较为活跃。岗位帖需进入归档，按月份逐月查找。
compound-semi-cdt: 英国化合物半导体 EPSRC 博士培训中心（MRes + PhD），学费由项目代付，另有每生 £20,000 研究培训经费。第 9 批（2027/8 入学）为 Tech First 试点，生活津贴每年 £30,000。
conicet-becario: 阿根廷 CONICET 博士与博后奖学金，面向阿根廷及外国毕业生。博士奖学金须在 CONEAU 认证的博士项目就读，并需阿根廷宿主。
conicet-becas-2026-portal: 阿根廷 CONICET 年度博士与博后奖学金的总入口，列出各类奖学金的申请时间。博士类奖学金须在 CONEAU 认证的博士项目中进行，阿根廷籍与外国籍均可申请。
conicet-becas-internas-doctorales-2026: 阿根廷国家科研机构 CONICET 博士内部奖学金，需在阿根廷境内读博，语言为西语。需已获学士学位，或申请时仅欠不超过 5 门课；CONICET 不承担机票与移民费用。
conicet-pd-cit-2026-bases: 阿根廷 CONICET 博士后奖学金 PD-CIT 的 2027 年 2 月批次规则，获奖最长 36 个月，起始 2027 年 8 月 1 日。申请时须已完成博士论文答辩或提交论文定稿，外籍获奖者的机票与移民费用不由 CONICET 承担。
cooperative-ai-phd-fellowship: Cooperative AI Foundation 博士奖学金，聚焦多智能体与 AI 合作问题，生活费资助最高 $40,000/年，最长3年，另有会议与算力预算，不限国籍与地区，需已在读或拟入读认可大学的博士项目。
coral-list-archive: 全球珊瑚礁邮件列表 Coral-List 的归档，1995 年始于 NOAA AOML，2024 年起由国际珊瑚礁学会运营。列表常有博士与博后招聘发布，但禁止张贴求职请求和简历。
cornell-angelina-wang-phd-2027: 康奈尔大学 Angelina Wang 课题组招收 2027 年秋季入学的博士生。需通过 Cornell 信息科学或计算机博士项目正式申请，并在申请中注明导师。
cornell-chemistry-phd-funding: 康奈尔大学化学系的博士资助：学业进展令人满意时，系里保障至少 5 年资助，包括 12 个月生活费、学费与医保。当年具体金额以系里为准。
cornell-cvm-dvm-phd-research-award: 康奈尔兽医学院的 DVM 攻读 PhD 研究奖学金，面向持 DVM 或同等兽医学位者，学院称可获五年资助，含全额学费奖学金与生活津贴。中国兽医学位是否同等需向招生办确认。
cornell-eeb-graduate: 康奈尔大学生态与进化生物学（EEB）博士项目，新入学博士生可获六年资助（学费、津贴、医保，含暑期支持）。2024–2025 标准为 9 个月津贴 $33,930 加暑期支持。
cornell-eeb-phd-funding: 康奈尔大学生态与进化生物学系博士生资助政策，系里保障五年支持，含学费、津贴与医保。页面所列津贴为 2021–2022 年标准，9 个月 $28,654，暑期不少于 $6,233。
cornell-shc-mellon: 康奈尔人文学会 Mellon 博士后，两年期，年薪 $68,000（2027–29 轮）。语言学方向要求 2023 年 8 月 1 日后至 2027 年 6 月 30 日前获得博士学位，未取得者需系主任出具信函。
cornell-sociology-funding: 康奈尔大学社会学博士项目，官网称全部录取的研究生均可获得资助（guaranteed funding），每届录取 6–8 人，在读约 40 人。
cornell-weinberger-prospective: 康奈尔大学计算机系 Kilian Weinberger 教授的博士招生说明。页面称录取学生可获全额资助（学费、12 个月工资、医保），申请须通过康奈尔 CS 博士项目统一提交，不另向导师递交。
corvinus-doctoral-2026: 布达佩斯考文纽斯大学（Corvinus）的博士项目与奖学金，校方称博士奖学金每月 32 万福林。外国申请人的资格须向学校确认。
courtauld-phd-funding-scholarships: 伦敦考陶德艺术学院博士奖学金与资助页面，向全日制博士申请者开放。部分命名奖学金另设国籍、经济需求或研究领域条件，需先提交博士预申请。
coventry-astar-studentships: 考文垂大学与新加坡 A*STAR 合作的四年全额资助联合博士，通过 A*STAR 研究实习计划（ARAP）提供。第 1 年在考文垂，第 2–3 年在新加坡 A*STAR，第 4 年回考文垂，学位由考文垂授予。
cowles-postdoc-fellows: 耶鲁 Cowles 基金会数理经济学博士后，面向近期获得博士学位者，偏重严谨的数理经济学方法，驻校约一年，方向含计量、理论、产业组织、宏观等。
cpaess-cgc-postdoc: NOAA 气候与全球变化博士后奖学金，面向近3年内获博士者，与 NOAA 合作机构导师配对，两年期。非美籍资格以当届公告为准。
cpra-utoronto-utm: 多伦多大学（UTM）的 CPRA 说明页，属联邦 Tri-Agency 博后资助，最长 24 个月，CAD 70,000/年。需在授予前已取得博士（或同等）学位，申请人直接向 CIHR、NSERC 或 SSHRC 提交，并需预留校内签字时间。
cpra-uwaterloo: 滑铁卢大学博后中心的 CPRA 校内说明页，介绍 CIHR、NSERC、SSHRC 三类资助的校内流程。博后资助为 $70,000/年，最长 24 个月，2027 轮以校内通知为准。
cra-taulbee-support: CRA Taulbee 研究生资助数据，是北美计算机科学博士 TA、RA 与 Fellowship 津贴中位数的官方统计，可用来判断 offer 的资助水平是否合理。
cranfield-net-zero-aviation-cdt: 克兰菲尔德大学净零航空博士培训中心（Net Zero Aviation CDT），由 EPSRC 资助，聚焦航空脱碳。项目按批次逐条发布，部分项目仅限英国学费身份申请人。
crest-genes-doctoral-contracts: 法国 CREST 经济与统计博士合同，包括 GENES（ENSAE/ENSAI）博士奖学金。合同税前约每月 €2,368（含约 64 小时教学）。需两年制硕士学位，建议申请前先联系潜在导师。
crg-international-phd-2027: 西班牙巴塞罗那 CRG 国际博士项目 2027 批次，面向有意攻读博士学位的申请者，申请期内设有两场申请工作坊，可参加了解申请方式。
crg-intl-phd: CRG 国际博士项目（巴塞罗那），面向生物医学相关方向，需生物医学相关本科及硕士，预计 2027 年 9 月前完成学位，可在线选择最多两个课题组。
crick-doctoral-clinical-fellowship: 面向临床医生的三年制 Crick 博士奖学金，摘要称 2027 年 9 月入学。申请需具备 GMC 注册或同等医学执照。
crick-pace-postdoc: Crick 与 King's、UCL、Imperial 联合设立的 4 年全职博士后奖学金（Crick-PACE），本轮 5 个名额，年薪起 £47,500 含福利。需已取得博士学位或已完成答辩待授位，在 Crick 完成博士者不适用。
crick-phd-2026-news: 弗朗西斯·克里克研究所 Future Leaders 奖学金，面向 Black 或 mixed Black 族裔背景申请者，含学费与 £27,715/年免税生活津贴（4 年）。其他背景申请者需通过常规博士招生项目申请。
crick-phd-programme: 弗朗西斯·克里克研究所博士项目（2027届），所有国籍均可申请，资助含学费与免税生活津贴每年 £27,715，共4年，符合条件时报销签证费与 IHS，需一等或二等上荣誉学位。
crick-phd-programme-2027: 弗朗西斯·克里克研究所的博士项目，面向2027年入学批次，对所有国籍的候选人开放。需一等或二等一荣誉学位或同等学历，并满足英语要求。
crick-postdoc-recruitment: 弗朗西斯·克里克研究所的博士后招聘页，面向全球开放，岗位由课题组发布。页面称研究所为国际科研人员及其家属承担签证费用（含NHS附加费）。
crm-ism-postdoc: 蒙特利尔数学研究中心（CRM）与魁北克 ISM 联合设立的数学科学博士后奖学金，以研究为主，由成员高校教授指导。申请人的博士学位须在公告规定的时间之后取得。
crm-laval-postdoc: CRM 与拉瓦尔大学合办的一年期数学博士后（可续一年），有薪，须全时驻留魁北克城。博士学位取得时间须符合公告要求，申请需提交 CV 与研究陈述。
cruk-career-development-fellowship: 英国癌症研究中心（CRUK）职业发展奖学金，面向准备建立独立课题组的研究者，为期 6 年，典型总额最高约 £150 万。页面写明每年审核两次。
cruk-manchester-phd-studentships: CRUK 曼彻斯特研究所的四年制博士资助，全额覆盖学费与项目经费，并提供每年 £22,894 的免税生活津贴。页面称欢迎英国、欧盟及国际学生申请。
cruk-scotland-centre-phd-studentship: 英国 CRUK 苏格兰研究中心的全额资助博士位，为期 4 年，含每年 £22,894 免税津贴、学费与研究经费，需至少 2:1 的生命科学相关学位。另有面向黑人血统申请者的 Black Leaders in Cancer 名额。
cruk-scotland-institute-phd: CRUK 苏格兰研究所（格拉斯哥）博士资助，最长 4 年，年津贴 £22,500 并提供学费，面向英国、欧盟及国际毕业生，名额有限。页面称目前无在招岗位。
cryolist: CRYOLIST 冰冻圈邮件列表，是冰雪与冰冻圈研究的全球邮件列表，接受招聘广告，有历史存档，覆盖博士与博后岗位。
csbd-dresden-jobs: 德累斯顿系统生物学中心（CSBD）岗位汇总页，涵盖博士与博士后。博士招生仅通过 IMPRS Bio-MAP 统一进行，页面明确不接受直接联系课题组的申请。
csc-paris-cite-doctoral: 巴黎大学（Université Paris Cité）CSC 博士奖学金，约 €1,350/月（税后），36 或 48 个月。限中国大陆国籍，需达到导师团队工作语言水平，并先获 UPCité 博士学校录取。
csc-paris-saclay-joint-doctoral: 巴黎萨克雷大学 CSC 联合博士项目，CSC 提供约 €1,350/月补助，限中国公民，在读硕士生也可申请。需先向校博士学院申请，获录取后再在 CSC 报名。
csc-unisq-joint-prog: 南昆士兰大学（UniSQ）CSC 联合博士奖学金，大学提供最长 48 个月全额学费奖学金，CSC 另给生活津贴。须持中国国籍，并先获 UniSQ 博士录取，再申请 CSC 资助。
csd-cmu-phd-admissions-2026: 卡内基梅隆大学计算机科学系（CSD）博士招生，不要求硕士学位，需 3 封推荐信，GRE 为可选。官方称录取的博士生在学业良好期间可获津贴、学费、学生费与医保等综合资助，国内外学生基础资助相同。
csdms-coastal-jobs-wiki: CSDMS 社区维护的海岸职位百科页，列有多个博士与博后岗位，包括马里兰大学的博士岗位。页面最后编辑于 2019 年 3 月，部分岗位可能已过时。
cshl-fellows-program: 冷泉港实验室 Fellows 独立研究员计划，面向博士毕业不久的早期研究者，任期 3 年、可延长 1–2 年，提供独立实验室空间与行政支持。可由导师提名或本人申请，通过 Interfolio 提交。
cshl-graduate-program: 冷泉港实验室研究生项目（博士）由学院承担全部学费与学习费用，并提供津贴、笔记本电脑与医保。页面称当前博士津贴为 $50,000/年，获外部奖学金者为 $55,000 或奖学金金额中较高者。
cshl-phd: 冷泉港实验室（CSHL）研究生博士项目，学校承担全部学费并提供医疗保险与研究经费。宣传册所载津贴为 $34,000/年（写于 2019 年）。需已获学士或同等学位。
csiro-iphd-program-research-opportunities: CSIRO 工业博士（iPhD）研究机会，由大学、企业与 CSIRO 三方联合指导。2027 年开始项目的学生奖学金为 A$49,513/年（政府 A$37,153 加企业补足），另有研究费 A$13,390/年。
csiro-postdoctoral-fellowships: 澳大利亚CSIRO博士后项目（含CERC研究员岗位），岗位全年陆续发布。持博士学位或已提交博士论文等待授予即可申请，页面称可为境外申请人办理工作签证担保，录用须满足移民要求并通过安全审查。
csl-mpg-criminal-law-fellowships: 马普犯罪、安全与法律研究所（CSL）的刑法研究奖学金面向外国研究者，博士生月津贴 EUR 1365。访学期限为两至最多四个月，是短期访学资助，并非长期博士岗位。
cstheory-jobs: 理论计算机科学职位板，由 CATCS 维护，以博士后与教职广告为主，机构分布于美国、加拿大、以色列、阿联酋、韩国、德国等。
csu-gra-intl-tuition-premium: 科罗拉多州立大学研究助理（GRA）学费补贴，覆盖州内与非州居民学费的差额，仅适用秋、春学期。需获 GRA 任用，并在相应学期注册至少 1 个 resident-instruction 学分。
cu-anschutz-biomedical-phd: 科罗拉多大学安舒茨医学校区生物医学科学博士项目，研究生院称博士项目全额资助、免学费和费用并提供津贴，另有医疗与牙科保险。官网称不需要 GRE。
cu-anschutz-neuroscience-phd: 科罗拉多大学安舒茨医学院的神经科学博士项目，资助形式以录取通知为准。国际生需提供英语成绩。
cu-boulder-cs-fall-2027-recruiting: 科罗拉多大学博尔德分校计算机科学系的导师一览，按研究方向列出2027年秋季正在招收博士生的教授与实验室。资助与国际生资格需联系导师或查看申请要求。
cuhk-anthropology-phd: 香港中文大学人类学博士项目，需已获人类学硕士或同等学位，并提交学信网中国大陆学历认证报告。生活费约 HK$19,100/月（旧数据，以现行为准）。
cuhk-arch-mphil-phd-pgs: 香港中文大学建筑学院 MPhil/PhD 研究生奖学金（PGS），全日制博士生可获资助，2026–27 年为 HK$229,200/年（学制期内）。须提名拟导师，HKPFS 获奖者不可同时获 PGS。
cuhk-bme-phd-programme: 香港中文大学生物医学工程学系的 MPhil/PhD 项目。普通学生月津贴 HK$19,100–19,660，HKPFS 获奖者每月 HK$28,700。申请需工程、理科或医学相关学士学位（或同等学历），并提交研究兴趣陈述等材料。
cuhk-bschool-mphil-phd: 香港中文大学商学院 MPhil-PhD 项目，全日制，列有 6 个研究领域。页面提及研究生助学金（PGS），本地全日制学生享有学费减免，2026/27 学费为 HK$47,000。
cuhk-china-studies-phd-s42: 香港中文大学跨学科中国研究哲学博士项目。需修满至少 27 个学分单位的课程、通过资格考试，并以英文完成论文答辩；页面列出 2027/28 学费为 HK$49,500（不论学习模式）。
cuhk-chinese-lang-lit-phd-s42: 香港中文大学中国语言与文学哲学博士项目，可通过 HKPFS 申请资助，申请时需一并提交 HKPFS 材料。需已获中国语言或中国文学硕士学位，并提交不超过 8,000 字的研究计划。
cuhk-communication-phd-programme: 香港中文大学传播学博士项目，页面称培养研究型职业，申请者需具备传播学、媒体研究或相关人文社科硕士学位。学校公告的资助上限为最高 HK$1.38 million。
cuhk-econ-phd-camp-2026: 香港中文大学经济系博士招生营，表现突出者可获早录取、系级入学奖学金与校级研究生助学金，并可被推荐申请 HKPFS。
cuhk-ees-hkpfs: 香港中文大学地球与环境科学系的 MPhil–PhD 项目，申请 HKPFS 资助，标准年津贴 HK$344,400，另有会议与研究差旅津贴 HK$14,400，需先向 RGC 取得编号再报 CUHK。
cuhk-eng-postgrad-funding: 香港中文大学工学院相关院系的研究生资助。博士生助学金（PGS）每月约 HK$19,100–19,660，并可申请 HKPFS（月津贴 HK$28,400，对所有国籍开放）。未获 HKPFS 的提名者可获校方奖学金。
cuhk-eng-rpg-scholarships: 香港中文大学研究生 studentship，每年 HK$229,200（约 HK$19,100/月）。全日制博士在截止前通过网上系统提交申请即自动参评，无需单独申请。
cuhk-gcni-career-news: 香港中文大学神经科学研究所（GCNI）招聘动态页，列出 Schnupp 与 Wong 实验室的博后、研究员及研究助理岗位，另有 Assistant Professor 岗位标题。申请经 CUHK 招聘网站（career.cuhk.edu.hk）提交。
cuhk-gov-pa-mphil-phd: 香港中文大学政府与公共行政 MPhil/PhD 项目，博士申请需研究计划、写作样本与研究陈述，并点名拟导师。可同时申请 HKPFS，需先向 RGC 提交初步申请。
cuhk-gs-research-postgraduate: 香港中文大学研究生院的研究型博士入口，汇总香港博士研究生奖学金（HKPFS）与校内奖学金。申请者须为全日制新入学博士生，需先在 HKPFS 网站提交初申取得参考号。
cuhk-gs-scholarships: 香港中文大学研究生院奖学金入口，包括 HKPFS、Vice-Chancellor 计划（学费豁免与生活津贴）和校长博士奖学金（HK$80,000 分期加 studentship）。国际生资格以官网当年说明为准。
cuhk-history-hkpfs: 香港中文大学历史学系 HKPFS 博士申请入口，人文方向，说明申请流程与评审标准。页面称全日制新入学博士生不论原籍均可申请，需先取得 RGC 参考号，再向中大提交正式申请。
cuhk-hkpfs: 香港中文大学的香港博士研究生奖学金（HKPFS）。该奖学金由香港研究资助局统筹，资格不论原籍，资助含学费豁免、住宿与生活津贴。须先在 RGC 系统申请获取 HKPFS 编号。
cuhk-hkpfs-erg-portal: 香港中文大学工程学院 HKPFS 信息站，介绍工学院香港博士研究生奖学金的申请安排与夏季工作坊。该奖学金面向全日制新入学博士生。
cuhk-hkpfs-leaflet: 香港中文大学研究生院的香港博士研究生奖学金（HKPFS）宣传册，欢迎 2027–2028 学年申请。资助包括学费豁免、生活津贴、住宿津贴，以及会议与研究差旅津贴。
cuhk-japanese-studies-mphil-phd: 香港中文大学日本研究系MPhil–PhD项目，每年约2–3个全额奖学金名额，可同时申请HKPFS（仅PhD）。需满足系入学要求。
cuhk-joint-phd-mainland-partners: 香港中文大学的内地战略合作院校联合培养博士计划（Joint PhD Training Scheme）。学生先在内地战略合作高校注册为博士生，由内地导师与 CUHK 导师共同指导。
cuhk-law-phd-programme: 香港中文大学法学院博士项目，招收法学方向博士生。提供 HKPFS 月津贴 HK$28,700（最长三年），另有每年 HK$14,400 会议与研究差旅津贴。
cuhk-pgs-studentship: 香港中文大学研究生助学金（PGS）与 HKPFS 说明。全日制博士通常可获 PGS，最长 4 年。2025-26 年度博士候选前月额 HK$19,100、候选后 HK$19,600，年度总额 HK$229,200。
cuhk-phd-pharmacy: 香港中文大学药学博士项目，专业方向含药剂学、药物化学、药学实践和药学经济学等。2027/28 学费为 HK$49,500，需药学或相关学科硕士学位。
cuhk-phd-public-health-hkpfs: 香港中文大学公共卫生方向的博士资助名额，属 HKPFS 项目，公告于2024年10月发布，所载为2025–26轮，适用的申请要求以官网为准。
cuhk-rih-postdoc: 香港中文大学人文高等研究所（RIH）的博士后研究员计划，一般为期 2 年、不可续期，需指定学院导师。申请需提交 800 字研究计划、不超过 25 页的写作样本和三封推荐信。
cuhk-soc-rpg-admission-2026-27: 香港中文大学社会学系研究型博士（RPg）招生。招生海报列出 HKPFS 资助，含学费减免、生活津贴和住宿补助，2026–27 年标准最高为 US$43,700/年。内地学生能否申请 HKPFS 需向学系确认。
cuhk-social-welfare-phd: 香港中文大学社会福利学哲学硕士与博士项目，博士候选人资格前生活津贴为每月HK$19,100，候选人资格后为HK$19,600。申请需英文个人陈述与研究计划，一般要求社会工作或相关领域学位。
cuhk-sph-research-postgrad: 香港中文大学公共卫生及基层医疗学院的 MPhil–PhD 研究生项目，英语授课，招收内地等地学生。需同时完成 RGC（HKPFS）与校研究生院申请，HKPFS 与校内研究生奖学金为竞争性资助，不保证获得。
cuhk-stat-hkpfs-2024: 香港中文大学统计学系的博士生资助（HKPFS）说明，面向全职新入学博士生。2024 版列出每年 HK$331,200 的津贴，另含学费与差旅津贴；系内要求总 GPA 不低于 3.4/4.0，有发表成果者除外。
cuhk-translation-phd: 香港中文大学研究型翻译学博士，国际生可申请。资助需经 HKPFS 或校内 studentship 录取后获得，并非录取即享；学费为 HK$49,500（2027/28）。
cuhksz-lam-robotics-group: 香港中文大学（深圳）Tin Lun Lam 机器人课题组，招收博士生、博士后与研究助理。申请时需将简历、成绩单及研究成果幻灯片发送至导师邮箱。
cullen-scholarship-marine-institute: 爱尔兰海洋研究所（Marine Institute）挂靠的 Cullen 博士奖学金，每轮约 10 个海洋科学博士名额。宿主须为爱尔兰岛内高校的导师，国际生资格以当年公告为准。
cuni-juniorstar-postdoc: 查理大学计算机科学研究所 Samuel Braunfeld 主持的捷克科学基金会（GAČR）项目博后岗位，计划 2026 年秋季入职（可协商），资助至 2028 年底。需具备博士学位。
cuni-lfhk-postgrad: 查理大学第一医学院研究生教育入口，列出博士招生与奖学金基本规则，细节以学院国际办公室为准。学校层面全日制博士月奖学金约 1–2.5 万捷克克朗（来源文件较旧）。
cuni-physics-phd-quantum-optics: 查尔斯大学数学物理学院的物理博士项目（量子光学与光电子学方向），博士生无学费。全额资助课题净不低于 22,000 CZK/月，申请前需先与导师确认课题。
curie-ic-phd: 巴黎居里研究所国际博士项目（IC-PhD），36 个月全日制英文授课。目前没有开放的博士申请征集，可关注 Job offers 页面或直接联系课题组 PI。
curtin-central-scholarship-round: 科廷大学集中奖学金（RTP，仅博士）需先获注册导师发出 Invitation to Apply，2026 年博士基础津贴 38,440 澳元/年（免税）。津贴与学费减免合计的档位仅限本地学生。
curtin-hdr-stipend-scholarship: 科廷大学 HDR 津贴奖学金，2026 年博士基础津贴每年 38,440 澳元，免税，最长 3 年 6 个月全时当量。需先查看 HDR 项目机会并确定导师，再提交 EOI 表格。EOI 不保证录取。
cvml-list: 计算机视觉与机器学习邮件列表，有审核机制，用 [Jobs] 标签发布岗位，用 [Studies] 标签发布 PhD 招生，覆盖全球与欧洲地区。
cvut-pictus-phd-cofund: 捷克理工大学 PICTUS MSCA COFUND 博士项目，第二轮征集 8 名学生，签订 48 个月全职合同。税前月薪 2,444 欧元，另有流动津贴 444 欧元/月；需持硕士学位（或已提交硕士论文），并从课题列表中选题撰写研究计划。
cy-rif-postdoc-programme: 塞浦路斯研究与创新基金会（RIF）的博后研究人员计划，此前有 2024 年与 2025 年征集。外国申请人资格可发邮件至 support@research.org.cy 咨询。
cyber-valley-jobs: Cyber Valley 职位总页（图宾根与斯图加特），汇集各机构的博士、博后与研究员岗位，方向涵盖机器学习、计算机视觉与机器人。
daad-ainet-postdoc-network: DAAD的AInet国际AI早期职业研究者项目，提供虚拟网络周加一周赴德国实验室访问的旅行津贴。这不是全奖博士后职位，适合作为联系德国AI实验室的入口。
daad-china: DAAD 北京代表处中文站，提供德国博士奖学金等项目说明。硕士毕业不超过 6 年，读博开始不超过 3 年；申请时在德国居住超过 15 个月则不符合（以当期公告为准）。
daad-china-foerderprogramme-deutschland: DAAD 中国办事处整理的赴德资助项目检索入口，可按学科与学历筛选，包括 CAS-DAAD 联合博士奖学金等项目。
daad-dlr-research-fellowships: DAAD 与 DLR 联合资助的博士奖学金，覆盖航空航天、能源、交通方向，每月 €1,760，最长 36 个月，另有差旅津贴、医保与家庭补助（以当期公告为准）。需申请 DLR 研究所课题，通过 DAAD 在线门户申请。
daad-international-programmes-db: DAAD 官方的德国国际项目数据库，可按学位选博士、学科和授课语言筛选英文博士项目，并显示学费情况。德国大多数公立校博士不收学费。页面缓存可能显示 0 条结果，需在线直接查询。
daad-kc-wong-postdoc: DAAD–王宽诚博士后奖学金，面向中国大陆在职的高校与科研机构教研人员（持博士学位，任教授、副教授、研究员等职务），赴德做 3–12 个月博士后研究。月资助 2100 欧元并含保险，领域涵盖自然科学、数学、工程、农学、医学。
daad-phdgermany: DAAD PhDGermany 数据库，列出面向国际申请者的德国博士岗位，可按资助类型、学科和城市筛选。资助形式以各岗位说明为准。
daad-prime-postdoc: DAAD PRIME 博士后研究项目，资助 18 个月，其中 12 个月海外研究、6 个月德国再融入，东道须为德国高校。申请截止前五年内须在德国高校或研究体系学习或工作至少三年，博士学位获得后不超过 6 年（育儿等可顺延）。
daad-scholarship-db: DAAD 奖学金数据库，供博士申请者查找可申请的奖学金。在检索中选择国籍 China、学位 Doctoral candidates，即可列出全部可申请项目。
dal-csc-phd: Dalhousie 大学 CSC 博士奖学金（入学型），由 CSC 资助生活费（含海外医保）、往返机票与签证费，达尔豪斯承担学费资助最长 48 个月。申请需要导师的电子回复。
dal-killam-phd: 达尔豪斯大学管理学院的 Killam 博士奖学金入口，面向加拿大与国际学生，2026 年由该学院授予一项。
dal-physiology-full-funding: 达尔豪斯大学生理学与生物物理系的博士资助政策。无全额资助不予录取，不接受自费生，资助最长 4 年，资助来自导师经费或个人奖学金。2026–27 博士最低到手收入为 CAD 17,000/年，助教收入不计入。
dal-research-excellence: 达尔豪斯大学研究卓越奖学金（DRES），面向加拿大及国际博士新生，每年 CAD $35,000，最长 4 年。需在博士前两年内申请 Tri-agency CGRS-D。
dal-scholarships-bursaries: 达尔豪斯大学研究生奖学金与助学金总入口，多数奖项通过统一申请（Harmonized Scholarship Process）办理。各奖项金额与国际生资格不同，以各奖项条款为准。
damon-runyon-quantitative-biology: Damon Runyon 定量生物学博后奖学金，需配对干实验与湿实验导师，研究须在美国进行。资助 3 年，年津贴依次为 $76,000、$78,000、$80,000，另有每年 $2,000 费用津贴。
dan-david-society-tau: 特拉维夫大学人文学院 Dan David 博后计划，三年期，最多 4 名，自 2027 年 10 月 1 日起，每年 $40,000。博士学位须于 2022 年 10 月 1 日至 2027 年 9 月 1 日间获得，本校博士不具资格。
dara-denmark-phd-fellowships: 丹麦高级研究学院（DARA）博士奖学金，每年两次发放全额奖学金。学生需自拟项目并与丹麦导师合作，Pioneer Centre for AI 附属导师可接收。
darden-phd-tuition-fellowship: 弗吉尼亚大学 Darden 商学院博士奖学金，官网称全日制博士生可获五年全额学费与费用支持（以学业进展达标为条件），并补贴大学学生医保；要求为 Darden 教员完成研究助理工作。
dartmouth-graduate-aid-overview: 达特茅斯学院研究生资助概览，称所有博士项目都提供财务支持（含年度津贴或奖学金），学费通常由奖学金支付，一般覆盖整个博士期。
dartmouth-graduate-stipends: 达特茅斯学院研究生院 2026–27 学年博士资助：津贴 $49,862.40，另有 $1,500 搬迁奖金，良好学术状态下保障 5 年。国际新生另有 $1,200 签证等一次性补助。
dartmouth-mellon-postdoc: 达特茅斯学院 Leslie Center 的梅隆人文博士后（Mellon Postdoctoral Fellowships），设意大利研究（跨学科方向）与宗教（南亚宗教）两个岗位。具体资格以各岗位公告为准。
dartmouth-neukom-postdoc-fellows: 达特茅斯学院Neukom计算科学研究院的两年期跨学科博后项目，研究需与计算相关。津贴为$70,000（2027–2028），另有设备、差旅与研究材料经费。国际生资格需向Neukom确认。
dbg-job-openings-plant-sciences: 德国植物学会（DBG）植物科学职位板，列有博士与博士后岗位。多数岗位截止在 2026 年 10–11 月，需随时查看新职位；待遇以各岗位公告为准。
dcu-phd-scholarships: 都柏林城市大学人文社科各学院博士奖学金的汇总入口，列出 2026 年各学院的博士奖学金项目。具体轮次与国际生资格以各学院为准。
de-tuebingen-csc-phd: 图宾根大学与中国政府合作的 CSC 博士项目，须为中国大陆国籍，可全职最长 48 个月，或分段在图宾根停留。免学费，CSC 提供生活费与往返机票。申请人应选择有名额的课题组，导师需先提交课题申报。
deloitte-doctoral-fellowship: 德勤基金会会计博士奖学金，每年约 10 名会计博士获 25,000 美元，需由本校会计博士项目提名。
desy-doctoral-positions: DESY 提供粒子物理、光子科学与加速器方向的博士课题，地点在汉堡与采泽，博士学位由合作大学（如汉堡大学）授予，课题随时发布，可直接联系课题负责人。
desy-theory-phd-positions: 汉堡 DESY 理论物理组的博士与博后岗位。博士岗位薪资由 DESY 支付，须先被大学接收为博士生，申请时附 CV 并直接联系理论组相关研究人员；研究员奖学金申请人须已获博士学位。
dff-sapere-aude-research-leader: 丹麦独立研究基金（DFF）的 DFF-Research Leader 青年研究领袖资助，面向获博士学位 3–8 年内的青年研究者，用于组建独立研究团队，不是学生岗位。预算上限 DKK 4,450,000（不含间接费）。
dfg-gefoerderte-verfahren-jobs: 德国研究基金会（DFG）资助项目的招聘公告集中页，可找到DFG项目中的博士与博后岗位。页面当前列有一则博士岗位，位于杜伊斯堡-埃森大学多尺度模拟工作组，为期3年，TV-L 13。
dfg-graduiertenkollegs: 德国研究基金会（DFG）资助的研究生院（Graduiertenkollegs），由高校设立，DFG 资助最长九年，内容包括博士岗位与博后岗位。招聘与申请需直接联系各校，以各校公告为准。
dfg-grk-new-colleges-2026: 德国研究基金会（DFG）批准新设 10 所研究训练组（GRK），自 2026 年秋季起首期资助 5 年，合计约 7000 万欧元（含 22% 间接费）。各组的高校与研究主题见页面，岗位以各组公告为准。
dfg-heisenberg-programme: 德国研究基金会（DFG）海森堡项目，带薪资助，面向已接近教授任职条件的研究者，可随时提交申请。外国研究者具备相应资格时可申请，并可从国外提交，不适用于仅有博士学位的早期博后。
dfg-walter-benjamin: DFG Walter Benjamin 博士后项目，面向已获博士学位（或已提交论文）的早期博后研究者，可走德国带薪岗位路线，也可申请国外停留（Stipendium）。通常为 2 年，需更换所在机构。
dfk-paris-doctoral-contracts: 德国艺术史中心巴黎（DFK Paris）的博士合同，期限三年（可延一年），须在巴黎现场研究。第一年每月 €2,300（毛额），之后每年增加 €100。需已在德国或法国大学攻读博士，德语与法语要求较高。
dicyt-usach-postdoctorado-2027: 智利圣地亚哥大学（USACH）DICYT 校内博士后竞赛，与 FONDECYT 不同。竞赛 bases 称项目可由智利人或外国人承担，但须能完成整个执行期，其余资格以 bases 原文为准。
dipf-phdipf-doctoral-programme: DIPF 莱布尼茨教育研究所的 PhDIPF 跨学科博士项目。博士多通过挂靠研究项目的雇员岗位入学（TV-H 工资表），而非独立奖学金；需硕士学位与研究计划。
discoverphds: 英国为主的博士项目库，收录英国、欧洲及全球各地的博士项目。部分项目由高校付费推广，页面以 featured 标出。
diw-graduate-center-phd: DIW Berlin 研究生中心的经济学博士项目，无学费，课程阶段每月 €1,650。研究阶段通常通过部门雇佣合同资助，需满足绩效标准，预期时长五年。需经济学或相关领域硕士学位。
dkfz-hidss4health-phd: 德国 HIDSS4Health 数据科学与健康博士岗位（DKFZ / KIT / 海德堡），全额有薪，英语授课，需数据科学与生命科学双导师。须针对公布的指定课题申请。
dkfz-international-phd: DKFZ（海德堡癌症研究中心）国际博士项目，面向持硕士学位或预计获得硕士的优秀申请者，需两封推荐信。与 HIDSS4Health 相关的博士生同属该项目。
dkfz-international-phd-program: 德国癌症研究中心（DKFZ）国际博士项目，属全额资助的结构化项目，为所有 DKFZ 博士研究员提供导师指导与培训。一般要求 3 年本科加 2 年硕士（含书面研究论文），英语需 TOEFL/IELTS 7.0 或 CAE。
dkfz-postdoctoral-fellowships: 德国海德堡癌症研究中心（DKFZ）博士后奖学金，每年最多 7 个名额，首期合同为两年。2026 轮要求博士学位须在申请截止前两年内获得，并需两封推荐信。
dlgs-dresden-leibniz-graduate-school: 德累斯顿莱布尼茨研究生院（DLGS）面向国际博士生，每年 6 月公告一次，经竞争选拔提供为期 3 年的全职奖学金。金额以官网为准。
dlr-daad-fellowships: 德国航空航天中心（DLR）与 DAAD 联合研究奖学金，面向海外博士与博士后，须为非德国国籍。博士每月 €1,760，最长 36 个月；申请须经 DAAD 门户，选择具体 DLR 研究所岗位，DLR 研究所提供资助，DAAD 承担其他费用。
dlr-institute-vacancies: 德国航空航天中心（DLR）研究所的博士与博后招聘入口，博士岗位在 DLR 统一招聘平台发布，设三年期 DLR Graduate Program 培训。部分研究所不接受无岗位的自荐。
dlut-doctoral-enrollment-2026: 大连理工大学化工学院 2026 年春季博士拟招生导师名单，列出各导师的博士名额，涵盖化学工程与技术、储能等方向，可据此联系导师。名单不代表全额奖学金。
doaks-fellowships: 美国 Dumbarton Oaks 的拜占庭与古典研究初级研究员奖，研究涵盖拜占庭、前哥伦布与园林景观。申请者须为论文阶段的在读博士候选人，并获得本校导师支持。
donders-institute-vacancies: 拉德布德大学 Donders 研究所的博士与博士后岗位，为荷兰大学有薪员工合同，页面所见如社会科学学院的博士岗位 'Curiosity in the Classroom'。
donders-phd-programme: 荷兰 Donders 脑科学研究所的博士岗位全年陆续发布，岗位已有资金与导师，各岗位有各自的开始日期。申请需在 Radboud 的 Donders 岗位页投递，研究生院不负责接收申请。
dra-ku-grants: 哥本哈根大学药物研究学院的资助页入口，面向药学科学领域博士生。博士资助多以课题组公告发布；DRA Scholarships 是面向硕士阶段优秀学生的预科培养，并非博士资助。
dra-ku-programme: 哥本哈根大学药物研究学院（DRA）博士项目。丹麦博士通常为 3 年带薪职位，申请须先选定所在学院的博士学校，并找到已获资助的岗位或与导师共同提交课题。
dresden-schaufler-kolleg-promotionsstipendien: 德累斯顿 Schaufler 学院第三期博士奖学金，招 8 名，资助期 2027 年 4 月至 2030 年 9 月，主题为「能源文化的转型」，面向社会科学、人文、文化或教育科学方向的早期职业研究者。
drexel-lebow-phd-funding: 德雷塞尔大学 LeBow 商学院为博士生提供 5 年学费与津贴支持，条件是学业进展达标。助教资助含津贴和全日制学费减免，所有录取博士自动纳入助理岗位考虑。
dshs-cologne-phd-programme: 科隆德国体育大学（DSHS）的博士项目。津贴每月 €1,650（有子女为 €1,850），为期 3 年，可延长 6 个月。内部博士奖学金名额较少，约 2 个；运动科学背景者可联系学院学术职业办公室。
dtu-energy-vacant-positions: 丹麦技术大学能源系（DTU Energy）的空缺岗位页，覆盖电池、氢能、光伏与储能等方向的博士与博士后职位，岗位随时发布，博士为带薪雇佣。
dtu-framebio-recruitment: 丹麦技术大学 FRAMEBIO 研究组直接发布的招聘页，面向博士与博后，岗位为带薪职位。适合定期关注，具体岗位与资助细节以各岗位页为准。
dtu-healthtech-phd-school: DTU 健康技术学院博士学校的在招岗位入口，岗位为带薪全职博士职位，部分要求两年制（120 ECTS）硕士或同等学历。具体资格以各岗位公告为准。
dtu-industrial-phd: 丹麦技术大学（DTU）产业博士，受雇于企业并在 DTU 注册，为期 3 年，由丹麦创新基金支持。需先获研究生院有条件批准。非北欧、欧盟、EEA 或瑞士公民须提前约 2.5 个月办理工作与居留许可。
dtu-jobs: 丹麦技术大学（DTU）的空缺职位页。博士为受薪雇员，通常签 3 年期固定期限合同，月薪约 DKK 34,000 以上（2024 年数据），国内外候选人均可申请。
dtu-phd-applicant-guide: DTU 博士申请指南，需硕士或同等学历，博士全年可入学。岗位在 vacant positions 列表发布，能源方向岗位可在 DTU Energy 岗位页查看。
dtu-phd-salary: 丹麦技术大学（DTU）的官方说明页，博士生以雇员身份受聘（PhD fellow 制度），有薪资。这是制度说明而非招生公告，具体资格与截止请以各岗位页为准。
duke-12-month-funding-news: 杜克大学研究生院博士资助承诺，博士前五年提供含 12 个月生活费的保障资助，五年后由各项目决定。该承诺见于 2019 年 4 月的新闻稿。
duke-biochem-financial-support: 杜克大学生物化学系博士项目，系页面称 6 年全额资助，覆盖学费、费用与津贴，含医保，2024–25 估算约 $40,000/年。国际生的 Dean’s Scholarship 为第一年后由项目推荐、委员会评审。
duke-bme-phd-admissions: 杜克大学生物医学工程博士项目，官网称录取生前五年提供全年薪津贴、免学费和必要费用，健康与牙科保险保费覆盖六年。
duke-chancellors-scholarship-biomed: 杜克大学国际生生物医学博士奖学金（现称 Dean's Scholarship for International Students），于博士第一学年末授予，资助第二学年的生活津贴、学费与医保，非入学即发。
duke-ece-phd-funding: 杜克大学电子与计算机工程（ECE）博士项目为全额资助：前五年发放津贴并覆盖学费与强制费用，前六年覆盖健康与牙科保险，之后由各项目自行决定。
duke-econ-phd-funding: 杜克大学经济系博士招生页的资助说明。页面称博士前五年全额资助，包括学费、强制费、医保与 12 个月津贴，金额以当年页面为准。
duke-fuqua-phd: 杜克大学 Fuqua 商学院的工商管理博士（PhD in Business Administration）项目，属于学术型博士培养，平均约 5 年完成。
duke-math-phd-guaranteed-funding: 杜克大学数学系博士项目，所有录取学生在项目内享有五年保证资助（guaranteed funding），具体金额与国际生条款请查项目页。
duke-nus-nrf-postdoc-insitu-structural: Duke-NUS 医学院 Lok 实验室的原位结构生物学博士后岗位，以获批的新加坡 NRF 博后奖为前提。固定基本薪资 S$106,800/年，共 4 年，另有 S$250,000 研究经费。需博士学位，申请时博士后经验不超过 3 年。
duke-phd-funding: 杜克大学为所有博士生保证 5 年津贴加学费杂费，另提供 6 年医保。该保障可作为比较美国 offer 时的参照，属于全额资助类别。
duke-physics-phd-financial-support: 杜克大学物理系博士生资助说明页，列出学费与资助安排；研究生院总体承诺前五年提供津贴。页面所载津贴金额为旧年度数据。
duke-seok-yong-lee-lab-postdoc: 杜克大学医学院 Seok-Yong Lee 课题组的博后岗位，由 NIH 资助，研究方向为膜转运机制。申请需提交简历与研究兴趣陈述，有冷冻电镜、膜蛋白生化或电生理背景者更佳。
dumbarton-oaks-mellon-landscape-fellowships: Dumbarton Oaks 园林与景观史方向的 Mellon 研究员项目，面向持终端学位（如 PhD 或 MLA）者或 PhD 候选人等同资格者，研究员需全职驻留。学年资助 $35,000，单学期 $17,500，另有凭报销的场外住房津贴。
dunn-school-graduate-studentships: 牛津大学 Sir William Dunn 病理学院的 DPhil 全额资助竞争项目，面向 2027 学年入学的各国学生，资助包含生活津贴，名额通过竞争分配。
durham-astro-postgraduate: 杜伦大学天文与宇宙学研究生机会页，面向 2027 年 10 月入学的博士与理学硕士。提供 STFC 博士奖学金（学费与生活费，通常 3.5 年）和 CSC 名额（学费与 3.5 年生活津贴），另有自筹或其他来源资金的学生。
durham-business-phd-scholarships: 杜伦大学商学院（DUBS）的博士奖学金，覆盖学费，国际生可申请，设有 DUBS 60 周年博士奖学金与 Global Grand Challenges 等项目。DUBS 60 周年博士奖学金的津贴为每年 £20,780。
durham-csc-awards: 杜伦大学提供的 CSC 奖学金，属全额资助，限中国大陆公民或永久居民申请。需获得无条件录取，或仅需完成现有学位的有条件录取；毕业后须回国。
durham-csc-joint-award: 杜伦大学与 CSC 联合博士奖学金，覆盖学费、年度津贴、医疗保险、往返机票与签证费。仅限中国大陆公民及永久居民，需先获杜大全日制博士无条件 offer（或仅待完成学位的有条件 offer）。
dzne-doctoral-researchers: 德国神经退行性疾病研究中心（DZNE）的博士招聘入口。博士职位通常在职位门户发布，也可直接联系研究组，许多研究组负责人同时在大学任职，中心博士社群约150人。
eacr-astrazeneca-postdoctoral-fellowships: 欧洲癌症研究协会（EACR）与阿斯利康合办的博后奖学金，最长 3 年。申请需为 EACR 会员、持 PhD、博后经验不超过 8 年、从事癌症研究，并须披露 AI 使用情况。
eadh-jobs-category: 欧洲数字人文协会（EADH）的招聘分类，集中发布欧洲数字人文领域的博士与博后职位，部分内容较旧，可按日期查找近期职位。
eahn-fellowships-category: 欧洲建筑史网络（EAHN）的博士奖学金，以 Junior Fellow 为主，任期 1 年，含象征性津贴。需在国际大学攻读建筑史或相近领域博士。
eapls-vacancies: 欧洲编程语言与系统协会（EAPLS）的招聘板，集中编程语言与形式化验证方向的博士与博后岗位。更新不规律，需逐条查看各岗位要求。
eaps-mit-graduate-funding: MIT 地球大气与行星科学系的博士资助，录取的博士生可获得津贴、全额学费与医保，无需单独申请资助。第一年多为 fellowship 或 RA，之后以 RA/TA 为主。
earthbyte-postgrad-opportunities: 悉尼大学 EarthByte 研究组的博士机会页，研究方向为板块构造与地球动力学，属于项目型博士奖学金，需获悉尼大学地球科学院博士录取。澳大利亚政府研究培养计划（RTP）可供国际生申请，个别项目限澳大利亚国内生。
eawag-postdoc-fellowship: 瑞士水科学研究所 Eawag 的两年期博士后奖学金。要求博士学位在申请截止前两年内获得，且不得曾与 Eawag 合作。
ebi-sanger-espod-postdoc: EMBL-EBI 与 Sanger 研究所联合博士后奖学金（ESPOD），为期 36 个月，税后月津贴 £3,535.78（不含养老金与保险）。
eca-art-phd-scholarship-edinburgh: 爱丁堡艺术学院（ECA）博士奖学金，页面提到大学博士学院将为 2027–2028 学年入学的博士生提供奖学金，艺术学院亦公告下一轮博士奖学金。资助为 UKRI 标准津贴。
ecb-wim-duisenberg-fellowship: 欧洲央行研究部的 Wim Duisenberg 研究学者奖学金（2027 轮），面向已获博士学位、在顶级期刊有突出发表的研究者，到法兰克福总部访问 2–6 个月。这是访问学者项目而非学生资助，提供按资历确定的财务津贴。
eccles-utah-phd-tuition-support: 美国犹他大学 Eccles 商学院博士项目，现行页面提供有竞争力的年度津贴、五年学费减免、研究经费与医保。
ecn-berlin-phd: 柏林爱因斯坦神经科学中心（ECN）通过竞争性遴选授予神经科学博士奖学金。2017–2023 年共授予 111 个，其中 72% 授予国际学者，2022 年起也向非 ECN 学生开放。
eco-n-leipzig-graduiertenkolleg: 莱比锡 ECO-N 博士培训组（Graduiertenkolleg），设 14 个博士岗位，以岗位工资形式资助，属于当前资助期内的博士培训。申请需通过 iDiv 招聘系统提交。
econ-princeton-phd-admissions: 普林斯顿大学经济系博士项目，录取博士生可获学费、学生医保与基本生活津贴，含夏季支持。12 个月生活津贴为 $52,680–$55,440（2026–27 学年）。
econjobmarket: 经济学求职平台 EconJobMarket，EEA 与其合作，平台同时收录博士与博后岗位，免费发布预博士（pre-doc）与 RA 岗位，覆盖全球，该类岗位板块需登录后查看。
economicsnetwork-jobs: 英国 Economics Network 经济学职位板，列出英国及国际的经济学研究与教学岗位，适合查找博后，可按截止日期筛选。申请前需留意工作签证要求。
ed-ai-cdt-1117: 爱丁堡 AI 博士培训中心（Centre for Doctoral Training in AI）全日制 4 年，含生活津贴、学费（英国及海外学生）及研究与差旅补助。签证费与 IHS 需学生自付。
ed-economics-phd-fees-funding: 爱丁堡大学经济学院的博士学费与奖学金，名额有限。有名额时提供 UKRI 标准生活津贴（自 2026 年 10 月起每年 £21,805）并覆盖学费，资助 4 年；奖学金按学术成绩择优，研究兴趣需与至少两位学院学者契合。
ed261-paris-cite-3ch-cd: 巴黎西岱大学 ED 261（认知·行为）博士合同竞赛，带薪，每年 5–7 个合同。需研究型硕士，须提交导师与实验室负责人同意书及研究计划，每人只能报一个主题。
ed279-pantheon-sorbonne-cd-2026: 巴黎第一大学 ED 279 艺术类博士院每年竞得 4 个为期三年的博士合同。申请需研究型硕士（Master 2 Recherche）且成绩达 Très Bien（16/20），并须先联系拟任导师。
ed3c-doctoral-contract-terms: 索邦、PSL 与巴黎大学的认知科学博士学校 ED3C（大脑·认知·行为）的博士合同，每年通过 PAC 竞争分配：导师提交课题，学生申请并面试。
ed623-paris-cite-sse-cd: 巴黎西岱大学 ED 623（知识·科学·教育）博士合同，属带薪岗位，往年 10 月入职。申请要求以学院公告为准。
ed624-paris-cite-sciences-societes-cd: 巴黎西岱大学 ED 624（社会科学）博士合同竞赛，带薪。要求 M1 与 M2 成绩均不低于 14/20，以单一 PDF 提交含不超过 10 页研究计划的完整申请，每位 HDR 导师每轮只能推荐 1 名候选人。
edbmic-lyon-doctoral-contract-exam: 里昂 ED 340 BMIC 博士合同竞赛，带薪，课题须在 BMIC 研究团队内完成。面向持 Master 2 或同等学位（近五年内取得）者，课题陈述与答辩可用法语或英语，申请以电邮提交。
edcanbios-lyon-competitive-admission: 里昂 ED 656（CanBioS）博士合同竞赛，由 UCBL1 组织，带薪。课题由导师经 ADUM 提交，申请前需先邮件学院获取授权。
edinburgh-ahrc-dla-open-competition-2027: 爱丁堡大学 AHRC 博士景观奖，面向 2027/28 年入学的历史、古典学与考古学院博士项目申请者，共两个名额，全额资助含学费与 UKRI 标准津贴（约 £21,805/年）。
edinburgh-bhf-phd-opportunities: 爱丁堡大学BHF心血管研究中心的四年制博士项目列表，涵盖血管龛、心血管疾病，以及与UK DRI合作的痴呆研究项目。页面所列2026入学轮截止均已过，页面提及后续还会有入学批次。
edinburgh-bs-phd-scholarships: 爱丁堡大学商学院博士奖学金总页，含 ESRC 公开竞赛、Edinburgh Doctoral College 奖学金与学院研究奖。Doctoral College 奖学金覆盖学费并发放与 UKRI 最低标准相当的年津贴，面向所有录取者。
edinburgh-china-council-scholarship: 爱丁堡大学 CSC 合作奖学金，全额资助，仅面向中国大陆籍（含永久居民）博士生。需经国家留学基金委选拔，申请时已获爱丁堡博士录取。参与院系每年不同。
edinburgh-doctoral-college-intl: 爱丁堡大学 Doctoral College 国际博士奖学金，覆盖学费并提供生活津贴，资助期 3–4 年，面向英国与海外学生。需英国一等或 2:1 或同等国际学位。
edinburgh-doctoral-college-scholarships-health: 爱丁堡大学健康与医学院博士学院奖学金，覆盖学费及UKRI标准生活津贴，资助期最长3.5年（视学业进展而定）。英国与海外学生均可申请，须先提交博士录取申请，奖学金另行评审。
edinburgh-doctoral-other-funding: 爱丁堡大学 Doctoral College 奖学金列表，面向英国及海外学生，起始 2027–2028 学年，覆盖学费并发放 UKRI 标准生活津贴（2026–2027 学年为 £21,805）。需已申请该校博士入学。
edinburgh-ewen-cameron-studentship: 爱丁堡大学法学院 Ewen Cameron 博士奖学金，提供学费及按 UKRI 标准的生活津贴（最长三年），英国与国际学生均可申请。需一等或高等荣誉学位（或同等），研究计划须与学院契合。
edinburgh-global-health-phd: 爱丁堡大学 Usher 研究所的全球卫生 PhD，2027年入学，全日制3年、非全日制6年，申请前需先联系潜在导师。公开资助多仅覆盖英国与欧盟学费，国际生需自付差额或申请校级奖学金。
edinburgh-history-classics-archaeology-intl: 爱丁堡大学历史、古典与考古学院面向国际生的命名博士奖学金列表。部分奖学金如 Arbuthnott 每年约 £20,780，各奖学金条件不同，建议先联系拟申请导师。
edinburgh-informatics-vacancies: 爱丁堡大学信息学院招聘页，岗位统一发布在 University of Edinburgh Jobs 站点。抓取时列出的是 Lecturer、Reader 等学术岗位，具体以该站点发布的职位广告为准。
edinburgh-law-phd-scholarships: 爱丁堡大学法学院博士奖学金（2027–28 入学），主要为 SGSSS Open 社会科学博士竞争，资助学费加 UKRI 标准津贴，仅限社会科学视角研究，名额有限，录取与奖学金申请均需完成。
edinburgh-mcintosh-patterson-studentship: 爱丁堡大学历史语言学全额博士奖学金，提供全额学费（英国、欧盟或海外）及每年£15,500生活费，为期三年。研究计划须为历史语言学，且可由爱丁堡语言学教师指导。页面称目前不接受申请。
edinburgh-nuclear-physics-postgrad: 爱丁堡大学核物理研究生项目页，列有 PhD 课题与 studentship 信息，系里可直接提供 STFC 名额。PLANET 博士项目仅面向 home fee status 学生。
edinburgh-ppl-international-funding: 爱丁堡大学哲学、心理与语言学院的国际生资助列表，包括ERC资助的博士、James Forrester道德哲学博士奖学金、ERC Synergy Nilomorph博士奖学金与Leverhulme Trust博士名额等。多为学费减免，多数当期窗口已过。
edinburgh-spads-cdt: 爱丁堡大学与赫瑞-瓦特大学合办的国防相关传感与 AI 博士中心，全额资助，津贴为 £23,112/年（免税，2025/26）。需英国 2:1 或等值学位，须通过安全审查，需要 ATAS 证书者不符合条件。
edinburgh-sps-doctoral-college-scholarship: 爱丁堡大学社会与政治科学院博士学院奖学金，覆盖全额学费并发放UKRI标准生活费，面向所有国籍。申请前须先提交SPS博士入学申请，首年授予，可续期至共3.5年。
edinburgh-stats-phd-opportunities: 爱丁堡大学数学学院统计方向的博士机会，设有数量有限的 4 年全额奖学金，含学费减免与 UKRI 标准津贴。申请人无需另行申请奖学金，但需在截止前提交录取申请，并需一等荣誉学位，或二等一荣誉学位加硕士学位。
edmh-paris-saclay: 巴黎-萨克雷 Hadamard 数学博士学校（EDMH）博士合同，经竞争性选拔并通过 ADUM 平台申请，合同期 3 年。需硕士或同等学历。
edstep-phd-financing: 格勒诺布尔阿尔卑斯大学 EDSTEP 博士经费类型说明，列出竞争性合同博士、IDEX 定向合同博士及 CIFRE（企业雇用 3 年）三类。
eduhk-phd: 香港教育大学博士与 MPhil 项目，提供 HKPFS 入口及校内研究生奖学金 RPGS，2026/27 学年每月 HK$19,100，博士候选资格后每月 HK$19,600。需满足学校录取要求。
ee-msca-route-ut-notice: 爱沙尼亚塔尔图大学关于 MSCA 博后通道的通知：赴爱沙尼亚的博后不能直接向 ETAG 申请，须通过 MSCA 途径。要求已获博士学位、科研经验不超过 8 年，并需先联系依托导师。
ee-stanford-phd-admissions: 斯坦福大学电气工程（EE）博士招生页。页面称 EE 博士生只要学业进展合格即可获得全额资助，申请无需先有硕士学位。另设的 Knight-Hennessy 奖学金需单独申请。
eea-job-market-hub: 欧洲经济学会（EEA）官方招聘入口，汇总欧洲经济学 job market 与 JEEH 岗位，多为预博士与博士后职位，最短 9 个月，适合在欧洲经济学领域寻找岗位的申请者查看。
eecs-berkeley-phd-funding-faq: 加州大学伯克利分校 EECS 博士招生 FAQ 页。学士即可直接申请，无需硕士，不要求 GRE，仅接受秋季入学，无滚动录取。资助与国际生条款以官网为准。
egu-cl-jobs: 欧洲地球科学联合会（EGU）气候分部的岗位板块，汇集气候方向的博士与博后机会，可在该页面查看相关岗位入口与各岗位信息。
egu-jobs: EGU 职位板（egu.eu/jobs），收录地球、行星与空间科学岗位，可按学科分区（division）与关键词检索，用关键词 PhD 可查找博士岗位，在站点可查看在招状态。
ehu-pifg-predoc: 巴斯克大学（UPV/EHU）各研究组以自有经费资助的预博士研究人员合同（PIF 系列），属于带薪岗位，按轮次开放申请。
eiffel: 法国外交部埃菲尔卓越奖学金，博士类月津贴 €2,100，含交通、保险等服务，不含学费。须由法国高校通过 Campus France 网站提交，学生不能直接申请。
eiffel-france-excellence-campusfrance: 法国 Eiffel 卓越奖学金（Campus France），面向博士，申请者需持硕士学位且年龄不超过 35 岁。学生不能直接向 Campus France 申请，须由法国高校提交，博士生资助需与法国高校的共培养协议挂钩。
eiffel-u-paris-2027: 法国 Eiffel 卓越奖学金在巴黎大学的 2027–28 学年校内申请说明。博士生每月津贴 2000 欧元，获奖者免除巴黎城市大学学费。学生须经法国高校提交，不能直接向 Campus France 投递。
einstein-postdoctoral-grant-berlin: 爱因斯坦基金会柏林博士后资助，须由柏林高校提交，需先与柏林合作导师确认。博士毕业不超过 4 年（可因子女、照护等情况延长），资助最长 4 年（特殊情况 6 年）。
eit-digital-industrial-phd: EIT Digital 产业博士征集。已在读博士者可走 EIT Digital 博士学校，未入读博士者可申请产业博士（Industrial PhD）岗位，具体课题以公告为准。
eller-accounting-phd: 亚利桑那大学 Eller 商学院会计博士，全员享全额学费加生活津贴，可通过课程教学增加收入。2027 年秋季入学，需四年制本科、GPA 3.0 及 GMAT 或 GRE。
eller-marketing-phd-funding: 亚利桑那大学 Eller 商学院市场营销博士项目，页面称多数营销博士获全额资助（助研、助教或奖学金，含学费减免与医保），资助保证 5 年。
ellis-central-call-2026: ELLIS 博士与博后项目2026年中央招生，面向2027年入学，需通过 ELLIS 门户提交完整申请，并找到愿意接收的 ELLIS 导师。ELLIS 本身不发工资，资助由导师所在单位提供。
ellis-phd: 欧洲 AI 与机器学习博士项目，提供两个欧洲国家的双导师、三种研究轨道，以及欧洲境内 6 个月研究交流。
ellis-research-jobs: ELLIS 研究岗位列表页，汇集网络内的博士与博后岗位，分布于欧洲多国。具体资助与要求以各岗位页为准。
ellis-tubingen-open-positions: ELLIS Institute Tübingen 统一岗位页，汇总各 PI 的博士与博后招聘，岗位多为雇员合同。ELLIS、CLS、IMPRS 等博士项目通常秋季开放、10 至 11 月中旬截止，各岗位的资助与截止日需逐个确认。
ellis-tue-phd-positions: ELLIS 图宾根研究所的博士岗位汇总，由 PI 通过 ELLIS、CLS、IMPRS、MPI-AIX 等项目招收博士，多为德国公共部门全职薪资。需逐个查看各 PI 的要求。
ellis-vienna-open-positions: ELLIS Unit Vienna（ISTA）的开放岗位入口，招博士与博后，多为薪资岗位。申请需博士学位及相关研究经历，并提交研究陈述、论文列表与三封推荐信。
elte-stipendium-hungaricum: ELTE 页面介绍的匈牙利政府奖学金（Stipendium Hungaricum）博士项目，通常为 2+2 年。资格依据双边教育协议与国籍，并非所有国家都可申请，具体以官网与 Tempus 公告为准。
embl-ebi-eipp: EMBL 国际博士项目（EMBL-EBI）是一项全额资助的博士项目，学制 3.5–4 年，适合生物信息与计算生物方向。官方入口为 embl.org，适合希望在欧洲研究机构攻读博士的读者查看。
embl-eipod-linc: EMBL EIPOD-LinC跨学科博士后，官网FAQ称面向所有国籍。需截止日前已获博士学位，博后研究经验不超过8年，并需EMBL导师及合作伙伴。
embl-eipp-topics-2027: EMBL 国际博士项目（EIPP）的研究方向与 2027 年 10 月入学说明。申请需选择两个 EMBL 研究单元，并列出最多四个感兴趣的研究方向；需两封学术推荐信，仅接受在线申请，不收申请费。
embl-phd: 欧洲分子生物学实验室（EMBL）国际博士项目，设于海德堡等 6 个站点，全资助，对所有国籍开放，申请不收费。需持可在学位授予国攻读博士的大学学位，并需两位学术推荐人。
embo-postdoctoral-fellowships: EMBO 博士后奖学金，支持欧洲及世界各地的博士后，期限最长两年，强调国际流动，不得前往获得博士学位的同一国家。需至少一篇第一作者同行评议论文（或符合条件的预印本）。
emory-econ-phd-support: Emory大学经济学系博士项目提供学费全额奖学金加津贴，标准津贴每年$43,260，为期五年，另有医保补贴每年$4,762。
emory-gdbbs-financial: 埃默里大学（Emory）GDBBS 生物医学博士资助，学费全额奖学金，2025–26 津贴 $42,000/年，学生医保 100% 补贴（仅本人）。学生费每学年不足 1200 美元，需自付。
emory-laney-finance-overview: Emory大学Laney研究生院的博士资助概览：标准学费奖学金覆盖全部学费，津贴约$43,260/年（FY26-27），按五年计，各项目略有不同。
emory-lgs-policy-funding: 埃默里大学 Laney 研究生院博士资助政策，博士可享全额学费奖学金最多七年，生活补助与医疗保险保障五年并可延长。资料中博士生工会合同标准年薪为 $43,260。
ems-jobs: 欧洲数学会（EMS）岗位板，列出 2026 年 5 月至 10 月发布的博士与博后数学岗位，最新一条发布于 2026 年 10 月 14 日，覆盖欧洲地区。
energy-gov-fellowships: 美国能源部（DOE）综合能源系统办公室汇总的奖学金与研究机会，列有 ORISE 科技研究员、AAAS 科技政策研究员和 Energy Innovator 等任期制项目，其中 ORISE 与 AAAS 项目限美国公民或居民。
enerhy-cdt: EnerHy 绿氢与风能博士培训中心，由 EPSRC 资助，Loughborough、Cranfield、Strathclyde 三校联合运营。最低年生活补助 £19,237（4 年制）。部分项目仅限英国学费身份，国际生资格因项目而异。
epfl-admission-criteria: EPFL 博士录取标准与申请流程说明。申请须提交至所选博士项目，在线填写表格并列出 3 位推荐人，PDF 材料可用英、法、德、意文。入学前还需确定论文课题、导师并落实经费。
epfl-amcv-openings: EPFL AMCV 组的博士岗位，研究偏微分方程与变分方法，可能涉及计算机辅助证明，薪资为 EPFL 标准博士助理水平。须以邮件申请，附 CV、成绩单、不超过 3 页的研究说明及至多 3 位推荐人。
epfl-biorob-openings: EPFL BioRob 机器人实验室的博士岗位，在招满前持续接收申请。博士生岗位须先被 EPFL 博士学院录取，申请时需按学院流程完成双重申请。
epfl-cvlab-positions: EPFL CVLab 计算机视觉实验室的博士候选岗位，方向包括神经元形态建模、增强现实与人物跟踪，基础薪资 CHF 55,225/年。申请表需注明 Prof. Fua 的 CVLab，页面称无需事先联系导师。
epfl-cyd-fellowships: 瑞士洛桑联邦理工学院（EPFL）的 CYD 网络防御博士奖学金，资助最长 4 年，含薪酬及科研与会议经费。须在瑞士高校读博并获瑞士教授担任导师，研究需契合瑞士网络防务优先方向。
epfl-edbb-open-positions: EPFL 生物技术与生物工程博士项目（EDBB）的实验室岗位汇总。需先被 EDBB 博士项目录取，录取后方可受聘为 doctoral assistant，岗位由各 PI 发布。
epfl-edcb-open-positions: EPFL 计算与定量生物学（EDCB）博士项目下的实验室岗位，包括 Barth Lab、可编程生物材料实验室等多位 PI 的博士岗位。需先通过 EDCB 博士项目申请并获得实验室岗位，录取后为带薪 doctoral assistant。
epfl-edce-applicants: EPFL 土木与环境工程博士项目（EDCE）的申请说明。页面称 4 年制学士学位也可申请（需额外修 8 学分），需先获项目录取才会被聘为带薪博士生，TOEFL/GRE 非必需。
epfl-edch-chemistry-doctoral: EPFL 化学与化学工程博士学院，项目通常 4 年、全英文授课，需化学或化工背景的学士或硕士学历。申请由学院统一评审，无需先找到导师，但页面建议先参考实验室方向。
epfl-edey-applicants: EPFL 能源博士项目（EDEY）的申请说明，资助方式为带薪。申请者需持硕士或同等学历、英语较强，并提交 3 封推荐信；建议先完成在线申请再联系潜在导师。
epfl-edic-program: EPFL 计算机与通信科学博士项目（EDIC），统一集中招生，申请经在线表格提交。第二轮主要面向本地申请者，第一年可先探索不同研究方向再选定。
epfl-edma-applicants: EPFL 数学博士项目（EDMA）的申请说明。需提交在线申请表，附 3 封推荐信及学历与成绩单，须提前联系 3 位推荐人。非英语或法语母语者建议提交 TOEFL。
epfl-edms-open-positions: EPFL 分子生命科学博士项目（EDMS）的实验室在招岗位，起薪 CHF 55,225/年起。需先直接向 EDMS 博士项目申请并被录取，之后才能受聘为博士助理，不能直接投导师。
epfl-edmx-applicants: 瑞士EPFL材料科学与工程（EDMX）博士项目申请者页，岗位多为带薪雇佣。需先被学院录取后加入实验室，硕士在读或已获相关硕士者可申请，已完成相近博士论文者不可录取。
epfl-edne: EPFL 神经科学博士项目（EDNE），面向已有或即将获得硕士学位（学科不限）的申请者，无需 TOEFL 或 GRE。申请时需填写 3 至 5 个感兴趣的实验室，并准备简历、动机信、成绩单与推荐信。
epfl-edne-open-positions: 瑞士洛桑联邦理工学院（EPFL）EDNE 神经科学博士学院下属课题组的博士空缺集中页。通常需先被博士学院录取，在线申请时可选择 3–5 个实验室，入围后参加面试日。
epfl-ellis-lausanne-unit: EPFL 洛桑 ELLIS 单元的博士与博后页，介绍 ELLIS 博士项目采用双导师制，要求至少 6 个月交流，并列出在读博士名单。
epfl-galatea-jobs: 瑞士 EPFL Galatea 实验室的博士岗位，研究超快激光与物质相互作用，2026 年将开放两个名额。申请人须先被 EPFL 的 EDPO、EDAM 或 EDPY 博士项目之一录取。
epfl-grid-ess-positions: EPFL 电网与储能系统实验室（GRID-ESS）提供 2 个带薪博士岗位，研究方向包括主动配电网、本地能源市场和电池储能。需电气、电子或相关专业硕士（或即将完成），并有较强电力系统背景及 Python/Julia 编程能力。
epfl-idephics-open-positions: EPFL IdePHICS 实验室的统计物理与机器学习交叉方向博士岗，全年持续接收申请。需经 EPFL 博士项目申请，并列 Krzakala 为拟导师。
epfl-lab-bion-positions: EPFL BION 实验室的博士与博后岗位页，列出当前在招岗位，例如水凝胶声学超材料方向的博士岗位。博士与博后请直接联系 Prof. Zhang。
epfl-lab-head-positions: EPFL HEAD 实验室（机械工程）的博士岗位页，页面写有招聘博士生，招全职（100%）岗位。入围者需另行申请 EPFL 的 EDME 博士项目。
epfl-lions-positions: EPFL LIONS 实验室目前招收多名机器学习博士生，方向为强化学习与优化。需通过 EDEE 或 EDIC 博士学院申请，并列 Prof. Volkan Cevher 为拟导师，入学时间全年持续。
epfl-phd: EPFL 博士学院。需先被博士项目录取，才能受聘为博士助理（doctoral assistant），首年毛薪 CHF 55,225/年（2026 年起）。非 EU/EFTA 国籍从实习转为聘用受限，以官网为准。
epfl-phd-funding-guide: 洛桑联邦理工学院（EPFL）的官方博士资金入口页，汇总 CYD 博士奖学金、CYD 概念验证与人道主义行动奖学金及瑞士政府奖学金等。各项目资格不同，部分文件需用 EPFL 邮箱登录查看。
epfl-programs-list: 瑞士洛桑联邦理工学院（EPFL）的博士项目总览，约 22 个博士项目（EDxx），申请须投向具体项目，各项目截止时间不同，中国大陆学生资格需看具体项目页。
epfl-security-privacy-cryptography-group: EPFL 安全、隐私与密码学研究组主页，下属 SPRING、HexHive、LASEC 等实验室，申请路径通过 EDIC 统一录取。各实验室的岗位需分别查看，本页不列具体岗位。
epfl-spring-open-positions: EPFL 隐私实验室（SPRING）的招生页，列出两个博士后岗位，分别为应用密码学（Applied Cryptography）与机器学习（Machine Learning）方向。博士通过 EDIC 统一录取，可联系 Carmela Troncoso 了解情况。
epfl-summer: EPFL 计算机学院暑期研究项目，面向计算机、计算机工程、电信或电气工程相关专业在读生，需本科二年级及以上或硕士在读。月津贴 CHF 1,800，按实际时长折算，另报销差旅，每年申请一次。
ephe-funded-phd-campaign: EPHE-PSL（巴黎）全额资助博士招生活动，通常每年 5–6 月招募，面向次年入学。资助为三年全职合同，申请者需有硕士学位或同等学历，不要求硕士论文已答辩。
eps-harvard-admissions: 哈佛大学地球与行星科学系只招博士，申请时可列出最多三位感兴趣的 EPS 教师。录取后提供研究或助教资助、全额学费及研究津贴。
epsrc-quantum-informatics-cdt: 英国 EPSRC 量子信息学博士培训中心（CDT），由爱丁堡牵头的五校联合招生，提供全额资助的博士名额。申请需一等或高二等荣誉学位、研究陈述与两封推荐信，国际生名额有限。
erasmus-ese-phd: 伊拉斯谟经济学院（ESE）的全额资助博士岗位，合同期 4–5 年，2026 岗位月薪毛额 EUR 3,059–3,881（38 小时）。研究型硕士优先，须被 Tinbergen 或 ERIM 研究生院录取。
erasmus-mc-phd-vacancies: Erasmus MC（鹿特丹）博士岗位总览，页面为官网导航，指向 Academic Transfer 与 Working at Erasmus MC 的招聘页面，多数岗位要求医学、生物或相关硕士或医学学位。
erbium-ferlaino-openings-2026: 因斯布鲁克 IQOQI 的 Ferlaino 组招收博士与博后，研究实验原子物理与量子气体。博士岗位税前约 €2,832.10/月（全年 14 次发放），申请需发邮件至该组招聘邮箱。
erc-avcr-selection-procedures: 捷克科学院各研究所招聘公告的汇总入口，ERC 资助的博士与博后岗位会在各研究所发布，可在此统一查看各所公告，按研究所逐一检索。
erc-cemm-postdoc-stg-prep: 维也纳 CeMM 研究所的 ERC 启动资助准备博后项目，月薪 EUR 5,014.30（税前，14 次/年）。需已获博士学位或预计在项目开始前获得，入职前至少需有一篇第一作者论文。
erc-dashboard-projects: ERC 官方项目库，可按学科、国家、年份搜索在研项目，是找到 PI 与宿主大学的入口。找到后可到对方招聘页查岗位，适合博士与博后检索。
erc-epfl-iphys-consolidator: 洛桑联邦理工学院 IPHYS 为 ERC Consolidator 申请人提供支持的流程说明：需先取得 IPHYS 教授的支持信，再将材料提交给 IPHYS 主任，流程细节以 IPHYS 办公室为准。
erc-friend-group-cambridge-phd: 剑桥大学 Cavendish 实验室 Friend 课题组（ERC Advanced Grant）的招生页。PI 面向 2026 年 10 月入学招收博士生，请发邮件联系，并称将就该 ERC 项目发布岗位。
erc-repromech-mpi-heidelberg-phd: 马普医学研究所（海德堡）Möllmert 课题组的 ERC 启动资助博士岗位，研究生殖力学，为期 36 个月，计划 2027 年 1 月 1 日起，薪资为 TVöD Bund E13（75%）。
erc-research-in-germany-stg: 德国官方科研门户 Research in Germany 介绍 ERC 启动资助，面向博士毕业约 2–7 年的研究者，任意国籍，德国宿主机构可申请。这是研究者项目，不是学生岗位。
erc-stg-2026-cnrs-awardees: 法国国家科研中心（CNRS）新闻页，列出 2026 年 ERC Starting Grant 在 CNRS 承担的 19 项获奖课题及 PI 姓名。页面不发布岗位，可据此找到相关课题的 PI。
erc-stg-lumica-iic-cas-phd: 捷克科学院无机化学研究所Mrozek课题组的ERC资助博士岗位（LUMICA项目），申请方式为邮件联系PI。薪资与资格细节需先向课题组咨询。
erc-stg-staple-ifj-krakow-phd: 波兰克拉科夫 IFJ PAN 的 Poncelet 课题组，在 ERC Starting Grant（STAPLE 项目）下开放博士生岗位，请直接联系 PI。学历认证、签证及其他资格要求均需向 PI 确认。
erc-uzh-postdoc-erc-cog: 苏黎世大学页面介绍 ERC Consolidator Grant，面向取得博士学位 5–15 年、所有国籍的研究者，最长 5 年、最高 200 万欧元（含 40 万欧元间接费用）。申请需机构书面确认，经 AVA 系统获取。
ercim-fellowship: ERCIM Alain Bensoussan 博士后奖学金面向世界各地的博士学位获得者，在欧洲研究机构完成研究。通常需在申请截止前 8 年内获得博士学位或处于博士最后一年，申请时需选定承办机构。
erim-rsm-phd: 鹿特丹伊拉斯谟大学 RSM/ERIM 全职博士岗位，RSM 称博士岗位按荷兰劳动法提供全额资助，录取后即获有薪合同；国际生资格以各岗位为准。
ernst-mach-worldwide-news: 奥地利Ernst Mach奖学金（全球版）公告，面向奥地利以外大学的博士生、博后与研究人员。2026/27轮每月€1,300（1至9个月），另有最高€1,200差旅补助，年龄上限35岁，申请前六个月内不得在奥地利生活或工作。
es-fpu-2026: 西班牙全国性 FPU 预博士合同，带薪，最长 4 年，约 €32,500/年（含社保，以 BOE 为准）。需持有公告所列学位，已录取或能于 2026/27 学年注册博士项目，由研发中心与申请人共同提交。
es-jobs-net: UCAR 托管的 es_jobs_net 地球与环境科学岗位邮件列表，归档页可按月浏览，最新一项为 2026 年 10 月，博士与博后岗位以各帖为准。
es-juan-de-la-cierva-2026: 西班牙 Juan de la Cierva 2026 项目，由研发中心提交并包含申请人，申请的研发中心须为读博单位以外的机构。博士学位须在 2024-01-01 至 2026-12-31 之间取得，符合中断条件可顺延。
es-ramon-y-cajal-2026: AEI 发布的 Ramón y Cajal 2026 年度项目，面向西班牙籍及外国研究人员，为带薪研究职位。博士学位须于 2016-01-01 至 2024-12-31 之间获得，另有例外条款。
es-ub-predocs-ub: 巴塞罗那大学 PREDOCS-UB 项目，提供预博士合同与国外研究停留资助。2026 年研究停留征集已截止，且仅面向在职 PREDOCS-UB 受资助者。
es-uc3m-doctorado-ayudas: 卡洛斯三世大学（UC3M）的博士资助汇总页，包括桑坦德预博士停留补助（每项 2,000 欧，2026/27 学年）、FPU 类国家合同和该校自有预博士合同。有薪合同按各公告申请，国际生资格以公告正文为准。
es-upm-programa-propio-talento-2026: 马德里理工大学 UPM 自有计划下的全职预博士合同（Talento 2026），有薪，面向拟攻读博士的申请人。该轮已关闭；申请前需获得 UPM 博士入学资格，语言与学位认证要求以官网公告为准。
esa-ecology-job-sites: 美国生态学会（ESA）整理的生态学求职网站清单，本身不发布岗位。清单中各站点的岗位类型与资助情况不同，需逐个查看。
esa-exploration-science-cofunded-phd: 欧洲航天局（ESA）与大学共同资助博士研究的提案征集，2026 年 7 月发布，面向探索科学（Exploration Science）方向的博士研究提案。
esa-research-fellowships-space-science: 欧洲空间局空间科学研究员奖学金（博后），项目最长三年，初始项目两年。仅接受页面所列国家的国籍申请，列表不含中国大陆；需已获或接近获得技术或科学类博士学位。
esade-mres-phd-scholarships: ESADE 商学院管理科学 MRes（两年）加 PhD（三年）全额资助项目，Talent 奖学金含学费减免与生活津贴，MRes 每年 €17,406。需完成至少 240 ECTS 学分的学位。
esi-frankfurt-phd: 恩斯特·施特吕格曼神经科学研究所（ESI Frankfurt）是马普学会研究所，与歌德大学神经科学研究生院等合作开放博士机会，具体岗位与资助需进入对应项目查看。
eso-studentship: 欧洲南方天文台在德国和智利为博士生提供一至两年的研究学生岗位，须在本校注册博士并由本校导师指导，优先但不限 ESO 成员国国籍。
eso-studentship-programme: ESO 博士生研习计划（欧洲岗位，地点在德国加兴）。须已在本校读博并继续注册，由 ESO 员工天文学家与本校导师共同指导。
esrf-phd-conditions: 欧洲同步辐射装置（ESRF）博士生项目，课题可由 ESRF 提出，也可接受学生或导师自带课题。需被大学录取并有学术导师，70% 以上研究时间在 ESRF，税前月薪 2286–2560 欧元。
esrf-phd-programme: 欧洲同步辐射装置（ESRF）的博士项目，每年春秋两轮招生，岗位在招聘页逐条发布。页面称每年招收各国顶尖理科毕业生，目前在读博士 30 余人，来自 19 个合作国家及其他国家。
ess-ipp-rehabilitation-doctoral-programme: 波尔图理工学院健康学院（ESS-IPP）的康复科学博士项目，共 12 个名额，2026–2027 轮已开放申请。学费首年 €2,000，之后每年 €1,500。申请需硕士或同等学历，并具备葡萄牙语和英语口笔语能力。
estonian-national-scholarship-students: 爱沙尼亚国家学生奖学金，外国博士生可申请，博士津贴为每月 €660。面向在爱沙尼亚高校攻读学位的外国学生，持有高校初级研究员合同的博士生不符合。国籍名单以教育部网站为准。
eswn-earth-jobs: ESWN 地球与环境科学岗位汇总表，属众包性质的非官方岗位源，列有博士与博后岗位，含 2025–2026 年度岗位表及以往年度存档。
eth-ai-center-doctoral-fellowships: ETH AI Center 博士奖学金，由两名不同领域导师共同指导，按100%岗位计，第1年 CHF 72,800、第2年 CHF 78,000、第3年 CHF 83,200，需计算机、机器学习、统计等相关领域硕士学位。
eth-doctoral-studies-students: 苏黎世联邦理工学院（ETH Zurich）的博士学习学生端说明，要求博士阶段至少修满 12 学分，具体细则由各系规定。
eth-doctorate-admission: ETH Zurich 博士入学条件：需大学硕士学位，须先找到一位 ETH 教授提供博士职位，并在完成硕士课程后才能注册。成绩通过 eApply 提交。
eth-doctorate-finding-place: ETH Zurich 无统一博士学院，由各教授自行招收。需先联系课题组，获教授同意后由其签署申请，再向 Doctoral Administration 提交；多数为带薪研究助理，无学费。
eth-quantum-open-positions: ETH Zurich 量子科技中心的职位汇总，列出 MSc 与 PhD 论文级课题，方向包括非平衡量子现象和稀土等磁性离子绝缘体，在 PSI、ETHZ 与 EPFL 合作框架下进行。
eth-seismicity-phd: 隶属 ETH Zurich 的瑞士地震局博士岗位，研究地震活动预测，需地球物理、物理、数学、数据科学或相关定量硕士学位并熟练使用 Python，为瑞士固定期限合同岗位。
eth-srl-soft-robotics-open-positions: ETH Zurich 软体机器人实验室（SRL）的博士与博后公开岗位。此为软体机器人组，并非 ETH RSL 机器人系统实验室。博士需有自己做出可用结果的经历，博后需已获博士学位并有一作发表。
ethz-ai-center-doctoral-fellowship-2027-posting: 苏黎世联邦理工（ETH Zurich）AI Center 博士岗位，属 100% 雇员岗位，8–12 个名额，通常 3 年，优秀者可延长 1 年。需取得计算机、机器学习、统计、物理、工程或应用数学等相关硕士。
ethz-ai-center-phd-fellowships: 苏黎世联邦理工学院 ETH AI Center 的三年期人工智能方向博士奖学金，由两位不同领域导师共同指导。年薪为第1年 CHF 73,100、第2年 CHF 78,300、第3年 CHF 83,500。需在 2027 年 6 月前取得相关硕士。
ethz-ai-center-postdoc-fellowship-2027: 苏黎世联邦理工（ETH Zurich）AI Center 的博后岗位，8–12 个名额，期限 2 年，需有 AI 或计算机、物理、工程、应用数学背景。仅接受在线门户申请。
ethz-cs-direct-doctorate: ETH Zurich 计算机系直博入口，前两年全额奖学金并免学费，之后为覆盖瑞士生活费的薪资，通常 5–6 年完成。要求计算机或相近专业学士学位，名额极少，需经导师挑选；申请方式与硕士相同。
ethz-cs-doctoral-study-program: ETH Zurich 计算机系博士学习计划，薪资可覆盖瑞士生活费，典型修业 4–5 年。一般需硕士学位（Fast Track 可暂录取），须先找到愿意指导的教授；录取竞争激烈，名额很少。
ethz-doctoral-study-programmes: ETH苏黎世没有统一博士项目，学生按各系与课题组组织学习，获得Dr. sc. ETH学位。申请通常需硕士学位且成绩优秀，并需先找到ETH教授同意指导，是找具体博士岗位的起点。
ethz-ee-direct-doctorate: ETH D-ITET 直博路径（Direct Doctorate）：申请时须在硕士申请中注明为直博项目，并需未来导师书面承诺提供硕士奖学金和后续博士资助。硕士阶段获全额择优奖学金并免学费，博士阶段发放工资。
ethz-hest-open-positions: ETH D-HEST 在招岗位指引。博士等科研岗位主要见各教授网站和 ETH 招聘门户（Open Positions Portal），本页本身是岗位入口指引，各岗位的条件与薪资以具体公告为准。
ethz-inf-open-positions: ETH苏黎世计算机系（D-INFK）博士与博后招聘页，列出与Max Planck合办的CLS博士奖学金及CYD硕士论文奖学金，并指向各课题组博后岗位页。有意攻读博士者可访问该系博士项目站点。
ethz-robot-learning-doctoral-soft-robotics: ETH Zurich 软体机器人实验室（机器人与智能系统研究所）发布的多个博士岗位，工作量 100%，地点在苏黎世，固定期限。方向涵盖机器人学习，以及软体与生物混合机器人。
ethz-robotx-phd-fellowship-2027: ETH Zurich RobotX 中心 2027 轮博士岗位，按 ETH 博士工资标准受聘并获全额资助。申请一次可供多个课题组考虑，最多可选三位教授，需在 2027 年 8 月前完成硕士学位。
ethz-robotx-postdoc-fellowship: ETH Zurich RobotX 中心博后岗位，一年合同（通常可续约），按 ETH 博后工资标准受聘。申请一次可供多个课题组考虑，最多可选三位教授，需附一至两篇代表性论文。
ethz-sges: 瑞士政府卓越奖学金（ETH 页面）面向博士阶段，月津贴 CHF 3,500。需先获得 ETH 教授同意并出具邀请函，之后仅可通过 Go-ESKAS.ch 提交申请，博后奖学金已不接受申请。
ethz-supply-chain-doctoral-2026: ETH Zurich 供应链管理组（Prof. Stephan Wagner）的博士岗位，要求工业工程、经济或商管相关硕士，并有强实证方法与数据分析背景，偏分析型背景者不予考虑。申请材料滚动评审。
eu-be-ugent-msca-pf: 根特大学玛丽·居里博士后奖学金（MSCA-PF）校内说明页。申请需由根特大学教授作为东道机构共同撰写，截止前须已取得博士学位且获得不超过 8 年，每年征集一次。
eu-dfg-emmy-noether: DFG 艾米·诺特计划（Emmy Noether Programme）面向博后及临时合同的早期研究者，领导独立青年研究组，资助期 6 年。通常需至少 2 年博后经验，一般在博士毕业 4 年以内；外国申请者需附意向书，表明毕业后继续在德国从事研究。
eu-era-fellowships-widening: 欧盟 ERA Fellowships 博后行动，以 MSCA 博士后奖学金为基础，面向拓宽参与国家（Widening Countries）的宿主机构，研究人员不限国籍。
eu-es-ramon-y-cajal-2026: 西班牙 Ramón y Cajal 博后合同，面向科研人员的带薪博后岗位，据报道最低税前年薪 €40,000。申请人博士学位须在 2016-01-01 至 2024-12-31 之间获得，非欧盟申请人需确认工作与居留许可。
eu-euraxess-jobs: EURAXESS 欧洲研究者职位门户，汇集欧洲各国的博士与博后岗位。页面称列有来自 43 个以上国家及其他地区的数千个研究岗位，并链接 Horizon Europe、ERC、MSCA 等欧盟资助项目入口。
euan-macdonald-mnd-phd: 依托爱丁堡、邓迪与圣安德鲁斯的 Euan MacDonald 运动神经元病（MND）研究中心博士奖学金，官网称无国籍限制，含 UKRI 同等生活津贴（3.5 年）、大学学费，以及每年 £10K、共三年的差旅与耗材额度。
eui-max-weber-postdoc: 欧洲大学研究院（EUI）马克斯·韦伯博士后项目，为期 1–2 年，面向经济、历史、法律、政治与社会科学领域近期获博士学位者，英语为工作语言。开始时博士论文须已正式提交并被接受答辩。
eumetsat-research-fellowships: EUMETSAT 的研究员奖学金面向地球观测与气象领域的博后，列出2026年研究员的报告，其所在机构包括 ECMWF、DWD、Met Office、KNMI 等，可据此了解相关研究方向。
eur-csc-phd-scholarships: 伊拉斯谟大学鹿特丹的 CSC 博士奖学金，CSC 支付每月 €2,000 生活费、保险和往返机票，最长 48 个月；学校承担学费与科研费。需先获博士录取，研究方向与硕士一致，入学学年初年龄不超过 35 岁。
eur-future-phd-candidates: 伊拉斯谟大学鹿特丹（EUR）的博士入口页，列出各学院的博士岗位与申请流程。申请需研究型硕士，英语需达 CEFR C1，个别岗位要求 GRE/GMAT。
eur-mint-toulouse-thesis-fellowships: 图卢兹 EUR MINT 数学博士资助，每年为 2–4 名 IMT 相关博士生提供为期 3 年的资助（可能为共同资助），面向法国及外国学生。需 IMT 导师签字的课题方案、成绩单、CV 与动机信，在线提交。
eur-research-master-economics: 伊拉斯谟大学鹿特丹分校与 Tinbergen Institute 合办的两年制经济学研究型硕士（Research Master），属硕士层级，是读博的一条路径，多数学生继续攻读博士。
eur-university-phd-vacancies: 伊拉斯谟大学鹿特丹（EUR）全校博士岗位入口，各学院与 ERIM 的博士岗位多为带薪 4–5 年雇员合同，截止日期各不相同，以各岗位公告为准。
eurasip-jobs-phd: EURASIP 信号处理职位板，列出该领域的学术职位，包括博士与博后岗位。
euraxess-china: 欧盟在华科研人才服务网点（EURAXESS Worldwide，北京），提供欧洲科研职业与资助信息及网络服务，服务免费，当前活动请查看官网。
euraxess-dn-2025-results: EURAXESS 北美站发布的 2025 年 MSCA 博士网络征集结果通报（2026 年 3 月公布），共 141 个博士项目。可据此找到新网络，并在 EURAXESS 岗位库按项目名检索岗位，申请资格以各网络岗位公告为准。
eurofusion-engineering-grants: EUROfusion 工程资助，面向持硕士或博士学位的年轻工程师，为期 2 年并含培训计划，适合聚变与能源工程方向；需通过成员单位申请。
eutopia-cotutelle-2026: EUTOPIA 联盟伙伴校学者共同指导的联合培养（co-tutelle）博士，资助 3–4 年。需由伙伴校学者共同指导同一博士项目，并由家校统一提交。
eutopia-cotutelle-programme-hub: EUTOPIA 联合培养（co-tutelle）博士项目总页，由两所伙伴高校的常任教授共同指导。具体资格以当年征集指南为准，各校名额与截止日不同。
eutopia-warwick-jointphd-scholarship: 华威大学联合博士办公室的 EUTOPIA 奖学金，华威作为主校（Home）时，学生可获 4 年学费全额，外加按 UKRI 标准的生活津贴及 RTSG £9,900。申请须由华威合作导师提交，学生不可直接申请，资助 3–4 年。
evoldir: 进化生物学邮件列表，由 McMaster 维护，站点已迁至 evoldir.net，页面含 2026 年 10 月的更新。岗位信息在 Graduate positions 分类下，博士与博后招聘以各帖为准。
exactus-turku: 芬兰图尔库大学的自然科学博士项目 EXACTUS，申请者可选择申请正式学籍、带薪的 doctoral researcher 岗位，或两者同时申请，两种方式都以攻读博士学位为目标。
excellent-brains-coe-vienna: 奥地利 FWF 资助的神经元回路卓越中心（CoE）博士项目，2025 年公告写明面向奥地利及海外毕业生并全额资助。每位学生配两位导师及一位导师顾问，可在机构间做最多 3 次实验室轮转。
exeter-csc-scholarships: 埃克塞特大学与 CSC 联合奖学金，每年最多约 50 个名额。申请者需满足 Exeter 英语要求（一般雅思 6.5，单项不低于 6.0）并通过 CSC 选拔标准，须经学校指定链接申请。
exeter-gamebirds-lowland-ecosystems-phd: 埃克塞特大学关于释放野鸡对低地生态系统影响的博士 studentship，由 BASC 资助，2027 年 1 月入学，为期 3.5 年。资助覆盖英国学费及至少 £21,805/年的免税津贴，国际生需自付学费差额；有英国生态学、自然史或野外经验者优先。
exeter-swdtp: 埃克塞特 ESRC 西南 DTP，约 34 个全额奖学金名额，面向英国与国际学生，国际生名额有限，需满足 ESRC 资格，具体细则以官网公告为准。
fapesp-postdoc-fellowships: 圣保罗州研究基金会（FAPESP）的博士后奖学金总页，需在圣保罗州高校或研究机构全职开展研究，由当地导师提交申请。候选人博士学位获得不满 7 年；部分征集限发展中国家籍。
fau-imprs-sc: 马普佛罗里达神经科学研究所（MPFI）与佛罗里达大西洋大学（FAU）合办的国际马普研究生院，研究突触与神经回路。学生同时注册于 FAU 的综合神经科学（IBNS）博士项目，页面称这是美国唯一的 IMPRS 项目。
fau-jobs-portal: 埃尔朗根-纽伦堡大学（FAU）职位门户，可找到博士与博后岗位，多为 TV-L 固定期限雇员职位，以薪资形式提供。各岗位截止不同，可在门户按截止日期筛选。
fau-math-phd-ta-stipend: 佛罗里达大西洋大学数学与统计系的博士助教（GTA）岗位，每周约 20 小时的辅导、批改、监考或授课工作。学年津贴 $19,500，另加每个夏季学期 $6,500，合计约 $26,000/年，并每年减免 24 学分学费。
fbk-international-phd: 布鲁诺·凯斯勒基金会（FBK）国际博士项目征集页，涵盖博士项目、岗位与奖学金。目前没有开放的征集，下一轮时间尚未公布，可查阅过往征集档案。
fct-2026-call-notice: 葡萄牙 FCT 博士奖学金（2026 轮），通过 myFCT 平台申请，拟资助 1,600 个奖学金。第三国公民可以申请，但申请在国外或部分在国外开展的奖学金，须在葡萄牙永久且惯常居住。
fct-ceec-individual-call: 葡萄牙FCT CEEC Individual科研合同，面向任何国籍的博士，需葡萄牙机构接收，通过myFCT申请。页面称约400个研究员合同。
fct-doctoral-2026-calls: 葡萄牙 FCT 2026 年博士奖学金竞赛的一般线与非学术线，非学术线计划资助 1,600 个奖学金（其中 600 个在非学术环境）。非学术线需与 FCT 列出的非学术机构合作，并在葡萄牙开展至少 12 个月工作。
fct-phd-grants-2026-notice: 葡萄牙 FCT 2026 年博士奖学金竞赛的官方公告，共提供 1,600 个奖学金，其中一般线 1,000 个、非学术环境 600 个。
fed-board-dissertation-fellows: 美联储理事会博士论文研究员项目，面向经济学与金融学在读博士生，为约 12 周的有薪驻场研究，主要在夏季。页面称无需美国公民身份，但须获得在美国合法工作的资格。
fem-trento-phd-42: 意大利特伦托大学 FEM 研究所联合博士项目，方向为农业食品与环境科学，共 9 个奖学金名额，其中 7 个对应特定课题。第 42 届已结束，第 43 届预计春季发布。
fens-jobs: 欧洲神经科学协会（FENS）职位板，收录欧洲各地的神经科学岗位，博士岗位较多，职位类型同时包含博士与博后。
fer-zagreb-doctoral-admissions: 萨格勒布大学电气工程与计算学院（FER）的博士招生，学费 9,000 欧元分 6 期缴纳，无奖学金。申请需硕士或同等工程文凭，平均成绩不低于 3.5/5，并需面试。
fes-auslaender-promotion: 弗里德里希·艾伯特基金会（FES）外国博士生奖学金，每月 1,500 欧元并有法定医保补贴，一般资助 3.5 年。须已获德国高校博士录取，需德语 B2，医学方向不资助。
fes-basic-funding-foreigners: 艾伯特基金会（FES）外国博士生奖学金，面向在德国高校就读的外国博士生，须居住在德国。申请须用德文提交，需很好的德语能力，并体现与社会民主价值观的契合。
fesb-split-doctoral-2026: 斯普利特大学 FESB 2026/27 学年三年制博士招生，设电气与信息技术（最多 25 人）和机械工程（最多 20 人）两个方向。学费 7,800 欧元由申请人或其单位承担，正文未列奖学金。
fhi-mpg-open-positions: 马普学会 Fritz Haber 研究所的招聘入口，面向博士后及学生（学士、硕士、博士）。具体岗位见各部门与课题组网站。
fi-academy-research-fellow: 芬兰科学院 Academy Research Fellow 项目，面向持博士学位的研究者。资格以当轮公告为准，上一轮要求 2019 年 1 月 1 日至 2024 年 1 月 31 日间获得博士学位。
fields-postdoc-fellowship: 加拿大 Fields 研究所的博士后奖学金，按专题项目招收，每项约 6–8 个名额。津贴为六个月 $35,000（2026-07-01 起），需近期获得数学科学相关博士学位，申请时写明加入的专题项目和拟合作导师。
fields-research-fellowships: Fields Institute 短期研究访问奖学金，面向 Fields 主要主办大学的教研人员（或其代申请的访问学者），居留 1–3 个月，每月最高 4,000 加元生活津贴。大多伦多地区（GTA）的教研人员不符合条件。
fishmed-phd-unibo: 博洛尼亚大学 FishMed 地中海渔业与海洋生物资源博士项目，学制 3 年，含 3 个月境外交流，授课语言为英语和意大利语。奖学金每月 €1,350，为税后净额。
fiu-graduate-assistantships: 佛罗里达国际大学的研究生助理岗位（GA/RA/TA），含津贴、学费减免和医保，由院系竞争分配，需先联系所在研究生项目申请。全职（每周20小时）的助理可享医保补贴。
flicq-future-leaders-scholarship: ARC 量子计算未来领袖培训中心（FLiQC）的工业博士奖学金，研究须属量子技术领域，2026 年标准津贴 A$42,754/年，最长 4 年。需先获合作大学博士录取并取得项目导师支持，不能同时持有 RTP 等主要博士津贴。
flinders-agrtps-international: 弗林德斯大学国际生政府奖学金（AGRTPS），约 5 个名额，含学费减免、免税生活津贴（2026 年约 3.61 万澳元/年，最长 3.5 年）及海外医保，仅限首次来澳攻读 HDR 的非澳新公民。
flinders-fiprs-international: 弗林德斯大学（Flinders）国际博士奖学金（FIPRS），覆盖国际学费并提供津贴，2026 年标准为每年 A$36,061，免税，最长 3.5 年。须满足研究型学位入学要求并获得导师同意。
flux-society-jobs: Flux Society 发展与认知科学职位板，列有发展认知神经科学相关的博后与博士岗位，如都柏林三一学院的四年期博士奖学金。截止与资格以原公告为准。
fmi-phd-programme: 瑞士弗里德里希·米歇尔研究所（FMI）的国际博士项目，学位由巴塞尔大学授予，学制通常 4–5 年，每年 1 月和 6 月两轮遴选。需持有或入学前将持有可在本国攻读博士的大学学位，如 MSc、Diploma、DEA 等。
fnr-pride: 卢森堡 FNR 的主要博士资助项目 PRIDE，由博士培养单元（DTU）作为申请主体获得成批博士岗位。每个岗位含 4 年博士雇佣合同与培训流动津贴，候选人直接向获资助的 DTU 申请岗位。
folger-long-term-fellowships: Folger 莎士比亚图书馆长期研究资助，面向已获博士学位的人文学者，可选全年 $70,000（9 个月）或一学期 $35,000（5 个月）。需通过官方门户提交 250 词项目摘要。
fondation-arc-postdoc-france: 法国 ARC 癌症研究基金会资助在法国实验室的博士后研究，覆盖薪资，最高 4,767 €/月。固定期限合同 24 或 36 个月，不可续期；需已获博士学位，宿主实验室须不同于博士所在实验室。
forarthistory-opportunities: 英国艺术史学会（For Art History）机会板，列有博后奖、研究资助与长期研究员等项目，内容混合，含会议征稿与期刊投稿。
fordham-gsas-stipends: Fordham 大学文理研究生院（GSAS）的津贴与奖学金表。2026–27 学年研究生助理 1–2 年级津贴为 $38,192，3 年级及以上为 $38,723，另有各类研究与教学奖学金。
forrest-research-fellowships: 西澳Forrest研究基金会博士后奖学金，面向所有国家与学科的候选人，需在西澳五所大学之一开展研究，资助含学术薪酬和公寓住宿。需有突出的学术履历和重要的个人研究贡献。
forschung-und-lehre-stellenmarkt: 德国 Forschung & Lehre 学术招聘页，每条岗位同步发布到 academics 平台，可在该平台按兴趣筛选博士与博后岗位。本页本身不列具体岗位。
forse-cambridge-studentships: 剑桥大学 Forse 课题组的化学方向招生与奖学金页面，列有博士 studentship 与实习机会。英国资助的博士名额对海外生通常有学费缺口限制，非英国申请者需自行承担海外学费差额或获得合适奖学金。
forte-starting-grants-2026: 瑞典Forte健康与福利研究理事会Starting Grants 2026，面向已取得博士学位且毕业证书签发不超过三年的早期研究者，档次包括两年SEK 250万、三年SEK 375万等。属项目经费而非个人工资，需要瑞典宿主机构。
forum-1p3a-rit-yidan-hu-phd-2026: RIT 教师 Yidan Hu 的博士招生，研究方向包括无线网络安全、数据隐私与 AI 安全，需计算机相关背景和 Python 等编程基础。RIT 官方教师页称有 RA 岗位在招，资助细节需向导师询问。
fr-cifre-offres-portal: ANRT 官方 CIFRE 门户，企业在此发布 CIFRE 博士论文岗位，学生可在此寻找合作企业。这是企业博士岗位的官方平台。
fr-culture-contrats-doctoraux-architecture: 法国文化部为建筑、城市与景观方向博士论文设立的博士合同，分全额与半额两种。自 2026 年 1 月 1 日起最低 2 300 欧元毛额/月（不含服务补充），含服务补充为 2 760 欧元毛额/月；论文需挂靠 ENSA 建筑学院相关项目。
fr-cy-em2psi-doctoral-contracts: CY Cergy Paris 大学 EM2PSI 三年期博士合同（2026–2027 轮），税前月薪约 €2,300。需先确定所属实验室导师，并提交硕士成绩单、论文计划与推荐信。
fr-ens-csc-phd-cooperation: 巴黎高师（ENS-PSL）与国家留学基金委合作博士名额，最长 4 年，月津贴约 €1,350，合作项目共 20 个名额。申请者须为中国公民或永久居民，博士毕业须回国。
fr-ens-lyon-csc: 里昂高等师范学校（ENS de Lyon）的 CSC 博士资助，全额资助。中国大陆申请人经 CSC 申请并注明 ENS-CSC 项目，需导师先提出课题，不可同时走里昂大学 CSC 渠道。
fr-grenoble-idex-ri-postdoc: 格勒诺布尔阿尔卑斯大学 IDEX RI 国际卓越与外展博士后，面向该校科研与教学人员，需与国际合作伙伴共同申请。合同由该校与合作方各承担一半，期限 12–24 个月，另有最多 1.5 万欧元差旅与活动经费。
fr-implanteus-eur-theses: 阿维尼翁大学 EUR Implanteus 2026–2029 批次博士合同课题，部分与 INRAE 联合，申请经 ADUM 平台提交。该批次四个课题已选定，官网同时显示可关注 2027 年批次。
fr-insa-lyon-utt-csc: INSA Lyon 与 UTT 合作的 CSC 全额资助博士项目，由 CSC 资助，在 INSA Lyon 完成学业，学制以当年通知为准。招生通常每年 3 月启动，次年 9 月入学。
fr-lille-engsys-phd: 里尔大学工程与系统博士学院（ED ENGSYS）的博士申请与选拔页，合同为 3 年。境外学位需与法国硕士等值，申请前需先与拟定导师联系。
fr-lille-engsys-thesis-funding-2026: 里尔大学 ENGSYS 方向的 2026 年博士资助征集汇总，列出学校与地区合同等各类博士资助的时间表和开放状态。部分地区资助 2026 年已不再征集，可据此排查当期可申请的渠道。
fr-lyon-ed205-commitment-letter-guide: 里昂大学 ED205 EDISS 博士申请说明，介绍申请博士时如何取得导师承诺信，并列出常规博士合同、定向合同、CDSN、FRM 及中法联合博士项目（CSC）等资助渠道的申请方式。
fr-paris-cite-csc-appel-2026: 巴黎城市大学 CSC 博士征集，仅限中国公民，适用所有学科，由 CSC 发放生活费，约 €1,350 净/月（页面所载）。外语水平须满足研究团队工作语言要求。
fr-paris-saclay-csc-appel-2026-2027: Paris-Saclay 大学与 CSC 联合博士项目征集通知，仅限中国公民（据 2025–26 文件，中国硕士在读生亦可），CSC 申请须通过学校统一征集。津贴为 €1,350/月（页面所载）。
fr-paris-saclay-doctoral-programmes-funding: 巴黎-萨克雷大学博士项目与资助总览页，区分定向项目（如国际 ADI、气候转型等）与挂靠各 Graduate School 的项目。适合用来找到具体的博士学校（ED）与项目名称，再到 ADUM 或各 Graduate School 页面查对岗位。
fr-paris-saclay-phd-track: 巴黎-萨克雷大学 PhD Track，是 2 年硕士学习加 3 年博士合同的一体化项目。2026 届提供 10 个奖学金，申请于 1 至 3 月进行，4 月面试，本轮申请已结束。
fr-polytech-cote-azur-csc: Polytech Côte d'Azur 面向已获硕士学位中国学生的 CSC 资助博士，全博士 36–48 个月，联合培养 6–24 个月。学费由实验室或大学尽量减免，CSC 提供生活费，需找到导师共同申请。
fr-saclay-plant-sciences-phd: Saclay Plant Sciences（SPS）博士奖学金，2026 届最多提供 2 个 3 年期名额。需完成 SPS 团队 M2 实习或为列出 M2 项目的学生，页面称合同安排尚未最终确定。
fr-sorbonne-csc-programme: 索邦大学 CSC 联合培养博士项目，最长资助 4 年，月奖学金 1350 欧元（页面称会定期调整）。仅限中国国籍，须先获课题负责人推荐并通过学校预录取。
fr-uca-economics-international-phd: 尼斯蔚蓝海岸大学与意大利圣安娜大学合办的 4 年制国际经济学博士（ELMI），提供奖学金，税前月补助 €2,836。申请需具备硕士学位，或能在 2026 年 9 月 30 日前取得。
fr-uca-life-academie4-phd: 尼斯蔚蓝海岸大学 LIFE 学院的 Academy of Excellence 4 联合博士，2026 批次为 2 个跨学科全额资助岗位（3 年），月净薪约 2300 欧。课题须位于生物与其他学科交叉处，主导师须属于 LIFE 研究生院。
frankfurt-school-doctoral: 法兰克福金融学院博士项目，录取者学费全免并领取月津贴，最高 €2,320/月（免税，以官网为准），另覆盖研究相关费用。要求全职投入研究，最长 5 年，需硕士或同等学历。
fraunhofer-emft-phd: 弗劳恩霍夫EMFT研究所的博士入口，方向为微系统与传感器，列出最新博士机会。博士通常为3至5年，须与大学或应用科学大学合作完成，岗位多要求工程或物理硕士学位。
fraunhofer-fhr-doctorate: 弗劳恩霍夫高频物理与雷达技术研究所（FHR）的博士入口，博士岗位随招聘页发布，多要求工程或相关理科硕士学位。国际生资格需向研究所确认，薪资与注册要求以具体岗位为准。
fraunhofer-fokus-science-careers: 弗劳恩霍夫 FOKUS（柏林）的科研与博士培养入口。研究所与柏林多所大学合作，博士通常在合作大学完成，博士与博后机会可通过其招聘页或联系研究组寻找。
fraunhofer-iee-jobs-theses-phd: 弗劳恩霍夫 IEE 招聘页，含博士论文与博士岗位入口。通常需优秀硕士成绩，并需先获大学接受博士课题、再与研究所商定。
fraunhofer-iee-research-school: 弗劳恩霍夫能源系统研究所（IEE，卡塞尔）的研究生院页面，是该所博士培养的结构化入口。资助形式以具体岗位为准，国际生资格需向研究所确认。
fraunhofer-ilt-doctorate: 弗劳恩霍夫激光技术研究所的直接入职博士岗位，多以研究助理身份全职受聘，博士通常与亚琛工业大学合作，在工作中完成研究。薪资级别以岗位公告为准。
fraunhofer-individual-doctoral-projects: 弗劳恩霍夫个人博士项目，博士生在研究所内完成研究，聘用依据公共部门集体协议，通常 3 年，可延长至 6 年。需持相当于德国硕士的优秀大学学位，并向具体研究所申请。
fraunhofer-ipa-doing-a-phd: 弗劳恩霍夫生产技术研究所（IPA）的博士说明页，含研讨班与学术活动，博士工作与所内项目紧密结合，以雇员合同进行，需在招聘页查找具体岗位。
fraunhofer-ipm-phd-program: 弗劳恩霍夫物理测量技术研究所（IPM）的博士项目。博士研究通常在合作大学完成，多为弗莱堡大学，学位按该大学规定授予，博士生同时参与所内相关研究项目。
fraunhofer-ise-careers: 弗劳恩霍夫太阳能系统研究所（Fraunhofer ISE）的职业页与博士候选人专区，博士多为带薪雇员合同，通常 3 年，适合光伏、储能、氢能方向。需申请具体职位。
fraunhofer-itwm-careers-beginners: 弗劳恩霍夫工业数学研究所（ITWM）提供全职博士奖学金，通常 3 年，课题结合实际研究项目，由研究所与合作大学共同指导。需数学、计算机科学或物理背景，能把模型实现为算法与软件。
fraunhofer-promovieren-guide: 弗劳恩霍夫协会（Fraunhofer）的博士说明：博士通常在研究所与大学合作框架下完成。申请对应具体研究所的岗位，而非中央奖学金，各研究所岗位各自截止。
frbsf-sargent-dissertation-fellowship: 旧金山联储 Thomas J. Sargent 博士论文奖学金，面向论文研究阶段的博士生。6 月至 8 月需在旧金山联储现场驻行约六周，并领取津贴。
fred-hutch-graduate-program: Fred Hutch 与华盛顿大学（UW）联合管理的分子与细胞生物学（MCB）博士项目，仅招博士生，并设 10 个由 Fred Hutch 教员主持的培训经费项目。需申请 UW 的分子与细胞生物学博士项目。
fredhutch-postdoc-programs: Fred Hutch 博士后项目列表页，可查看各项目的岗位。国际学者资格以各项目为准，具体薪酬与签证条件需看对应岗位。
freiburg-ellis-phd-program-ml: 弗莱堡大学 ELLIS 博士项目的机器学习组，PhD 岗位仅通过 ELLIS PhD 项目招收，全职岗位为 TV-L E13 100%。申请需通过 ELLIS 官方征集，以 ellis.eu 公布的信息为准。
freiburg-lgfg-state-graduate-funding: 弗莱堡大学的巴登-符腾堡州博士生奖学金（LGFG），由各大学统一受理，每月 1,500 欧元，免税，含材料与差旅补贴，无雇佣关系。州法要求已完成大学学位、成绩优秀并被州内大学录取为博士生。
freiburg-protpath-medical-stipends: 弗莱堡大学ProtPath（GRK 2606）面向医学生的资助，用于完成6至12个月的实验性医学论文，全职研究一至两个学期。DFG津贴每月1,095欧元，申请需向协调员提交动机信、CV与证书PDF。
freiburg-robot-learning-lab-openings: 弗莱堡大学机器人学习实验室（Valada 组）的博士与博后岗位，薪资为 TV-L E13 至 E14（100%）。页面欢迎国际候选人，不要求德语，需相关硕士并具备 PyTorch 经验。
freiheit-non-eu-doctoral: Friedrich-Naumann-Stiftung 面向非欧盟国籍博士生的奖学金，须已获德国州立或认可大学的博士录取。仅资助德国州立或认可大学的博士，不资助海外博士、研究访学、医学、牙医及博后项目。
frias-early-career-fellowship: 弗莱堡高等研究院（FRIAS）早期职业奖，面向博后阶段，任何国籍与学科均可申请。需已获博士学位，博后经验不超过 8 年，全日制驻留弗莱堡，每年一轮。
frq-doctoral-rules-2027-2028: 魁北克研究基金会（FRQ）2027–2028 年度博士研究奖学金规则，常规 B2 博士奖学金为每年 CAD 25,000。国际生通常需先由魁北克高校预选，国际生资格以 FRQ 原文为准。
fsbi-phd-studentships: 英国与爱尔兰鱼类学会（FSBI）每年一次面向会员的博士奖学金竞争，资助四年全额（含学费与生活费）。申请人须为付费会员，不符合英国居住条件者须自行补足学费差额。
fsu-physics-funding: 佛罗里达州立大学物理系录取的博士生均获资助包，至少覆盖 5 年，每年 $30,115（页面标注 2025 年），另含全日制学费减免。前两学期为每周 10–12 小时的教学助理，之后一般转为研究助理。
ftmc-vilnius-open-positions: 立陶宛 FTMC（维尔纽斯）的博士岗位页，需相关硕士学位，每人只能申请一个课题，海外学位需提前完成学历认可。页面称 2026 年博士招生已关闭，下一年度课题预计 2027 年 2 月公布。
fu-berlin-csc-phd-fsgs: 柏林自由大学 FUB-CSC 博士项目，面向 CSC 奖学金申请的中国大陆公民，页面称可免学费。申请需文学方向硕士或同等学历、德语与英语良好，并提交研究计划（exposé）。
fu-berlin-csc-phd-program-2026: 柏林自由大学与 CSC 合作的博士项目，面向中国籍博士候选人，学科范围不含工程。自拟课题需先取得 FU Berlin 导师接收函，语言要求为 IELTS 6.5 或 TOEFL 95 iBT（或 DaF）。
fu-berlin-csc-programme: 柏林自由大学与 CSC 合作的博士项目。申请者须为中华人民共和国公民或永久居民，且申请时未在境外工作或学习。直接向柏林自由大学申请并注明 FUB/CSC 合作协议，录取后另向 CSC 申请资助。
fu-berlin-drs-current-programmes: 柏林自由大学博士研究学院（DRS）的多个 2027 年 10 月入学项目目录。其中 FUB-CSC 名额专门面向中国公民（GEAS 2 名、FSGS 1–2 名），需经校际合作提名；部分名额还需自行争取外部资金。
fub-csc-application-procedure: FUB-CSC 博士项目申请流程，面向中国公民，专业不含工程类。先向 FU 教授申请课题获得邀请函，经导师确认后再走 CSC 申请。
fudan-sans-neuroscience-positions: 复旦大学神经科学研究中心的博士后与研究生长期招聘，2026 年 4 月发布，可随时联系课题组。薪酬需向课题组确认。
fundit-shs-calls: Fundit 是法国汇总社会科学与人文学科博士后及以上研究资助和奖学金的信息库，由 RFIEA 基金会建立。它本身不是单一资助项目，需逐项查看各项目的国籍条件。
fwf-docfunds: doc.funds 奥地利结构化博士项目资助，面向有博士授予权的奥地利高校，由至少 5 名研究人员组成的联合体申请。资助期最长 48 个月，用于 5–10 名博士生的人员费用。
fwf-erwin-schroedinger: 奥地利 FWF 资助的 Erwin Schrödinger 博士后奖学金，需已获博士学位并获得海外东道研究机构的邀请与支持，海外停留 10–24 个月，之后须有返回奥地利的安排。全年滚动受理，经 elane 门户提交。
fwf-esprit-postdoc: 奥地利科学基金（FWF）面向青年博后的 ESPRIT 项目，有薪资，须在奥地利合格研究机构开展。要求博士学位获得不超过 5 年，并需有东道导师（mentor）。
fwo: 弗拉芒研究基金会（FWO）的基础研究类博士奖学金，每月 €2,600，共 4 年，另每年 €3,720 研究经费。仅弗拉芒地区高校可提名候选人，需与高校导师共同申请。
fwo-junior-postdoc: 比利时 FWO 初级博士后奖学金。申请者需持有欧盟指令或双边协议认可的博士学位，学位须在起始年 10 月 1 日前不超过 3 年取得，并需在弗拉芒地区宿主机构找到导师。
fwo-phd-fundamental: FWO 博士研究员奖学金（基础研究，佛兰德），面向隶属佛兰德语区大学的博士，每月 €2,700（0 年资历标准），另有每年 €3,720 研究经费。需有 EEA 或瑞士硕士学位，或经 NARIC-Vlaanderen 认定为等效，最多可申请两次。
fwo-senior-postdoc: 比利时 FWO 高级博士后奖学金，面向博士学位在起始年 10 月 1 日前 3–6 年获得、且有至少 2 年博后经历的研究者，需在佛兰德地区宿主机构找到导师。
fyssen-postdoc-grants: Fyssen 基金会资助外国学者赴法国实验室做最长两年的博后，最高 €45,000/年，学科包括行为学与心理学、神经生物学、社会人类学、古人类学与考古。需法国实验室邀请，博士学位取得不足 2 年，且申请截止时未满 35 岁。
fz-juelich-doctoral-careers: 于利希研究中心博士招聘总入口，页面称超过 1000 名在读博士来自约 70 个国家。多数入职时签订为期三年的博士合同，可参加 JuDocS 英文培训与研究生院项目。
g-evol-muenster-open-phd: G-Evol汇总页，列出明斯特大学及德国多地实验室的博士与博后岗位，分布于明斯特、法兰克福、慕尼黑等地。页面所列岗位截止日均已过，页面称后续还会发布新岗位。
gac-geoscience-job-board: 加拿大地质学会（GAC）提供的免费招聘板，目前列有皇后大学的硕士或博士岗位，2027 年 1 月入学。
gal-predoc-usc: 加利西亚大区 2026 年预博士资助的授予决议，受助对象为 SUG 公立大学、公共研究机构及 CSIC 在加利西亚的中心，合同起始日为 2026 年 9 月 1 日。页面是授予结果，而非招生公告。
galilee-cd-session2-2026: 巴黎北大学 ED Galilée 2026 年第二轮博士合同，共 3 个，其中 2 个主要面向 ED Érasme 学科方向，1 个为部分资助（2/3 合同，24 个月）。合同月薪 €2,300（税前，无教学义务）。
gambling-harm-promovendus-nl: 蒂尔堡大学 Tranzo 系的博士岗位（promovendus），研究早期赌博问题的预防干预及赌博暂停等措施。带薪雇员合同，0.8 fte，月薪 €3,204–€4,051。
gaps-careers-list: TRIUMF 维护的 GAPS-Careers 岗位转发列表，覆盖核物理、粒子物理与加速器相关的博后和博士岗位。可在列表存档中按月浏览，也可订阅邮件。
garfield-doctoral-dissertation-fellowship: Beta Phi Mu 的 Eugene Garfield 博士论文奖学金，面向图书情报、信息研究博士生，每人 $3,000，每年最多 6 人。资格以在认可的图书情报博士项目中注册为准，而非国籍，需处于论文写作阶段。
gatech-ae-postdoc-fellowship: 佐治亚理工学院航空航天学院的博士后研究员计划，提供带薪岗位，每年需讲授一门本科课程，另有最高 $1,500 差旅经费。申请前需先联系拟合作教师。
gatech-biology-graduate-funding: 佐治亚理工学院生物科学博士项目，以助教、助研或奖学金资助。2026年秋季津贴$37,500/年，2027年1月1日起升至$38,400/年，学生每学期约自付$758学杂费。
gatech-eas-graduate-financial-assistance: 佐治亚理工学院地球与大气科学研究生资助，助研与助教津贴含学费，页面列出 $37,500/年（$3,125/月）。Presidential Fellowship 限美国居民或永久居民。
gatech-ece-financial-assistance: 佐治亚理工 ECE 研究生资助，助研和助教是主要来源，超过 50% 的全日制研究生以此获得资助，并提供较低学费。贷款仅限美国公民和永久居民。
gatech-math-financial-aid: 佐治亚理工学院数学系博士生通常获5年支持（学校将尽量支持第6年），报酬多以助教身份发放。页面称约$37,500/12个月（2025秋季官网数据）。
gatech-me-funding-ga-gta: 佐治亚理工学院机械工程博士资助说明。页面称约 90% 博士生由研究助理（GRA）或助教（GTA）资助，GRA/GTA 学生按规定获得州外学费减免。资助依据学术表现而非经济需要。
gatech-me-graduate-financial-aid: 佐治亚理工学院机械工程研究生资助，通常按年承诺，续期取决于学业表现与经费，不是多年保障。入学前应向系里了解续期规则。
gatech-physics-financial-support: 佐治亚理工物理系博士生获学费减免，并通过助教、研究助理或奖学金获得资助，当期约 $35,504/年。国际申请者可申请 Amelio Fellowship，每年另加 $5,500，最多 4 年。
gatech-public-policy-phd-guaranteed-funding: 佐治亚理工学院公共政策学院为录取博士生提供四年资助保障，含学费与津贴，不含夏季。国际生资格需向学院确认。
gates-cambridge: 剑桥大学全额奖学金（学费与生活费），面向英国以外国家公民。可申请全日制博士、MPhil/MLitt 或一年制研究生课程（商科及部分专业课程除外），需在剑桥研究生申请系统中选择 Gates Cambridge 资助。
gauss-goettingen-phd-admission: 哥廷根 GAUSS 数学与自然科学博士院。须先获得导师名下的博士岗位，再申请 GAUSS 入学，需硕士或同等学位，并先找到导师与课题、与导师确认博士资金。
gcplus-duisburg-postdoc-calls: 杜伊斯堡-埃森大学 GC Plus 研究生院的博后服务总览页，列出 Postdoc Seed Funding、Funding Programmes and Stays Abroad 等博后资助入口，具体资格与截止以各征集通知为准。
geochemsoc-career-center: Geochemical Society（地球化学学会）的职业中心，可按地球化学筛选岗位，含博后及部分博士岗位，多数在美国，国际生是否可申请以各岗位要求为准。
geodynamics-sydney-list: Geodynamics 岗位邮件列表的悉尼大学公开存档，列出至2026年9月的月度帖子，含博士与博后岗位，岗位与资助细节以各帖为准。
geomar-doctoral-opportunities: 基尔 GEOMAR 亥姆霍兹海洋研究中心的博士岗位入口，含 MarDATA 海洋数据科学研究生院。岗位多为约 3 年的 E13 带薪合同，逐个公告发布，没有统一截止日，需定期查看。
georgetown-biology-phd: 乔治城大学生物系博士项目，录取博士生可获至少五年全额资助（含津贴、学费减免与免费医保），页面称当前津贴为$36,934/年。申请前建议先联系潜在导师。
georgetown-history-phd-financial-aid: 乔治城大学历史系博士资助，含五年津贴、两年额外学费支持及七年医疗保险，学业良好可续期；五年津贴中有三年需为系服务，多为助教。2025–2026 学年津贴为 $39,924。
georgetown-mathstat-phd-funding: 乔治城大学数学与统计博士项目，录取博士生均获全额学费、医保与津贴的助教类资助，2026–27学年津贴$40,922。有外部资助者不享受校内资助。
georgetown-physics-phd-funding: 乔治城大学物理学博士，承诺全日制博士生在学业进展合格时获五年全额支持。前两年多为助教，之后多为研究助理；研究助理可获津贴、全额学费减免与医保。2026–27 学年津贴 $40,922。
gerda-henkel-promotionsfoerderung: 德国格尔达·亨克尔基金会的历史人文学科博士奖学金，只资助考古、历史、伊斯兰史、艺术史、法律史、史前史、科学史等方向，当代课题不予资助。需全职，不得同时领取薪酬或退休金，并需两份专家鉴定。
gerstner-sloan-kettering-phd: 纪念斯隆-凯特琳癌症中心（Gerstner Sloan Kettering）研究生院博士项目，所有录取学生均获资助包，含 2026–27 学年津贴 $55,620、学费全免与医疗牙科保险，不要求 GRE。
getty-predoc-postdoc-fellowships: Getty 基金会艺术史博士前与博后研究员项目，博士前津贴 $30,000、博后 $35,000，另含工位与搬迁补助。2027–28 学年研究所学者项目暂停接受申请。
gfz-career-doctoral-entry: 德国 GFZ 亥姆霍兹地学中心的博士岗位入口页，说明博士阶段的支持与招聘途径。博士多为雇员合同，需在德国大学注册，具体岗位以招聘页为准。
ggnb-goettingen-application: 德国哥廷根大学 GGNB 分子生物与神经科学研究生院。需申请 GGNB 教授提供的博士岗位，或先取得意向教授的书面说明（含经费与暂定题目），另需理工科或数学、信息学相关硕士学位与 C1 英语。
ggnb-goettingen-phd: 哥廷根生命科学研究生院（GGNB）博士申请入口，全年可申请，资助绑定具体导师岗位。需先与 GGNB 教员对接：持其博士岗位可在入学后 3 个月内申请，或由教员出具资助说明后申请。
ghent-csc-program: 根特大学与 CSC 博士合作项目，面向中国籍学生，每月约 €1,350 的 CSC 资助，免学费与实验费，根特另有补助。优先项目须先获根特大学预选，并需英语 B2。
giessen-gcsc-doctoral-scholarships: 德国吉森大学 GCSC 人文社科博士奖学金与会员名额，另有 DAAD GSSP 名额。需高于平均水平的已完成学位，德语或英语流利，主要住所在吉森或周边；DAAD 名额另有国籍、学位年限等要求。
giessen-gcsc-stipendien: 吉森大学 GCSC 研究生院博士奖学金，每月 €1,468，最长 3 年，含少量 DAAD GSSP 名额（另有国籍限制）。申请需已完成高于平均水平的学位及文化学相关博士计划，主要住所须在吉森或周边。
gifu-english-agri-phd: 岐阜大学联合农学研究科英文授课博士项目，3年学费（含入学费、考试费）免收，并有每月约6万日元补助。机票、住宿与保险自理，MEXT奖学金申请者不可申请。
gih-sport-doctoral-studentships: 瑞典体育与健康科学学院（GIH）的运动科学博士岗位，跨人体生物学、人文与社会科学。博士岗多为带薪的临时雇员身份，多于次年秋季入学。需修满 240 ECTS（其中至少 60 为高阶学分）或同等知识。
gii-geneva-financing-phd: 日内瓦高等国际与发展研究院博士录取通常附四年资助包：奖学金每年 CHF 20,000，学费第一年 CHF 3,000、之后每年 CHF 1,000。获瑞士政府奖学金者，该奖学金替代第二至四年资助。
gk-ev-cognitive-science-job-listings: 德国认知科学学会（GK-EV）的职位汇总，包括博士与博后岗位，可见 TU Darmstadt 全额资助博士岗和 The Adaptive Mind 集群 4 年期岗位。国际生资格以具体公告为准。
gks-2027-notice-list: 韩国政府奖学金（GKS）2027年度公告入口，来自NIIED与Study in Korea。依NIIED摘要，申请时需截至7月31日持有学士或硕士学位，博士为1年韩语加3年学位课程。中国大陆学生资格以当年公告与中国驻韩使领馆通知为准。
glasgow-computing-studentships: 格拉斯哥大学计算科学学院的卓越奖学金，面向国际生，每年减免 £10,000 学费，共 3 年，属于学费减免而非生活津贴。申请需两封推荐信和研究计划，并需计算机或相近专业的优秀学位。
glasgow-csc-phd: 格拉斯哥大学的 CSC 博士奖学金，学院免学费，CSC 提供生活费、机票和签证费。面向中国大陆公民或永久居民，须获得格拉斯哥博士录取，部分学院要求无条件录取。
glasgow-cse-scholarships: 格拉斯哥大学计算机学院博士奖学金，包括 Graduate School 奖学金与 CSC 奖学金。前者覆盖学费与生活津贴；后者名额通常由学院每年分到少量。通常要求二等一荣誉学位或同等海外学历。
glasgow-jws-phd: 格拉斯哥大学 James Watt 工程学院接受博士研究申请，学院与 EPSRC 资助的奖学金名额有限，面向本国与国际候选人。需同时提交学术申请和奖学金申请。
glasgow-leverhulme-doctoral: 格拉斯哥大学校级竞争性 Leverhulme 博士奖学金，面向跨学科博士，每轮最多 30 个名额。每轮每人只能递交一份申请，且需先通过校内程序。
glasgow-mvls-funded-research-opportunities: 格拉斯哥大学 MVLS 学院的带奖博士项目列表，包括 MRC DTP、MVLS/EPSRC studentship 与 Wellcome 感染生物学博士项目等。MVLS/EPSRC 页面称生活费不低于 UKRI 标准 £20,780。
glasgow-terrier-jobs: 格拉斯哥大学 Terrier 信息检索团队的招聘页，长期招收信息检索方向的博士与博后。当前可见的博士岗（初始资助 12 个月）仅面向英国与欧盟申请者。
glasgow-urban-studies-phd: 格拉斯哥大学城市研究博士，全日制 3 年、非全日制 5 年，论文 70,000–100,000 字。页面列出 2027/28 年国际生学费 £28,275，未列国际生专项资助。
gmu-history-art-history-phd-funding: 乔治梅森大学历史与艺术史系的博士助教/助研资助。全职博士助教或助研可获生活津贴，每年约 US$23,000–25,000，并免最多 17 学分/学年的学费。需在入学申请中勾选资助意向。
gmu-schar-phd-funding: 乔治梅森大学 Schar 公共政策学院的博士资助。全日制博士可申请研究助理（GRA），免每学期 3 门课学费并发放津贴，每周约 20 小时科研工作。学院称无法为所有录取博士生提供资助。
goettingen-china-office-csc: 哥廷根大学 China Office 的 UGOE-CSC 博士奖学金，面向获得 UGOE 相应学院录取信的中国籍博士生。CSC 资助最长 48 个月，含生活津贴（含医保）、往返经济舱机票及签证费报销，完成项目并答辩后由 UGOE 授予博士学位。
goettingen-imprs-biological-complex-systems: 哥廷根大学、MPI-NAT 与 MPI-DS 联合运营的英文国际马普研究生院，研究生物与复杂系统物理。需硕士或同等学历，课程英文授课，通过 GGNB 网站申请。
goettingen-phd-jobs: 哥廷根大学的博士岗位列表。目前没有开放中的全奖岗位，研究训练组下一期预计 2027 年初发布公告。自费申请者可考虑 DAAD 等奖学金，需直接联系教授。
goettingen-public-international-law-doctoral: 哥廷根大学国际公法博士项目，属国际法方向，为三年制博士，由 Kai Ambos、Andreas Paulus、Peter-Tobias Stoll 三位导师共同指导，申请冬季学期入学。自 2018 年秋季起每年接收候选人。
goettingen-ugoe-csc-phd: 哥廷根大学（UGOE）面向全部学科优秀中国籍博士生的 CSC 奖学金，资助最长 48 个月，含生活津贴与医保、往返机票及签证费。需获 UGOE 录取（含有条件录取）或 Letter of admissibility，毕业由 UGOE 授予博士学位。
google-deepmind-student-researcher: Google DeepMind 学生研究员 / 实习项目，面向在读本科、硕士或博士，带薪，时长 12–24 周，每周五天在谷歌办公室现场工作。官网称可申请 2026–2027 周期，申请按学位层次和地点组织。
google-phd-fellowship: 谷歌博士奖学金，面向在读博士，须由所在大学提名。年度 $85,000，最多两年，含学费、生活费、差旅与设备。美国与加拿大需修完研究生课程学分，欧洲及中东可在博士任意阶段申请。
gov-canada-intl-scholarships: 加拿大政府国际学生奖学金门户，汇总面向非加拿大人的博士与博后奖学金。多数项目需由加拿大院校代为申请，具体资格以各项目页为准。
graduate-institute-tuition-financial-aid: 日内瓦国际关系与发展研究生院（HEI）的博士财政支持页。每个院系每年评出 6 个资助包（2 年奖学金加 2 年助教），面向最优秀的博士候选人，名额有限；前两年奖学金为 CHF 20,000/年，分 10 期。
grass-fellowship-mbl: MBL 神经科学夏季研究基金 Grass Fellowship，面向博士前期及以上研究者，包括博士生与博后。提案不超过 4 页，国际申请人须持覆盖整个研究期的签证（如 J-1）；资助为部分资助，申请者不宜同时撰写博士论文。
graz-doctoral-admission: 格拉茨大学博士入学说明。申请者需先获得导师支持并签订指导协议，提交研究计划后先向博士学院申请，再提交 UNIGRAZonline 在线申请，经委员会资格审查。
green-cdt-nuclear-sheffield: GREEN 核能博士培训中心由谢菲尔德大学牵头，联合曼彻斯特、兰开斯特、利兹、利物浦五所大学，提供全额资助的四年制博士项目。
greifswald-graduate-funding: 格赖夫斯瓦尔德大学研究生资助页，介绍州研究生奖学金的申请方式。该奖学金通常在冬季学期公告，按学期单独发布。
grenoble-doctorat-subjects-funding: 格勒诺布尔阿尔卑斯大学博士官网的课题库与资助说明，覆盖校内与外部资助。外国学生资格以各博士学院或项目公告为准，例如 LLSH 博士学院的 IRGA 奖学金为学院专项。
grenoble-quang2-quantum-phd-call: 格勒诺布尔量子科学博士统一招生，含 QuanG2（MSCA COFUND）、QuanTEdu-France 与 QuantAlps 三条路线。QuanG2 路线税前月薪 €2,400，其他路线 €2,300，需持硕士或同等学位。
grenoble-soft-nano-phd-offers: 格勒诺布尔阿尔卑斯大学软物质与纳米科学博士岗位汇总入口。校内资助岗位经各博士学院招聘，外部资助岗位发布在各实验室页面，资助金额因岗位而异。
gsas-harvard-natsci-support: 哈佛 GSAS 自然科学与工程方向博士通常提供至少 5 年全额资助，含学费、医保与基本生活费，物理等部分项目为 6 年。金额每年变化，以录取通知为准。
gsd-phd-program: 哈佛设计研究生院与哈佛文理研究生院联合管理的 PhD 项目，学生可攻读建筑、景观建筑与城市规划方向的博士学位。
gsi-hgs-hire-graduate-school: GSI 亥姆霍兹重离子研究中心的 HGS-HIRe for FAIR 研究生院，由 GSI、若干大学及 FIAS 共同设立，面向 GSI 与 FAIR 相关研究的结构化博士教育。
gsi-theses-phd: GSI 亥姆霍兹重离子研究中心的博士课题与合作大学博士岗位，方向为核物理与 FAIR 相关研究。学位由合作大学授予，入学要求与国际生资格需以具体岗位为准。
gsn-lmu-munich: 慕尼黑系统神经科学研究生院（GSN-LMU）不收取申请费与学费。需在线提交完整申请，两封推荐信须由推荐人在截止前自行提交，不接受邮件或 Uni-Assist 等外部平台提交。
gsu-finance-phd: 佐治亚州立大学 Robinson 商学院金融博士，大学博士奖学金每 12 个月 $22,000（竞争性，可续 4 年）。多以含全额学费减免的助教或研究助理职位支付培养费，项目一般 5 年。
gtc-oxford-said-dphil: Green Templeton 学院与赛德商学院的 DPhil 奖学金，提供全额学费与不低于 UKRI 标准的津贴（2026/27 为 £21,805），限赛德管理或金融方向新生。
gu-cul-doctoral-school: 哥德堡大学 CUL 研究生院招收教育科学与教师研究方向的博士生，并非人文社科方向。博士生以大学雇员身份获薪，申请须持有瑞典教师资格证。
gu-ocean-vacancies: 哥德堡大学海洋相关博士与博后岗位，按批次在学校总招聘页发布，各批截止时间不同，需定期查看。
gu-sahlgrenska-doctoral-studies: 哥德堡大学 Sahlgrenska 学院的医学与口腔方向博士岗，以带薪职位形式经大学 Vacancies 页公开招聘。外部机构出资的岗位，需先提交个人学习计划。
guelph-ai-security-lab: 加拿大圭尔夫大学 AI 安全实验室，招收网络安全与 AI/机器学习方向的资助博士生及硕士生，入学时间为 2027 年夏季与秋季。申请需计算机科学或计算机工程背景，AI 或网络安全经验者优先，并直接发邮件联系 Wenjing Zhang 博士。
guelph-idts-award: 圭尔夫大学国际博士学费奖学金（IDTS），每年 CAD 12,500 学费差额，最多 4 年，入学后自动评定。需录取平均分 A- 及以上，不可与 China Scholarship Council 等第三方资助叠加。
guelph-idts-funding: 圭尔夫大学国际博士生学费奖学金（International Doctoral Tuition Scholarships），最长 4 年。录取平均分需 A- 及以上，录取即自动评定。
guelph-ses-phd-funding: 圭尔夫大学环境科学学院博士最低资助，国际全日制博士生每年 CAD $20,500，共 4 年；另有 CAD 12,500 国际博士学费奖学金，以及前两年每年半个助教岗位。
gulbenkian-armenian-studies-phd: 古本江基金亚美尼亚研究奖学金，面向已录取或在读国际认可大学的硕博士生及博后，课题侧重当代亚美尼亚问题。欧洲（含英国）博士为€17,000，美国与加拿大为$25,000（2026轮）。
gurdon-wellcome-masters-phd: 剑桥大学 Gurdon 研究所发育生物学相关研究生项目，资助包括 Wellcome Trust 资助的发育生物学 MPhil（硕士）项目。申请人可在提交正式申请的同时联系课题组负责人。
gut-polonium-doctoral-fellowships: 格但斯克理工大学 Polonium 国际博士奖学金，面向波兰境外的博士生，为补充奖学金，最高 PLN 2,500/月（税前），最长 12 个月。须已被该校博士学校录取，处于博士第一或第二学年。
gw4-biomed3-mrc-dtp: GW4 BioMed3 MRC 博士培训伙伴，提供 MRC 全额资助，年生活费 £21,805（2026/27 费率）。国际生名额约占 30% 上限，竞争性分配，国际生需自付签证费与医疗附加费。
gwu-michaels-neuro-fellowship: 乔治华盛顿大学 Michaels 神经科学博士奖学金，需已录取或申请 GWU 医学与健康科学院的神经科学博士项目。完成通用申请即自动参评。
hague-academy-doctoral-scholarship: 海牙国际法学院课程与博士奖学金，面向非 OECD 国家在读博士生，资助 €2,250 加一半差旅费（上限 €910）。须能在获奖次年 12 月 31 日前完成答辩，并在海牙实际居住两个月。
hakubi-project-kyoto: 京都大学 Hakubi 计划特定项目助理教授公开招聘，全学科开放，面向持博士学位或同等研究能力者。入选者任期原则五年且不可续聘，研究经费每年约 100–400 万日元。曾任 Hakubi 计划研究人员者不可申请。
hamburg-iqp-mathey-positions: 汉堡大学量子物理研究所 Mathey 课题组的博士、博后及论文课题页，页面写明课题可立即开始，工作语言为英语。PhD 申请需将学术兴趣与成就的简短说明及 CV 发至课题组邮箱。
hamburg-promotion-jobs-guide: 汉堡大学博士中心整理的德国学术招聘平台清单，包括 EURAXESS、ZEIT 人才库与各学会岗位。页面是导航而非岗位列表，适合作为找博士与博后岗位的起点。
hamburg-quantum-universe-jobs: 汉堡大学 Quantum Universe 集群岗位页，当前列有若干博士岗位，包括 BabylAXO 探测器开发、ATLAS 组岗位与 Observational studies 方向。岗位以英文广告为主，通常需相关硕士或博士学位。
hanken-doctoral-funding-routes: 芬兰 Hanken 经济学院的博士资助方式说明，包括雇员合同（2027 年起全日制入学者第 1 年 100% 合同 12 个月，第 2–4 年 50% 合同）、外部科研经费与有限名额的校内奖学金。
hanse-wissenschaftskolleg: 德国 Hanse-Wissenschaftskolleg 驻地研究员计划，面向各学科研究者，驻地 3–10 个月。常规研究员需博士学位超过 5 年，初级研究员需博士学位在 5 年内，申请通常需提前约一年。
hardiman-phd-scholarships-galway: 戈尔韦大学 Hardiman 博士奖学金，为四年制全额资助，每年生活津贴 €25,000 加学费全免。需一等荣誉或二等一级学位或同等学历，申请时需指定一名导师，并提交申请表与两份学术推荐信。
harding-distinguished-cambridge: 剑桥 Harding 博士奖学金，面向不限国籍的剑桥博士生，覆盖学费、生活津贴（2025–26 为 £21,360/年）及 6,000 英镑科研经费。需在剑桥研究生申请系统中勾选该资助，已在剑桥读博者不可申请。
harno-estonian-government-doctoral-scholarship: 爱沙尼亚政府奖学金（Harno），支持在爱沙尼亚高校攻读硕士与博士，各学科均可申请。须先获高校录取，仅限官方名单内国籍的申请者，俄罗斯、白俄罗斯公民 2026/27 学年不予受理。
harvard-bwh-brain-positions: 哈佛 BWH The Brain 实验室（Bulyk 实验室）的职位页，列出两个博后岗位、一个技术研究助理岗位，以及研究生、本科生机会。博后要求 2025 或 2026 年获得博士学位，或 2026 年秋季毕业；页面称薪资与福利有竞争力。
harvard-gsas-bbs: 哈佛大学研究生院（GSAS）生物与生物医学科学博士项目（BBS）。须提交个人陈述，可能需参加面试，不接受 GRE 成绩。
harvard-gsas-fas-humanities-funding: 哈佛文理学院人文社科博士通常提供学费、医保及基本生活费的完整支持至少五年，由学费补助、津贴和助教等组合构成。东亚语言文明（EALC）博士需已获录取，并满足课程与语言要求。
harvard-gsas-phd-financial-aid-page: 哈佛研究生院（GSAS）博士资助总入口。入学博士生通常获得至少五年的学费、医疗费及基本生活费支持，由学费补助、助教、助研与奖学金组合构成，需全日制且学业进展达标，各院系金额不同。
harvard-gsas-phd-funding-news: 哈佛研究生院（GSAS）2023 年 12 月的官方公告：自 2024–25 学年起，各博士项目 12 个月津贴至少 5 万美元（含保障补助）。资助随录取提供，条款以录取信为准。
harvard-hou-family-taiwan-fellowship: 哈佛费正清中心的 Hou Family 台湾研究博后，全职驻中心六至十二个月。申请者需持人文或社科相关博士学位，研究聚焦台湾，哈佛大学博士学位获得者不可申请。
harvard-international-graduate-funding: 哈佛奖学金办公室的国际研究生资助入口，按国家或地区列出专项奖学金（如英国、法国、加拿大等），页面所列国家未包括中国大陆。多数资助由各学院管理，宜先咨询院系财务资助办公室。
hbigs-heidelberg: 海德堡生物科学国际研究生院（HBIGS）全年可在线申请在招博士岗位，须在开始博士课题前提交。需获得可进入海德堡大学生物科学博士的学位，已开始博士课题者不能申请。
hbku-chss-admission-requirements: 哈马德·本·哈利法大学（HBKU）人文与社会科学学院博士项目。需相关领域硕士、GPA 不低于 3.0/4，并提交 1,000–2,000 词研究计划书、个人陈述及 2 封推荐信。
hbku-graduate-scholarship: HBKU 研究生奖学金，面向国际生 PhD，STEM 学费减免为 100%，津贴 9,000 QAR/月（共 45 个月），需担任 RA 或 TA。学费减免与津贴视资金可用性而定，不保证，录取时统一考虑，无需单独申请。
hbku-qc2: HBKU 卡塔尔量子计算中心（QC2）招生入口，页面称正在招聘博士、博后、科学家及高级科学家岗位，并列有短期访问与合作入口。
hbku-scholarship-policy-pdf: 哈马德·本·哈利法大学（HBKU）研究生奖学金政策，国际博士生每月津贴 9,000 卡塔尔里亚尔（共 45 个月），学费减免 100%。随博士入学申请一并考虑，但津贴不保证，视经费与择优或需求而定。
hcitaly-list: 意大利 HCI 社区邮件列表的官方归档，转发博士与博士后岗位公告。归档页停在 2024 年 4 月，需订阅后查看当前岗位。
hdsi-harvard-data-science-postdoc: 哈佛数据科学研究所（HDSI）博士后，为期两到三年的独立研究型资助，由哈佛教师指导与合作。
hea-goi-ies: 爱尔兰政府国际教育奖学金（HEA主办），覆盖硕博，宿主院校免学费，并发放一年€10,000生活费。出生国籍不得属于欧盟、欧洲经济区、瑞士或英国，俄罗斯与白俄罗斯国籍不可申请，申请时需已获爱尔兰高校有条件或正式录取。
hec-montreal-logistics-phd: HEC 蒙特利尔与 Concordia、McGill 及 UQAM 联合开设的物流与运营管理全日制博士项目，学制 4–5 年。页面称前四年学费免除，并提供竞争性资助。
hec-montreal-phd-funding-guide: 蒙特利尔高等商学院（HEC Montréal）博士生获 4 年资助承诺，2024 年秋起最低 $120,000，另含学费免除与 $5,000 科研补助，已有大额外部资助者除外。
hec-paris-phd-fees-funding: HEC 巴黎高商博士项目，全体博士生均免学费，并获五年生活津贴每年 €26,500（由 HEC Foundation 资助）；第 3 年起需缴博士学院注册费与 CVEC。
hec-paris-robust-optimization-postdoc: HEC 巴黎商学院的两年期博士后职位，研究稳健优化与统计，由法国 ANR 与香港 RGC 联合资助，可与香港科技大学的合作者开展合作。需已获或即将获得运筹学、计算机科学等相关博士学位。
hector-fellow-academy: Hector Fellow Academy 博士岗位由 Hector Fellow 课题组发布，需优秀硕士学位、良好英语能力，并愿意迁至导师所在大学。申请时需准备自拟研究想法，或选择已发布课题。
hector-tuebingen-job-listings: 图宾根大学 Hector 教育科学与心理学研究所的招聘列表，可找到攻读博士的研究助理岗位，以及数字教育数据计算建模方向的博后岗位（100%，E 13 TV-L，3 年）。
heidelberg-doktorandinnen: 海德堡大学博士生资助总入口，介绍州研究生奖学金（需先被院系录取）及国际访问资助咨询。结构化项目各自设截止，DAAD-GSSP 要求硕士或同等学历、成绩优秀。
heidelberg-hggs-daad-gssp: 海德堡人文法社科研究生院 DAAD-GSSP 奖学金，每月 €1,400，最长 4 年，面向居住在国外（或在德国不超过 12 个月）的国际申请人。需硕士学位、成绩优秀及很好的英语能力。
heidelberg-high-doctorate: 海德堡全球健康研究所（HIGH）博士课程（含 Dr. sc. hum.），全年接受申请。无学费，但需缴学生服务费（每学期约 161 欧元）。需具备 4 年以上学制的大学学位，并获潜在导师接收。
heidocs-2-0-heidelberg: 海德堡大学研究生学院的 heiDOCS 2.0 小额资助，面向已被本校某学院录取的博士候选人，用于旅费、过渡期、出版和项目类支出。这是小额补助而非完整奖学金，需持能进入博士培训的学位（通常为硕士）。
heiwa-nakajima-graduate: 平和中岛财团留学生奖学金（日本），面向在读日本大学的留学生，由所在大学推荐，各校名额有限，每个实验室限推荐 1 人。资助期 12 个月，自 4 月起。
helena-munich-doctoral-thesis: 亥姆霍兹慕尼黑、LMU 与 TUM 共建的 HELENA 环境健康研究生院博士论文项目，按课题招生，提供薪资岗位。须先与 Helmholtz Munich 导师确定课题并申请其博士岗位，入学后三个月内需在 LMU 或 TUM 注册。
helena-munich-graduate-school: Helmholtz Munich 研究生院（HELENA）为博士研究员提供 3+1 年合同与导师协议，配个人论文指导委员会，学位由合作大学授予。需通过 Helmholtz Munich 招聘站申请具体岗位。
helmholtz-current-calls: 亥姆霍兹联合会当前开放的博士与博后征集汇总，包括 Investigator Groups、Doctoral Award 等项目。各征集的截止与资格不同，需逐项查看。
helmholtz-investigator-groups: Helmholtz 独立研究组长项目，面向有国际经历的优秀研究者，学术年龄 2–6 年，须有至少 6 个月的国际工作经历（博士或博后阶段）。需先向某亥姆霍兹中心申请，由中心预审并设定截止。
helmholtz-jobs: 德国最大科研联合会的统一招聘平台，覆盖 DLR、KIT、DESY、Jülich 等 18 个中心，有博士和博后岗位。部分涉及敏感技术的岗位有出口管制审查。
helmholtz-munich-chc-postdoc: Helmholtz Munich 计算健康中心的博后项目，提供全额资助的两年期带薪博后岗位，面向国际申请者，每年征集一轮，研究方向为计算健康。
helmholtz-postdocs-career-page: 亥姆霍兹联合会的博后总入口，汇集各研究中心的博后岗位链接，并介绍职业发展中心与博后网络（HAPN）。
helsinki-collegium-arts-postdoc: 赫尔辛基高等研究院艺术方向博士后，由 Kone 基金会资助，受薪，需驻校 80% 工作量。需艺术方向博士学位，或其他领域博士且有艺术实践经历。
helsinki-doctoral-researcher-positions: 赫尔辛基大学博士学院统一资助的有薪博士研究员职位，身份为雇员，约四年。需通过所在博士项目的正式申请与录取，并与导师达成协议。
helsinki-eloisa-doctoral: 赫尔辛基大学 ELOISA 生态、进化与环境可持续博士项目，多为大学资助的带薪博士研究员岗位，同校岗位页称税前约 €2,600/月。需硕士学位或相当学历，并证明芬兰语、瑞典语或英语能力。
helsinki-peex-esm-phd: 赫尔辛基大学大气科学系与 PEEX 合作开设的国际地球系统建模博士项目，属于地球系统建模方向，页面称每年一次征集申请。
henley-accounting-phd: 亨利商学院会计博士奖学金，学费资助为英国申请者 £4,700、非英国申请者 £23,500，三年津贴每年 £20,780，另有每年 £3,500 教学津贴。需优秀本科与硕士学位。
her-care-cordis-project: HER-CARE 博士网络（MSCA 博士网络）项目，协调机构为荷兰癌症研究所（NKI-AVL），2026 至 2029 年，计划培养 15 名博士研究员。博士岗需满足 MSCA 博士网络资格，即未持博士学位并满足流动性规则。
herbert-miami-marketing-phd: 迈阿密大学Herbert商学院的营销学博士项目，资助含学费减免、医保、生活津贴与专业发展经费，仅招秋季入学。国际生需办理WES学历认证。
herchel-smith-postdoc: 剑桥大学 Herchel Smith 博士后研究项目，属带薪岗位。2026/27 轮招募已关闭，2027/28 轮预计 2026 年 10 月中至 11 月开放，具体细节尚待发布。
hereon-macromolecular-school: 亥姆霍兹 Hereon 大分子生物科学研究生院，覆盖高分子与生物材料方向，招收自然科学、生物材料或工程背景的博士生。申请需英文材料，动机信、CV、学位与成绩证明及两封推荐信合并为一个 PDF 发至协调办公室。
heriot-watt-current-pgr-opportunities: 赫瑞-瓦特大学带奖博士机会汇总页，属学校层面入口，指向其主导或参与的跨校 CDT，并链接 EPSRC DTP（数学与统计）与社会科学名额。
hessian-ai-research: 黑森州 hessian.AI 研究所（达姆施塔特）的博士岗位，为带薪雇员合同，由各实验室分别发布。德国 TV-L 合同通常要求硕士学位。
heydar-aliyev-ieg-phd: 阿塞拜疆海达尔·阿利耶夫博士奖学金，含学费、国际航班、月津贴、医疗保险及签证居留费用，共100个名额，为期5年。面向伊斯兰合作组织等成员国国民，中国学生是否符合需看官网名单。
hfsp-postdoctoral-fellowships: 人类前沿科学计划（HFSP）博士后奖学金，资助博士后换研究方向并换国家，开展前沿、高风险的生命科学研究。LTF 面向生命科学博士，CDF 面向非生物学科博士且生命科学经验较少。
hgsfp-heidelberg-physics: 海德堡物理研究生院（HGSFP）的博士招生入口，含 IMPRS-HD 国际轮。除统一的国际轮外，也可直接联系导师，或通过在线表格提交申请。
hhmi-freeman-hrabowski-scholars: HHMI的Freeman Hrabowski Scholars计划面向早期职业教职研究人员，方向为基础生物与生物医学科学。需已获或将获HHMI合格机构终身或tenure-track教职，入选者保留学术职位与实验室，最长可获10年支持。
hhmi-gilliam-fellowship: HHMI Gilliam 奖学金（生物与生物医学博士），最高 $65,000/年，须与 PhD 导师共同申请，面向 HHMI 合作院校基础生物或生物医学博士项目的二、三年级学生。美国公民、永久居民、DACA 及在所在院校可合法获资助的国际学生均可申请。
hhmi-hanna-gray-postdoc: HHMI 为距独立教职约两年的博后设立的 Hanna H. Gray 研究员计划，资助最多 2 年博后支持并衔接教职支持。2026 年起博后经 Freeman Hrabowski Scholars 竞赛申请。
hhu-macrochem-jobs: 杜塞尔多夫大学高分子化学课题组招聘页，列有一个计划于 2026 年 10 月或 11 月入职的博士岗位。课题组目前无博后资金，欢迎本科、硕士毕业论文咨询。
hhwf-research-fellowship: Helen Hay Whitney 基金会博士后研究员计划，资助期三年，第 1–3 年津贴分别为 $73,000 / $75,000 / $77,000，另有每年 $1,500 研究津贴。研究须在美国学术实验室进行，博士学位须在截止前两年内获得。
hida-data-science-schools: 亥姆霍兹信息与数据科学平台（HIDA），下辖 6 个信息与数据科学研究生院，页面称这些研究生院将培养 250 多名全额资助的博士研究员。各学院招生要求以对应学院页面为准。
higham-lab-univie-open-positions: 维也纳大学 Higham 实验室的招聘页，博士与博后都可联系。页面称博后可主动联系，Higham 教授可作为 ESPRIT（36 个月）项目的依托方。另提及可通过 HEAS 网络获得短期实习或研究奖学金。
hiroshima-csc: 广岛大学 CSC 博士项目，接收获中国政府（经国家留学基金委 CSC）资助的中国籍国际学生，资助覆盖学费。须先联系拟入学的研究科或拟指导教员，名额满后停止接受申请。资助细则以 CSC 网站为准。
hiroshima-global-doctoral-fellowship: 广岛大学 Global Doctoral Fellowship，以研究员身份聘用国际博士生，支持 3–4 年，共 30 名。月薪上限 144,000 日元，研究经费最高 40 万日元/年。申请者需被录取到广岛大学博士课程并注册入学，并说明毕业后为日本科技创新作贡献的意愿。
hiroshima-mext-faq: 广岛大学 MEXT 奖学金的大学推荐路线，候选人须经与广岛大学有交流关系的大学推荐，个人不能直接申请或咨询。想走此路线需先通过本校推荐，或改走驻华日本使馆的推荐路线。
hirszfeld-doctoral-school-recruitment: 赫希菲尔德免疫与实验治疗研究所博士学校（PAN）的博士生奖学金，第 I–II 年税前每月 PLN 3,570.50，第 III–IV 年 PLN 5,500.50。官网目前称无新招生，设有招生档案。
hitec-graduate-school: 亥姆霍兹能源与气候博士培训项目，由尤利希牵头、五所大学参与，为期 3 年，每年最多约 8 个奖学金。
hitotsubashi-mext-business-doctoral: 一桥大学经营管理研究科博士课程的 MEXT 奖学金路径，需先经日本使领馆初选，再向大学提交申请。适用 2027 学年入学。
hk-sg-astar-cfar-talent-scholarship: 新加坡 A*STAR CFAR 页面，列出 A*STAR 研究生奖学金（AGS，称全额资助，博士期间可含 12 个月海外实习）、ARAP 与 ARIA 等项目。部分项目限新加坡公民或永久居民。
hk-sg-cuhk-ccs-phd-fellowship: 香港中文大学中国语文学系博士奖学金页面，列出 HKPFS、校长博士奖学金（自动考虑，无需单独申请）及研究生奖学金等校级资助。需相关学科学士学位，英文与中文能力须达标。
hk-sg-cuhk-vc-phd-scholarship: 香港中文大学校长博士奖学金，报读全日制博士并按时提交网申即自动考虑，无需单独申请。页面列出 HK$80,000 奖学金（分三年发放），另有每年研究生奖学金 HK$229,200。
hk-sg-hku-aimin-li-openings: 港大 Aimin Li 课题组的招聘页，课题组常年招聘，各层级职位均有。页面列出 HKPFS、港大校长博士奖学金等可用奖学金，研究生申请须先向港大研究生院提交。
hk-sg-hku-science-rpg-important-dates: 港大理学院研究生项目的申请与奖学金时间节点汇总，可据此倒推 HKPFS 与院系申请的先后顺序，年份以页面为准。
hk-sg-hku-science-rpg-why: 香港大学理学院研究型博士（RPG）项目，2026/27 海报称获 HKPFS 的学生将自动升级为校级博士奖学金（HKU-PS），并享受学费豁免。申请需获港大研究型博士录取。
hk-sg-hkust-gz-soch-phd-2026-27: 香港科技大学（广州）创新政策与创业博士项目，全日制博士助学金每月 15,000 元、最长 4 年，采用双导师制。全日制申请者自动纳入助学金考虑，申请通过学校在线招生系统。
hk-sg-hkust-weihan-phd-openings: 香港科技大学 Weihan Li 课题组的博士招生页，称 HKUST(GZ) 博士岗位全年开放申请，并提供全日制助学金，月津贴为 15,000 元或 10,000 元。页面同时征集博士后与研究助理。
hk-sg-nus-soc-graduate-programmes: 新加坡国立大学计算机学院研究生入口页，列出计算机科学与信息系统博士方向及各硕士项目的入口与咨询邮箱，可从这里进入各项目。
hk-sg-polyu-fellowship-schemes-overview: 香港理工大学研究生院奖学金总览，汇总全日制博士的 HKPFS、Kuok Group Fellowship、PPPFS、IPFS 与 PRPgS 等入口。HKPFS 年津贴 HK$344,400，各计划名额与金额以当年页面为准。
hkbu-accounting-econ-phd: 香港浸会大学会计、经济及金融学系博士（PhD）项目，需硕士或同等学历及研究计划。全日制博士可同时参加 HKPFS 与校内奖学金评审。
hkbu-admissions-general: 香港浸会大学研究生院招生入口，列出香港博士研究金计划（HKPFS）、常规研究式博士与硕士（MPhil）课程，以及 ITS 跨学科博士三条路径。各项目入学条件不同，需按各院系页面查看。
hkbu-biology-phd: 香港浸会大学生物系博士/哲学硕士项目，需生物或相关学科学士或硕士学位，可参加普通轮与 HKPFS 申请。页面所列 AY2027/28 学费：UGC 资助 HK$49,500，自资全日制 HK$99,000/年。
hkbu-chemistry-phd-programme: 香港浸会大学化学系博士（PhD / MPhil）项目。申请 HKPFS 需优良硕士学位或一级荣誉学士，并需较强英语能力与研究潜力；常规项目以名额与录取为准。
hkbu-chinese-medicine-phd: 香港浸会大学中医药学院博士/哲学硕士项目，需中医药或相关学科背景与研究计划。可通过 HKPFS 申请，建议先联系潜在导师。
hkbu-chinese-phd-programme: 香港浸会大学中国语言与文学系博士项目，可申请 HKPFS 奖学金，该奖学金对所有国籍开放，HKPFS 申请人同时参与常规研究生项目评审。申请需硕士（成绩优秀）或一等荣誉学士。
hkbu-cs-phd-programme: 香港浸会大学计算机系的博士项目，招收 2027 年 9 月入学的新全日制博士生。可申请香港博士生奖学金计划（HKPFS），面向所有国籍，名额竞争性，也可同时参与常规研究生项目评审。
hkbu-gov-intl-studies-phd: 浸大政府与国际研究学系的博士项目，面向 2027 年 9 月入学，通过 HKBU 研究生院申请，可申请 HKPFS 资助，资助期 4 年。需学术成绩优秀，具备研究能力及沟通领导能力。
hkbu-history-rpg: 浸大历史系研究型哲学博士与硕士项目页，HKPFS 申请者同时考虑常规研究生名额。页面列出 2027 年 9 月入学的申请安排。
hkbu-hkpfs-faq-enquiry: 浸大研究生院整理的香港博士研究生奖学金（HKPFS）常见问题页，说明先向 RGC 在线系统申请参考号、再向所选大学提交正式申请的流程，并列出 RGC 与浸大研究生院的咨询邮箱。
hkbu-hkpfs-page: 香港浸会大学博士研究生奖学金（HKPFS）入口页，非本地生可申请，每人最多选 2 个博士项目。奖学金含学费全免，月津贴 HK$28,700（AY2027/28），另有差旅与研究经费，需先取得 RGC HKPFS 参考号。
hkbu-jao-tsung-i-sinology-phd-s42: 香港浸会大学饶宗颐国学院的哲学博士 / 哲学硕士（汉学）项目。2027 年 9 月入学的页面列出自资全日制学费每年 HK$99,000，UGC 资助学费为 HK$49,500；录取竞争激烈且受名额限制。
hkbu-mmis-phd: 香港浸会大学管理、市场营销与信息系统方向的全日制博士项目，招收 2027 年 9 月入学的学生，并给出香港博士研究生奖学金计划（HKPFS）的申请入口。
hkbu-pe-phd: 香港浸会大学体育与健康科学系招收2027年9月入学的PhD与MPhil，可同时申请HKPFS，名额有限。
hkbu-pg-scholarships: 香港浸会大学研究生奖学金总表，列出香港博士研究生奖学金（HKPFS）与 United Board Faculty Scholarship Program，后者最高每年 US$10,000，限该联盟内大学的全职教职员工。面向全日制研究型博士生。
hkbu-religion-philosophy-phd: 香港浸会大学宗教与哲学系博士/哲学硕士项目，需哲学、宗教或相关人文学科背景及研究计划。可同时申请 HKPFS 与研究生奖学金，人文方向名额有限，建议提前联系导师。
hkbu-rpg-programmes-admission: 浸大 MPhil / PhD 研究型研究生项目入口，可按院系进入各项目查看资助。需满足研究生入学与英语要求，学历与导师要求以各项目页为准；HKPFS 另需 RGC 网上初申。
hkbu-school-communication-phd: 香港浸会大学传播学院哲学博士项目，研究方向含新闻学。申请者须同时申请香港博士研究生奖学金（HKPFS），才能获得该校奖学金。
hkbu-social-work-phd: 香港浸会大学社会工作学系博士/哲学硕士项目，需社会工作或相关社会科学背景及研究计划，可通过 HKPFS 申请。
hkbu-translation-studies-phd-s42: 香港浸会大学翻译研究哲学博士 / 哲学硕士项目，可申请 HKPFS（需学校提名）或常规研究生奖学金。申请需提交 3000–3500 词的英文研究计划，以及学士和硕士成绩单。
hkpfs: 香港博士研究生奖学金计划（HKPFS），面向新入学全日制博士生，2026/27 学年年津贴 HK$344,400（约每月 HK$28,700）。需先在 HKPFS 系统取得参考号再申请院校，已在读博士者不可申请。
hkpfs-hku-gradsch: 香港研资局博士研究生奖学金计划（HKPFS），在香港大学申请，对所有国籍开放，资助三年。2027/28 轮每年津贴 HK$344,400，另有 HK$14,400 差旅经费。每人只能提交一份 RGC 申请。
hku-arts-pgs-rates: 香港大学文学院研究生奖学金（PGS）基本每月 HK$19,135，博士试用期确认后升为 HK$19,655，均自 2025 年 9 月 1 日起。获得 HKPFS 者另有月津贴 HK$28,400、差旅津贴 HK$14,200。
hku-biosch-ecology-biodiversity-postgrad: 香港大学生物科学学院生态与生物多样性方向研究生招生，可申请 HKU Presidential PhD Scholarship、HKPFS、PGS 等。HKPFS 每月 HK$28,400（2026/27 入学）。
hku-bisp-lab-join: 香港大学 BISP 实验室（MRI 与神经科学）招博士后和博士。博后需计算机、人工智能、医学影像等相关领域博士学位，博士申请者可申请香港博士研究生奖学金（HKPFS）。
hku-chi-yin-choy-vacancies: 香港大学蔡志贤课题组（电机电子）招博士后，应届博士与有经验的博士均可申请，合同一年，视表现与经费可续聘。需将附照片的 CV 与研究计划书发邮件给 Choy 教授。
hku-civil-transport-phd-page: 香港大学土木工程系交通方向教授的招生页，招收自驱型博士生，入选者可获研究生奖学金，页面所示标准为每月HK$19,135（2025年标准）。申请前需先联系教授，并具备交通、数学或计算机等相关学位背景。
hku-cs-how-to-apply-2027: 香港大学计算机科学系 2027 年秋季入学研究型博士的申请指南，说明申请条件与流程。申请者需已获硕士学位，或本科学位（直博）。
hku-cs-phd-admissions: 香港大学计算与数据科学学院 2027 年入学的博士、哲学硕士（PhD/MPhil）招生说明。需学士学位并提交研究计划；非英语授课学位者需提供英语成绩，如 TOEFL 网考 85 分或以上。
hku-dong-keun-ki-jobs: 香港大学 Dong-Keun Ki 实验室（物理）招收博士研究生，研究实验介观量子物理，包括石墨烯与二维材料、范德华工程和钙钛矿热电，通常 9 月入学，可发邮件至 dkki@hku.hk 联系。
hku-education-phd-scholarships: 香港大学教育学院的 MPhil/PhD 奖学金列表，包括 HKPFS 与 PGS 等。HKPF 每月 HK$28,700，另有每年 HK$14,400 的研究差旅补助；需先向香港研究资助局申请 HKPFS 参考号，再提交港大申请并附研究计划书。
hku-fbe-phd-admissions: 香港大学经管学院博士项目，学生需选择六个研究领域之一，主要资助渠道为 HKPFS。基本 PGS 每月 HK$19,135（自 2025 年 9 月 1 日起），通用轨入学奖学金 2027-28 学年为 HK$49,500。
hku-fbe-phd-financial-support: 香港大学商学院的博士入学与财务支持说明。设通用轨与 TPg 轨入学奖学金，按学术成绩自动评定、无需单独申请，通用轨 2027–28 学年为 HK$49,500；另有 PGS 及校级 HKPFS、Presidential 奖学金。
hku-funding-rpg: 香港大学研究型研究生资助总入口，汇总香港博士研究生奖学金（HKPFS）、HKU-PS 与院系奖金。全日制博士申请者自动参与 HKU-PS 考虑，建议同时申请 HKPFS。
hku-gradsch-hkpfs-detail: 香港大学研究生院 HKPFS 说明页，面向 2027/28 入学的新生，不限国籍。每月奖学金 HK$28,700，差旅津贴 HK$14,400/年（最多三年），须先向 RGC 提交初申取得参考号。
hku-hayden-so-vacancies: 香港大学 Hayden So 课题组（电机电子）招博士后，研究低功耗异构可重构计算系统，需 FPGA、GPU、CPU 异构计算背景；另列出计算机体系结构、并行编程、编译器等硕博方向。
hku-ihss-phd-funding: 香港大学人文社科跨学科研究院（IHSS）的博士费用与资助说明。2026/27 全日制综合费每年 HK$47,000，分两期缴纳。可申请 HKU-PS、HKPFS（新申请者不论原籍均可申请）及 PGS 等，具体以研究生院当年公告为准。
hku-law-phd-pgs: 香港大学法学院为法学方向博士生设立的博士研究生奖学金，资格与金额请以学院当前页面为准。
hku-math-pg: 香港大学数学系博士申请，须获录取。在线申请表中可勾选香港博士研究生奖学金（HKPF）或 Postgraduate Studentship（PGS），选择 HKPF 另需完成 RGC 初步申请表。
hku-presidential-phd: 香港大学 Presidential PhD Scholar Programme，全日制博士申请者自动参评。2027/28 入学套餐含每月 HK$28,700 研究生奖学金、学费减免及首年现金奖励 HK$40,000，需先完成 HKU 博士申请。
hku-science-rpg-faq: 香港大学理学院研究型研究生的常见问题页，列出六个系的招生联系人，并指引通过「Find Your Supervisor」选择导师。博士申请需提交研究兴趣陈述或研究计划及两封推荐信，理学院不要求 GRE/GMAT。
hku-science-rpg-funding: 香港大学理学院的研究型博士资助说明，涵盖 PGS 与 HKU-PS 等项目。PGS 基础标准自 2026-09-01 起为 HK$19,135/月，博士试用期后 HK$19,655/月；HKU-PS 含每月 HK$28,700 的 PGS 并免学费。
hku-shenzhen-hospital-joint-phd: 香港大学与深圳医院联合培养的博士项目，第 1、4 年在港大，第 2、3 年在深圳医院做论文研究。港大阶段每月 HK$18,760，深圳医院阶段每月不低于 RMB10,000。
hku-sklchem-gd-joint-phd: 香港大学合成化学国家重点实验室与广东省化学与精细化工广东省实验室的联合博士培养安排，为期三年，2026 年起招生，面向化学及化学相关交叉学科的博士生。
hku-society-of-fellows-humanities: 香港大学文学院人文学科研究员学会，三年期研究助理教授级别职位（非升轨、不可续约），2027 年 6–8 月入职，含月薪、医疗、年假及研究支持。持 HKU 博士学位者不予考虑。
hkust-bm-phd-financial-assistance: 香港科技大学商学院的博士财务资助说明。PGS 按正常学制发放，每月 HK$19,135（2025-26 学年标准）。另可申请香港博士生奖学金计划（HKPFS），津贴 HK$340,800/年，学费豁免 4 年，需经 RGC 系统申请。另有 HKUST RedBird 博士奖。
hkust-cse-early-recruiting: 香港科技大学计算机科学与工程系为 Fall 2027 入学开展的研究生早期面试招募，面向优秀本科生与硕士毕业生，全日制 MPhil/PhD 4–5 年。研究生奖学金约 HKD 229,620/年，早期批次之后仍可通过常规渠道申请。
hkust-econ-phd-2026-27: 香港科技大学（HKUST）经济学哲学博士项目，设 MPhil 与 PhD，PhD 全日制 3 年（有相关研究型硕士）或 4 年（无），采用北美研究型模式，申请需 GMAT 或 GRE 成绩。
hkust-fytgs-fees: 香港科技大学研究生院学费与奖学金页。博士研究生助学金（PGS）每年约 HK$229,620，用于生活费与学费。国际生另有 RedBird PhD Award，并可申请 HKPFS。
hkust-gz-creative-future-lab-recruiting: 香港科技大学（广州）Creative Future Lab（计算媒体与艺术）的招聘页，列出博士、MPhil 与研究助理岗位。录取后进入全额资助的博士项目，正常学制 3 年（无硕士 4 年）。申请须先发邮件并附研究计划书。
hkust-hkpfs: 香港科技大学博士学位奖学金（HKPFS）入口，对所有国籍的新入学全日制博士开放，学费全免4年，生活津贴 HK$344,400/年，会议津贴 HK$14,400/年，需先向 RGC 取得编号再向 HKUST 申请。
hkust-math-pg-funding: 香港科技大学数学系博士生资助说明。页面称几乎所有博士生可通过 PGS、HKPFS 或 Asian Future Leaders 等获得资助，PGS 约 HK$229,620/年，最长 4 年。
hkust-pgs: 香港科技大学研究型研究生奖学金（Postgraduate Studentship），PhD 最长 4 年，每年 HK$229,620，申请时在线勾选即可。金额以研究生院当年页面为准。
hkust-physics-scholarship: 香港科技大学物理学系研究生奖学金页，列出 PGS 奖学金每年 HK$229,620、最长 4 年，受资助者需按学系安排担任助教。
hkust-physics-scholarships: 香港科技大学物理系的博士奖学金列表，包括 PGS 与 HKPFS 等学系层面的资助。PGS 为每年 HK$229,620（2026/27，需担任助教），HKPFS 为每月 HK$28,700；评选看学业成绩与英语能力。
hkust-physics-summer-camp: 香港科技大学物理系夏令营与博士入学通道，夏令营面向申请 2027/28 秋季入学博士或硕士的申请人，活动为 7 月 13–17 日。页面列研究生助学金每月 HK$19,135（2025–26 年度参考数字）。
hkust-ppol-phd: 香港科技大学公共政策博士项目，资助为香港博士研究生奖学金（HKPFS）：每年 HK$340,800，共 4 年，含奖学金与学费豁免。须先向研资局（RGC）取得参考编号，再向香港科大提交申请。
hkust-redbird: 香港科技大学入学奖学金，含 RedBird PhD Award，面向国际博士申请人。入学奖 HK$40,000，首年学费减免，之后每年学业卓越奖 HK$20,000，可与 PGS 叠加。
hkust-science-rpg: 香港科技大学理学院研究型博士（RPG）入学页，资助以香港博士研究生奖学金（HKPFS）为主：每年 HK$344,400，共 4 年，另含 4 年学费豁免。需先向研资局（RGC）取得参考编号，再向港科大申请并填写。
hkust-seng-scholarships: 香港科技大学工学院研究生资助页面，列出香港博士奖学金（HKPFS）、华为博士奖学金、博士研究生助学金及工学院博士奖项。助学金页面称可覆盖日常生活费、学费及其他相关费用。
hkust-sqml-opportunities: 香港科技大学 SQML 实验室（自旋量子材料）招收博士、博后及访问学者，方向包括 MRAM 与 AI 硬件，另有 2D 自旋电子学方向的博后或研究助理教授岗位。申请前可直接联系 PI。
hkustgz-2027-28-application-guide: 香港科技大学（广州）2027–28 学年博士申请指南，在线系统提交，国际与中国大陆申请者的时间表不同。PGS 奖学金下，博士每月 CNY 15,000，最长 4 年；MPhil 每月 CNY 10,000，最长 2 年。
hkustgz-admission-timeline-2026-27: 香港科技大学（广州）博士招生时间表，涵盖 2026-27 春季与 2027-28 秋季入学，分别列出国际生与中国内地申请者的申请安排，录取滚动发放。
hkustgz-ai-thrust-prospective: 香港科技大学（广州）人工智能学域招收博士与 MPhil，申请时需在研究计划中注明潜在导师。学校同时面向中国大陆与国际申请者开放博士申请。
hkustgz-cis-lab-openings: 香港科技大学（广州）CIS 实验室（Zeyu Wang）招收博士、MPhil、博后及研究助理岗位。博士每月 RMB 15,000 津贴，MPhil 每月 RMB 10,000，英语最低要求为 TOEFL iBT 80 或 IELTS 6.5。
hkustgz-cma-fully-funded-phd: 香港科技大学（广州）计算媒体与艺术（CMA）方向的全奖博士与 MPhil 名额，博士最长资助四年，覆盖学费、住宿和生活费。按滚动方式招生，名额满可能提前停止。
hkustgz-iot-thrust-phd: 香港科技大学（广州）信息枢纽物联网学域的博士项目 PhD(IoT)，研究方向包括具身智能、边缘 AI、智能体等，资助信息可在官网查询。
hkustgz-lingjie-duan-a2e-phd: 香港科技大学（广州）A2E 实验室（段凌杰）招收 2026、2027 年入学的博士生，研究分布式机器学习、多智能体系统与算法博弈论，录取博士生可获月津贴 RMB 15,000。
hkustgz-postgraduate-studentship: 香港科技大学（广州）研究生助学金（PGS）面向全日制博士录取生，博士每月 CNY 15,000、最长 4 年。录取后自动参评，无需单独申请。
hohenheim-hgl-life-sciences: 霍恩海姆大学生命科学研究生院（HGL）的农学博士项目入口，本项目本身不提供资金。需正式录取为博士生并由霍恩海姆教授或讲师指导；资金需通过导师项目、州奖学金或 CSC 等途径获得。
hohenheim-msca-dn-eligibility: 霍恩海姆大学 EU 办公室整理的 MSCA 博士网络（Doctoral Networks 2026）候选人资格说明，原则上不限国籍。申请时未持博士学位，且过去 36 个月内在招聘国居留或主要活动不超过 12 个月。
hokkaido-e3-mext-uni-guideline-2027: 北海道大学 e3 项目 MEXT 大学推荐指南（2027 年 10 月入学），博士 4 个名额，仅招 10 月入学。须居住在日本境外，需先与拟指导教授沟通，经文件审核与面试后由教授推荐，再经校内两轮筛选。
hokkaido-fisheries-scholarships: 北海道大学水产科学研究科的国际学生奖学金页面，列出 MEXT、JASSO、地方政府、私人基金会等多种来源。博士阶段 MEXT 口径月额 ¥145,000（11–3 月为 ¥148,000）。MEXT 等奖学金需在入学前经使馆或大学推荐。
hokkaido-global-scholarships-hub: 北海道大学留学生奖学金入口页，汇总日本政府奖学金（MEXT）各申请途径及 JICA、CSC 等其他奖学金。博士层面的自费国际学生特别资助仅限兽医学、环境科学、化学科学与工程、感染症学四个研究科，学费免除，以研究助理工作为条件。
hokkaido-igp-mext-leaflet-2026: 北海道大学生命科学院 IGP MEXT 博士奖学金（2027 年 10 月入学），生命科学方向，博士 3 年制，共 5 个名额。月津贴约 14.5 万日元，学费免除，需先获得导师同意。
hokkaido-ist-postdoc-2026: 北海道大学信息科学院纳米材料科学方向的固定期限博士后，研究方向为柔性电子与电子皮肤。年薪约 360–600 万日元，另有通勤补贴；入职时须已取得博士学位，合同至 2027 年 3 月 31 日，可续约。
hokkaido-mext-embassy-route: 北海道大学 MEXT 申请路径说明，多数 MEXT 博士生经中国大陆日本使领馆推荐录取，需先通过初筛获推荐；大学推荐名额更少，且需导师先行接洽。博士月津贴 ¥145,000（北大官网所列）。
hokkaido-self-supported-grant: 北海道大学面向自费外国留学生的特别资助，学业极为优秀者可由研究科特待计划选拔。受助者免除学费，并获奖励金或RA薪资。页面标注的总长奖励金自2024年度起停止新招生。
hokudai-e3-mext-2027: 北海道大学 e3 项目的 MEXT 大学推荐奖学金，面向 2027 年 10 月入学的博士生，博士名额 4 个，经项目竞争性选拔。须居住在日本境外且未在日本大学就读，需在国籍国的日本使领馆申请留学生签证。
hokudai-igc-dhs-mext-2027: 北海道大学 IGC-DHS 数据驱动与假设驱动科学国际研究生课程，2027 年 10 月入学，有 5 个全额 MEXT 奖学金（博士 4 个、硕士 1 个）。申请前需先联系拟指导教授，材料须以英文提交。
howard-biology-graduate-program-funding: 霍华德大学生物系博士奖助包，博士生最低 $24,000/年，并含 10 个月学费，需全日制就读。遴选期为每年 2 月至 6 月，6 月 15 日前未获书面资助则机会大幅降低。
hpi-database-group-positions: 德国 HPI 数据库组（Naumann 教授）定期有博士生与博士后职位，页面称细节请直接联系任一教授。该网页为近期建立，问题可发邮件至 office-naumann@hpi.de。
hpi-research-school-scholarships: 哈索·普拉特纳研究所（HPI）研究学院每年新增全额博士与博后奖学金，奖学金免缴所得税，页面称提供计算资源与差旅经费。
hrzz-dok-doctoral-assistants: 克罗地亚 HRZZ DOK 博士助理征集，资助导师依托 HRZZ 项目聘用博士助理并承担其工资总成本，期限为科研机构 5 年、高校 6 年。征集文件为克罗地亚语。
hrzz-pdip-2026: 克罗地亚 HRZZ PDIP-2026 博后项目，项目期 2 年，单项目 40,000–100,000 欧元。申请须在克罗地亚注册的高校或科研机构进行，博士学位需在截止前约 5 年内取得。
hrzz-team-recruiting: 克罗地亚 HRZZ 项目负责人可在依托机构聘用博士生与博后，具体依征集而定。Installation Research Project 可聘博士生 4 年，Research Project 可承担所聘博士生学费 3 年，博后最长 2 年。
hss-promotionsstipendium: 德国汉斯·赛德尔基金会博士奖学金，页面列出 5 个名额，与为期三年的国际 summer school（主题为宗教与民主）相关，申请者包括国际博士生。需通过官方门户申请，并提交教授鉴定等材料。
huji-doctoral-research: 希伯来大学国际办公室的博士研究页面，介绍两类博士学位路径：个人制（需自行联系导师并提交研究计划）与结构化项目。
huji-frieberg-postdoc-s42: 希伯来大学 Louis Frieberg 东亚研究中心的人文社科博士后，研究对象为中国、日本、韩国或蒙古。每月免税津贴 8,500 新谢克尔，往返经济舱机票最高 2,000 美元；需已获博士学位且毕业不超过 4 年。
huji-funding-opportunities: 希伯来大学汇总的多项博士后及博士资助，包括 Azrieli、Fulbright、MSCA、Mandel、Buber 等。CSC–HUJI 项目限中国公民或中国永久居民，需先取得 HUJI 导师同意，各项目截止不一。
huji-mandel-scholarships-page: 希伯来大学 Mandel 人文高级研究学院奖学金与资助。2026/27 轮申请已关闭；出差资助仅限 Mandel 博士荣誉项目成员（进入 Stage B 后），下一轮预计 2026 年 11 月发布。
huji-postdoc-fellowships-2027: 希伯来大学 2027–28 学年博士后奖学金，只限新入职博后，需先与希大导师确认合作，并通过大学 Scholarship Portal 申请。月津贴 NIS 7,128（12 个月）；非以色列籍博后另报销往返经济舱机票，并报销 50% 基础医保。
huji-racah-international-students: 希伯来大学 Racah 物理研究所的国际学生说明页，称国际学生可申请硕士与博士并有资助，具体金额与资格见财务支持部分。建议直接联系研究生办公室。
human-technopole-semm-phd: Human Technopole 系统医学博士项目（SEMM）的博士奖学金，含计算生物、功能基因组学、群体与医学基因组学方向，提供至多 4 个全额奖学金。向意大利及国外毕业生开放，不因国籍筛选，需相关领域硕士学位。
humboldt-feodor-lynen: 洪堡基金会 Feodor Lynen 博士后研究奖学金，面向德国国籍研究者；非德国公民须在申请时在德国从事学术工作。博士学位须在申请前 4 年内获得（资深学者为 12 年内），东道学者须为海外洪堡网络成员或指定奖项获得者。
humboldt-international-climate-fellowship: 洪堡国际气候保护奖学金，面向非欧洲发展中或转型国家、从事气候与资源保护相关工作或研究的未来领导者与博后，须在德国开展研究。
humboldt-research-fellowship: 洪堡研究奖学金面向全球各国籍研究者，需与自选德国合作导师开展研究。博后资助 6–24 个月，月资助 €3,000 另加福利；博士学位须在申请前 4 年内取得。
hungary-mate-intl-phd-pilot-2026: 匈牙利农业与生命科学大学（MATE）国际博士奖学金试点，最多 4 名，税前 HUF 2,500,000/年，共两年，免除学费。需先获 MATE 博士学院录取，并与校内导师共同撰写英文申请书。
hust-pirc-postdoc-recruitment: 华中科技大学 PIRC 中心常年接收博士后申请，需提交个人简历与三篇代表作，联系邮箱为 pirc@hust.edu.cn。待遇以中心公示为准。
hyperspace-frankfurt-jobs: 法兰克福大学的天体与物理职位博客，按日期列出全球天体、引力波、粒子物理的博士与博后职位，具体条件以各职位原文为准。
hzb-doctoral-researchers: 亥姆霍兹柏林材料与能源中心（HZB）的博士招聘入口，设有与区域大学合办的研究生院。博士学位通常由合作大学授予，国际生资格看具体岗位与所选大学的入学要求，各岗位以逐条公告为准。
hzdr-phd-listings: 德累斯顿-罗森多夫中心博士职位总页，方向涵盖凝聚态、强磁场与低温实验。强磁场实验室的岗位长期开放，页面建议直接联系实验室。
hzi-international-graduate-school: HZI 感染研究国际研究生院（GS-FIRE，布伦瑞克），博士岗位以 TV-L E13（65%）合同在职位门户逐个发布。
iaifi-mit-postdoc-fellowship: IAIFI 物理与 AI 交叉研究所（MIT、哈佛、东北大学、塔夫茨、波士顿大学联合）的三年期博后职位，由 NSF 资助。申请需提交求职信、CV、研究陈述、论文列表及 3 封推荐信，博士学位须已获得或预计 2027-09-01 前取得。
iarc-visiting-postdoc-opportunities: IARC（WHO）访问学者与博士后机会汇总页，列出WHO肿瘤分类Senior Visiting Scientist现场岗位，以及2025年发布的CSU岗位。Senior Visiting Scientist需博士学位超过15年并保持学术隶属。
ibm-goldstine-postdoc-fellowship: IBM 研究院的 Goldstine 博士后研究奖学金，面向数学与计算方向的带薪研究。需在申请前 5 年内获得博士学位，国际生资格以公告为准。
ibs-pcs-visiting-fellows: 韩国 IBS 复杂系统理论物理中心（PCS）的访问研究员与博士职位，持续接收申请。博士职位一般为三年，薪资与经验相称。材料需合并为一个 PDF（求职信、CV 及 2–4 页研究计划），并需 2 位推荐人。
ibsa-foundation-call-2026: 瑞士 IBSA 基金会 2026 年征集的医学与生物研究奖学金，提供 7 项 €32,000 的 12 个月奖学金。需医学、生物、药学、生物技术或生物工程学位，申请人截止时须 40 岁以下（任何国籍）。
iccr-phd-scholarship: 印度政府文化关系委员会（ICCR）每年向约 180 个国家的外国学生提供包括博士在内的奖学金，通过 ICCR A2A 门户申请。多家使馆通知称博士申请年龄上限为 50 岁。
icelandic-research-fund-doctoral: 冰岛研究基金（Rannís）面向冰岛高校全日制博士生的资助。申请人须已获冰岛高校博士项目录取并提供资格证明，申请材料须为英文。
icfo-phd-fellowships: 巴塞罗那光子科学研究所（ICFO）的国际博士奖学金入口。录取博士生均获全额资助，申请需理科或工程相关硕士，建议先联系课题组负责人。目前开放的是本科与硕士实习项目，博士奖学金按批次开放。
iciq-phd-calls: ICIQ 全额资助博士招生列表，岗位属与 URV 合作的化学科学与技术博士项目，需硕士或同等学历。页面列有 2026 年第二轮博士岗，如机器学习驱动的力敏分子设计课题。
icm-csic-inphinit-hosts: 巴塞罗那 ICM-CSIC 发布的博士候选人需求，申请需先联系课题组，再通过 INPhINIT 统一申请。
icm-csic-pif-phd-calls: 巴塞罗那海洋科学研究所（ICM-CSIC）在 PIF 计划下公布的全额资助海洋科学博士岗。第一年毛薪约 €19,000，第 2–4 年约 €23,500。往年要求先联系项目负责人，且每人仅可申请一个项目。
icmat-severo-ochoa-fpi-past: 西班牙马德里 ICMAT 的 Severo Ochoa FPI 博士奖学金，为期 48 个月的带薪博士合同。需硕士学位，并通过 CSIC 系统申请。
icr-foreign-researchers-grants-2026: 罗马尼亚文化学会（ICR）面向外国研究者的资助，支持赴罗马尼亚开展为期三个月的研究，资助€5,000，偏人文社科与艺术。需研究计划、CV、身份证明及 2 封推荐信，每年征集。
ics-netherlands-vacancies: 荷兰阿姆斯特丹、格罗宁根、乌得勒支、内梅亨四所大学联合的 ICS 社会科学研究生院，提供全额资助的英文社会学方法博士岗位。当前 2026 批次申请已关闭，2027 批次尚未公布。
ictp-math-postdoc-2026: 意大利的里雅斯特 ICTP 数学博士后，两年期（可延 12 个月），免税月津贴 EUR 2100–2300（依资历）。需入职前已取得数学博士学位，经 ICTP 在线系统申请，页面写明优先考虑来自或在发展中国家工作的候选人。
ictp-phd-sandwich-programmes: ICTP 面向发展中国家博士生的 STEP 访问研究项目：博士需在本国大学注册，每年赴 ICTP 或合作机构访问 3–6 个月，最多 3 年，限物理与数学相关方向。中国大陆是否符合资格，以 ICTP 说明为准。
ictp-postdoctoral-opportunities: 的里雅斯特ICTP博士后机会索引页，列出凝聚态、数学、地球系统、定量生命科学等方向的岗位，通常为两年期，可延12个月。申请需三封推荐信，通过ICTP在线系统提交。
ictp-postgraduate-diploma: ICTP 研究生文凭项目面向发展中国家学生，为攻读博士做准备，设高能与宇宙、凝聚态、地球系统、数学、定量生命科学五个方向，要求相当于理学硕士水平的物理、数学或相关学位。
ictp-saifr-postdoc: ICTP-SAIFR 圣保罗博士后职位（复杂系统方向），两年期，FAPESP 资助。年免税薪金 150,840 雷亚尔，搬迁费 12,000 雷亚尔，每年另有 15,084 雷亚尔科研经费。
icts-opportunities: 班加罗尔国际理论科学中心（ICTS-TIFR）招聘汇总，列出 2027 秋季周期博后项目、S. N. Bhatt 纪念卓越奖学金 2027 及 Simons 合作项目特别博后等岗位。
icys-nims-recruitment: NIMS 国际青年科学家中心（ICYS）研究员（博后）招募，当前为面向美国研究者的特别批次，适用于在美国难以继续研究的青年研究者。年薪 600 万日元以上，另有 200 万日元/年研究经费。
idealab-language-brain-doctorate: IDEALAB 语言与大脑实验研究国际博士项目，由波茨坦、格罗宁根、麦考瑞三校联合培养，3 年制，需在三所合作大学中至少两所的导师指导下研究，需语言与大脑相关背景的硕士或同等学历。
ideas-helmholtz-data-science-school: 亥姆霍兹环境与生命科学数据科学研究生院，由 UFZ 与 HZDR 牵头，面向数据科学与环境、生命、健康科学交叉方向。以带合同的博士岗位招聘，3 年，可延长 1 年，同一轮可申请多个课题。
idiap-careers-phd: 瑞士 Idiap 研究所（Martigny）的 AI 与机器学习博士岗位，通常为 48 个月，并通过 EPFL 博士学院录取。欧盟外申请者需确认工作许可。
idil-montpellier-phd: 蒙彼利埃大学 IDIL 研究生项目的博士招聘页，每轮约 12 个带薪的三年期博士合同。需满足 IDIL 与各课题的硕士学历和语言要求。
idiv-phd-postdoc-project-call: 德国生物多样性综合研究中心（iDiv）的博士与博后项目征集，每年一轮，要求跨学科合作。申请人须为 iDiv 成员，博士岗位经公开国际招聘。
idrottsforum-lediga-platser: Idrottsforum 北欧体育研究职位聚合页，列有瑞典、挪威、丹麦、芬兰多所高校的在招博士与博后岗位，岗位以原校公告为准。
ie-university-phd-funding: IE 大学商学院英语授课的管理学博士奖学金，四年全日制，由委员会评审，不自动授予。金额 €25,000/年（毛额，4 年），需有商科相关硕士及至少 10 年资深领导或高管经历。
ieb-beatriu-de-pinos: 由 AGAUR 资助的 3 年期非终身轨博后奖学金（Beatriu de Pinós）。需先由接收研究组的教授提交，经巴塞罗那经济学院（IEB）与巴塞罗那大学（UB）内部预选后，再提交 AGAUR 官方申请；须在国外有至少 2 年博后经历。
ieee-eds-phd-student-fellowship: IEEE 电子器件学会（EDS）博士生奖学金，奖金 5,000 美元并可报销 IEDM 差旅。需为 EDS 学生会员并由 EDS 会员提名，每所院校限 1 人，获奖后需在同一导师处再工作 12 个月。
ieee-life-gsf-ee: IEEE Life Members 电气工程研究生奖学金，面向首年研究生，奖金每年 US$10,000。申请需电气工程专业学士学位，毕业院校须为认可的工程院校，并提交 3 封大学教授推荐信。
ieee-npss-graduate-scholarship: IEEE 核与等离子体科学学会（NPSS）研究生奖学金，面向核科学与等离子体科学方向的在读研究生，每年最多 4 名。奖金 US$1,500 及证书，并含一年 NPSS 会员资格。
ieee-pes-yalla-fellowship: IEEE PES Murty & Bhavani Yalla 电力系统保护与控制奖学金，每年 1 名，一次性奖金 $5,000，另有最高 $1,000 差旅补助。面向美国或加拿大院校的硕士（论文型）或博士，需由他人提名。
ieee-photonics-graduate-scholarship: IEEE 光子学学会（Photonics Society）研究生奖学金，面向攻读光子学相关学位的学生，最高 $10,000/年。申请者须先成为该学会学生会员。
ieee-photonics-gs-scholarship: IEEE Photonics Society 研究生奖学金，面向学会学生会员中处于研究生倒数第二年者，奖金最高 $10,000/年。需提交 CV、成绩单、研究陈述、代表性论文列表与两位推荐人。
ieee-sscs-predoctoral-award: IEEE 固态电路学会（SSCS）博士前期成就奖，面向已完成至少一年固态电路方向博士学习的学生。前两名各得 $3,500 现金并最多报销 $2,000 差旅，申请人须为 IEEE 与 SSCS 会员，同一导师每年最多 2 名。
ieee-vis-positions: IEEE VIS 公开岗位邮件列表，存档页列有 2026 年以及 2025、2024 等年份的存档，列表近年仍在更新，博士与博后岗位以各帖为准。
iem-cas-phd-2026: 捷克科学院实验医学研究所于2026年1月30日发布公告，招收2026/2027学年的博士生，研究方向为实验医学相关课题。
ieo-semm-phd: IEO 与欧洲分子医学研究生院（SEMM）的博士招生，位于意大利。2025 年招生公告称提供 10 个博士名额，招生分春季、夏季及医师科学家等轮次。
iese-phd-management-admissions: 西班牙 IESE 商学院管理学博士项目，提供学费减免 5,000 欧元及每月约 1,500 欧元生活津贴，并含医疗保险与会议、暑期课程全额资助，资助最长可续至 5 年（MRM + PhD）。
ifom-cancer-biology-phd: 意大利米兰 IFOM 癌症生物学博士项目，英文授课，4 年全额资助，学位由英国开放大学授予。官网称面向各国学生，全年接受申请，按开设职位评审。
ift-madrid-cosmo-job-offers: 马德里 IFT 宇宙学组的招聘列表，包括 JAE-PRE 资助的引力波数据分析博士岗位、FPI-UAM 资助的引力波与宇宙学博士岗位，以及 RyC 2026、JdlC 2025 等博后项目。具体以各公告为准。
ift-madrid-predoctorales: 马德里 IFT（UAM-CSIC）预博士合同与奖学金页。页面列出的 PIX2026、JAE-PRE 等博士岗位均已关闭，目前页面所见没有开放中的博士岗位。
ifw-dresden-career: 德累斯顿莱布尼茨固体与材料研究所（IFW）的招聘页，设有博士岗位栏目。目前列出的具体开放职位是实验室技术员、研究助理（一年期，80% 工时）和学徒岗位。
igbmc-job-offers: IGBMC（斯特拉斯堡）招聘与职位页，定期发布就业、博士（thèse）与实习机会。页面所列职位为博后与技术岗位，发布日期为 2026 年 6 月至 9 月。
igbmc-thesis-internships: IGBMC（斯特拉斯堡）研究生课题、实习与博士机会总页，适合在职位页之外直接联系课题组。法国博士合同资格以学校为准。
ignidte-innsbruck-cofund: 因斯布鲁克大学与医学院合办的 IGNIDTE 医学影像与图像引导治疗 MSCA COFUND 博士项目，2026 年 4 月启动，共 12 名博士生，大学占 4 个名额。全职带薪，含欧洲合作机构短期 secondment。
igradu-ulm-application: 乌尔姆大学 IGradU 博士项目的申请说明。申请人需先在乌尔姆大学研究组获得博士岗位并取得导师书面接收，再参加英文答辩与面试，并需说明全程资金来源；需硕士或同等学位。
ihes-simons-postdoc: 法国高等科学研究所（IHES）由 Simons 基金会资助的理论物理博后，为期 2+1 年，页面称 2026 年秋季起始。需通过 Academics Jobs Online 提交申请。
ihub-iitmandi-postdoc-call: 印度理工学院曼迪分校（IIT Mandi）iHub 与 HCI 基金会博后岗位，计划招 4 人，首期一年，月薪 INR 70,000–85,000。需博士学位，方向为 HCI、计算机视觉或生成式 AI 等，并需通过 GATE/GPAT/NET 考试。
iic-cas-careers: 捷克科学院无机化学研究所的工作机会页，列有博士与博后岗位。博士岗位（低价态碳发光材料）写明全额资助 4 年并含竞争力薪资；博后岗位（合成主族化学）为 2 年全职合同。
iisc-distsys-openings: 印度科学研究所（IISc）分布式系统实验室的博士招生，部分博士岗提供产业资助奖学金（第二年起）。需先被 IISc 录取，招生分 5 月与 12 月两轮。
iisc-google-phd-fellowship: 由 Google 资助、IISc 管理的博士奖学金，最多 US$50,000，最长四年，限计算机及相关领域。须全日制在读，早期博士生须于 2025 年 1 月或之后入读，已获同类产业资助者不具资格。
iisc-international-phd: 印度科学院（IISc）面向外国籍学生的博士项目，可申请理学或工程方向博士。录取者获宿舍与奖学金，金额与印度学生相同，页面称通常足以覆盖学费、宿舍餐费和生活费。
iisc-ipdf-postdoc: IISc 博士后研究员（IPDF），月薪 INR 80,000 加 HRA，另有年研究经费 INR 2 Lakh。外国国籍与 OCI 持有者可申请，需选定院系并先联系拟合作导师，全年可申请。
iiser-pune-intl-admissions: 印度 IISER Pune 面向印度以外国籍学生的博士招生总页，需四年制本科或印度境外取得的硕士学位。页面称可能提供 6 个国际博士奖学金，经济困难的优秀学生可获学费减免。
iit-ccht-doctoral-programme: 意大利理工学院（IIT）CCHT 资助的博士项目，学籍在威尼斯卡福斯卡里大学，学制 3 年（2027–2030 学年），含多个研究方向。申请前需先联系 CCHT 确定研究方案。
iit-cognitive-architecture-openings: 意大利理工学院（IIT）认知架构实验室招聘页，研究人机协作与认知机器人。页面称本年度博士申请已关闭，博士后暂无开放岗位；博士通过热那亚大学相关博士学校招收。
iit-madras-phd-brochure-2026: 印度理工学院马德拉斯分校（IIT Madras）2026 年 7 月入学的博士招生简章，博士津贴前两年每月 ₹37,000，后三年每月 ₹42,000，简章设有国际生录取专章。
iitd-intl-phd: 印度理工学院德里分校（IIT Delhi）面向非印度国籍（含 OCI/PIO）申请者的国际博士与 PG 招生入口。需提交英语能力声明与两名推荐人，部分申请人需 GATE、CSIR 或 INSPIRE 成绩。离线申请全年接受。
iitg-foreign-national-admission: IIT Guwahati 的 PG 与 PhD 在线申请门户，页面标注仅限外国籍申请人，申请人通过该门户提交申请，博士项目也在其中。
iitk-foreign-students-guidelines: 印度理工学院坎普尔（IIT Kanpur）外国籍博士申请指南（DOAA）。外国籍候选人通过页面链接在线申请，免申请费，免除 GATE 成绩要求，入围者经视频会议面试。
iitk-international-routes: IIT Kanpur 汇总国际博士奖学金路线，包括 ICCR、Study in India、AARDO、DIA 等。页面称 ICCR 奖学金申请通常在 4 至 6 月，其中 DIA（ASEAN）路线当前暂停招生，Study in India 路线未写暂停。
iitkgp-rolling-phd: IIT Kharagpur 全年滚动接收博士申请，资助类别含学院助教、个人奖学金（CSIR、UGC、DBT、ICMR、INSPIRE 等）及项目资助。DPEF 奖学金仅面向 GATE 2026 前 50 名考生。
iitmandi-chci: IIT Mandi 人机交互中心（CHCI）博士研究机会，面向 2027 年 1 月入学的博士。理工类硕士，或 NIRF 前 100 院校本科且 CGPA ≥ 7.5（2024 年公告）者可申请，国际生免 GATE/JAM。CHCI 助学金是否适用国际生需向中心确认。
iium-ummatic-phd: 马来西亚国际伊斯兰大学（IIUM）面向国际生的 Postgraduate Ummatic 博士奖学金，学费全免（最高 RM81,400，最多六个学期），另有月津贴 RM1,000，最多 36 个月。申请者须不超过 30 岁。
ijs-cobotat-funded-phd: 斯洛文尼亚约瑟夫·斯特凡研究所 COBOTAT 实验室的全资助博士岗位，研究人机协作机器人控制。需自然科学或工程类高等教育背景及英语能力，了解机器人学者优先。申请方式为邮件联系 Tadej Petrič。
ijs-young-researchers-2026-call: 斯洛文尼亚约热夫·斯特凡研究所（IJS）2026 年青年研究员征集，申请人选择导师后带薪攻读博士，项目每年征集。境外学历需取得斯洛文尼亚承认，合同开始前须备齐就业材料。
ijs-young-researchers-fellowships: 约瑟夫·斯特凡研究所（JSI）青年 fellowship 项目入口，提供由斯洛文尼亚研究署资助的带薪博士，最长 4 年。需硕士或同等学历，外国学历需完成承认程序。
ikerbasque-research-fellows: 巴斯克科学基金会（Ikerbasque）的博后研究员职位，五年期合同，2026 年共 15 个，由巴斯克政府、欧盟与东道机构资助。申请需在规定窗口内取得博士学位，并需东道机构接收函。
ilcc-edinburgh-phd-studentships: 爱丁堡大学 ILCC 三年期博士奖学金，约 10 个名额，覆盖学费及研究理事会标准生活费（2024/25 年为每年 GBP 19,237），面向英国、欧盟及非欧盟国籍学生。
ill-phd-positions: 格勒诺布尔中子研究所（ILL）的三年期博士课题，全额资助，官网写明无国籍限制。学生在 ILL 开展研究并注册于 ILL 成员国的大学，每年公布一批课题，需按课题单独申请。
illc-uva-tcs-positions: 阿姆斯特丹大学 ILLC 汇总的理论计算机科学职位，涵盖理论计算机与组合优化等方向的博士与博后岗位。各公告截止时间不同，需逐条查看。
illinois-ece-sarwate-fellowship: 伊利诺伊大学厄巴纳-香槟分校ECE的Sarwate研究生奖学金，为一年期、不可续期的津贴，金额等于一名25%任职新生助研的学年薪资，在50%助研之外额外发放。需已获得50%助研录用。
illinois-grainger-guarantee: 伊利诺伊大学厄巴纳-香槟分校（UIUC）工学院博士 5 年资助保障，前 5 年秋、春学期保证获得学费减免加津贴的 TA/RA 职位，夏季支持不保证。需留在原博士项目并保持良好学术状态。
imani-uconn-robotics-phd-2027: UConn Farhad Imani 课题组的机器人与智能制造博士招生，需机械、电气、计算机或应用数学背景。博士生通过研究助理（RA）获得资助，申请材料发送至 farhad.imani@uconn.edu。
imcbio-igbmc-phd: 斯特拉斯堡大学 IMCBio 国际博士项目，依托研究生院与 IGBMC 等实验室，页面列有 PhD-2026-05 等导师课题。资助由 LabEx INRT 按申请人水平分配，需硕士或同等学历。
imdea-energy-jobs: 马德里能源研究所（IMDEA Energía）预博士研究员岗位，研究方向包括电池、储能等，合同通常 1 年、可按表现续约，每年 €21,000–24,000。
imdea-networks-job-listings: 西班牙 IMDEA Networks 研究岗位列表，涵盖网络与无线通信方向。列表中有 2026 年 10 月发布的博士岗（6G 方向，页面称全额资助）和博士后岗（嵌入式系统、无人机与无线通信）。
impan-sierpinski-postdoc: 波兰科学院数学所（IM PAN）瓦茨瓦夫·谢尔品斯基博士后项目，面向获博士学位 2–7 年的研究者，聘期 2 年。需提交研究陈述、论文目录、两封推荐信，并提名 IM PAN 合作人。
imperial-bioeng-studentships: 帝国理工学院生物工程系的博士资助页，列出系级与外部资助岗位。申请需先与导师联系，个人自费一般不接受。
imperial-business-school-phd-funding: 帝国理工商学院博士项目，录取博士生均获全额学费减免（含海外学费）与生活津贴，2026/27 年为 £29,580/年，通过 GTA 奖学金最长可获 5 年，第 6 年个案考虑。
imperial-chem-eng-phd-scholarships: 帝国理工学院化学工程系 2027 年 10 月入学的全额博士奖学金，至多 15 个名额，其中 5 个仅限英国 Home 学生。资助含学费及免税生活费补助，约 £23,800–27,000/年，为期 42 个月。
imperial-cheme-phd-scholarships: 帝国理工学院化学工程系的 PhD 奖学金页，属 President's PhD Scholarship，面向全球申请人且无国籍限制，但申请前需有系内导师同意，部分院系无法支持国际生。
imperial-chemical-biology-cdt: 帝国理工学院化学生物学 CDT，要求物理科学（化学、物理、数学、工程）本科一等或二等一。海外学费学生仅有少量国际奖学金，需补足学费差额，申请前须先选定具体课题。
imperial-compmath-phd: 帝国理工学院计算数学方向的博士项目列表，经费来源多样。学费按 Home 与 Overseas 区分，留意各项目说明，可直接联系导师。
imperial-computing-phd-admissions: 帝国理工学院计算系官方博士招生入口，覆盖计算机科学方向。国际申请者需先确认导师有名额；一般要求一等或优秀（Distinction）硕士学位，仅学士学位通常不录取。部门奖学金信息在另一页面。
imperial-eee-phd: 帝国理工学院电气工程系的博士入口，资助多以导师提名的竞争性奖学金为主。校级 President's Scholarship 2026-27 轮每年 £26,500，申请前需先与院系导师取得联系，且仅限新生。
imperial-frontier-ai-phd: 帝国理工学院 Frontier AI 实验室与 Thomson Reuters 合作的全奖博士项目，奖学金覆盖海外学费并提供 42 个月生活津贴。需先向中心发送 CV，入选后再提交正式申请，采用滚动评审。
imperial-gida-studentships: 帝国理工 MRC 全球传染病分析中心的博士名额，涵盖传染病流行病学 4 年制博士（含 1 年 MRes）及各研究组名额，经费来自帝国理工与 MRC GIDA，申请需先联系潜在导师。
imperial-itp-phd-recruitment: 帝国理工学院智能传输（ITP）实验室的博士招生，方向为智能信号处理与无线通信。计划招 1 名有资助的博士和 2 名自筹经费的博士。需满足 Imperial 英语要求，可能需要 ATAS。
imperial-materials-phd-projects: 帝国理工学院材料系的全额资助博士课题列表，资助含学费及按 UKRI 标准的生活津贴（2026–27 年为 £23,805/年），最长 42 个月。需先与课题导师联系并获同意；申请限英国或享受本地学费资格者，国际生可申请但名额较少。
imperial-materials-scholarship-hub: 帝国理工学院材料系的博士奖学金入口，汇总多类博士奖学金。其中 President's Scholarship 无国籍限制，但需先获系内导师面试并推荐，且本科或一体化硕士须为一等或同等成绩。
imperial-maths-cdts-list: 帝国理工学院数学系参与的 EPSRC 博士培训中心（CDT）汇总页，列出 CCMI、LSGNT、Mathematics of Random Systems、StatML 等项目。LSGNT 2026 年 9 月入学提供 9 个全额资助名额，面向英国及海外学生，该批申请已截止。
imperial-presidents: 帝国理工学院（Imperial）校级全奖，全额学费（3.5 年）加生活津贴，2027-28 费率为 £27,036/年。需先获得 Imperial 导师同意，并需一等学位或硕士 distinction。
imperial-structures-phd-study: 帝国理工学院土木与环境工程系结构组的博士说明页，标准学制 3 至 3.5 年，通常 10 月入学，可协商其他入学时间。页面列出潜在导师及历年博士论文。
imprs: 马普国际研究生院（IMPRS），由马普研究所与大学合作，页面称截至 2026 年 1 月共有 68 个。具体课题请联系各 IMPRS 协调员。
imprs-astro-garching: IMPRS 天体物理博士项目（加兴，马普天体物理国际研究生院），由慕尼黑 LMU 与 MPE、MPA、LMU/USM、ESO 联合招生，约 25 个博士岗位，2027 年 9 月入学。申请需天体物理、物理或天文相关硕士，成绩良好以上，并提交成绩单、CV、硕士论文摘要与推荐信。
imprs-astrophysics-lmu: 慕尼黑大学与马普天体物理所（MPA）、地外物理所（MPE）、欧洲南方天文台（ESO）联合的天体物理博士项目，每年 9 月入学，学制 3 至 4 年，每年约招 25 个名额。合同期间约 €1,770/月。
imprs-bac-berlin: 柏林自由大学与马普分子遗传学研究所联合的分子生命与计算科学国际博士项目。页面称提供 3 年全额资助，并可通过研究生院奖学金计划（GSSP）申请 DAAD 奖学金。申请材料中 AI 工具仅可用于排版或语言润色。
imprs-cbp-call-for-applications: 马普学会在法兰克福与美因茨的国际博士生院（IMPRS-CBP）年度统一招生页，页面称提供全额资助的博士岗位。2026 届申请已关闭，2027 届申请将于 2026 年 12 月接收。
imprs-cim-muenster: 明斯特大学与马普分子生物医学研究所联合的英文博士项目 CiM-IMPRS，研究细胞运动与组织动力学。申请需硕士或同等学历，材料为英文并通过在线系统提交；曾在中国大陆、印度或越南求学者入选后需提交 APS 证明。
imprs-coni-leipzig: 马普人类认知与脑科学研究所、莱比锡大学、德累斯顿工大与 UCL 合办的三年制认知神经影像博士项目，每年征集一次。申请需硕士学位或即将完成硕士，并附 1–1.5 页求职信，点名意向导师。
imprs-cpqm-quantum-materials: 量子材料方向的国际博士学院，由德累斯顿马普固体化学物理研究所牵头，与德累斯顿工业大学、圣安德鲁斯大学联合培养。需化学、物理或材料专业的优秀学士或硕士学位，优秀候选人来自任何国家均可申请。
imprs-esm-register: 马普气象所与汉堡大学联合的 IMPRS-ESM 地球系统建模国际博士项目，每年有竞争性招生，页面称提供 3 年博士合同。
imprs-evolbio-max-planck: 马普进化生物学国际博士项目（IMPRS EvolBio，普伦/基尔）由马普进化生物学所、基尔大学与 GEOMAR 联合举办，英文授课，含培训阶段与三年博士研究，通常 9 月开学，要求硕士或 Diploma 学位。页面称本轮 7 个岗位已招满。
imprs-functional-material-design: 功能材料设计国际马普博士学校（柏林/波茨坦）由马普胶体与界面研究所牵头，与波茨坦及柏林多所高校联合招生。竞争性全额资助，共 23 个博士研究员岗位，合同 4 年，需自然科学相关硕士学位（或即将获得）。
imprs-gbc-biogeochem: 耶拿大学与马普生物地球化学研究所合办的英文博士项目，英语为主要申请语言，提供为期3年的资助，申请需在线注册并提交材料，之后可能有电话或视频面试。
imprs-genome-science-goettingen: 哥廷根 IMPRS 基因组科学博士项目，岗位为雇员合同，月净薪约 1300–1600 欧元。需硕士或即将获得硕士学位，并需两名推荐人，通过在线注册提交 PDF 材料。
imprs-gravity-aei-potsdam: IMPRS Gravity at the Extreme（AEI 波茨坦/汉诺威）博士项目，研究引力波与相对论天体物理。需在入学前取得硕士学位，并提交不超过 3 页的研究陈述、CV、成绩单、论文列表及 3 名推荐人。
imprs-gs-goettingen: 哥廷根大学 IMPRS Genome Science 博士项目（与 GönomiX 联合招生），研究基因组科学相关课题。全额资助，通常以课题组雇佣合同发放，月净薪约 1300–1600 欧元。申请需硕士学位或 2026 年 10 月前可取得硕士，并需推荐人。
imprs-hd-astro-heidelberg: 海德堡 IMPRS-HD 天文与宇宙物理博士项目，2027 年秋入学。申请者需持物理或天文硕士，特殊情况下可为本科加论文且有科研经历。
imprs-idi-berlin-call: IMPRS-IDI 感染生物学国际博士项目（马普感染生物学研究所等），2026 批次提供六个全额资助博士岗位，面向全世界申请者。
imprs-is: 马普智能系统研究所与斯图加特、图宾根大学联合的 AI 与机器人博士项目（IMPRS-IS，Cyber Valley），需硕士学位，录取后签订雇佣合同，每年秋季统一招生。
imprs-kir-historical-reciprocities: 马普科学史研究所与柏林三所大学联合运营的博士项目，聚焦知识及其资源的历史互惠问题，3.5 年（可延长 6 个月）。录取者通过雇佣合同获资助，面向所有国籍申请者。
imprs-life-admission: 马普人类发展研究所（柏林）IMPRS LIFE 博士项目，英语授课，面向近期取得相关硕士（MA、Magister 或 Diploma）学位者。博士合同按 TVöD 13（75%）支付，视资助机构也可能为奖学金。
imprs-mis-leipzig: 莱比锡马普数学科学所与莱比锡大学的 IMPRS Mathematics in the Sciences 博士项目，提供 3 年带薪岗位（TVöD 65% E13），免学费、无教学义务，并有研究经费。需先联系潜在导师并在申请门户指定导师。
imprs-ml: 慕尼黑的 IMPRS-ML 分子生命科学国际博士项目，由马普生物化学所与生物智能所联合 LMU、TUM 招生，只在固定轮次接受申请，国际生资格与资助细节以官网为准。
imprs-moduli-bonn: 马普数学所·波恩 IMPRS Moduli Spaces 博士项目，提供 3 年合同（可延至 4 年），免学费，资助形式为合同制薪资，属于博士岗位类资助。
imprs-molecular-plant-science: 马普分子植物生理研究所（波茨坦）的国际博士研究生院，提供全额资助博士职位，资助期 3 年，可延长，需硕士学位。
imprs-neuro-goettingen: 哥廷根大学 IMPRS Neurosciences 神经科学博士项目，英语授课，面向各国申请者。资助以岗位薪资形式提供，月净额约 €1,300–1,600，学期仍需缴费约 460 欧元。
imprs-phds-csde-fellowship: 马普人口研究所主办的 IMPRS-PHDS 人口科学博士项目，核心伙伴为罗斯托克大学，方向为人口学、流行病学与数据科学，三年制，每年约15个博士名额，不收学费，需硕士或同等学位。
imprs-physics-of-light-erlangen: 马普光科学研究所与埃尔朗根-纽伦堡大学合作的 IMPRS Physics of Light 博士培养项目，课程与结构化支持明确，英文授课，无需德语，申请需硕士学位。页面列出 Herbert Walther Fellowship 等资助。
imprs-plant-breeding-cologne-application: 马普植物育种研究所与科隆大学联合的 IMPRS 博士项目，博士岗位为期 3 年（可延长）并获全额资助，英文授课，要求硕士或同等学历。可对项目排序申请；2026 轮已截止，2027 轮预计 2026 年秋冬开放。
imprs-qbee-konstanz: 康斯坦茨大学与马普动物行为所联合的 IMPRS-QBEE 博士项目，博士学位由康斯坦茨大学生物系授予，申请与学程管理使用 OpenCampus 平台。须在入学前取得硕士或同等学位，需英语流利并提供语言证明，无需德语。
imprs-qd-heidelberg-application: 海德堡 IMPRS-QD 量子动力学与凝聚态国际研究生院的申请页，年度招生。要求硕士或同等学历、平均成绩 B+ 以上，有硕士论文或发表成果，具备扎实量子力学基础。非母语者需英语达标。
imprs-qdc-dresden: 德累斯顿的 IMPRS 量子动力学与控制国际博士项目，全英文授课，无学费，入选者获得完全覆盖生活费的资助。标准入学条件为物理、化学、数学或计算机科学硕士或同等学历。
imprs-qst-mqv-doctoral-fellowships: 慕尼黑量子谷（MQV）与 IMPRS-QST 联合的 3 年博士奖学金，面向国际申请者。入学前需取得硕士或同等学历，可同时申请两项，统一入口为 application.imprs-quantum.mpg.de。
imprs-quantum-science-technology: 慕尼黑 IMPRS 量子科学与技术博士项目，由马普量子光学所、慕尼黑大学和慕尼黑工大共同组织，为英文博士项目，提供全额资助岗位。需硕士或同等学历。
imprs-stns-halle-nise: 马普微结构物理研究所（哈勒）NISE部门的IMPRS-STNS博士项目，博士岗位全额资助，初始合同36个月。需硕士或同等学历，或为优秀本科生走fast track路线；申请须通过IMPRS-STNS在线门户。
imprs-tp-application: 马普国际研究生院（IMPRS-TP）的申请页，接受任何国籍的硕士或医学学位持有者。需英文申请，提交两篇短文、至少三个研究组志愿及两封推荐信。
imprs-trust: 由马普信息所、马普软件系统所、萨尔大学与 RPTU 计算机系联合运行的 IMPRS-TRUST 可信计算国际马普研究生院，位于萨尔布吕肯与凯泽斯劳滕，官网称项目全额资助。需计算机或同等领域学士或硕士学位。
imprs-trust-admissions: IMPRS-TRUST 可信计算国际博士项目，由萨尔大学与凯泽斯劳滕大学联合招生，需计算机相关学士或硕士学位（或同等学历）。摘要称录取者生活费和学费全部覆盖。同一研究组也接受 CS@Max Planck 申请。
ims-csc-scholarship: 分子科学研究所（IMS）与 SOKENDAI 合作的 CSC 博士奖学金，每年总计约 5 个名额，其中 SOKENDAI 博士生名额每年限 2 个。须获得 IMS 录取函或注册证明，可联合指导，申请人需已是中国高校博士候选人。
imt-atlantique-spin-phd-topics-2026: 法国 IMT Atlantique 布雷斯特与南特校区在招的博士课题列表，课题各有截止时间，多为带薪博士岗位，可逐项查看研究内容。
in-alicante-job-offers: 阿利坎特神经科学研究所（IN，CSIC–UMH）的岗位列表，汇集各课题组的有薪岗位，包括 4 年全职资助博士岗位，以及 MRI 研究项目的博后与博士岗位。
indiana-kelley-phd-financial-aid: 印第安纳大学 Kelley 商学院博士项目为全额资助类：博士生不交学费，并获含生活津贴与医疗保险的基础资助包。
indiana-luddy-funding: 印第安纳大学 Luddy 信息学院的博士资助页，申请者会被自动考虑资助，无需另行申请奖学金。多数博士生通过助教或研究助理获得资助，享有学费减免与医保补贴，国际生须保持全日制。
infoclio-jobs: infoclio.ch 是瑞士人文社科招聘板，汇集博士与博士后岗位，每条附截止日期，多数以德语或法语发布。例如巴塞尔大学古代文明系的博士奖学金岗位。
innovation-fund-denmark-industrial-phd: 丹麦工业博士（Industrial PhD），企业雇佣候选人并在大学注册，项目 3 年，创新基金对企业薪资补贴最高 DKK 17,000/月。申请者需完成硕士学位，并满足丹麦评分制下的成绩要求。
innsbruck-dune-phd: 因斯布鲁克大学 SFB DUNE 项目（Euclid 弱引力透镜）的四个博士职位，方向包括弱引力透镜与本征对齐、星系团计数与弱引力透镜宇宙学，以及矮星系形成与演化。
inomics-economics-jobs: INOMICS 经济学岗位聚合站，同时列出博士、博后、教授及行业岗位，需逐条筛选。岗位条件以各发布机构为准。
inomics-rgs-econ-program: 德国鲁尔经济研究生院（Ruhr Graduate School in Economics）的全额资助博士项目，提供至少 3 年资助，形式为 TV-L E13 助理职位或奖学金，无学费，面向经济学方向的博士研究。
inphinit-la-caixa-incoming: INPhINIT “la Caixa” 博士奖学金（Incoming 通道，西班牙与葡萄牙），官网列出 30 个名额，最长 4 年全额资助，含劳务与科研费用及学费。
inrae-phd-offers: INRAE 的博士岗位多为雇佣合同，常与合作伙伴共同资助，也含 CIFRE 产业博士。需硕士（M2）或同等学历，岗位在 jobs.inrae.fr 发布。
inria-jobs: Inria 在招岗位总列表，含博士、博后、实习及行政岗位，不限于计算机、人工智能和应用数学。博士需先与潜在导师讨论课题，CORDI 奖学金申请窗口多为每年 2–5 月。
insait-cv-phd-openings: 保加利亚索非亚 INSAIT 计算机视觉方向博士招生页，官网称该博士项目全额资助、滚动招生，所列年薪为 €39,684（毛额）。仅有学士学位者入学后前两年需完成硕士学位。
insait-phd-fellowship: 保加利亚 INSAIT（索非亚）计算机科学与 AI 博士奖学金，英文授课，滚动招生。奖学金为全额，每年€39,684（税前），博士期限最长 5 年；入学需学士或硕士学位，应届毕业生可申请。
inserm-choisir-service-public: 法国 Inserm 雇主页，在 Choisir le service public 平台上显示约 166 条在招岗位，涵盖博士与博士后职位，可在此浏览该机构的全部在招岗位。
institut-agro-phd-schools: 法国 L'Institut Agro 博士学院与博士项目，专注农业、食品与环境领域，与 INRAE、CIRAD 合作。可申请 CIFRE、合作博士合同或 cotutelle 等形式，资助以各项目页为准；一般需硕士或同等学历，教学语言为法语与英语。
institut-curie-ic-phd: 居里研究所国际博士项目 IC-PhD（巴黎，前身 EuReCa），面向在研究所实验室开展研究的国际生，英文授课，是在巴黎的国际博士培养路线之一。
instn-cea-theses: INSTN 博士与博后课题清单，是 CEA 博士与博后的统一入口，核能与能源方向课题较多，岗位为有薪合同。博士需 Master 2 或同等学历，并在合同开始前取得。
intibs-pan-doctoral-school: 波兰科学院 INTiBS 下属四年制英文博士学校。2026/27 通用招生已截止，另有小批次招生。奖学金金额请查博士学校官网。
iocb-prague-phd-call: 布拉格有机化学与生物化学研究所（IOCB Prague）每年发布博士招生公告，可在多个课题中选择。申请需硕士或同等学位（生命科学或相关领域），并提交 CV、求职信及本科、硕士成绩单。
iowa-state-bbmb-phd-funding: 爱荷华州立大学生物化学、生物物理与分子生物学系的博士助研或助教资助，半职年津贴$30,000，学费100%减免并含单人医保。经轮转入学的博士可获5年支持，每年审核进展。
iowa-state-econ-funding: 爱荷华州立大学经济系博士，首年半职助教每学年津贴 $23,000（9 个月，每周约 20 小时）。半职助教可获相当于居民学费的学费奖学金，需 GPA 不低于 3.0。
iowa-state-ivy-phd: 爱荷华州立大学 Ivy 商学院全职住校博士项目，约 5 年，每年至多录取 12 人。录取者获半职助教或助研（每周约 20 小时），津贴 $32,500 起，含学费减免与医保。
ip-paris-csc-joint: IP Paris 与 CSC 联合博士资助项目，面向中国大陆国籍学生。需先获 IP Paris 博士录取，再通过 CSC 与学校双重流程申请。官网称每年约 30 名中国学生可获 CSC 资助。
ip-paris-econ-phd-track: 巴黎理工学院（IP Paris）经济学五年整合型 PhD Track，前两年为课程、后三年为论文。第 3–5 年的博士资助名额有限，由 IP Paris、X 与 ENSAE 提供，需要争取。
ip-paris-phd-track-scholarships: 巴黎综合理工 PhD Track 卓越奖学金，面向本科后连读硕士与博士的路径。完整资助包含硕士阶段每年 €10,000（2 年）及博士阶段 3 年约 €82,800（税前总额），由录取后的评审委员会决定是否授予。
ipb-solidstate-open-positions: 贝尔格莱德物理研究所固体物理与新材料中心的岗位页，列出欧盟 Horizon 项目 HIP-2D-QM 下 1 名结构分析与量子材料博后岗位，另有知识产权与风险管理岗位。岗位通过 EURAXESS 发布，薪酬与截止可在该平台查看。
ipmu-phd-programs-kavli: Kavli IPMU 不直接招生，博士通过东京大学数学、天文、物理或跨学科信息学研究科申请。国际生需事先指定导师，经导师预选与研究科正式选拔两个阶段。
ipp-yourphd-rolling: 马普等离子体物理研究所（IPP）博士申请入口，通过 YourPhD 全年滚动接收，面向物理或计算机硕士（或同等学位）。督导从申请池中选人，结果通常约 6 周，博士生薪资为 TVöD 第 13 组的 75%。
ipsa-job-board: 国际政治学会（IPSA）岗位板，列出政治学博后岗位（如 The Mark Grosjean Postdoctoral Fellowship in Political Science、MPIfG 的 Postdoctoral Researcher），另有大量教职岗位，需自行筛选。
iqc-available-positions: 滑铁卢 IQC 的在招职位页，列出多项博后资助项目，含标为 Ongoing 的 IQC 博后奖学金。研究员岗位目前无招聘，教职目前无机会。
iqc-lazaridis-fellowships: 滑铁卢大学量子计算研究所（IQC）的 Lazaridis 国际研究生奖学金，面向与 IQC 成员合作的国际博士生。每年合计 CAD 44,000（奖学金 CAD 34,400 加研究津贴 CAD 9,600），可续约至 4 年，须由 IQC 量子信息项目导师提名。
iqim-caltech-postdoc-2026: 加州理工学院 IQIM 量子信息方向博士后学者，2027 年秋入职，第一年年薪 $85,000，另有年度科研经费。申请需指定至少一位 Caltech 教员，并提交三封推荐信，入职前需已取得或预计取得博士学位。
irb-barcelona-intl-phd-fellowships: IRB Barcelona生命科学与生物医学国际博士奖学金，2026–2027学年最多提供15个博士奖学金名额。非欧洲高等教育区大学的学位，须可在西班牙获得相应博士入学资格。
irb-drive-doctoral-fellowships: IRB Barcelona 与巴塞罗那大学（UB）、庞培法布拉大学（UPF）联合的四年期博士奖学金，由欧盟玛丽·居里行动资助，年津贴 €31,000（税前）。学位须由 UB 或 UPF 授予，中国学生需先确认能否进入这两所大学的博士项目。
ireland-goipd: 爱尔兰政府博士后奖学金（Government of Ireland Postdoctoral Fellowship），需在爱尔兰合格高校找到合作导师。薪级标准为第 1 年 €46,305、第 2 年 €47,879，以征集文件为准。
irish-cancer-society-fellowships: 爱尔兰癌症协会癌症研究博后奖学金，研究须在爱尔兰共和国的宿主机构进行。博士毕业 0–5 年（翻译研究类）或 0–6 年（社会/护理类），需至少一名有经验的学术导师。各轮次不同。
irish-cancer-society-phd-scholarship: 爱尔兰癌症协会的癌症生存研究博士奖学金，资助 3–4 年全日制，每年固定津贴 €25,000，生存研究方向奖学金总额 €150,000，另有 €5,000 流动性经费。需与爱尔兰共和国认可的宿主机构建立关联。
isae-supaero-doctoral-teams: 法国 ISAE-SUPAERO 的博士研究团队（含与 ONERA 联合的团队），可在此找到相关课题。多数由项目或工业方出资，需逐个课题查看资助条件。
isas-ebisawa-postdoc-info: 日本 ISAS/JAXA 海老泽研究室博后途径说明。该室不设专门博后项目，可走 JSPS 外国人博士后或 JAXA 航天项目研究员（Aerospace Project Research Associate）途径，建议先邮件联系教授。
isba-jobs: 国际贝叶斯分析学会岗位板，列出统计方向的博士岗位，其中包括有资助者的岗位，招聘范围覆盖全球。
iscb-careers: 国际计算生物学会（ISCB）的岗位中心，设有 PhD student position 分类，可浏览博士与博后岗位，岗位范围覆盖全球，资助与条件以各岗位发布为准。
ise-electrochemistry-jobs: 国际电化学学会（ISE）职位板，汇总电化学、电池与电解水方向的博士和博后职位，职位来源多样，需逐条查看各岗位要求。
isglobal-phd-programme: 西班牙巴塞罗那ISGlobal博士项目，设有国际名额，无国籍限制。2025轮毛薪为第一、二年每年€20,400，第三、四年每年€24,350，要求300 ECTS硕士学位及良好英语。
issp-utokyo-scholarship: 东京大学物性研究所（ISSP）的博士项目学生可申请有薪的研究助理（RA）岗位，薪酬与岗位数以 ISSP 总务办公室为准。另有公共与民间奖学金渠道，部分需经东京大学申请。
ist-austria-phd-admission: 奥地利科学技术学院（IST Austria）的博士招生说明，英文授课，博士生有薪资。每年只受理一次申请，需提交研究陈述、成绩单并请 3 位推荐人。
ist-fct-phd-studentships: 里斯本理工大学 Técnico 博士学院的 FCT 博士奖学金通道，属 FCT 博士奖学金竞赛的一般申请线，申请通过 FCT 官网提交。
ist-ra-utokyo-2027: 东京大学信息理工学研究科博士生特别研究员（IST-RA）2027 批次，面向在读博士生，月津贴 A+ 类 120,000 日元、A 类 60,000 日元。MEXT 奖学金及中国政府留学项目等外国政府资助学生不可领取。
ista: 奥地利科学与技术研究所（ISTA）的统一博士项目，含第一年轮转，全资助。需本科已完成第二学年或持硕士学位，并提交英文材料：CV、研究陈述、成绩单及 3 位推荐人。
ista-open-positions: 奥地利科学技术研究所（ISTA）官方岗位页，列出 Ibáñez、Pellicciotti、Siegert、Fatichi、Polshyn 等研究组的博后岗位，其余多为行政、技术与科学服务岗位。截止日期需到各岗位页查看。
ista-phd-program: 奥地利 IST Austria 提供全额资助的博士项目，面向持学士或硕士学历的申请者。申请材料包括英文 CV、1–2 页研究陈述（最多可列 3 个研究组）、成绩单及 3 位推荐人。
ista-visual-computing-open-positions: ISTA 视觉计算组的职位页，招博士与博后，资助标为全额。博士生通常通过学院统一批次招生，博后可直接邮件联系组长。
isye-or-doctoral-program: 佐治亚理工学院 ISyE 运筹学博士项目，仅秋季入学，GRE 对博士申请者为可选。需数学、统计、应用概率、线性代数与编程基础。
italy-rita-levi-montalcini: 意大利 Rita Levi Montalcini 项目，面向在海外从事教学或博后研究的研究者，由意大利公立大学聘为固定期限研究员，按合同领取薪酬，各轮资格以公告为准。
itatti-2027-2028-fellowships: I Tatti 的 2027–28 学年艺术史研究员资助，面向已获博士学位、研究意大利文艺复兴（约 14–17 世纪）的学者。Berenson 研究员津贴 USD 5,200/月（据公告摘要）。每学年每人仅可申请一类研究员。
iter-monaco-postdoc: 摩纳哥政府与 ITER 联合设立的有限名额博士后奖学金，两年一轮。2026 轮国籍名单包括中国，博士学位须于 2023 年 1 月 1 日后获得，或预计于 2026 年 12 月 31 日前获得。
itm-antwerp-phd-sandwich: 安特卫普热带医学研究所（ITM）的个人博士项目，属 DGD 资助的能力建设计划。比利时停留期间每月 €1,750（最多 24 个月），本国停留期间按本国博士薪资或奖学金发放，上限 €1,500/月。需获 ITM 录取，并得到本国高校及 ITM 导师共同支持。
its-global-excellence-phd: 印尼泗水理工学院（ITS）面向国际生的博士全奖，覆盖六学期学费、月生活费、保险、签证与往返机票，月生活费 IDR 5,000,000（2025 届报道）。申请需硕士 GPA 3.25/4.00 并有一篇国际发表。
its-postgraduate-tuition-waiver: 印尼泗水理工学院（ITS）针对外籍博士生的学费减免，免学费 36 个月，不含生活津贴。申请需硕士学位、GPA ≥3.25、年龄不超过 40 岁，并需 ITS 研究导师推荐信。
iu-bloomington-cmcb-financial-support: 印第安纳大学医学院（Bloomington）细胞、分子与癌症生物学博士项目，所有录取学生均获学期内及暑期生活津贴，约 $30,000/年。资助保障 5 年，形式包括助教、研究助理、培训经费或奖学金，大学提供学生健康保险。
iucaa-phd-inat: IUCAA 博士项目，通过 INAT 在线申请、笔试与面试录取。需物理、应用物理、数学、应用数学、电子学或天文学硕士，或工程类学士/硕士（成绩 55% 以上）。
iuem-brest-recruitment: 布雷斯特欧洲海洋研究所（IUEM）招聘页，全年按合同招聘人员并接收各级实习生，可找到博士与博后类岗位。
iuj-scholarship: 国际大学（IUJ）的奖学金页，列出MEXT大学推荐路线：100%学费、博士月津贴¥145,000，另含机票。页面还列有IUJ、ADB等机构奖学金，各项申请时间与资格不同。
iussp-jobs: 国际人口科学联合会（IUSSP）的全球人口学职位板，汇集各地招聘信息，可筛选博士与博后岗位，找到人口学方向的在招职位。
iusspavia-phd-xlii-bando: 意大利 IUSS 帕维亚高等研究院博士第 XLII 期（2026/27）招生公告，共 23 个名额。选拔向不限国籍的申请者开放，国际生需提供学历认证。
ivan-titov-nlp-join: 爱丁堡大学 Ivan Titov 课题组（NLP）招收博士生，可通过 ILCC 博士项目或两个 CDT（Responsible NLP、Machine Learning Systems）申请。页面写明目前没有有资助的博后岗位，访问博士需自备经费。
iza-jobs-portal: 德国 IZA 劳动经济研究所招聘平台，定期招聘劳动经济学研究助理岗位，面向有经验的博士。
jacobs-cifar-research-fellowship: Jacobs 基金会与 CIFAR 合办的研究员项目，面向博士毕业十年以内的早中期研究者，研究聚焦儿童与青少年的学习与发展。资助拨给宿主机构，可在三年内用于支付部分薪资及研究相关开支。
jane-coffin-childs-fund: Jane Coffin Childs Memorial Fund的医学研究博士后奖学金，面向美国的医学与生物博后，提供三年薪资支持。2026轮津贴为第1年$72,000、第2年$74,000、第3年$76,000，另有研究与差旅等经费。
jane-street-grf: Jane Street 研究生研究奖学金，面向美国、加拿大、英国、欧洲、澳大利亚、新西兰或新加坡研究型博士项目的学生（官方称国际生可申请），学科为电气工程与计算机、数学、物理、统计。含全额学费与 50,000 美元生活费（需纳税）。
janelia-careers-lab-postdoc: HHMI 下属 Janelia 研究园区的招聘页，岗位为课题组长实验室的博后，聘期一年起、最长可至五年。博后招聘全年开放，具体岗位以招聘页为准。
janelia-jhu-joint-phd: Janelia 与约翰霍普金斯大学（JHU）联合的神经科学博士项目，全奖。无需单独申请 Janelia，而是通过 JHU 神经科学博士项目申请，并在申请中选择 1–4 位 Janelia 课题组长。
janelia-joint-graduate-program: HHMI Janelia 研究所与合作大学联合的神经科学博士路径，学位由合作院校授予，标注为全额资助。不能直接申请 Janelia，需通过 JHU 神经科学博士项目申请，申请时可列出 1–4 位 Janelia 组长。
japan-foundation-sydney-fellowships: 日本国际交流基金会的日本研究奖学金（悉尼），面向赴日开展日本研究的人文社科博士候选人与资深学者。总部指南要求申请人为与日本有外交关系国家的国民或永久居民。
jara-doctoral-researchers: JARA（亚琛工大 × 尤利希）联合体系下的博士研究人员身份说明。具体带薪岗位需到尤利希各研究所或亚琛工大岗位页查找。
jasso: 日本学生支援机构（JASSO）的留学信息与奖学金汇总页，收录大量民间财团奖学金，这些奖学金多为入学后申请。
jax-phd-cooperative: 美国杰克逊实验室（JAX）合作博士项目，学生注册在 Tufts、UConn Health、Maine 等合作院校，在 JAX 轮转并做论文。资助主要依靠 T32 训练经费，申请需走合作院校。
jax-postdoctoral: 美国杰克逊实验室的博士后岗位，涵盖衰老、癌症、免疫、计算生物和神经等方向，按实验室在职位门户发布。需近期获得博士、医学博士或同等学位，国际申请者的签证需向 PI 或 HR 确认。
jena-completion-grants-international: 耶拿大学为在耶拿攻读博士的非德国籍博士生提供答辩前的完成期资助，每月最高约 1000 欧元。通过校方在线门户申请。
jena-nano-quantum-optics-2026: 耶拿大学 Abbe 光子学中心纳米与量子光学组，2026 年发布 9 个博士、博后与青年组长岗位。博士与博后岗位按评审滚动进行，直至招满。
jena-research-school-aps: 耶拿大学光子科学博士研究院（Helmholtz Institute Jena 研究生院），英语授课，现有约 45 名博士生，最多 25 名获奖学金或工作合同。页面称无固定申请日期，需先获得相关工作组同意。
jhu-alliance-ai-lab-phd-2027: JHU Alliance AI Lab的Haimin Hu课题组设有博士招生栏目。申请方式为直接发邮件给Hu教授，附上研究计划、简历和相关技能说明。
jhu-biostat-phd: 约翰霍普金斯大学彭博公共卫生学院的生物统计博士项目，录取的博士生均获为期 5 年的助教或助研资助，含全额学费、医保与生活津贴，起薪 $25,000/年（据系所页面）。
jhu-neuroscience-phd-ntp: 约翰霍普金斯医学院神经科学博士项目，竞争激烈。官方称录取者学费全免并有津贴与医保，2026–27最低津贴标准为$52,000。NIH经费仅限美国公民与永居者，国际生资助结构需向项目确认。
jic-international-scholarship: 约翰英纳斯中心（JIC）国际奖学金每年约 1 个名额，补足国际学费差额。Rotation PhD 每年最多 5 个名额，其中最多 2 个给国际生。
jk-icems-join: 京都大学 iCeMS 入学与加入页。博士生需通过京都大学各研究科录取，博后需直接联系课题组。学历与语言要求以研究科或 PI 为准，资助需另行与导师或研究科确认。
jk-kaist-ami-lab-postdoc: KAIST AMI Lab（先进机器智能）的 InnoCORE 博后岗位。InnoCORE 为 KAIST、DGIST、UNIST、GIST 联合的国家项目，博后为合同制研究岗，薪资以岗位公告为准。
jk-kaist-kim-group-openings: KAIST Sangsik Kim 课题组，方向为光子学与纳米光子学，曾于 2022 年公告招收博后与博士。申请需直接发邮件联系 PI，学历、语言与资助形式以回复为准。
jk-kaist-steve-park-lab: KAIST Steve Park 研究组，方向为可拉伸电子与软体机器人，招收博士与博后。博后每年 KRW 9,000 万（据实验室页面），博士学位需在近 5 年内取得。
jk-keio-bio2q-postdoc-2026: 庆应义塾 WPI-Bio2Q 量子计算核心招募博后职位与博后实习，2026 年 5 月发布公告。要求英文申请材料并参加英文面试。
jk-nature-jp-jobs-board: Nature Careers 的日本学术职位板，职位为英文招聘，可按学科和岗位类型筛选。多为带薪研究职位而非全奖学位，是否含学费与生活费需看各岗位说明。
