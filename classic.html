.af{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.af details{border-top:1px solid var(--line)}
.af details:first-child{border-top:0}
.af summary{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 14px;cursor:pointer;list-style:none}
.af summary::-webkit-details-marker{display:none}
.af summary:hover{background:var(--soft)}
.af summary span{font-size:12.5px;color:var(--muted)}
.af summary b{font-size:14.5px;font-weight:500;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.af summary i{font-style:normal;font-size:12px;color:var(--faint);white-space:nowrap}
.af details[open] summary i{color:var(--brand-text)}
.af q{display:block;margin:0 14px 12px;padding:10px 12px;border-radius:8px;background:var(--proof);font-family:var(--f-mono);font-size:13px;line-height:1.6;font-style:normal;color:var(--ink);overflow-wrap:anywhere}
.af q::before,.af q::after{content:none}
.back{display:none}
footer{border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer .in{padding-top:18px;padding-bottom:32px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px}
footer .brand b{font-size:14px}
footer .mark{width:22px;height:22px;border-radius:7px}
footer p{margin:0;flex:1 1 320px}

/* 窄屏：视图标签换到第二行，工具只留图标；列表铺满，详情全屏打开，底部固定申请按钮 */
@media (max-width:860px){
  .bar{flex-wrap:wrap;padding-top:8px;gap:0 12px}
  .tools{margin-left:auto}
  .tool .lbl,.savebtn .lbl{display:none}
  .tool{padding:0 9px}
  nav{order:3;flex-basis:100%;margin:6px -4px 8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  .hero .in{padding-top:18px;gap:14px}
  .sub{margin-top:-6px;font-size:13px}
  .search{flex-wrap:wrap}
  .search label{flex-basis:100%}
  .search label+label{border-left:0;border-top:1px solid var(--line);flex:1 1 0}
  .go{margin:6px;align-self:center;min-height:40px}
  .heat{padding:12px 12px 10px}
  .peak,.legend{display:none}
  .sg{grid-template-columns:repeat(35,30px)}
  main.in{display:block}
  .list{max-width:none}
  aside{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.detail aside{display:block}
  body.detail{overflow:hidden}
  .pane{border-radius:0;border:0;min-height:100%}
  .back{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:2;width:100%;min-height:52px;padding:0 max(12px,env(safe-area-inset-left,0px));border:0;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px}
  .ph,.pb{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .af summary{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 12px}
  .af summary span{grid-column:1/-1}
  .af q{margin:0 12px 12px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .acts{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
  .acts .apply{flex:1;justify-content:center;white-space:nowrap;padding:0 14px}
  .acts .keep{padding:0 12px}
  .acts .due{display:none}
}
/* 为我推荐：画像表单（只存在浏览器本地）+ 按匹配度排序的卡片，卡片写明命中了哪些词与条件 */

body.rec .search,body.rec .hero .pills,body.rec #heat,body.rec .headline,body.rec .sub{display:none}

.rp-more{display:flex;flex-direction:column;gap:14px}
.rp-more>summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--brand-text);min-height:32px;display:flex;align-items:center;gap:8px}
.rp-more>summary span{font-weight:400;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-more[open]>summary span{display:none}
.rp-more[open]>summary{margin-bottom:12px}
.rp-more>div+div,.rp-more>.rp-grid+div{margin-top:12px}
.rp-foot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.rp-clear2{margin-left:0!important}
.rp-clear{margin-left:auto;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer}
.rp-clear:hover{color:var(--ink);border-color:var(--ink-2)}
.recsum{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:13px;color:var(--muted);line-height:1.7}
.recsum b{color:var(--ink);font-family:var(--f-mono)}
.recsum b.tip{font-family:var(--f-body);color:var(--soon)}
.recsum details{margin-top:4px}
.recsum summary{cursor:pointer;color:var(--brand-text)}
.recsum ul{margin:6px 0 0;padding-left:18px}
.why{display:flex;flex-direction:column;gap:2px;margin-top:4px;padding:8px 10px;border-radius:9px;background:var(--proof);font-size:13px;line-height:1.5;color:var(--proof-ink)}
.why b{font-family:var(--f-mono);font-size:12.5px;color:var(--brand-text)}
.why i.new{font-style:normal;font-family:var(--f-body);font-size:11.5px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--urgent);color:#fff}
.why span{color:var(--ink-2);overflow-wrap:anywhere}
.why small{font-size:12px;overflow-wrap:anywhere}
.why.weak{background:var(--soft);color:var(--muted)}
.why.weak b{color:var(--muted)}
@media (max-width:860px){
  .recp{padding:14px 12px}
  .rp-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .rp-clear{margin-left:0}
}
</style>

// 申请进度单独存：{id: {s: 状态, r: 结果, t: 更新日}}；旧收藏没有记录时按“想投”处理

const stageOf = id => { const v = STATUS[id]; return v && STAGES.some(([k]) => k === v.s) ? v : {s: "want"}; };

// 准备清单：材料来自公告原文摘出的材料清单（x.af.dc）；公告没列时给常见材料并说明
function prepItems(x){

  return {fromPost: docs.length > 0, items: [...base, "联系推荐人，告知截止日期", "确认截止时刻与时区", "（可选）给导师发套磁信"]};
}
function prepList(x){

  return `<div class="prepl"><h3>准备清单 <span class="mono">${done} / ${items.length}</span></h3>

const isNow = x => !!x.o && (!isDate(x.o.dl) || days(x.o.dl) >= 0);
const dlOf = x => isNow(x) && x.o.dl ? x.o.dl : x.dl;
function mono(x){
  const s = (x.org || x.n).replace(/[（(].*$/, "").trim();
  const cjk = s.match(/[一-鿿]/);
  if (cjk && /^[一-鿿]/.test(s)) return s[0];
  const w = s.replace(/^(the|university of|universit[äe]t|universidad)\s+/i, "").match(/[A-Za-z][A-Za-z]*/g) || [s];
  return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase();
}
function due(x){
  const d = dlOf(x);
  if (isNow(x) && x.o.st === "upcoming") return [x.o.op ? `${x.o.op} 开放申请` : "即将开放", "s"];
  if (d === "rolling") return ["滚动招生 · 随时可投", "r"];
  if (isDate(d)) { const n = days(d); return n < 0 ? [`${d} 已截止`, ""] : [`${d.slice(5).replace("-", "/")} 截止 · ${n === 0 ? "今天截止" : `还有 ${n} 天`}`, n <= 7 ? "u" : n <= 30 ? "s" : ""]; }
  return [d ? (LABELS.deadline[d] || d) : "截止日期官网未写明", ""];
}
const levelText = x => (x.l || []).map(l => LABELS.level[l] || l).join(" / ") || "博士";
const regionText = x => (x.r || []).map(r => LABELS.region[r] || r).join(" · ");
const cnYes = x => x.e === "yes";
const discTags = x => (x.d || []).filter(d => d !== "all").slice(0, 2).map(d => `<span class="tag">${esc(LABELS.discipline[d] || d)}</span>`).join("");
const screened = x => (x.fl || []).includes("security-screening");
// 卡片上只放简短金额（如 €47,000–€64,000/年）；官网原文放在详情里
const CUR = "(?:[€£$¥]|CHF|EUR|GBP|USD|SEK|NOK|DKK|ISK|PLN|CZK|AUD|CAD|NZD|HKD|SGD|JPY|KRW|A\\$|NZ\\$|HK\\$|S\\$|C\\$|RMB|kr)";
const AMT = new RegExp(`${CUR}\\s?\\d[\\d,.]*(?:\\s?[kK])?(?:\\s?(?:–|-|—|to)\\s?${CUR}?\\s?\\d[\\d,.]*(?:\\s?[kK])?)?`);
function shortPay(x){
  const s = String(x.s || "").trim(), cov = x.c && x.c !== "unknown" ? LABELS.coverage[x.c] : "";
  if (!s) return cov;
  if (s.length <= 22) return s;
  const m = s.match(AMT);
  if (!m) return cov;
  const per = /per (year|annum)|\/\s?(year|yr|annum)|p\.\s?a\.|annual|yearly|每年|\/年|年薪/i.test(s) ? "/年" : /per month|\/\s?month|monthly|每月|\/月|月薪/i.test(s) ? "/月" : "";
  return m[0].replace(/\s+/g, " ").trim() + per;
}
const bmSvg = ic("bookmark", 18);

function filtered(noDay){
  const q = st.q.trim().toLowerCase();
  const out = DATA.filter(x => {
    if (!noDay && st.day && dlOf(x) !== st.day) return false;
    if (st.saved) { if (!SAVED[x.id]) return false; }
    else if (st.view === "now" && !isNow(x)) return false;
    else if (st.view === "ver" && !x.v) return false;
    if (st.cn && !cnYes(x)) return false;
    const lv = x.l || [];
    if (st.phd !== st.pd && !lv.includes(st.phd ? "phd" : "postdoc")) return false;
    if (st.full && !["full", "salary"].includes(x.c)) return false;
    if (st.soon) { const d = dlOf(x); if (!isDate(d) || days(d) < 0 || days(d) > 30) return false; }
    if (st.region && !(x.r || []).includes(st.region)) return false;
    if (st.disc && !(x.d || []).includes(st.disc)) return false;
    if (q && !x._hay.includes(q)) return false;
    return true;
  });
  const key = x => { const d = dlOf(x); return isDate(d) && days(d) >= 0 ? d : d === "rolling" ? "9998" : "9999"; };
  return out.sort((a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : a.n.localeCompare(b.n, "zh"));
}

function group(x){
  const d = dlOf(x);
  if (d === "rolling") return "滚动招生 · 随时可投";
  if (!isDate(d)) return "截止日期官网未写明";
  const n = days(d), wkEnd = (7 - TODAY.getDay()) % 7;
  if (n < 0) return "已截止";
  if (n <= wkEnd) return "本周截止";
  if (n <= wkEnd + 7) return "下周截止";
  return `${+d.slice(0, 4) === TODAY.getFullYear() ? "" : `${d.slice(0, 4)} 年 `}${+d.slice(5, 7)} 月截止`;
}
function cardsHtml(list){

        : `学科相同、但没有命中你的关键词（相关性较弱）<small>${REC.res.related.length}</small>`;
      const head = g === last ? "" : `<h3 class="grp">${g}</h3>`;
      last = g;

    const g = group(x), head = g === last ? "" : `<h3 class="grp">${esc(g)}<small>${counts[g]}</small></h3>`;
    last = g;
    return head + card(x);
  }).join("");
}
const icsText = s => String(s || "").replace(/[\;,]/g, c => "\\" + c).replace(/\n/g, "\\n");
// 按 RFC 5545 折行：每行不超过 75 字节，续行以空格开头，不拆开多字节字符
function icsFold(line){
  const enc = new TextEncoder(), out = [];
  let cur = "", n = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (n + b > (out.length ? 74 : 75)) { out.push(cur); cur = ""; n = 0; }
    cur += ch; n += b;
  }
  out.push(cur);

}
function vevent(x, stamp){

  const alarm = (t, m) => ["BEGIN:VALARM", `TRIGGER:${t}`, "ACTION:DISPLAY", `DESCRIPTION:${icsText(m)}`, "END:VALARM"];
  return ["BEGIN:VEVENT", `UID:${icsText(x.id)}@phdradar`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${dl.replace(/-/g, "")}`, `DTEND;VALUE=DATE:${iso(end).replace(/-/g, "")}`,
    `SUMMARY:${icsText("截止：" + x.n)}`, `DESCRIPTION:${icsText([x.org, "申请链接：" + x.u, "截止时间以官网为准，注意时区。"].filter(Boolean).join("\n"))}`,
    `URL:${x.u}`, ...alarm("-P14D", "还有 14 天截止：" + x.n), ...alarm("-P7D", "还有 7 天截止：" + x.n), ...alarm("-P1D", "明天截止：" + x.n), "END:VEVENT"];
}
function icsCalendar(list){
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//PhDRadar//CN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", ...list.flatMap(x => vevent(x, stamp)), "END:VCALENDAR"];
  return lines.map(icsFold).join("\r\n") + "\r\n";

function icsDownload(list, name){

  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);

const ics = x => icsDownload([x], `phdradar-${dlOf(x)}.ics`);
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const md = d => `${+d.slice(5, 7)}月${+d.slice(8)}日`;
function heat(){

  const vals = Object.values(counts), total = vals.reduce((a, b) => a + b, 0), max = Math.max(1, ...vals);

// 关键词提示：太常见的建议加更具体的词，一条都没命中的建议换英文 / 同义说法（评测显示关键词质量最影响结果）
