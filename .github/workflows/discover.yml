name: discover

# 每天一次寻找在招博士生的导师和新的信源（CSRankings 主页轮换扫描、Bluesky 招生帖、GitHub 汇总仓库、AIOpenings 表、关注导师主页）
on:
  schedule:
    - cron: "23 4 * * *"  # 每天一次（原先两次 + 改代码即触发，太耗 Actions 分钟数）
  workflow_dispatch:
    inputs:
      budget:
        description: "CSRankings 本次扫描的主页数"
        required: false
        default: "1500"

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 发现
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/discover.py --budget "${{ inputs.budget || '1500' }}"
          cat reports/discovery.md >> "$GITHUB_STEP_SUMMARY"
      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery reports/discovery.md
          git diff --cached --quiet && exit 0
          git commit -m "Update discovery results"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
