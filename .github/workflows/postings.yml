name: postings

# 采集招聘平台上的具体岗位（scripts/collect_postings.py）。不随推送运行。
# 每天定时采集只有 Actions 能访问的平台（-s actions，即 collect_postings.ACTIONS：FindAPhD 等，清单依据 docs/access.md 的双地点检查）；
# 定时只在公开仓库运行（公开仓库的 Actions 不计分钟数），结果提交到公开仓库的 _data/postings.yml，
# 由每日任务用 scripts/import_postings.py 一次并回这些平台。
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "平台，逗号分隔（actions = 只有 Actions 能访问的清单；也可写具体名字如 findaphd,jobs-ac-uk）"
        default: "actions"
      max_details:
        description: "每个平台最多读多少个详情页"
        default: "3000"
      dry_run:
        description: "只打印统计、不写结果（true/false）"
        default: "false"
      commit:
        description: "把结果提交到仓库（true/false）；默认只作为附件上传，审核后再合并"
        default: "false"

permissions:
  contents: write

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'pingfanfan/PhDRadar'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: postings
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 采集
        run: |
          python scripts/collect_postings.py -s "${{ inputs.sources || 'actions' }}" --max-details "${{ inputs.max_details || '3000' }}" \
            --save-samples 40 $([ "${{ inputs.dry_run }}" = "true" ] && echo --dry-run) | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samples
          path: research/inbox/samples/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: inputs.dry_run != 'true'
        with:
          name: postings
          path: _data/postings.yml
          if-no-files-found: ignore
      - name: 提交
        if: github.event_name == 'schedule' || (inputs.dry_run != 'true' && inputs.commit == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/postings.yml 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "岗位采集：${{ inputs.sources || 'actions' }}"
          git pull --rebase && git push
